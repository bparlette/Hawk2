<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hospital Escape — Cast Quality (T4-Lit 3D Stage)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05090d;color:#e6eef2;font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:12px}
#hud.hidden{display:none}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:auto}
.pill{background:rgba(11,16,22,0.82);border:1px solid rgba(180,210,224,0.22);border-radius:8px;padding:6px 10px;backdrop-filter:blur(6px)}
.btn{cursor:pointer;background:rgba(20,30,38,0.9);color:#dce9ee;border:1px solid rgba(160,200,218,0.28);border-radius:6px;padding:4px 8px;font:600 11px/1.2 inherit}
.btn.on{background:#2d6a7a;border-color:#7ad0e6;color:#fff}
#meta{font:600 11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:#b8ced8;max-width:420px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05090d;color:#9fc2cf;font:600 15px/1.4 inherit;z-index:10}
</style>
</head>
<body>
<div id="loading">Loading T4 environment &amp; CAST-QUALITY GLBs…</div>
<div id="hud">
  <div class="bar">
    <div class="pill" id="modeBar"></div>
    <div class="pill" id="camBar"></div>
  </div>
  <div class="bar">
    <div class="pill" id="meta">Initializing…</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="cast-quality.js"></script>
</body>
</html>
