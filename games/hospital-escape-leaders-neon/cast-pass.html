<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hospital Escape · Mixamo Cast Pass (Neon)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #070a0e; color: #e2eef2; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 390px; height: 844px; max-width: 100vw; max-height: 100vh; background: #0b0f15; overflow: hidden; box-shadow: 0 12px 48px rgba(0,0,0,0.8); }
  #c { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 5px; z-index: 10; pointer-events: none; }
  body.clean #hud { display: none !important; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; pointer-events: auto; }
  .pill { border: 1px solid rgba(120,196,216,0.35); background: rgba(9,16,22,0.82); color: #cbe4ee; font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer; backdrop-filter: blur(5px); }
  .pill.active { background: #1e6274; color: #fff; border-color: #7ee0f0; font-weight: 700; }
  #meta { font-size: 10px; line-height: 1.35; background: rgba(9,16,22,0.82); padding: 4px 7px; border-radius: 5px; border: 1px solid rgba(120,196,216,0.22); }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; background: rgba(7,10,14,0.86); z-index: 20; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="390" height="844"></canvas>
  <div id="loading">Loading Mixamo Cast Pass (VALID Rigs)...</div>
  <div id="hud">
    <div class="row" id="mode-row"></div>
    <div class="row" id="clip-row"></div>
    <div class="row" id="cam-row"></div>
    <div id="meta">Initializing...</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="cast-pass.js"></script>
</body>
</html>
