<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hospital Escape · WEST WING B Hallway Bake-Off (Neon)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #050708; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; color: #e2eef2; }
  body { display: flex; align-items: center; justify-content: center; }
  #viewport { position: relative; width: 390px; height: 844px; max-width: 100vw; max-height: 100vh; overflow: hidden; background: #000; box-shadow: 0 12px 48px rgba(0,0,0,0.75); }
  #c { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 10; }
  body.clean #hud { display: none !important; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; pointer-events: auto; }
  .pill { border: 1px solid rgba(110,190,210,0.35); background: rgba(8,16,22,0.78); color: #cde6ee; font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer; backdrop-filter: blur(6px); }
  .pill.active { background: #1e6274; color: #fff; border-color: #7ee0f0; font-weight: 600; }
  #meta { font-size: 10px; background: rgba(8,16,22,0.78); padding: 4px 7px; border-radius: 5px; border: 1px solid rgba(110,190,210,0.22); line-height: 1.35; }
</style>
</head>
<body>
<div id="viewport">
  <canvas id="c" width="390" height="844"></canvas>
  <div id="hud">
    <div class="row" id="take-row"></div>
    <div class="row" id="vp-row"></div>
    <div id="meta">Loading WEST WING B...</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
  (function(){
    var q = new URLSearchParams(location.search);
    var t = parseInt(q.get('take') || '1', 10) || 1;
    if(q.get('clean') === '1') document.body.classList.add('clean');
    window.__HALLWAY_QUERY = {
      take: Math.min(5, Math.max(1, t)),
      vp: q.get('vp') || 'vp1',
      clean: q.get('clean') === '1',
      time: q.has('t') ? parseFloat(q.get('t')) : null
    };
    if(window.__HALLWAY_QUERY.take === 2 || window.__HALLWAY_QUERY.take === 4){
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\/script>');
    }
  })();
</script>
<script src="corridor-data.js"></script>
<script src="take1-pbr.js"></script>
<script src="take2-lightmap.js"></script>
<script src="take3-painted.js"></script>
<script src="take4-kitbash.js"></script>
<script src="take5-cinema.js"></script>
<script src="hallway-rig.js"></script>
</body>
</html>
