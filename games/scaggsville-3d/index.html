<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Scaggsville 3D — Rally the Crew</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#232038;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #game{position:fixed;inset:0;}
  canvas{display:block;}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:1100;}
  #speed{position:absolute;top:calc(8px + env(safe-area-inset-top));left:12px;color:#fff;
    font-size:14px;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 4px rgba(0,0,0,.7);}
  #speed b{font-size:28px;font-weight:800;}
  #rally{position:absolute;top:calc(42px + env(safe-area-inset-top));left:12px;color:#ffd9a0;
    font-size:12px;font-weight:800;letter-spacing:.1em;text-shadow:0 1px 4px rgba(0,0,0,.7);}
  #title{position:absolute;top:calc(8px + env(safe-area-inset-top));right:12px;color:#fff;opacity:.85;
    font-size:12px;font-weight:800;letter-spacing:.2em;text-shadow:0 1px 4px rgba(0,0,0,.7);}
  #wanted{display:none;position:absolute;top:calc(25px + env(safe-area-inset-top));right:12px;color:rgba(255,255,255,.22);
    font-size:16px;font-weight:900;letter-spacing:2px;text-shadow:0 1px 6px rgba(0,0,0,.85);opacity:0;transition:opacity .2s;}
  #scoreHud{position:absolute;top:calc(47px + env(safe-area-inset-top));right:12px;text-align:right;color:#fff;
    font-size:13px;font-weight:800;letter-spacing:.04em;text-shadow:0 1px 4px rgba(0,0,0,.85);}
  #comboPill{display:none;margin-left:5px;padding:1px 6px;border-radius:6px;background:rgba(255,188,36,.94);
    color:#141824;font-size:11px;font-weight:900;vertical-align:1px;}
  #nav{position:absolute;top:calc(74px + env(safe-area-inset-top));right:12px;width:58px;text-align:center;color:#fff;}
  #arrow{display:inline-block;font-size:30px;color:#ffd23f;text-shadow:0 2px 8px rgba(0,0,0,.6);transition:transform .12s linear;}
  #navdist{font-size:11px;font-weight:800;letter-spacing:.05em;text-shadow:0 1px 4px rgba(0,0,0,.8);}
  #target{position:absolute;left:50%;top:calc(180px + env(safe-area-inset-top));transform:translateX(-50%);color:#fff;text-align:center;width:94%;
    font-size:13px;font-weight:700;text-shadow:0 1px 5px rgba(0,0,0,.9);pointer-events:none;}
  #target span{background:rgba(10,14,26,.55);border-radius:8px;padding:3px 10px;}
  #street{position:absolute;left:50%;top:calc(206px + env(safe-area-inset-top));transform:translateX(-50%);color:#ffd9a0;text-align:center;width:94%;
    font-size:11.5px;font-weight:800;letter-spacing:.05em;text-shadow:0 1px 5px rgba(0,0,0,.9);pointer-events:none;}
  #street span{background:rgba(10,14,26,.55);border-radius:8px;padding:2px 9px;}
  #street:empty{display:none;}
  #banner{position:absolute;left:50%;top:34%;transform:translateX(-50%) scale(.9);color:#fff;text-align:center;
    font-size:26px;font-weight:900;letter-spacing:.03em;text-shadow:0 3px 14px rgba(0,0,0,.75);opacity:0;
    transition:opacity .25s ease, transform .25s ease;pointer-events:none;width:94%;}
  #banner.show{opacity:1;transform:translateX(-50%) scale(1);}
  #banner small{display:block;font-size:14px;font-weight:700;color:#ffd9a0;margin-top:4px;}
  #legHud{position:absolute;top:calc(72px + env(safe-area-inset-top));right:12px;text-align:right;color:#ffd9a0;
    font-size:11.5px;font-weight:800;letter-spacing:.06em;text-shadow:0 1px 4px rgba(0,0,0,.85);}
  #results{position:absolute;left:50%;top:16%;transform:translateX(-50%);width:min(430px,92vw);display:none;
    background:rgba(10,14,26,.88);border:2px solid rgba(255,210,63,.55);border-radius:16px;color:#fff;
    padding:16px 18px 12px;pointer-events:auto;text-align:left;box-shadow:0 10px 34px rgba(0,0,0,.55);}
  #results h3{margin:0 0 8px;font-size:19px;font-weight:900;letter-spacing:.05em;text-align:center;}
  #results .rrow{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:2.5px 0;color:#cfd6ea;}
  #results .rrow b{color:#fff;font-weight:900;}
  #results .rtot{border-top:1px solid rgba(255,255,255,.25);margin-top:7px;padding-top:7px;font-size:14.5px;color:#fff;}
  #results .rtot b{color:#ffd23f;}
  #results .rclose{text-align:center;color:#8f97ad;font-size:11px;margin-top:9px;letter-spacing:.08em;}
  /* ---- gptouch: floating joystick (left half) + round buttons (bottom-right) ---- */
  #stickZone{position:fixed;left:0;bottom:0;width:50%;height:62%;z-index:1150;touch-action:none;}
  #stickBase{position:fixed;width:112px;height:112px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
    background:rgba(16,20,36,.32);display:none;z-index:1151;pointer-events:none;transform:translate(-50%,-50%);}
  #stickKnob{position:fixed;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.75);
    display:none;z-index:1152;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.4);}
  .btn{position:fixed;border-radius:50%;border:3px solid rgba(255,255,255,.55);color:#fff;font-weight:900;
    display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1200;touch-action:none;
    text-shadow:0 1px 3px rgba(0,0,0,.5);box-shadow:0 4px 14px rgba(0,0,0,.4);}
  .btn small{font-size:9px;letter-spacing:.12em;font-weight:700;opacity:.9;}
  #btnA{right:22px;bottom:calc(28px + env(safe-area-inset-bottom));width:88px;height:88px;font-size:20px;background:rgba(46,160,80,.8);}
  #btnB{right:122px;bottom:calc(20px + env(safe-area-inset-bottom));width:64px;height:64px;font-size:14px;background:rgba(220,50,50,.65);}
  #btnT{right:196px;bottom:calc(24px + env(safe-area-inset-bottom));width:64px;height:64px;font-size:18px;background:rgba(255,150,40,.55);}
  #btnT svg{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);pointer-events:none;transform:rotate(-90deg);}
  #btnT circle{fill:none;stroke:rgba(255,150,50,.95);stroke-width:4;stroke-linecap:round;}
  #btnMute{right:18px;bottom:calc(130px + env(safe-area-inset-bottom));width:44px;height:44px;font-size:18px;background:rgba(16,20,36,.55);}
  #btnCam{right:70px;bottom:calc(130px + env(safe-area-inset-bottom));width:44px;height:44px;font-size:11px;letter-spacing:.04em;background:rgba(16,20,36,.6);}
  #btnFoot{right:122px;bottom:calc(130px + env(safe-area-inset-bottom));height:44px;padding:0 14px;border-radius:22px;
    font-size:11px;letter-spacing:.06em;background:rgba(24,32,54,.72);white-space:nowrap;}
  #btnRadio{right:18px;bottom:calc(184px + env(safe-area-inset-bottom));width:44px;height:44px;font-size:18px;background:rgba(16,20,36,.58);}
  #btnCrew{right:70px;bottom:calc(184px + env(safe-area-inset-bottom));height:44px;padding:0 11px;border-radius:22px;
    font-size:10px;letter-spacing:.05em;background:rgba(46,96,190,.78);white-space:nowrap;display:none;}
  #btnAct{left:50%;transform:translateX(-50%);bottom:calc(242px + env(safe-area-inset-bottom));height:42px;padding:0 16px;
    border-radius:21px;font-size:12px;letter-spacing:.06em;background:rgba(148,58,225,.9);white-space:nowrap;display:none;}
  .btn.on{filter:brightness(1.5);transform:scale(.94);}
  /* ---- pick your player ---- */
  #pick{position:fixed;inset:0;z-index:1300;background:linear-gradient(180deg, rgba(16,14,34,.88), rgba(30,20,44,.92));
    display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 14px 20px;overflow-y:auto;}
  #pick h1{color:#fff;font-size:26px;letter-spacing:.14em;margin:2px 0 0;font-weight:900;text-align:center;}
  #pick h2{color:#ffd9a0;font-size:13px;letter-spacing:.2em;margin:4px 0 12px;font-weight:700;text-align:center;}
  #pick .sub{color:#cfd6ea;font-size:13px;text-align:center;max-width:520px;line-height:1.45;margin-bottom:14px;}
  .card{pointer-events:auto;width:min(520px,94vw);background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.16);
    border-radius:14px;padding:10px 14px;margin:5px 0;color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .card:active{border-color:#ffd23f;background:rgba(255,210,63,.12);}
  .card .nm{font-size:18px;font-weight:900;}
  .card .st{font-size:12px;color:#ffd9a0;font-weight:700;letter-spacing:.06em;}
  .card .car{font-size:12px;color:#cfd6ea;text-align:right;line-height:1.35;}
  #pick .foot{color:#8f97ad;font-size:11px;margin-top:12px;text-align:center;line-height:1.5;}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="speed"><b>0</b> km/h</div>
  <div id="rally">RALLY 0/7</div>
  <div id="title">SCAGGSVILLE 3D</div>
  <div id="wanted">☆☆☆☆☆</div>
  <div id="scoreHud"><span id="scoreVal">$0</span><span id="comboPill"></span></div>
  <div id="nav"><div id="arrow">⬆</div><div id="navdist"></div></div>
  <div id="target"><span></span></div>
  <div id="street"><span></span></div>
  <div id="banner"></div>
  <div id="legHud"></div>
  <div id="results"></div>
</div>
<div id="stickZone"></div>
<div id="stickBase"></div><div id="stickKnob"></div>
<div class="btn" id="btnB">B<small>BRAKE</small></div>
<div class="btn" id="btnT"><svg viewBox="0 0 80 80"><circle id="turboRing" cx="40" cy="40" r="36"/></svg>»<small>TURBO</small></div>
<div class="btn" id="btnA">A<small>GAS</small></div>
<div class="btn" id="btnFoot">EXIT</div>
<div class="btn" id="btnCam">CAM</div>
<div class="btn" id="btnMute">🔊</div>
<div class="btn" id="btnRadio">📻</div>
<div class="btn" id="btnCrew">CREW ⇄</div>
<div class="btn" id="btnAct">🏁 RACE</div>
<div id="pick"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { buildWorld, applyWorldEnvMap, WORLD_LIGHTING } from './src/world/buildWorld.js';
import { buildVehicle, VEHICLE_ROWS } from '../shared/gpvehicles.js';
import { buildPerson, buildDriver, poseIdle, poseWave, poseWalk } from '../shared/people.js';
import { makeParkedFleet } from './src/fleet.js';
import { CREW_VEHICLES, CREW_PEOPLE } from './src/crew.js';
import { createCar, stepCar, collide, pursue } from './src/drive.js';
import { createMissions } from './src/missions.js';
import { gameAudio } from './src/audio.js';
import { music } from './src/music.js';
import { WORLD_DATA } from './src/data.js';
import { createDayNight } from './src/daynight.js';
import { createCrowdSystem } from './src/crowd.js';
import { streetLabel } from './src/street.js';
import { createInteriors } from './src/interiors.js';
import { createCineCam } from './src/cinecam.js';
import { mountGarage, buildCustomVehicle } from './src/garage.js';
import { createFX } from './src/fx.js';
import { createTraffic } from './src/traffic.js';
import { createProps } from './src/props.js';
import { createWanted } from './src/wanted.js';
import { createOnFoot } from './src/onfoot.js';
import { createMinimap } from './src/minimap.js';
import { createRadio } from './src/radio.js';
import { createActivities } from './src/activities.js';

/* ============================== RENDERER / SCENE ============================== */
const L = WORLD_LIGHTING;
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = L.renderer.exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('game').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 7000);

// Lane E: cinematic camera (src/cinecam.js) — owns the camera for the
// depart sweep / above cruise / approach descent / arrival beats. The
// chase cam below stays the released-state view; on release the module
// leaves a one-shot handoff that the host adopts (see the animate seam).
const cine = createCineCam({ camera });

const world = buildWorld(scene);
const envMaps = applyWorldEnvMap(renderer, scene);

// Lane A: the day/night cycle owns the live lighting — it starts on the
// golden preset (first paint unchanged) and walks the rally golden -> dusk
// -> night. sunDir is the cycle's persistent vector (shadow aim reads it).
const daynight = createDayNight();
const sunDir = daynight.sunDir;
const sun = new THREE.DirectionalLight(L.sun.color, L.sun.intensity);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-80; sun.shadow.camera.right=80; sun.shadow.camera.top=80; sun.shadow.camera.bottom=-80;
sun.shadow.camera.near=10; sun.shadow.camera.far=700; sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.6;
scene.add(sun); scene.add(sun.target);
const hemi = new THREE.HemisphereLight(L.hemi.sky, L.hemi.ground, L.hemi.intensity);
scene.add(hemi);
const amb = new THREE.AmbientLight(L.ambient.color, L.ambient.intensity);
scene.add(amb);
const dome = scene.getObjectByName('skyDome');
const lightRig = { renderer, scene, sun, hemi, ambient: amb, dome, envMaps,
  windows: scene.getObjectByName('litWindows'), lampGlow: scene.getObjectByName('lampGlow') };

// Lane A: pedestrians + crowd system (instanced; the party lane consumes
// window.__crowd — spawnCrowd / clearCrowd, see src/crowd.js header).
const crowd = createCrowdSystem(scene, world);
crowd.spawnAmbient();

// GTA V / Palm City gameplay layers: pooled FX/skids, live AI traffic,
// breakable props + stunt ramps, 1-5* Howard County PD, on-foot + carjack, radar.
const fx = createFX(scene);
const traffic = createTraffic(scene, world, WORLD_DATA);
const props = createProps(scene, world, WORLD_DATA);
const wanted = createWanted(scene, world, WORLD_DATA);
const minimap = createMinimap(WORLD_DATA, document.body);
const radio = createRadio({ music, gameAudio });
const activities = createActivities({
  scene, world, D: WORLD_DATA, buildVehicle, CREW_VEHICLES,
  showBanner: (...a) => showBanner(...a),
  addScore: (...a) => addScore(...a),
  gameAudio,
});

/* ============================== GAME STATE ============================== */
const HOUSEHOLDS = [
  { stop:'brad',    label:'Brad',                 cars:['brad'] },
  { stop:'clayton', label:'The Floyds',           cars:['clayton','zack'] },
  { stop:'jason',   label:'Jason',                cars:['jason'] },
  { stop:'grant',   label:'Grant',                cars:['grant'] },
  { stop:'jimmy',   label:'Jimmy + Billy — Lazaris', cars:['jimmy','billy'] },
  { stop:'rigg',    label:'Rigg',                 cars:['rigg'] },
  { stop:'kosack',  label:'Kosack',               cars:['kosack'] },
];
const stopById = {}; for(const s of WORLD_DATA.stops) stopById[s.id]=s;

// Lane B: house cutaways/interiors (src/interiors.js) — built on entry at
// the house you're visiting, disposed on exit; Lazaris + Grant get their
// canon door-mom staging instead of an interior.
const interiors = createInteriors({ scene, camera, stops: stopById, surfaceAt: world.surfaceAt, gameAudio,
  heroRow: ()=> CREW_PEOPLE[HOUSEHOLDS.find(h=>h.stop===playerStop).cars[0]],
  onMiniGameReward: r => {
    if(r?.cash) addScore(r.cash, r.label || 'HOUSE BONUS');
    if(r?.turboRefill && player) player.charge = 1;
  } });

let started=false, finished=false, startTime=0, elapsed=0;
let playerStop='brad', playerCarId='brad', playerAvatarId='brad';
let targets=[];           // household stop ids still to visit, in order
let collected=new Set();
let player=null, playerVeh=null, playerBeam=null;
const followers=[];       // {state, mesh, name}
const parkedVehs={};      // carId -> vehicle (crew cars waiting at houses)
const people=[];          // {p, stopId, carId, mode, tx, tz, phase} crew figures
const trail=[];           // breadcrumb {x,z,d} player path, oldest first
let trailDist=0, lastTrailPt=null;
let missions=null;   // Lane D (src/missions.js): fake-cop + night party
let score=0, combo=0, comboTimer=0, comboLabel='', driftScoreAcc=0, shakeAmt=0;
let legStart=0, legTimes=[];   // rally stakes: per-leg split timer (leg 1 starts at startGame)
let camMode=0;       // 0 = Close GTA, 1 = Wide, 2 = Hood

// Lamar's burning Mustang at Atholton (finale set piece)
const ath=stopById['atholton'];
const lamarVeh = buildVehicle(CREW_VEHICLES.lamar);
lamarVeh.group.position.set(ath.hx+16, 0, ath.hz+14); lamarVeh.group.rotation.y=0.7; scene.add(lamarVeh.group);
const fireLight = new THREE.PointLight(0xffb84d, 13, 18, 1.8); // dim ember-gold glow (canon: no orange flame light)
fireLight.position.set(ath.hx+16, 1.6, ath.hz+14); scene.add(fireLight);

// ambient parked cars near the crew streets (merged fleet, 3 draws)
{
  const placements=[]; const palette=[0x8a8f96,0x5d6a7a,0x7a4a3a,0x4a5d48,0x9a958a,0x3f4a63,0x6e6258,0xa8a49a];
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  for(const s of WORLD_DATA.stops){
    if(s.id==='atholton') continue;
    for(let i=0;i<4;i++){
      const a=rnd()*Math.PI*2, r=14+rnd()*36;
      const x=s.sx+Math.cos(a)*r, z=s.sz+Math.sin(a)*r;
      if(world.surfaceAt(x,z)==='grass') continue;
      placements.push({ x, z, ry:rnd()*Math.PI, paint:palette[Math.floor(rnd()*palette.length)] });
    }
  }
  for(let i=0;i<10;i++){ const a=rnd()*Math.PI*2, r=10+rnd()*46;
    placements.push({ x:ath.hx+Math.cos(a)*r, z:ath.hz+Math.sin(a)*r*0.7, ry:rnd()*0.6-0.3, paint:palette[Math.floor(rnd()*palette.length)] }); }
  scene.add(makeParkedFleet(placements));
}

function spawnCrewCar(carId, x, z, heading){
  const veh=buildVehicle(CREW_VEHICLES[carId]);
  veh.group.position.set(x,0,z); veh.group.rotation.y=heading;
  scene.add(veh.group); return veh;
}
function spawnFigure(carId, stopId, x, z, faceX, faceZ){
  if(!CREW_PEOPLE[carId]) return;
  const p=buildPerson(CREW_PEOPLE[carId]);
  p.group.position.set(x,0,z);
  p.group.rotation.y=Math.atan2(faceX-x, faceZ-z);
  scene.add(p.group);
  people.push({ p, stopId, carId, mode:'idle', tx:x, tz:z, phase:Math.random()*6 });
}
function seatDriver(veh, carId){
  if(!veh || !veh.driverAnchor || veh._driver || !CREW_PEOPLE[carId]) return;
  const d = buildDriver(CREW_PEOPLE[carId]);
  d.group.scale.setScalar(veh.driverScale || 1);
  veh.driverAnchor.add(d.group);
  veh._driver = d;
}
const onfoot = createOnFoot({ scene, world, CREW_PEOPLE, CREW_VEHICLES, VEHICLE_ROWS, buildPerson, buildVehicle, seatDriver });
function attachBeam(veh){
  if(!veh) return;
  if(!playerBeam){
    playerBeam = new THREE.SpotLight(veh.beamColor ?? 0xffd9a8, L.beamIntensity ?? 200, 55, 0.62, 0.55, 1.1);
  } else {
    playerBeam.color.setHex(veh.beamColor ?? 0xffd9a8);
  }
  const len = veh.dims?.len ?? 4.5;
  playerBeam.position.set(0, 0.72, len / 2 - 0.2);
  playerBeam.target.position.set(0, 0, len / 2 + 18);
  veh.group.add(playerBeam); veh.group.add(playerBeam.target);
}
function parkCrewCars(){
  for(const hh of HOUSEHOLDS){
    if(hh.stop===playerStop) continue;
    const s=stopById[hh.stop];
    hh.cars.forEach((carId, i)=>{
      const px = s.hx + (s.sx-s.hx)*0.45 + (i? 3.4:0), pz = s.hz + (s.sz-s.hz)*0.45 + (i? 1.5:0);
      const hd = Math.atan2(s.sx-px, s.sz-pz);
      parkedVehs[carId]=spawnCrewCar(carId, px, pz, hd);
      spawnFigure(carId, hh.stop, s.hx + (s.sx-s.hx)*0.30 + (i? 1.6 : -0.6), s.hz + (s.sz-s.hz)*0.30 + (i? 0.8 : 0), s.sx, s.sz);
    });
  }
  // the 11th fleet car: the Black Cavalier, parked up at Kosack's (static —
  // it isn't a crew car and never joins the convoy)
  if(playerStop!=='kosack'){
    const s=stopById['kosack'];
    const px=s.hx+(s.sx-s.hx)*0.45-3.6, pz=s.hz+(s.sz-s.hz)*0.45+2.2;
    parkedVehs['cavalierBlack']=spawnCrewCar('cavalierBlack', px, pz, Math.atan2(s.sx-px, s.sz-pz));
  }
}

/* ============================== PICK YOUR PLAYER ============================== */
const pickEl=document.getElementById('pick');
// Garage chooser (src/garage.js): turntable stage + customize panel
// replaces the card grid. Game HUD + driving buttons stay hidden until
// the rally starts (the stage owns the screen until then).
document.getElementById('hud').style.display='none';
for(const id of ['btnA','btnB','btnT','btnMute','btnCam','btnFoot','btnRadio','btnCrew','btnAct']) document.getElementById(id).style.display='none';
const garage = mountGarage(pickEl, { households: HOUSEHOLDS, stops: stopById, environment: scene.environment,
  onStart: (stopId, custom)=> startGame(stopId, custom) });
window.__garage = garage;

function startGame(stopId, custom){
  // audio unlock: startGame runs synchronously inside the pick-card
  // pointerdown, so this is inside the user gesture (iOS rule).
  gameAudio.unlock(); gameAudio.engineStart(); gameAudio.uiTap();
  playerStop=stopId;
  pickEl.style.display='none';
  document.getElementById('hud').style.display='';
  for(const id of ['btnA','btnB','btnT','btnMute','btnCam','btnFoot','btnRadio']) document.getElementById(id).style.display='';
  const s=stopById[stopId];
  player=createCar(s.sx, s.sz, s.heading);
  const myCar = HOUSEHOLDS.find(h=>h.stop===stopId).cars[0];
  playerCarId = myCar;
  playerAvatarId = myCar;
  playerVeh=buildCustomVehicle(myCar, custom);   // the garage car, exactly as customized on the stage
  playerVeh.group.rotation.order='YXZ';
  scene.add(playerVeh.group);
  // headlight beam — the module throws the pool decal on the road; this is
  // the actual light that lifts the wet asphalt ahead of the car at dusk.
  // Its colour comes from the picked car's row (Brad yellow, Brian blue).
  // Intensity follows the lighting preset: full at blue hour, softer in
  // golden hour when the sun is still doing the work.
  attachBeam(playerVeh);
  minimap.show();
  spawnFigure(myCar, stopId, s.sx+2.6, s.sz+2.0, s.sx, s.sz);
  const pf=people[people.length-1];
  if(pf){ pf.mode='walk'; pf.tx=s.sx+Math.cos(s.heading)*1.8; pf.tz=s.sz-Math.sin(s.heading)*1.8; } // to the driver's door, then in
  parkCrewCars();
  targets = HOUSEHOLDS.map(h=>h.stop).filter(id=>id!==stopId);
  world.target.setStop(stopById[targets[0]]);
  started=true; startTime=performance.now();
  legStart=startTime; legTimes=[];
  cine.depart();   // Lane E: depart sweep -> settle -> rise to the above view
  showBanner('RALLY THE CREW', 'First stop: '+householdLabel(targets[0])+' — '+stopById[targets[0]].street);
  updateTargetHud();
}

  let dx=e.clientX-joyOX, dy=e.clientY-joyOY;
  const len=Math.hypot(dx,dy), max=52;
  if(len>max){ dx*=max/len; dy*=max/len; }
  joyX=dx/max; joyY=dy/max; latchTouch();
  sKnob.style.left=(joyOX+dx)+'px'; sKnob.style.top=(joyOY+dy)+'px';
});

function pollInput(){
  let steer=0, throttle=0, brake=false, boost=false, handbrake=false;
  if(keys['KeyA']||keys['ArrowLeft']) steer-=1;
  if(keys['KeyD']||keys['ArrowRight']) steer+=1;
  if(keys['KeyW']||keys['ArrowUp']) throttle+=1;
  if(keys['KeyS']||keys['ArrowDown']) brake=true;
  if(keys['ShiftLeft']||keys['ShiftRight']) boost=true;
  if(keys['Space']) handbrake=true;
  if(joyActive){
    steer+=joyX;
    if(onfoot.state.active){
      if(joyY < -0.18) throttle = Math.max(throttle, -joyY);
      if(joyY > 0.25) brake = true;
    }
  }
  if(btnA) throttle=1;
  if(btnB) brake=true;
  if(btnT) boost=true;
  if(proofInput){
    if(proofInput.steer!==undefined) steer=proofInput.steer;
    if(proofInput.throttle!==undefined) throttle=proofInput.throttle;
    if(proofInput.brake!==undefined) brake=!!proofInput.brake;
    if(proofInput.boost!==undefined) boost=!!proofInput.boost;
    if(proofInput.handbrake!==undefined) handbrake=!!proofInput.handbrake;
  }
  steer = THREE.MathUtils.clamp(steer,-1,1);
  if(touchMode && !onfoot.state.active && brake && Math.abs(steer)>0.55 && player && Math.abs(player.speed)>12){
    handbrake = true;
  }
  return { steer, throttle, brake, boost, handbrake };
}

// Lane E: build the arrival-camera anchors for a stop from LIVE state —
// group = the crew figures standing at the house (their average spot),
// falling back to the 0.30 point between house and street when nobody is
// standing; face = house -> street; lineup = this stop's parked cars in
// household order, then the convoy followers in order.
function cineArriveFor(stopId, cars){
  const s=stopById[stopId]; if(!s) return;
  const standing=people.filter(p=>p.stopId===stopId && p.mode!=='gone');
  let group;
  if(standing.length){
    group={x:0, z:0};
    for(const p of standing){ group.x+=p.p.group.position.x; group.z+=p.p.group.position.z; }
    group.x/=standing.length; group.z/=standing.length;
  } else {
    group={ x:s.hx+(s.sx-s.hx)*0.30, z:s.hz+(s.sz-s.hz)*0.30 };
  }
  let fx=s.sx-s.hx, fz=s.sz-s.hz; const fl=Math.hypot(fx,fz)||1; fx/=fl; fz/=fl;
  const lineup=[];
  if(cars) for(const carId of cars){ const pm=parkedVehs[carId]; if(pm) lineup.push({ x:pm.group.position.x, z:pm.group.position.z }); }
  for(const f of followers) lineup.push({ x:f.veh.group.position.x, z:f.veh.group.position.z });
  cine.arrive({ group, face:{x:fx, z:fz}, lineup });
}
function checkArrivals(){
  if(!started || finished) return;
  const t=currentTargetStop();
  const d=Math.hypot(player.x-t.sx, player.z-t.sz);
  if(d>17) return;
  if(targets.length){
    const stopId=targets.shift(); collected.add(stopId);
    legTimes.push((performance.now()-legStart)/1000); legStart=performance.now();
    const hh=HOUSEHOLDS.find(h=>h.stop===stopId);
    cineArriveFor(stopId, hh.cars);   // Lane E: BEFORE the parked cars are removed below
    for(const carId of hh.cars){
      const pm=parkedVehs[carId];
      if(pm){ scene.remove(pm.group); delete parkedVehs[carId]; }
      const st=createCar(t.sx+(followers.length%3)*2.5, t.sz+(followers.length%2)*3, player.heading);
      const veh=spawnCrewCar(carId, st.x, st.z, st.heading);
      followers.push({ state:st, veh, name:CREW_VEHICLES[carId].name, carId });
      for(const person of people) if(person.carId===carId && person.mode!=='gone'){ person.mode='walk'; person.tx=st.x+1.8; person.tz=st.z+0.6; }
    }
    showBanner(hh.label.toUpperCase()+' JOINED THE CONVOY', targets.length? 'Next: '+householdLabel(targets[0]) : 'Everyone\'s in — ATHOLTON HIGH!');
    gameAudio.arrival(); gameAudio.whoop();
    if(targets.length) world.target.setStop(stopById[targets[0]]); else world.target.setStop(stopById['atholton']);
    updateTargetHud();
  } else {
    cineArriveFor('atholton', null);   // Lane E: finale arrival beat (convoy lineup)
    finished=true; elapsed=(performance.now()-startTime)/1000;
    const mm=Math.floor(elapsed/60), ss=(elapsed%60).toFixed(1).padStart(4,'0');
    showBanner('🏁 RALLY COMPLETE — CREW ASSEMBLED', `Full crew at Atholton in ${mm}:${ss} · Lamar's Mustang is still burning`, 8000);
    showResults(elapsed);
    gameAudio.finale();
    targetEl.textContent='CREW ASSEMBLED AT ATHOLTON — free cruise';
    rallyEl.textContent='RALLY 7/7 🏁';
  }
}

let camYaw=null, camPos=new THREE.Vector3(), fovCur=60, overheadMode=false;
function updateCamera(dt){
  if(overheadMode){
    camera.position.set(player.x, 300, player.z+40);
    camera.up.set(0,1,0); camera.lookAt(player.x, 0, player.z);
    if(camera.fov!==55){ camera.fov=55; camera.updateProjectionMatrix(); }
    return;
  }
  if(onfoot.state.active){
    if(camYaw===null) camYaw=player.heading;
    if(onfoot.state.speed>0.5 && !keys['KeyS'] && !keys['ArrowDown']){
      let dh=player.heading-camYaw;
      while(dh>Math.PI) dh-=2*Math.PI; while(dh<-Math.PI) dh+=2*Math.PI;
      camYaw += dh * Math.min(1, dt*2.0);
    }
    const dist=4.6, height=2.15;
    const tx=player.x-Math.sin(camYaw)*dist, tz=player.z-Math.cos(camYaw)*dist;
    const k=Math.min(1, dt*8);
    camPos.x+=(tx-camPos.x)*k; camPos.z+=(tz-camPos.z)*k; camPos.y+=(height-camPos.y)*Math.min(1,dt*6);
    camera.position.copy(camPos);
    camera.up.set(0,1,0);
    camera.lookAt(player.x, 1.25, player.z);
    fovCur+=(60-fovCur)*Math.min(1,dt*4);
    if(Math.abs(fovCur-camera.fov)>0.05){ camera.fov=fovCur; camera.updateProjectionMatrix(); }
    return;
  }
  if(camMode===2){ // Hood cam
    const visYaw=player.heading+(player.driftAngle||0);
    camYaw=visYaw;
    camPos.set(player.x+Math.sin(visYaw)*0.55, player.y+1.18, player.z+Math.cos(visYaw)*0.55);
    camera.position.copy(camPos);
    if(shakeAmt>0.005){
      camera.position.x+=(Math.random()-0.5)*shakeAmt*0.45;
      camera.position.y+=(Math.random()-0.5)*shakeAmt*0.35;
    }
    camera.up.set(0,1,0);
    camera.lookAt(player.x+Math.sin(visYaw)*22, player.y+0.95, player.z+Math.cos(visYaw)*22);
  } else {
    if(camYaw===null){ camYaw=player.heading; camPos.set(player.x-Math.sin(camYaw)*7.4, 2.45, player.z-Math.cos(camYaw)*7.4); }
    let dh=player.heading-camYaw;
    while(dh>Math.PI) dh-=2*Math.PI; while(dh<-Math.PI) dh+=2*Math.PI;
    camYaw += dh * Math.min(1, dt*(camMode===1? 3.2 : 3.6));
    const dist = camMode===1 ? 10.6 : 7.4;
    const height = (camMode===1 ? 3.6 : 2.45) + (player.y||0)*0.65;
    const tx=player.x-Math.sin(camYaw)*dist, tz=player.z-Math.cos(camYaw)*dist;
    const k=Math.min(1, dt*7.5);
    camPos.x+=(tx-camPos.x)*k; camPos.z+=(tz-camPos.z)*k; camPos.y+=(height-camPos.y)*Math.min(1,dt*5);
    camera.position.copy(camPos);
    if(shakeAmt>0.005){
      camera.position.x+=(Math.random()-0.5)*shakeAmt;
      camera.position.y+=(Math.random()-0.5)*shakeAmt*0.7;
      camera.position.z+=(Math.random()-0.5)*shakeAmt;
    }
    const lookFwd = camMode===1 ? 6.5 : 7.2;
    const look=new THREE.Vector3(player.x+Math.sin(player.heading)*lookFwd, (player.y||0)*0.5+1.12, player.z+Math.cos(player.heading)*lookFwd);
    camera.up.set(0,1,0);                                     // roll inheritance 0: horizon stays level
    camera.lookAt(look);
  }
  const targetFov=60+Math.min(1, Math.abs(player.speed)/42)*8+(player.boosting? 4.0 : 0); // turbo breathe
  fovCur+=(targetFov-fovCur)*Math.min(1,dt*3.5);
  if(Math.abs(fovCur-camera.fov)>0.05){ camera.fov=fovCur; camera.updateProjectionMatrix(); }
}

const clock=new THREE.Clock();
let physAcc=0;
let rallyProgress=0, streetT=0, lastStreet='', lastRingCharge=-1; // Lane A loop state
let approachLatch=false; // Lane E: approachEnd fires once per approach
let _btnHidden=false;    // Lane B polish: driving-button visibility latch
let prevRL=null, prevRR=null, smokeAcc=0, turboAcc=0, roadLift=0;
let lastStars=-1, lastScore=-1, lastComboText='', lastFootText='', lastFootBg='', lastFootOp='', lastLegText='', lastActText='', lastCrewVis=false;
function animate(){
  requestAnimationFrame(animate);
  const rawDt=Math.min(clock.getDelta(), 0.06);
  const dt = rawDt * (activities.timeScale || 1.0);
  // Lane B: interiors tick every frame (entry prompts + door-mom beats
  // outside; the cutaway itself inside). While the player is inside a
  // house, the interior owns input + camera and the driving sim rests.
  const _inp = (started && player) ? pollInput() : null;
  interiors.tick(rawDt, { started: !!started, x: player? player.x : 0, z: player? player.z : 0,
    speed: player? Math.abs(player.speed) : 0, steer: _inp? _inp.steer : 0,
    up: !!_inp && (!!keys['KeyW'] || !!keys['ArrowUp'] || joyY < -0.55),
    down: !!_inp && (!!keys['KeyS'] || !!keys['ArrowDown'] || joyY > 0.55) });
  // Lane B polish: the driving/action buttons, driving HUD & minimap hide while inside a house
  if(interiors.active!==_btnHidden){ _btnHidden=interiors.active; const dsp=_btnHidden? 'none' : '';
    for(const id of ['btnA','btnB','btnT','btnCam','btnFoot','btnRadio','target','street','nav']) {
      const el=document.getElementById(id); if(el) el.style.display=dsp;
    }
    const rToast=document.getElementById('radioToast'); if(rToast && _btnHidden) rToast.style.opacity='0';
    if(_btnHidden){ crewBtn.style.display='none'; actBtn.style.display='none'; minimap.hide(); }
    else if(started) minimap.show();
  }
  if(started && player && !interiors.active){
    const rawInput = pollInput();
    const input = missions ? missions.modInput(rawInput) : rawInput;
    const nightK = Math.max(0, Math.min(1, (daynight.phase - 0.30) / 0.55));
    // Lane E: throttling out of an arrival beat starts the takeoff
    // pull-back (finale ends the leg program; households roll on)
    if(!onfoot.state.active && input.throttle>0.3 && cine.state.phase.startsWith('arrive')) cine.takeoff(finished? { nextLeg:false } : undefined);

    if(onfoot.state.active){
      prevRL=prevRR=null;
      onfoot.update(dt, input, camYaw ?? player.heading, player, poseIdle, poseWalk, {
        parkedVehs, followers, traffic, wanted, playerCarId
      });
      gameAudio.setSpeed(0);
      gameAudio.setScreech(0);
    } else {
      physAcc+=dt;
      while(physAcc>=1/60){
        stepCar(player, input, 1/60, world.surfaceAt(player.x, player.z));
        collide(player, world.colliders);
        physAcc-=1/60;
      }
      const targetLift = player.offroad ? 0 : 0.066;
      roadLift += (targetLift - roadLift) * Math.min(1, dt * 14);
      const visYaw = player.heading + (player.driftAngle || 0);
      playerVeh.group.position.set(player.x, (player.y || 0) + roadLift, player.z);
      playerVeh.group.rotation.set(player.pitch || 0, visYaw, player.roll || 0);
      if(playerVeh.setRoadLift) playerVeh.setRoadLift(roadLift);
      playerVeh.updateWheels(player.speed, player.steerVis, dt);
      if(playerVeh.setLights) playerVeh.setLights({
        brake: !!input.brake || !!input.handbrake,
        reverse: player.speed < -0.4,
        nightK
      });
      // Flash roof lightbar if driving a stolen Howard County PD cruiser with siren on
      if(playerVeh.isCopCar && playerVeh.lightBar){
        const blink = Math.sin(performance.now() * 0.015) > 0;
        const ch = playerVeh.lightBar.children;
        if(ch[1] && ch[1].material) ch[1].material.emissiveIntensity = player.sirenActive ? (blink ? 4.0 : 0.2) : 0.4;
        if(ch[2] && ch[2].material) ch[2].material.emissiveIntensity = player.sirenActive ? (blink ? 0.2 : 4.0) : 0.4;
      }
      gameAudio.setSpeed(Math.abs(player.speed)/42);
      gameAudio.setScreech(player.slip || 0);

      // Rear-wheel skidmarks, drift smoke/dust & turbo exhaust sparks/flames
      const fwdX = Math.sin(visYaw), fwdZ = Math.cos(visYaw);
      const rightX = -Math.cos(visYaw), rightZ = Math.sin(visYaw);
      const rearZ = (playerVeh.dims?.len ?? 4.4) * 0.31, halfW = 0.78;
      const rx = player.x - fwdX * rearZ, rz = player.z - fwdZ * rearZ;
      const rlx = rx - rightX * halfW, rlz = rz - rightZ * halfW;
      const rrx = rx + rightX * halfW, rrz = rz + rightZ * halfW;

      if(!player.airborne && (player.slip || 0) > 0.25){
        if(prevRL && prevRR){
          fx.addSkid(prevRL.x, prevRL.z, rlx, rlz, player.slip);
          fx.addSkid(prevRR.x, prevRR.z, rrx, rrz, player.slip);
        }
        prevRL = { x:rlx, z:rlz }; prevRR = { x:rrx, z:rrz };
        smokeAcc += dt;
        if(smokeAcc >= 0.04){
          smokeAcc = 0;
          const sSide = Math.random()<0.5 ? -1 : 1;
          fx.emit(player.offroad? 'dust' : 'smoke', rx + rightX*halfW*sSide, 0.22, rz + rightZ*halfW*sSide,
            (Math.random()-0.5)*1.6, 0.9+Math.random()*1.1, (Math.random()-0.5)*1.6,
            0.55 + player.slip*0.45, 0.55 + player.slip*0.35);
        }
      } else {
        prevRL = prevRR = null;
      }

      if(player.boosting){
        turboAcc += dt;
        if(turboAcc >= 0.03){
          turboAcc = 0;
          const exX = rx - rightX*0.42 - fwdX*0.72, exZ = rz - rightZ*0.42 - fwdZ*0.72;
          fx.emit('turbo', exX, (player.y||0)+0.32, exZ,
            -fwdX*7+(Math.random()-0.5)*1.2, 0.4, -fwdZ*7+(Math.random()-0.5)*1.2, 0.42, 0.26);
          if(Math.random()<0.45) fx.emit('flame', exX, (player.y||0)+0.32, exZ, -fwdX*5, 0.5, -fwdZ*5, 0.32, 0.18);
        }
      }

      if((player.hitImpulse || 0) > 0.12){
        shakeAmt = Math.max(shakeAmt, player.hitImpulse * 0.42);
        fx.burst('spark', player.x + fwdX*1.5, 0.72, player.z + fwdZ*1.5, 9, 6.5, 0.24, 0.42);
        gameAudio.crash(player.hitImpulse);
        player.hitImpulse = 0;
      }
      if((player.justLanded || 0) > 0.2){
        shakeAmt = Math.max(shakeAmt, player.justLanded * 0.38);
        fx.burst('dust', player.x, 0.35, player.z, 12, 6, 0.55, 0.55);
        gameAudio.crash(0.35);
        if((player.airTime || 0) > 0.45) addScore(Math.round(player.airTime * 250), 'STUNT AIR!');
        player.airTime = 0;
      }
      if(player.drifting){
        driftScoreAcc += dt * Math.abs(player.speed);
        if(driftScoreAcc >= 8){ driftScoreAcc = 0; addScore(25, 'DRIFT'); }
      } else {
        driftScoreAcc = 0;
      }

      // breadcrumb trail for the convoy
      if(!lastTrailPt || Math.hypot(player.x-lastTrailPt.x, player.z-lastTrailPt.z)>1.4){
        if(lastTrailPt) trailDist+=Math.hypot(player.x-lastTrailPt.x, player.z-lastTrailPt.z);
        lastTrailPt={x:player.x, z:player.z, d:trailDist};
        trail.push(lastTrailPt);
        if(trail.length>4000) trail.splice(0, trail.length-4000);
      }
    }

    // convoy followers retrace the trail
    followers.forEach((f, i)=>{
      if (f.missionHold) return;   // Lane D has the wheel (fake-cop beat)
      const back=(i+1)*13.5, want=trailDist-back;
      let tp=trail[0];
      for(let j=trail.length-1;j>=0;j--){ if(trail[j].d<=want){ tp=trail[j]; break; } }
      const dist=pursue(f.state, tp.x, tp.z, dt, world.surfaceAt(f.state.x, f.state.z), { arriveDist:26 });
      if(dist<2.2 && Math.abs(player.speed)<0.4) f.state.speed*=0.8;
      collide(f.state, world.colliders);
      f.veh.group.position.set(f.state.x, 0, f.state.z);
      f.veh.group.rotation.y=f.state.heading;
      f.veh.updateWheels(f.state.speed, f.state.steerVis, dt);
      if(f.veh.setLights) f.veh.setLights({ brake:false, reverse:false, nightK });
    });
    // crew figures: idle at their houses, wave when you're headed their way,
    // walk to their car when they join, player figure gets in at first throttle
    const tNow=performance.now()/1000;
    for(const person of people){
      if(person.mode==='gone') continue;
      const P=person.p.group;
      if(person.mode==='walk'){
        const dx=person.tx-P.position.x, dz=person.tz-P.position.z, dd=Math.hypot(dx,dz);
        if(dd<0.7){ person.mode='gone'; scene.remove(P);
          if(person.stopId===playerStop){ if(!onfoot.state.active) seatDriver(playerVeh, person.carId); }
          else { const f=followers.find(f=>f.carId===person.carId); if(f) seatDriver(f.veh, person.carId); }
          continue; }
        P.rotation.y=Math.atan2(dx,dz);
        const step=Math.min(dd, 1.6*dt);
        P.position.x+=dx/dd*step; P.position.z+=dz/dd*step;
        person.phase+=dt*7.5; poseWalk(person.p, person.phase);
      } else if(!finished && targets.length && person.stopId===targets[0]){
        poseWave(person.p, tNow);
      } else {
        poseIdle(person.p, tNow);
      }
    }

    // Live GTA World: AI Traffic, Breakables + Stunt Ramps, Howard County PD & FX
    traffic.update(dt, player, fx, gameAudio, {
      onNearMiss: () => addScore(100, 'NEAR MISS!'),
      onTrafficHit: imp => { if(imp > 14) wanted.addHeat(14, 'HIT & RUN'); }
    });
    props.update(dt, player, fx, gameAudio, {
      onPropSmash: it => {
        addScore(it.kind==='hydrant'? 75 : 40, it.kind==='hydrant'? 'HYDRANT GEYSER!' : 'SMASH!');
        if(it.kind==='hydrant') wanted.addHeat(10, 'VANDALISM');
        else if(props.stats().broken % 4 === 0) wanted.addHeat(8, 'RECKLESS DRIVING');
      },
      onRampLaunch: () => {
        addScore(200, 'STUNT LAUNCH!');
        activities.triggerStunt(player);
        showBanner('STUNT JUMP!', 'Send it over Scaggsville!', 1200);
      }
    });
    activities.update(rawDt, player, nightK);
    radio.update(rawDt, {
      street: lastStreet, speed: player.speed, stars: wanted.state.stars,
      onFoot: onfoot.state.active, carName: (CREW_VEHICLES[playerCarId]?.name) || playerVeh?.row?.name
    });
    wanted.update(dt, player, fx, gameAudio, {
      onEscape: st => {
        addScore(st * 250, 'ESCAPED PD!');
        showBanner('ESCAPED!', 'Lost Howard County PD (+$'+(st*250)+')', 2400);
      },
      onBusted: () => {
        combo = 0; comboTimer = 0;
        player.speed = 0; player.vLat = 0;
        showBanner('BUSTED!', 'Howard County PD let you off with a warning — keep rallying!', 2800);
      }
    });
    fx.updateMustangFire(dt, ath.hx+16, ath.hz+14, camera.position.x, camera.position.z);
    fx.update(dt, camera);

    checkArrivals();
    if (missions) missions.update(dt, hostState());
    // Lane E seam: stunt cam / crew sky-hop cam / cine cam / standard GTA chase cam
    let specialCam = false;
    if(crewSwapCam){
      crewSwapCam.t += rawDt / crewSwapCam.dur;
      const k = Math.min(1, crewSwapCam.t);
      const ease = k * k * (3 - 2 * k);
      const arcY = 2.6 + Math.sin(k * Math.PI) * 26;
      const cx = crewSwapCam.fromX + (crewSwapCam.toX - crewSwapCam.fromX) * ease;
      const cz = crewSwapCam.fromZ + (crewSwapCam.toZ - crewSwapCam.fromZ) * ease;
      camera.position.set(cx - Math.sin(player.heading)*7.4, arcY, cz - Math.cos(player.heading)*7.4);
      camera.up.set(0,1,0); camera.lookAt(cx, 1.0, cz);
      specialCam = true;
      if(k >= 1){ crewSwapCam = null; camYaw = player.heading; camPos.copy(camera.position); }
    } else if(activities.stuntActive){
      specialCam = activities.updateStuntCamera(rawDt, camera, player);
    }
    const cineOwned = (onfoot.state.active || specialCam) ? false : cine.update(dt, { player, input });
    if (cine.handoff){ const h=cine.handoff; camYaw=h.yaw; camPos.copy(h.pos); fovCur=h.fov; cine.handoff=null; }
    else if (cineOwned){ camYaw = cine.state.shadow.yaw; }   // keep the HUD arrow honest while cine owns the cam
    if (!cineOwned && !specialCam) updateCamera(dt);

    // HUD & Combo decay (DOM updated only on change)
    shakeAmt *= Math.exp(-9 * dt);
    if(comboTimer > 0){
      comboTimer -= dt;
      if(comboTimer <= 0){ combo = 0; comboLabel = ''; }
    }
    speedEl.textContent=Math.round(Math.abs(player.speed)*3.6);
    if(score !== lastScore){ lastScore=score; scoreValEl.textContent='$'+score.toLocaleString(); }
    const legTxt = finished? '' : `LEG ${Math.min(7, collected.size+1)}/7 · ${fmtTime((performance.now()-legStart)/1000)}`;
    if(legTxt !== lastLegText){ lastLegText=legTxt; if(legHudEl) legHudEl.textContent=legTxt; }
    const cText = combo > 1 ? `×${combo} ${comboLabel}` : (combo === 1 && comboTimer > 0 && comboLabel ? comboLabel : '');
    if(cText !== lastComboText){
      lastComboText = cText;
      comboPillEl.textContent = cText;
      comboPillEl.style.display = cText ? 'inline-block' : 'none';
    }
    const stStars = wanted.state.stars;
    if(stStars !== lastStars){
      lastStars = stStars;
      wantedEl.textContent = '★'.repeat(stStars) + '☆'.repeat(5 - stStars);
      wantedEl.style.opacity = stStars > 0 ? '1' : '0';
    }
    if(stStars > 0){
      const redSide = Math.sin(wanted.state.flashPhase) > 0;
      wantedEl.style.color = redSide ? '#ff525e' : '#66b8ff';
    }
    let fTxt='EXIT', fBg='rgba(24,32,54,.72)', fOp='1';
    if(onfoot.state.active){
      if(onfoot.state.nearestTarget){ fTxt='GET IN'; fBg='rgba(46,160,80,.82)'; }
      else { fTxt='ON FOOT'; fBg='rgba(24,32,54,.65)'; fOp='0.65'; }
    } else if(Math.abs(player.speed)>4.8 || player.airborne){
      fOp='0.45';
    }
    if(fTxt!==lastFootText){ lastFootText=fTxt; footBtn.textContent=fTxt; }
    if(fBg!==lastFootBg){ lastFootBg=fBg; footBtn.style.background=fBg; }
    if(fOp!==lastFootOp){ lastFootOp=fOp; footBtn.style.opacity=fOp; }
    const showCrew = followers.length > 0 && !onfoot.state.active;
    if(showCrew !== lastCrewVis){ lastCrewVis=showCrew; crewBtn.style.display=showCrew? 'flex' : 'none'; }
    let aTxt = '';
    if(!onfoot.state.active && activities.nearbyFlare){
      aTxt = (activities.nearbyFlare.kind==='race'? '🏁 RACE: ' : '💨 DRIFT: ') + activities.nearbyFlare.name;
    } else if(!onfoot.state.active && playerVeh && playerVeh.isCopCar){
      aTxt = player.sirenActive ? '🚨 SIREN OFF [H]' : '🚨 SIREN ON [H]';
    }
    if(aTxt !== lastActText){
      lastActText = aTxt;
      actBtn.textContent = aTxt;
      actBtn.style.display = aTxt ? 'flex' : 'none';
    }

    const t=currentTargetStop();
    const d=Math.hypot(player.x-t.sx, player.z-t.sz);
    // Lane E: feed the approach descent from the same distance the HUD
    // shows (trigger radius 220 m; 17 m = the collection range)
    if(d<=220) cine.approach(1-THREE.MathUtils.clamp((d-17)/203, 0, 1));
    if(d<=20 && !approachLatch){ approachLatch=true; cine.approachEnd(); }
    if(d>60) approachLatch=false;
    navdistEl.textContent = d>=1000? (d/1000).toFixed(2)+' km' : Math.round(d)+' m';
    const bearing=Math.atan2(t.sx-player.x, t.sz-player.z);
    let rel=bearing-camYaw; arrowEl.style.transform=`rotate(${rel}rad)`;
    const raceCp = activities.active && activities.active.kind==='race' ? activities.active.cps[activities.active.cpIdx] : null;
    minimap.update(dt, {
      px:player.x, pz:player.z, camYaw:camYaw ?? player.heading,
      targetStop:t, followers, cops:wanted.cops, ramps:props.ramps,
      flares:activities.flares, raceCp,
      wantedStars:wanted.state.stars, flashPhase:wanted.state.flashPhase
    });
    // sun shadow follows the player; sky dome too
    sun.position.set(player.x+sunDir.x*300, sunDir.y*300+40, player.z+sunDir.z*300);
    sun.target.position.set(player.x, 0, player.z); sun.target.updateMatrixWorld();
    if(dome){ dome.position.set(player.x, 0, player.z); }
    fireLight.intensity=11.5+Math.sin(performance.now()*0.021)*2.2+Math.sin(performance.now()*0.047)*1.6;
    // Lane A: rally progress for the day/night cycle — stops collected and
    // elapsed time, whichever is further along (nominal full rally ~9 min)
    rallyProgress = finished? 1 : Math.max(collected.size/7, Math.min(1, (performance.now()-startTime)/540000));
    // Lane A: headlight beam follows the cycle (soft at golden, full at night)
    if(playerBeam) playerBeam.intensity = onfoot.state.active ? daynight.current.beamIntensity*0.35 : daynight.current.beamIntensity;
    // Lane A: turbo charge ring (2D precedent) + engine-note hook —
    // audio.js setBoost is real (the turbo whistle); the guard stays so
    // an audio module without it could never break the loop
    if(turboRingEl && Math.abs(player.charge-lastRingCharge)>0.01){
      lastRingCharge=player.charge;
      turboRingEl.style.strokeDashoffset=(TURBO_RING_C*(1-player.charge)).toFixed(1);
    }
    if(typeof gameAudio.setBoost==='function') gameAudio.setBoost(!onfoot.state.active && player.boosting? 1:0);
    // Lane A: current-street readout (2D L10 wording), refreshed ~4/sec,
    // DOM touched only when the text actually changes
    streetT-=dt;
    if(streetT<=0){ streetT=0.25;
      const lbl=streetLabel(player.x, player.z);
      if(lbl!==lastStreet){ lastStreet=lbl;
        streetSpan.textContent=lbl;
        streetEl.style.display=lbl? '' : 'none';
      }
    }
  }
  // Lane A: cycle + crowd tick every frame (also behind the pick screen)
  daynight.update(dt, rallyProgress);
  daynight.applyTo(lightRig);
  crowd.update(dt, performance.now()/1000);
  if(!started && garage){ garage.update(dt, performance.now()/1000); garage.render(renderer); }
  else renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================== PROOF HOOKS ============================== */
window.__dbg={ get ready(){ return started; },
  get audio(){ return gameAudio.state(); },
  get music(){ return music.state(); },
  get cine(){ return cine.state; },
  get state(){ return player? { x:player.x, z:player.z, heading:player.heading, speed:player.speed,
    collected:[...collected], targets:[...targets], followers:followers.length, finished,
    driverSeated: !!(playerVeh && playerVeh._driver),
    phase: daynight.phase, phaseName: daynight.phaseName, timeLocked: daynight.locked,
    street: lastStreet, boosting: !!player.boosting, charge: player.charge,
    stars: wanted.state.stars, heat: Math.round(wanted.state.heat), score, combo, onFoot: onfoot.state.active,
    leg: Math.min(7, collected.size+1), legTime: +(((performance.now()-legStart)/1000).toFixed(1)),
    legTimes: legTimes.map(t=>+t.toFixed(1)), totalTime: +(((performance.now()-startTime)/1000).toFixed(1)),
    onRoof: onfoot.state.onRoof, isCopCar: !!(playerVeh && playerVeh.isCopCar),
    sirenActive: !!(player && player.sirenActive),
    radioStation: radio.current.id, stuntActive: activities.stuntActive,
    activity: activities.active ? activities.active.kind : null,
    drifting: !!player.drifting, slip: player.slip,
    trafficCount: traffic.cars.filter(c=>c.active).length,
    propsBroken: props.stats().broken, camMode,
    crowd: crowd.stats(), interior: interiors.stats() } : null; } };
window.__proof={
  start(id){ startGame(id||'brad'); },
  teleport(x,z,heading){ if(player){ player.x=x; player.z=z; if(heading!==undefined) player.heading=heading;
    player.speed=0; player.vLat=0; player.vy=0; player.y=0; player.airborne=false; prevRL=prevRR=null;
    trail.length=0; trailDist=0; lastTrailPt=null; camYaw=null; } },
  overhead(on){ overheadMode=!!on; if(!on){ camera.fov=60; camera.updateProjectionMatrix(); } },
  routePt(f){ const r=world.route; const i=Math.min(r.length-5, Math.floor(r.length*f)); const p=r[i], q=r[i+4];
    return { x:p[0], z:p[1], heading:Math.atan2(q[0]-p[0], q[1]-p[1]) }; },
  stopPt(id){ const s=stopById[id]; return s? { x:s.sx, z:s.sz, hx:s.hx, hz:s.hz, heading:s.heading } : null; },
  stats(){ return renderer.info.render; },
  enterHouse(id){ interiors.enter(id); },   // Lane B: cutaway entry/exit
  exitHouse(){ interiors.exit(); },
  houseHero(x, floor){ return interiors.debugSetHero(x, floor); },
  inside(){ return interiors.active; },
  openMiniGame(kind){ interiors.openMiniGame(kind); },
  closeMiniGame(){ interiors.closeMiniGame(); },
  partyAnchors(id){ return interiors.partyAnchors(id); },
  setTime(v){ daynight.setPhase(v); },   // Lane A: name | 0..1 | null (unlock)
  street(){ return lastStreet; },
  spawnCop(stars=2){ return wanted.addHeat(stars * 25, 'PROOF'); },
  clearWanted(){ wanted.clear(); },
  toggleFoot(){ return toggleOnFoot(); },
  vaultOrRoll(){ return onfoot.triggerVaultOrRoll({ parkedVehs, followers, traffic, wanted, playerCarId }); },
  cycleRadio(){ return radio.cycle(); },
  startActivity(id){ return activities.startById(id, player); },
  switchCrew(){ return switchCrew(); },
  skipCine(){ cine.cancel(); },
  setCam(m){ camMode=(m|0)%3; cine.cancel(); },
  setInput(obj){ proofInput=obj || null; },
};
window.__missions = missions;
window.__crowd = crowd;   // Lane A seam for the party lane (spawnCrowd/clearCrowd)
</script>
</body>
