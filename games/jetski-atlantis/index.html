<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>APEX WAKE — Atlantis Bake-Off</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0a2e47; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    color: #f2f8fc;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body:not(.g) #gl { filter: blur(5px) brightness(0.78); }
  #vig {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 58%, rgba(2,16,28,0.30) 100%);
  }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 1150; }
  body:not(.g) #hud { display: none; }
  body:not(.g) .tcov { display: none; }
  .panel {
    background: rgba(5, 20, 34, 0.44); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(180, 238, 255, 0.22); border-radius: 14px;
    box-shadow: 0 8px 28px rgba(0, 12, 24, 0.32);
  }
  #topLeft { position: absolute; top: 14px; left: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 3px; }
  #brand { font-size: 11px; font-weight: 800; letter-spacing: 0.24em; color: #ffd9a0; }
  #scoreLine { font-size: 20px; font-weight: 800; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  #subLine { font-size: 11px; font-weight: 600; color: rgba(226, 246, 255, 0.8); letter-spacing: 0.08em; }
  #topRight { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; pointer-events: auto; }
  .pillBtn {
    background: rgba(5, 22, 36, 0.56); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(180, 238, 255, 0.28); color: #effaff; border-radius: 999px;
    padding: 8px 13px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer; touch-action: manipulation;
  }
  .pillBtn:active { transform: scale(0.94); }
  #speedo { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 22px 12px; min-width: 180px; text-align: center; }
  #mphVal { font-size: 38px; font-weight: 900; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  #mphUnit { font-size: 11px; font-weight: 700; letter-spacing: 0.24em; color: #ffd9a0; margin-left: 4px; }
  #boostTrack { margin-top: 8px; height: 7px; border-radius: 999px; overflow: hidden; background: rgba(255, 255, 255, 0.16); }
  #boostFill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #ffb347, #ff5340); }
  #callout {
    position: absolute; top: 22%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
    font-size: 26px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: #fff;
    text-shadow: 0 3px 22px rgba(255, 158, 87, 0.9), 0 2px 6px rgba(0, 0, 0, 0.75);
    opacity: 0; transition: opacity 0.18s, transform 0.18s; pointer-events: none; text-align: center; white-space: nowrap;
  }
  #callout.show { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
  #title {
    position: fixed; inset: 0; z-index: 1200; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; padding: 58px 22px 46px; text-align: center;
    pointer-events: auto; cursor: pointer;
    background: linear-gradient(180deg, rgba(4, 20, 36, 0.42) 0%, rgba(4, 20, 36, 0.05) 45%, rgba(4, 20, 36, 0.55) 100%);
    transition: opacity 0.45s ease;
  }
  #title.gone { opacity: 0; pointer-events: none; }
  #title h1 {
    margin: 0; font-size: clamp(38px, 9vw, 68px); font-weight: 900; letter-spacing: 0.16em;
    background: linear-gradient(180deg, #ffffff 20%, #ffd9a0 90%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 6px 24px rgba(0, 30, 60, 0.7));
  }
  #title .sub { margin-top: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.34em; color: #ffe9c4; text-shadow: 0 2px 10px rgba(0,0,0,0.65); }
  #bar { width: min(420px, 74vw); height: 3px; margin: 18px auto 10px; background: rgba(255, 217, 160, 0.25); border-radius: 999px; overflow: hidden; }
  #barFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ffb347, #ffe9c4); transform: scaleX(0.04); transform-origin: left; transition: transform 0.3s ease; }
  #status { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: rgba(255, 240, 214, 0.92); min-height: 16px; }
  #title .cta {
    display: inline-block; margin-top: 20px; padding: 15px 34px; border-radius: 999px;
    font-size: 14px; font-weight: 800; letter-spacing: 0.22em;
    background: linear-gradient(135deg, #ffb347, #ff7a3c); color: #2a1402;
    border: 1px solid rgba(255, 255, 255, 0.55); box-shadow: 0 10px 30px rgba(255, 140, 60, 0.4);
  }
  #title .hint { margin-top: 14px; font-size: 11.5px; letter-spacing: 0.1em; color: rgba(230, 248, 255, 0.88); text-shadow: 0 1px 6px rgba(0,0,0,0.85); }
  .lvRow { margin-top: 16px; display: flex; gap: 8px; justify-content: center; }
  .lvBtn {
    padding: 7px 14px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    background: rgba(5, 22, 36, 0.5); color: rgba(230, 248, 255, 0.75);
    border: 1px solid rgba(180, 238, 255, 0.3); cursor: pointer;
  }
  .lvBtn.on { background: rgba(255, 179, 71, 0.85); color: #2a1402; border-color: #ffe9c4; }
  #err {
    position: fixed; inset: 0; z-index: 1300; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 30px;
    background: linear-gradient(180deg, #123a5e, #0a2e47);
  }
  #errTitle { font-size: 24px; font-weight: 900; letter-spacing: 0.06em; margin-bottom: 12px; }
  #errMsg { font-size: 15px; line-height: 1.55; max-width: 430px; color: rgba(240, 248, 255, 0.92); }
  @media (max-width: 540px) {
    #speedo { bottom: 104px; padding: 7px 16px 9px; min-width: 150px; }
    #mphVal { font-size: 28px; }
    #topLeft { top: 10px; left: 10px; padding: 6px 10px; }
    #brand { font-size: 9px; letter-spacing: 0.16em; }
    #scoreLine { font-size: 15px; }
    #subLine { font-size: 9.5px; }
    #topRight { top: 10px; right: 10px; gap: 5px; }
    .pillBtn { padding: 5px 8px; font-size: 9px; letter-spacing: 0.06em; }
    #callout { font-size: 17px; letter-spacing: 0.1em; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="hud">
  <div id="topLeft" class="panel">
    <div id="brand">APEX WAKE · ATLANTIS BUILD</div>
    <div id="scoreLine">0 PTS</div>
    <div id="subLine">FREE RIDE · GOLDEN HOUR</div>
  </div>
  <div id="topRight">
    <button class="pillBtn" id="qualBtn">QUALITY</button>
    <button class="pillBtn" id="muteBtn">SFX ON</button>
  </div>
  <div id="callout"></div>
  <div id="speedo" class="panel">
    <div><span id="mphVal">0</span><span id="mphUnit">MPH</span></div>
    <div id="boostTrack"><div id="boostFill"></div></div>
  </div>
</div>
<div id="title">
  <div>
    <h1>APEX WAKE</h1>
    <div class="sub">FREE RIDE · GOLDEN HOUR</div>
  </div>
  <div>
    <div id="bar"><div id="barFill"></div></div>
    <div id="status">Decompressing…</div>
    <div class="cta">TAP TO RIDE</div>
    <div class="hint">STICK / WASD — THROTTLE &amp; STEER · BOOST +10 MPH · TRICK — FLIPS &amp; DIVES</div>
    <div class="lvRow">
      <button class="lvBtn" data-lv="0">LOW</button>
      <button class="lvBtn" data-lv="1">MED</button>
      <button class="lvBtn" data-lv="2">HIGH</button>
    </div>
  </div>
</div>
<div id="err">
  <div id="errTitle"></div>
  <div id="errMsg"></div>
</div>
