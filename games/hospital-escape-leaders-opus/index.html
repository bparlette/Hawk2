<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14181e">
<title>Leaders Improved</title>
<style>
html,body{margin:0;height:100%;background:#14181e;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Helvetica Neue",Arial,sans-serif}
#view{position:fixed;inset:0}#view canvas{display:block;width:100%;height:100%}
#hdr{position:fixed;left:14px;top:calc(10px + env(safe-area-inset-top));z-index:1200;color:#fff;font:800 15px/1.2 "Helvetica Neue",Arial;letter-spacing:.04em;text-shadow:0 1px 4px rgba(0,0,0,.8);pointer-events:none}
#hdr small{display:block;font:600 10.5px/1.35 Arial;color:#b9c4cf;letter-spacing:.02em;margin-top:3px}
#hdr small b{color:#e8c95a;font-weight:800}
#ui{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:1200;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 10px;pointer-events:none}
#bar{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
#bar button{pointer-events:auto;min-width:56px;height:58px;padding:0 13px;border-radius:32px;border:2px solid rgba(255,255,255,.55);background:rgba(16,20,26,.72);color:#fff;font:900 16px Arial;letter-spacing:.04em;touch-action:none;cursor:pointer}
#bar button.gold{border-color:#e8c95a;color:#e8c95a}
#bar button.on{background:#e8ecf1;color:#10141a;border-color:#fff}
#bar button.gold.on{background:#e8c95a;color:#10141a;border-color:#fff}
#dirbar{display:flex;justify-content:center;gap:8px}
#dirbar button{pointer-events:auto;min-width:56px;height:58px;padding:0 15px;border-radius:32px;border:2px solid rgba(255,255,255,.55);background:rgba(16,20,26,.72);color:#fff;font:900 14px Arial;letter-spacing:.06em;touch-action:none;cursor:pointer}
#dirbar button.on{background:#e8ecf1;color:#10141a;border-color:#fff}
#load{position:fixed;inset:0;z-index:1300;display:flex;align-items:center;justify-content:center;color:#dfe6ee;font:700 16px Arial;letter-spacing:.08em;background:#14181e;text-align:center;padding:24px}
</style></head>
<body>
<div id="view"></div>
<div id="hdr">Leaders: before / after (Opus)<small><b>1 = Ex1 as judged · 1+ = Ex1 improved</b><br>N2 = as judged · N2+ = N2 improved (shippable CMU walk, gun-ready)<br>FRONT · BACK · SIDE aim the follow camera</small></div>
<div id="ui"><div id="dirbar"><button data-dir="front">FRONT</button><button data-dir="back">BACK</button><button data-dir="side">SIDE</button></div>
<div id="bar"><button data-mode="both" class="on">ALL</button><button data-mode="1" class="gold">1</button><button data-mode="1p" class="gold">1+</button><button data-mode="n2">N2</button><button data-mode="n2p">N2+</button></div></div>
<div id="load">LOADING…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="../hospital-escape-walkoff-neon/game/gunman-data-0.js"></script><script src="../hospital-escape-walkoff-neon/game/gunman-data-1.js"></script><script src="../hospital-escape-walkoff-neon/game/gunman-data-2.js"></script><script src="../hospital-escape-walkoff-neon/game/gunman-data-3.js"></script>
<script src="leaders.js"></script>
</body></html>
