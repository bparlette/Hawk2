<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hospital Escape — Hallway Bake-Off · Moth</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0e11;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #hud{position:fixed;top:0;left:0;right:0;z-index:1200;pointer-events:none;padding:10px 12px;color:#eef3f6;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  #hud .t{font-size:15px;font-weight:700;letter-spacing:.04em}
  #hud .s{font-size:11.5px;opacity:.92;margin-top:2px;line-height:1.45}
  #hud .stats{font-size:10.5px;opacity:.75;margin-top:2px;font-variant-numeric:tabular-nums}
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:1200;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(4,8,10,.88) 30%);display:flex;flex-direction:column;gap:6px}
  .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .btn{pointer-events:auto;border:1px solid rgba(255,255,255,.35);background:rgba(16,24,30,.82);color:#e8f0f4;border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:600;letter-spacing:.02em;cursor:pointer}
  .btn.on{background:#e8b730;border-color:#e8b730;color:#131a1e}
  .btn:active{transform:scale(.96)}
  .lbl{color:#9fb4c0;font-size:10px;font-weight:700;letter-spacing:.14em;align-self:center;margin-right:2px}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="t">HOSPITAL ESCAPE — HALLWAY BAKE-OFF · MOTH</div>
  <div class="s" id="takeName">TAKE 1 — PHOTOREAL PBR</div>
  <div class="s" id="takeDesc">CC0 photo textures, dynamic relight, high material fidelity.</div>
  <div class="stats" id="stats">—</div>
</div>
<div id="bar">
  <div class="row" id="takeRow"><span class="lbl">TAKE</span></div>
  <div class="row" id="camRow"><span class="lbl">CAM</span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="tex-data.js"></script>
<script>
(function(){
'use strict';
/* ============ fixed stage (from level1.js env, g_halls gauntlet corridor) ============
   Local coords: floor y=0, zL = world z + 91. Corridor A: x[-1.8,1.8], z[5,-26.8], h 3.0.
   Corridor B: z[-26.8,-23.2], x[-1.8,22]. Route: (0,0)->(0,-13)->(0,-21)->(3.5,-25)->(16,-25). */
var W=3.6, HW=1.8, H=3.0, ZA=5, ZB=-26.8, ZBN=-23.2, XB=22;
var PANELS_A=[3,-1,-5,-9,-13,-17,-21,-25], PANELS_B=[2,6,10,14,18];
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,0.08,120);

/* ---------- canvas texture helpers ---------- */
function cnv(w,h,f){var c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c;}
function ctex(c,rx,ry,srgb){var t=new THREE.CanvasTexture(c);if(rx){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry||rx);}if(srgb!==false)t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
function speck(g,w,h,n,cols,a,s0,s1){for(var i=0;i<n;i++){g.fillStyle=cols[(Math.random()*cols.length)|0];g.globalAlpha=a*(0.35+Math.random()*0.65);var s=s0+Math.random()*(s1-s0);g.fillRect(Math.random()*w,Math.random()*h,s,s*(0.6+Math.random()));}g.globalAlpha=1;}
function brush(g,w,h,n,cols,a,l0,l1){g.lineCap='round';for(var i=0;i<n;i++){g.strokeStyle=cols[(Math.random()*cols.length)|0];g.globalAlpha=a*(0.3+Math.random()*0.7);g.lineWidth=1.5+Math.random()*4;var x=Math.random()*w,y=Math.random()*h,l=l0+Math.random()*(l1-l0),an=(Math.random()-0.5)*0.5;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(an)*l,y+Math.sin(an)*l);g.stroke();}g.globalAlpha=1;}
function signTex(text,bg,fg,sub){return ctex(cnv(512,128,function(g,w,h){g.fillStyle=bg;g.fillRect(0,0,w,h);g.strokeStyle=fg;g.lineWidth=5;g.strokeRect(7,7,w-14,h-14);g.fillStyle=fg;g.textAlign='center';g.font='bold 44px Arial';g.fillText(text,w/2,sub?58:80);if(sub){g.font='bold 25px Arial';g.fillText(sub,w/2,102);}}),0,0);}
function exitTex(){return ctex(cnv(256,96,function(g,w,h){g.fillStyle='#0d5c2c';g.fillRect(0,0,w,h);g.fillStyle='#fff';g.font='bold 52px Arial';g.textAlign='center';g.fillText('EXIT',w/2,66);}),0,0);}
function plateTex(txt){return ctex(cnv(128,128,function(g,w,h){g.fillStyle='#274b63';g.fillRect(0,0,w,h);g.strokeStyle='#dce8ef';g.lineWidth=4;g.strokeRect(6,6,w-12,h-12);g.fillStyle='#eef5f9';g.font='bold 40px Arial';g.textAlign='center';g.fillText(txt,w/2,78);}),0,0);}

/* ---------- photo textures (Take 1/5): ambientCG CC0 ---------- */
var photoReady=false, photoErr=false, PH={};
(function(){
  var mgr=new THREE.LoadingManager();
  mgr.onLoad=function(){photoReady=true; if(window.__rebuildPhotoTakes)window.__rebuildPhotoTakes();};
  mgr.onError=function(){photoErr=true;};
  var tl=new THREE.TextureLoader(mgr);
  function ld(name,url,srgb){var src=(window.TEXDATA&&window.TEXDATA[name])||url;var t=tl.load(src);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=8;PH[name]=t;}
  ld('floorC','tex/floor_c.jpg',1); ld('floorN','tex/floor_n.jpg',0); ld('floorR','tex/floor_r.jpg',0);
  ld('wallC','tex/wall_c.jpg',1); ld('wallN','tex/wall_n.jpg',0); ld('wallR','tex/wall_r.jpg',0);
})();
function photoMat(kind,rx,ry,extra){
  var m={roughness:1,metalness:0};
  if(kind==='floor'){m.map=PH.floorC.clone();m.normalMap=PH.floorN.clone();m.roughnessMap=PH.floorR.clone();}
  else{m.map=PH.wallC.clone();m.normalMap=PH.wallN.clone();m.roughnessMap=PH.wallR.clone();}
  for(var k in m){if(m[k]&&m[k].isTexture){m[k].needsUpdate=true;m[k].repeat.set(rx,ry);}}
  if(extra)for(var k2 in extra)m[k2]=extra[k2];
  return new THREE.MeshStandardMaterial(m);
}

/* ---------- procedural painted/plain textures (game art language) ---------- */
function paintedFloorTex(){return ctex(cnv(512,512,function(g,w,h){
  g.fillStyle='#c6c1ad';g.fillRect(0,0,w,h);
  brush(g,w,h,260,['#a8a290','#c8c2b0','#98927f','#bfb9a5'],0.25,20,80);
  speck(g,w,h,2200,['#8f8a76','#d6d0ba','#7e8a90'],0.35,1,3);
  g.strokeStyle='rgba(84,82,70,.55)';g.lineWidth=3;g.strokeRect(0,0,w,h);
  g.fillStyle='rgba(120,116,98,.35)';g.fillRect(0,0,w,3);g.fillRect(0,0,3,h);
}),1,1);}
function paintedWallTex(){return ctex(cnv(512,512,function(g,w,h){
  g.fillStyle='#dde0d2';g.fillRect(0,0,w,h);
  brush(g,w,h,200,['#ccd2c2','#e8ead9','#c2cabb','#d3dac6'],0.3,24,90);
  speck(g,w,h,700,['#c6ccbc','#eef0e2'],0.35,1,3);
}),1,1);}
function paintedCeilTex(){return ctex(cnv(256,256,function(g,w,h){
  g.fillStyle='#e9e7da';g.fillRect(0,0,w,h);brush(g,w,h,60,['#dbd8c8','#f2f0e4'],0.3,14,50);
  speck(g,w,h,900,['#cfccc0','#fbfaf2'],0.4,1,2);g.strokeStyle='#a9a698';g.lineWidth=4;g.strokeRect(0,0,w,h);
}),1,1);}
function plainCeilTex(){return ctex(cnv(256,256,function(g,w,h){
  g.fillStyle='#e8e8e2';g.fillRect(0,0,w,h);speck(g,w,h,1500,['#d2d2c8','#f6f6f0'],0.45,1,2);
  g.strokeStyle='#a3a39a';g.lineWidth=4;g.strokeRect(0,0,w,h);
  g.fillStyle='rgba(120,120,112,.5)';for(var i=0;i<40;i++)g.fillRect(Math.random()*w,Math.random()*h,2,2);
}),1,1);}
function doorTexPainted(){return ctex(cnv(128,256,function(g,w,h){
  g.fillStyle='#7f9db3';g.fillRect(0,0,w,h);brush(g,w,h,60,['#7290a6','#8cabbf','#68849a'],0.35,10,44);
  g.fillStyle='#5d7a90';g.fillRect(8,8,w-16,h-16);g.fillStyle='#1d2c38';g.fillRect(36,36,56,74);
  g.fillStyle='rgba(255,255,255,.16)';g.fillRect(36,36,56,10);
}),0,0);}
function bakeCanvas(w,h,draw){return cnv(w,h,draw);}

/* ---------- small geometry helpers ---------- */
function box(g,w,h,d,mat,x,y,z,ry,parent){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);if(ry)m.rotation.y=ry;m.castShadow=true;m.receiveShadow=true;(parent||g).add(m);return m;}
function cyl(g,rt,rb,h,mat,x,y,z,seg,parent){var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||14),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||g).add(m);return m;}
function plane(g,w,h,mat,x,y,z,ry,rx,parent){var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);m.position.set(x,y,z);if(ry)m.rotation.y=ry;if(rx)m.rotation.x=rx;m.receiveShadow=true;(parent||g).add(m);return m;}

/* ================= STAGE BUILDER =================
   M = material set {floor, wallUp, wallLow, ceil, panel, door, glass, metal, darkMetal, rail}
   O = options {rail:boolean, plates:boolean, panelGlow:0..1}                        */
function buildShell(g,M,O){
  g.userData.panels=[];
  // floors (two slabs forming the L)
  var fA=plane(g,W,ZA-ZB,M.floorA||M.floor,0,0,(ZA+ZB)/2,0,-Math.PI/2); fA.userData.floor=true;
  var fB=plane(g,XB+HW,ZBN-ZB,M.floorB||M.floor,(XB-HW)/2,0.001,-25,0,-Math.PI/2); fB.userData.floor=true;
  // ceilings
  plane(g,W,ZA-ZB,M.ceilA||M.ceil,0,H,(ZA+ZB)/2,0,Math.PI/2);
  plane(g,XB+HW,ZBN-ZB,M.ceilB||M.ceil,(XB-HW)/2,H-0.001,-25,0,Math.PI/2);
  // light panels (emissive slabs in ceiling)
  PANELS_A.forEach(function(z){var p=box(g,0.62,0.04,1.24,M.panel,0,H-0.03,z); p.userData.panel=true; g.userData.panels.push(p);});
  PANELS_B.forEach(function(x){var p=box(g,1.24,0.04,0.62,M.panel,x,H-0.03,-25); p.userData.panel=true; g.userData.panels.push(p);});
  /* walls: segments [from,to] along an axis at fixed coord; holes = door/station spans */
  function wallZ(x,z0,z1,holes,face){ // wall along Z at x, face=+1 means faces +x
    var spans=[],cur=z0;
    holes.slice().sort(function(a,b){return b[0]-a[0];}).forEach(function(hl){ /* holes given high->low z */ });
    // build spans walking from z0 (high) down to z1 (low)
    var pts=[z0]; holes.forEach(function(hl){pts.push(hl[0],hl[1]);}); pts.push(z1);
    for(var i=0;i<pts.length;i+=2){
      var a=pts[i],b=pts[i+1]; if(a-b<0.01)continue;
      box(g,0.15,H,a-b,M.wallUp,x,H/2,(a+b)/2);
      box(g,0.17,1.02,a-b,M.wallLow,x,0.51,(a+b)/2);
      if(O.rail)box(g,0.05,0.14,a-b,M.rail,x+face*0.11,0.92,(a+b)/2);
    }
    holes.forEach(function(hl){ // lintel above hole
      var wdt=hl[2]||2.15; box(g,0.15,H-wdt,hl[0]-hl[1],M.wallUp,x,wdt+(H-wdt)/2,(hl[0]+hl[1])/2);
      if(hl[3])doorUnit(g,M,x,(hl[0]+hl[1])/2,face,'z');
    });
  }
  function wallX(z,x0,x1,holes,face){
    var pts=[x0]; holes.forEach(function(hl){pts.push(hl[0],hl[1]);}); pts.push(x1);
    for(var i=0;i<pts.length;i+=2){
      var a=pts[i],b=pts[i+1]; if(b-a<0.01)continue;
      box(g,b-a,H,0.15,M.wallUp,(a+b)/2,H/2,z);
      box(g,b-a,1.02,0.17,M.wallLow,(a+b)/2,0.51,z);
      if(O.rail)box(g,b-a,0.14,0.05,M.rail,(a+b)/2,0.92,z+face*0.11);
    }
    holes.forEach(function(hl){
      var wdt=hl[2]||2.15; box(g,hl[1]-hl[0],H-wdt,0.15,M.wallUp,(hl[0]+hl[1])/2,wdt+(H-wdt)/2,z);
      if(hl[3])doorUnit(g,M,z,(hl[0]+hl[1])/2,face,'x');
    });
  }
  // Corridor A west wall x=-1.8 (faces +x): doors zL -4, -10.5
  wallZ(-HW,ZA,ZB,[[-3.5,-4.5,2.15,1],[-10,-11,2.15,1]],1);
  // Corridor A east wall x=+1.8 (faces -x): door -1, station opening -13.5..-17.5 (open above counter to 2.2), door -19
  wallZ(HW,ZA,ZBN,[[-0.5,-1.5,2.15,1],[-13.5,-17.5,2.2,0],[-18.5,-19.5,2.15,1]],-1);
  // Corridor B north wall z=-23.2 (corridor side is -z): door x=14.5
  wallX(ZBN,HW,XB,[[14,15,2.15,1]],-1);
  // Corridor B south wall z=-26.8 (corridor side is +z): door x=7
  wallX(ZB,-HW,XB,[[6.5,7.5,2.15,1]],1);
  // North cap of A (z=5): wall + elevator double door
  box(g,W,H,0.15,M.wallUp,0,H/2,ZA); box(g,W,1.02,0.17,M.wallLow,0,0.51,ZA);
  box(g,0.86,2.2,0.07,M.door,-0.45,1.1,ZA-0.1); box(g,0.86,2.2,0.07,M.door,0.45,1.1,ZA-0.1);
  box(g,0.06,2.2,0.09,M.darkMetal,0,1.1,ZA-0.1);
  var es=plane(g,2.2,0.55,new THREE.MeshBasicMaterial({map:signTex('ELEVATORS','#274b63','#fff'),side:THREE.DoubleSide}),0,2.55,ZA-0.12,Math.PI);
  // East glass end of B (cafeteria glass, env glassX=22)
  box(g,0.12,H,0.5,M.darkMetal,XB,H/2,ZBN+0.25); box(g,0.12,H,0.5,M.darkMetal,XB,H/2,ZB-0.25);
  box(g,0.12,0.5,ZBN-ZB,M.darkMetal,XB,H-0.25,-25); box(g,0.12,0.35,ZBN-ZB,M.darkMetal,XB,0.17,-25);
  var gl=box(g,0.04,H-0.85,ZBN-ZB-1.0,M.glass,XB,(H-0.85)/2+0.35,-25); gl.castShadow=false;
  // dim cafeteria hint behind glass
  var hint=new THREE.Group(); g.add(hint);
  box(hint,6,4.2,10,new THREE.MeshBasicMaterial({color:0x14201f}),XB+3.2,2.1,-25).castShadow=false;
  box(hint,4.4,0.95,1.0,new THREE.MeshBasicMaterial({color:0x2c423c}),XB+2.6,0.48,-25).castShadow=false;
  box(hint,4.6,0.06,1.1,new THREE.MeshBasicMaterial({color:0x51665c}),XB+2.6,0.99,-25).castShadow=false;
  var ex=plane(g,1.1,0.42,new THREE.MeshBasicMaterial({map:exitTex(),side:THREE.DoubleSide}),XB-0.12,2.62,-25,-Math.PI/2);
  // junction + env signs (hanging sign at z=-5, env sign position)
  var s1=plane(g,2.4,0.6,new THREE.MeshBasicMaterial({map:signTex('CAFETERIA  →','#1f4e79','#fff'),side:THREE.DoubleSide}),0,2.42,-5);
  box(g,0.03,0.5,0.03,M.darkMetal,-0.8,2.85,-5); box(g,0.03,0.5,0.03,M.darkMetal,0.8,2.85,-5);
  wallSign(g,'CAFETERIA','#1f4e79',20.5,2.5,ZBN-0.09,Math.PI);
  wallSign(g,'GROUND FLOOR','#37586e',-HW+0.09,2.5,-21,Math.PI/2,'CORRIDOR A');
  // nurses' station alcove (east wall, z -13.5..-17.5)
  buildStation(g,M,O);
}
function wallSign(g,txt,bg,x,y,z,ry,sub){var p=plane(g,1.9,0.48,new THREE.MeshBasicMaterial({map:signTex(txt,bg,'#fff',sub),side:THREE.DoubleSide}),x,y,z,ry||0);return p;}
function doorUnit(g,M,fix,centre,face,axis){
  var grp=new THREE.Group(); g.add(grp);
  var slab,fr1,fr2,win,hnd,plate;
  if(axis==='z'){
    box(grp,0.09,2.15,0.1,M.darkMetal,fix,1.075,centre-0.55); box(grp,0.09,2.15,0.1,M.darkMetal,fix,1.075,centre+0.55);
    box(grp,0.09,0.1,1.2,M.darkMetal,fix,2.18,centre);
    slab=box(grp,0.05,2.1,0.98,M.door,fix+face*0.03,1.05,centre);
    win=box(grp,0.02,0.52,0.27,M.glass,fix+face*0.065,1.52,centre); win.castShadow=false;
    hnd=box(grp,0.16,0.035,0.035,M.metal,fix+face*0.09,1.02,centre+face*0.36);
    plate=plane(grp,0.3,0.3,new THREE.MeshBasicMaterial({map:plateTex('G'+(100+((Math.abs(centre)*7)|0)%40)),side:THREE.DoubleSide}),fix+face*0.095,1.7,centre-0.85,face>0?Math.PI/2:-Math.PI/2);
    box(grp,0.02,0.28,0.9,M.darkMetal,fix+face*0.055,0.14,centre);
  }else{
    box(grp,0.1,2.15,0.09,M.darkMetal,centre-0.55,1.075,fix); box(grp,0.1,2.15,0.09,M.darkMetal,centre+0.55,1.075,fix);
    box(grp,1.2,0.1,0.09,M.darkMetal,centre,2.18,fix);
    slab=box(grp,0.98,2.1,0.05,M.door,centre,1.05,fix+face*0.03);
    win=box(grp,0.27,0.52,0.02,M.glass,centre,1.52,fix+face*0.065); win.castShadow=false;
    hnd=box(grp,0.035,0.035,0.16,M.metal,centre+face*0.36,1.02,fix+face*0.09);
    plate=plane(grp,0.3,0.3,new THREE.MeshBasicMaterial({map:plateTex('G'+(100+((Math.abs(centre)*7)|0)%40)),side:THREE.DoubleSide}),centre-0.85,1.7,fix+face*0.095,face>0?0:Math.PI);
    box(grp,0.9,0.28,0.02,M.darkMetal,centre,0.14,fix+face*0.055);
  }
}
function buildStation(g,M,O){
  var st=new THREE.Group(); g.add(st);
  // alcove box behind east wall
  box(st,0.15,3.0,4.15,M.wallUp,3.02,1.5,-15.5); // back wall x=3.02
  box(st,1.3,0.15,4.15,M.wallUp,2.4,2.95,-15.5); // alcove ceiling cap
  box(st,0.15,3.0,0.4,M.wallUp,1.85,1.5,-13.6); box(st,0.15,3.0,0.4,M.wallUp,1.85,1.5,-17.4);
  box(st,1.3,0.02,4.15,M.wallLow,2.4,0.01,-15.5); // alcove floor
  // counter: front at wall line, top slab
  box(st,0.55,1.06,4.0,M.station||M.door,1.78,0.53,-15.5);
  box(st,0.72,0.05,4.15,M.counterTop||M.metal,1.78,1.09,-15.5);
  // desk inside + monitor + charts
  box(st,0.55,0.04,3.4,M.counterTop||M.metal,2.15,0.74,-15.5);
  box(st,0.5,0.72,0.06,M.darkMetal,2.15,0.37,-14.5); box(st,0.5,0.72,0.06,M.darkMetal,2.15,0.37,-16.5);
  var scr=plane(st,0.52,0.32,new THREE.MeshBasicMaterial({map:monitorTex(),side:THREE.DoubleSide}),2.02,1.12,-15.2); scr.rotation.set(0,Math.PI/2,0);
  box(st,0.04,0.3,0.05,M.darkMetal,2.1,0.9,-15.2);
  for(var i=0;i<4;i++){box(st,0.03,0.24,0.3,[M.chartA,M.chartB,M.chartC,M.chartA][i%4]||M.door,2.9,1.7,-14.3-i*0.75);}
  wallSign(st,'NURSES’ STATION','#37586e',1.7,2.62,-15.5,-Math.PI/2);

  var u=Math.max(0.001,Math.min(0.999,dollyU));
  camera.position.copy(dollyCurve.getPoint(u));
  var ahead=dollyDir>0?Math.min(0.999,u+0.035):Math.max(0.001,u-0.035);
  camera.lookAt(dollyCurve.getPoint(ahead));
}
var lastStat=0;
function frame(now,once){
  if(camMode==='dolly'&&!once){dollyU+= (now-(frame._p||now))/26000*dollyDir; frame._p=now;
    if(dollyU>0.995){dollyU=0.995;dollyDir=-1;} if(dollyU<0.005){dollyU=0.005;dollyDir=1;} applyDolly();}
  renderer.info.autoReset=false; renderer.info.reset();
  if(curTake===4){
    if(take5refs.dust)take5refs.dust.rotation.y=Math.sin(now*0.00004)*0.02;
    var fp=take5refs.flicker;
    if(fp){var nz=Math.sin(now*0.11)*Math.sin(now*0.031+1.7)*Math.sin(now*0.0073); var lv=nz>0.80?0.35:1.0; fp.material.color.setRGB(1.5*lv,1.55*lv,1.65*lv);}
    gradeMat.uniforms.uT.value=now/1000;
    ensureRT(); renderer.setRenderTarget(gradeRT); renderer.render(scene,camera);
    renderer.setRenderTarget(null); renderer.render(gradeScene,gradeCam);
  } else {
    renderer.render(scene,camera);
  }
  window.__state.frames++; window.__state.framesSinceSwitch++;
  window.__state.texturesReady=photoReady||photoErr;
  if(now-lastStat>600){lastStat=now; var el=document.getElementById('stats');
    if(el)el.textContent='draw calls '+renderer.info.render.calls+' · triangles '+renderer.info.render.triangles.toLocaleString()+' · three.js r128 (CDN)';}
}
function loop(now){ if(!capMode)requestAnimationFrame(loop); frame(now||0,false); }
addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
setTake(0); setCam('entrance');
loop(0);
})();
</script>
