<script type="module">
import * as THREE from 'three';
import { buildWorld, WORLD_LIGHTING, applyWorldEnvMap } from './src/world/buildWorld.js';
import { createBike } from './src/physics/bikePhysics.js';
import { createBailSim } from './src/rider/bailSim.js';

/* SUN: Neon's WORLD_LIGHTING now carries the ~20 deg sun herself (a9fe0e5, sunDir
   [-0.80, 0.34, 0.48], exposure 1.16) — the host adopts her export wholesale, no
   override. (Opus's finding that prompted it: at the old 11 deg sun the rider's
   shadow was invisible in the house shade on the main street.) */

/* ============================================================ RENDERER / SCENE / DUSK SKY */
const container = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = WORLD_LIGHTING.renderer.exposure;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(WORLD_LIGHTING.fog.color, WORLD_LIGHTING.fog.near, WORLD_LIGHTING.fog.far);
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0.0,'#1d2a52'); gr.addColorStop(0.45,'#3a4a7d'); gr.addColorStop(0.72,'#8a5f7d');
  gr.addColorStop(0.88,'#e07f4a'); gr.addColorStop(1.0,'#f7a856');
  g.fillStyle = gr; g.fillRect(0,0,4,512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 400); // 60 = Opus's shipped base FOV (his +4 deg speed breathe not wired; cap was 64)
const hemi = new THREE.HemisphereLight(WORLD_LIGHTING.hemi.sky, WORLD_LIGHTING.hemi.ground, WORLD_LIGHTING.hemi.intensity); scene.add(hemi);
const sun = new THREE.DirectionalLight(WORLD_LIGHTING.sun.color, WORLD_LIGHTING.sun.intensity);
const SUN_OFF = new THREE.Vector3(...WORLD_LIGHTING.sun.dir).normalize().multiplyScalar(45);
sun.position.copy(SUN_OFF); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-34; sun.shadow.camera.right=34; sun.shadow.camera.top=34; sun.shadow.camera.bottom=-34;
sun.shadow.camera.near=1; sun.shadow.camera.far=140; sun.shadow.bias=-0.0007;
scene.add(sun); scene.add(sun.target);
scene.add(new THREE.AmbientLight(WORLD_LIGHTING.ambient.color, WORLD_LIGHTING.ambient.intensity));

/* ============================================================ WORLD + PHYSICS (standalone modules) */
const world = buildWorld(scene);
const envInfo = applyWorldEnvMap(renderer, scene); // Neon's PMREM sky-reflection helper (was exported but never called — Opus handover)
const WATER_Y = world.water.y;
/* ---- Prop response (host-side, additive — the physics module is untouched):
   bins are loose props. A side hit at speed knocks the bin over (it becomes
   ground clutter: physGroundAt presents the base ground, the mesh tips), the
   rider deflects and keeps ~80% speed. A slow touch steers the rider around;
   sustained contact tips the bin anyway, so a stuck state cannot persist.
   Landing on an upright bin's lid is untouched (detection requires the
   rider's feet to be well below the lid). */
const binProps = world.binProps || [];
for (const bp of binProps){
  bp.baseHeight = Math.min(world.groundAt(bp.x + 1.15, bp.z), world.groundAt(bp.x, bp.z + 1.15));
  bp.knocked = false; bp.contact = 0; bp.anim = null;
}
function knockBin(bp, fx, fz){
  bp.knocked = true;
  flowBreak(0.5); // a knock-over costs half the speed build (Cherie: collisions break the flow)
  const pivot = new THREE.Group();
  pivot.position.set(bp.x + fx * 0.48, bp.baseY, bp.z + fz * 0.48);
  scene.add(pivot);
  pivot.attach(bp.mesh);
  bp.anim = { pivot, t: 0, axis: new THREE.Vector3(fz, 0, -fx).normalize() };
}
function propResponse(dt){
  const fx = Math.sin(S.heading), fz = Math.cos(S.heading);
  for (const bp of binProps){
    if (bp.knocked) continue;
    const dx = bp.x - S.x, dz = bp.z - S.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 1.02){ bp.contact = 0; continue; }
    const toward = dist > 0.01 ? (dx * fx + dz * fz) / dist : 0;
    const spd = Math.abs(S.speed);
    const rel = Math.atan2(Math.sin(Math.atan2(dx, dz) - S.heading), Math.cos(Math.atan2(dx, dz) - S.heading));
    if (S.grounded && spd >= 2.2 && toward > 0.2 && S.y < bp.top - 0.25){
      knockBin(bp, fx, fz);
      S.heading -= THREE.MathUtils.clamp(rel * 0.55, -0.35, 0.35);
      S.speed *= 0.8;
    } else if (!S.grounded && spd >= 2.2 && toward > 0.2 && S.y < bp.top - 0.60 && S.vy < -1.2){
      knockBin(bp, fx, fz); // falling well short into the bin's face (not a lid landing): tip it, keep flying
      S.heading -= THREE.MathUtils.clamp(rel * 0.55, -0.35, 0.35);
      S.speed *= 0.85;
    } else if (S.grounded && spd < 2.2 && dist < 0.9 && S.y < bp.top - 0.25){
      S.heading -= THREE.MathUtils.clamp(rel * 1.15 * dt, -0.06, 0.06); // soft slide around it
      bp.contact += dt;
      if (bp.contact > 0.7 && spd < 0.6){ knockBin(bp, fx, fz); S.speed = Math.max(S.speed, 1.2); bp.contact = 0; }
    } else bp.contact = 0;
  }
}
/* Physics seam (Opus module v2): env.groundAt must return { height, type }.
   - bin footprints: landable tops, type 'bin' (buildWorld.groundAt already returns the lid height there).
   - canal: type 'water', height = canal bed (below WATER_Y), so the module fires splash on entry.
   - bridge deck / ramps / rails: type 'deck'.
   - buildings / lamps / trees: the new env has no collider list, so they present through
     groundAt as tall heights and the module's wall rule applies (>0.15 m above the rider:
     stop below 6 m/s, bail 'crash' above it). */
function physGroundAt(x, z){
  let height = world.groundAt(x, z), type = 'ground';
  for (const b of world.bins) if (Math.abs(x - b.x) < 0.52 && Math.abs(z - b.z) < 0.52) { type = 'bin'; break; }
  for (const bp of binProps) if (bp.knocked && Math.abs(x - bp.x) < 0.56 && Math.abs(z - bp.z) < 0.56) { if (height > bp.baseHeight) height = bp.baseHeight; if (type === 'bin') type = 'ground'; }
  if (type === 'ground' && world.water.contains(x, z)) type = 'water';
  if (type === 'ground' && Math.abs(x) <= 5.2 && Math.abs(z) < 20.5 && height > 0.02) type = 'deck';
  for (const c of world.colliders) if (x > c.minX && x < c.maxX && z > c.minZ && z < c.maxZ && c.top > height) { height = c.top; type = 'ground'; }
  return { height, type };
}
const env = { groundAt: physGroundAt, waterLevel: WATER_Y };
const bike = createBike();
const S = bike.state;
bike.reset(world.spawn, env);

/* ============================================================ BIKE + RIDER VISUALS */
const BOX = new THREE.BoxGeometry(1,1,1);
function mat(color, rough=0.9, metal=0.0){ return new THREE.MeshStandardMaterial({ color, roughness:rough, metalness:metal }); }
function box(w,h,d,material,x=0,y=0,z=0,parent,shadow=true){
  const m = new THREE.Mesh(BOX, material); m.scale.set(w,h,d); m.position.set(x,y,z);
  m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
function tube(a, b, r, material, parent){
  const d = new THREE.Vector3().subVectors(b,a); const len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,6), material);
  m.position.copy(a).addScaledVector(d,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  m.castShadow = true; parent.add(m); return m;
}
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const frameMat = mat(0xd8434f, 0.35, 0.6), chromeMat = mat(0xb9c0c9, 0.3, 0.85), tyreMat = mat(0x17181c, 0.95),
      skinMat = mat(0xc98a5e, 0.8), shirtMat = mat(0xffd23f, 0.85), pantsMat = mat(0xb09a72, 0.95),
      shoeMat = mat(0xf2f2f2, 0.7), capMat = mat(0x24304f, 0.85),
      darkSteelMat = mat(0x2a2c30, 0.55, 0.7), rubberMat = mat(0x141416, 0.95),
      teeMat = mat(0xf3efe6, 0.92), shortsMat = mat(0xb09a72, 0.95), shortsDarkMat = mat(0x8a764f, 0.95),
      capDarkMat = mat(0x182238, 0.85), strapMat = mat(0x30363f, 0.8),
      hairMat = mat(0x2a1c12, 0.9), eyeMat = mat(0xf8f8f5, 0.3), soleMat = mat(0x3a3a3e, 0.9);
/* Cloth response for the tee (shirt v2): a woven bump + near-full matte so the
   shirt shades unlike skin (rough 0.8) and unlike the smooth khaki pants —
   garment first, body second. collarMat = the darker ribbed tone used for the
   collar / hem / cuff bands. */
function clothBumpTex(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const img = g.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4){
    const px = (i/4) % 128, py = ((i/4)/128)|0;
    const v = 116 + ((px + py) % 2) * 14 + Math.random()*16;
    img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 3); return t;
}
teeMat.bumpMap = clothBumpTex(); teeMat.bumpScale = 0.2; teeMat.roughness = 0.98;
const collarMat = new THREE.MeshStandardMaterial({ color: 0xdfd7c3, roughness: 1.0, bumpMap: teeMat.bumpMap, bumpScale: 0.2 });
/* --- geometry helpers for the modelled bike + Figure-Factory-style rider --- */
function xform(geo, px,py,pz, rx=0,ry=0,rz=0, sx=1,sy=1,sz=1){
  const g = geo.clone();
  g.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(px,py,pz),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)), new THREE.Vector3(sx,sy,sz)));
  return g;
}
function tubeGeo(a, b, r, seg=10){
  const d = new THREE.Vector3().subVectors(b,a); const len = d.length();
  const g = new THREE.CylinderGeometry(r, r, len, seg);
  g.applyMatrix4(new THREE.Matrix4().compose(a.clone().addScaledVector(d,0.5),
    new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize()), new THREE.Vector3(1,1,1)));
  return g;
}
/* tapered tube between two points: radius rA at a, rB at b */
function coneTube(a, b, rA, rB, seg=12){
  const d = new THREE.Vector3().subVectors(b,a); const len = d.length();
  const g = new THREE.CylinderGeometry(rB, rA, len, seg);
  g.applyMatrix4(new THREE.Matrix4().compose(a.clone().addScaledVector(d,0.5),
    new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize()), new THREE.Vector3(1,1,1)));
  return g;
}
function mergeGeos(list){
  const parts = list.map(g => g.index ? g.toNonIndexed() : g);
  let total = 0; for (const g of parts) total += g.attributes.position.count;
  const pos = new Float32Array(total*3), nor = new Float32Array(total*3), uv = new Float32Array(total*2);
  let o3 = 0, o2 = 0;
  for (const g of parts){
    pos.set(g.attributes.position.array, o3); nor.set(g.attributes.normal.array, o3);
    if (g.attributes.uv) uv.set(g.attributes.uv.array, o2);
    o3 += g.attributes.position.count*3; o2 += g.attributes.position.count*2;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  return out;
}
function mergedMesh(list, material, parent){
  const m = new THREE.Mesh(mergeGeos(list), material);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
/* capsule limb segment hanging from its pivot (origin at joint, extends -Y) */
function limbGeo(r, len){ const g = new THREE.CapsuleGeometry(r, len, 3, 10); g.translate(0, -(len/2 + r*0.4), 0); return g; }
function limbMesh(r, len, material, parent){ const m = new THREE.Mesh(limbGeo(r, len), material); m.castShadow = true; parent.add(m); return m; }
function pivot(parent, x, y, z){ const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
function spokeTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); g.clearRect(0,0,256,256);
  g.strokeStyle = 'rgba(196,204,216,0.95)'; g.lineWidth = 3;
  for (let i=0;i<20;i++){ const a = i/20*Math.PI*2;
    g.beginPath(); g.moveTo(128,128); g.lineTo(128 + Math.cos(a)*118, 128 + Math.sin(a)*118); g.stroke(); }
  g.strokeStyle = 'rgba(150,158,170,1)'; g.lineWidth = 7;
  g.beginPath(); g.arc(128,128,118,0,Math.PI*2); g.stroke();
  g.fillStyle = 'rgba(170,178,190,1)';
  g.beginPath(); g.arc(128,128,17,0,Math.PI*2); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const spokeMat = new THREE.MeshStandardMaterial({ map: spokeTexture(), transparent: true, alphaTest: 0.35,
  side: THREE.DoubleSide, roughness: 0.4, metalness: 0.7 });
/* --- Figure parts, rigkit/Ryu-grade: shaped geometry, clothing as geometry.
   Head = cranium + jaw + ears + nose (skin, merged), eyes/pupils/brows/mouth/
   hair (dark, merged), cap = dome + brim + button (merged). Limbs are tapered
   segments with joint spheres; the tee has sleeves + cuffs + collar + hem, the
   shorts have a waistband and flared leg openings over skin thighs. --- */
function tapered(rTop, rBot, len, seg = 12){ const g = new THREE.CylinderGeometry(rTop, rBot, len, seg); g.translate(0, -len/2, 0); return g; }
function buildHead(parent, y0){
  mergedMesh([
    xform(new THREE.SphereGeometry(0.112, 18, 14), 0, y0 + 0.115, 0, 0, 0, 0, 0.95, 1.06, 1.02),
    xform(new THREE.CylinderGeometry(0.082, 0.064, 0.08, 14), 0, y0 + 0.045, 0.014, 0, 0, 0, 1.0, 1.0, 1.08),
    xform(new THREE.SphereGeometry(0.02, 8, 8), -0.104, y0 + 0.10, -0.004, 0, 0, 0, 0.45, 0.98, 0.72),
    xform(new THREE.SphereGeometry(0.02, 8, 8), 0.104, y0 + 0.10, -0.004, 0, 0, 0, 0.45, 0.98, 0.72),
    xform(new THREE.ConeGeometry(0.02, 0.05, 8), 0, y0 + 0.082, 0.108, 1.25),
  ], skinMat, parent);
  mergedMesh([
    xform(new THREE.SphereGeometry(0.0095, 8, 8), -0.041, y0 + 0.115, 0.107),
    xform(new THREE.SphereGeometry(0.0095, 8, 8), 0.041, y0 + 0.115, 0.107),
    xform(new THREE.BoxGeometry(0.042, 0.011, 0.014), -0.042, y0 + 0.148, 0.10),
    xform(new THREE.BoxGeometry(0.042, 0.011, 0.014), 0.042, y0 + 0.148, 0.10),
    xform(new THREE.BoxGeometry(0.05, 0.013, 0.012), 0, y0 + 0.036, 0.096),
    xform(new THREE.CylinderGeometry(0.114, 0.117, 0.085, 14, 1, true, Math.PI*0.30, Math.PI*1.40), 0, y0 + 0.062, -0.004, 0, 0, 0, 0.97, 1, 1.03),
  ], hairMat, parent);
  mergedMesh([
    xform(new THREE.SphereGeometry(0.0165, 10, 8), -0.041, y0 + 0.115, 0.096, 0, 0, 0, 1, 1.15, 0.55),
    xform(new THREE.SphereGeometry(0.0165, 10, 8), 0.041, y0 + 0.115, 0.096, 0, 0, 0, 1, 1.15, 0.55),
  ], eyeMat, parent);
  mergedMesh([
    xform(new THREE.SphereGeometry(0.121, 18, 10, 0, Math.PI*2, 0, 1.35), 0, y0 + 0.118, 0),
    xform(new THREE.CylinderGeometry(0.02, 0.02, 0.014, 10), 0, y0 + 0.238, 0),
  ], capMat, parent);
  /* BACKWARDS cap (Cherie, Nov 20): the brim is a real visor piece — flat, thick,
     clearly its own part — worn pointing BACK over the neck so the chase camera
     reads it instantly; snap strap band above it on the dome's back. */
  mergedMesh([
    xform(new THREE.BoxGeometry(0.20, 0.026, 0.145), 0, y0 + 0.110, -0.150, -0.10),
  ], capDarkMat, parent);
  /* light underbrim (outfit lane): a contrast ledge under the rear brim so
     the brim separates from the dark dome + hair at phone size — Cherie's
     "hard to tell that's a brim" note */
  mergedMesh([
    xform(new THREE.BoxGeometry(0.188, 0.009, 0.135), 0, y0 + 0.093, -0.152, -0.10),
  ], shoeMat, parent);
  mergedMesh([
    xform(new THREE.BoxGeometry(0.125, 0.034, 0.016), 0, y0 + 0.152, -0.104, -0.15),
    xform(new THREE.SphereGeometry(0.011, 8, 6), -0.032, y0 + 0.152, -0.113),
    xform(new THREE.SphereGeometry(0.011, 8, 6), 0.032, y0 + 0.152, -0.113),
  ], strapMat, parent);
}
function buildArmParts(sh, el, side){

     29.9-30.5% from top. RE-MEASURED on the Figure Factory v2 rig in this
     integration: at 4.3 m the v2 rider filled only 26.7-28% of frame (the v2
     rig is smaller than his 1.715 m figure), so ride distance closes to 3.8 m
     behind the ORIGIN to restore the 30-35% band — a documented deviation of
     the same kind he made (his numbers were rig-specific; the band is the
     settlement). Swim keeps the waterline/underwater blend (Cherie's frame-7
     steer); bail pulls back to 5.5 m and rises to watch the dive (frame-3). */
  const dist = mode === 'swim' ? 3.8 : mode === 'bail' ? 5.5 : 3.8,
        hgt = mode === 'swim' ? THREE.MathUtils.lerp(0.08, -0.15, dBlend) : mode === 'bail' ? 2.2 : 1.65 - 0.65; // surface end +0.08 keeps camY ~+0.22: waterline framing with the lowered body
  camPos.x += ((tgt.x - bx*dist) - camPos.x) * Math.min(1, dt*4.5);
  camPos.z += ((tgt.z - bz*dist) - camPos.z) * Math.min(1, dt*4.5);
  camPos.y += ((tgt.y + hgt) - camPos.y) * Math.min(1, dt*4.5);
  camera.position.copy(camPos);
  if (mode === 'ride') camera.lookAt(S.x, S.y + 0.65, S.z); // aim at the rider, 0.65 above contact
  else camera.lookAt(tgt.x + bx*2.2, tgt.y + 0.35, tgt.z + bz*2.2);
  sun.position.set(tgt.x + SUN_OFF.x, SUN_OFF.y, tgt.z + SUN_OFF.z); sun.target.position.set(tgt.x, 0, tgt.z);
  /* underwater ambience: as the camera slips below the surface, fog closes in
     blue-green, the background follows, and a tint veil fades up */
  const uw = mode === 'swim' ? THREE.MathUtils.clamp((0.06 - camera.position.y) / 0.35, 0, 1) : 0;
  scene.fog.color.lerpColors(SURF_FOG.color, UW_FOG.color, uw);
  scene.fog.near = THREE.MathUtils.lerp(SURF_FOG.near, UW_FOG.near, uw);
  scene.fog.far = THREE.MathUtils.lerp(SURF_FOG.far, UW_FOG.far, uw);
  if (scene.background && scene.background.isColor) scene.background.lerpColors(SURF_BG, UW_FOG.color, uw);
  uwTint.style.opacity = (uw * 0.9).toFixed(3);
  speedEl.textContent = Math.round(Math.abs(mode === 'swim' ? swimSpeed : S.speed) * 3.6);
  modeEl.textContent = mode === 'swim' ? (swimDepth > 0.55 ? '🤿 UNDERWATER' : '🏊 SWIMMING') : (mode === 'bail' ? '💥 BAILED' : (grind ? '🛹 GRINDING' : (!S.grounded ? '🕊 AIRBORNE' : (S.crouch01 > 0.02 ? '🦘 CROUCH…' : ''))));
  renderer.render(scene, camera);
  workSamples.push(performance.now() - w0);
}
requestAnimationFrame(animate);
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---- debug / scripted-play hooks (verification harness) */
window.__dbg = {
  S, world, bike, input,
  get mode(){ return mode; },
  get touchMode(){ return touchMode; },
  get lastInput(){ return lastModInput; },
  get swim(){ return { x: swimPos.x, z: swimPos.z, heading: swimHeading, canClimb, depth: swimDepth }; },
  get envMs(){ return envInfo.initMs; },
  get flow(){ return +flowFactor.toFixed(3); },
  get grind(){ return grind ? { railX: grind.railX, dirZ: grind.dirZ, speed: +grind.speed.toFixed(2) } : null; },
  bins(){ return binProps.map(b => ({ x: b.x, z: b.z, knocked: b.knocked })); },
  poseCheck(){ // rider tolerances: ankle joints vs pedal centres, in metres (world space)
    const pa = crank.localToWorld(new THREE.Vector3(0.145, 0, CRANK_R));
    const pb = crank.localToWorld(new THREE.Vector3(-0.145, 0, -CRANK_R));
    const fa = new THREE.Vector3(), fb = new THREE.Vector3();
    ankJL.getWorldPosition(fa); ankJR.getWorldPosition(fb);
    const d = (a, b, c, e) => Math.min(a.distanceTo(c) + b.distanceTo(e), a.distanceTo(e) + b.distanceTo(c)) / 2;
    const sag = v => { const p = pitchGroup.worldToLocal(v.clone()); return new THREE.Vector3(0, p.y, p.z); };
    return { footPedalWorldM: +d(fa, fb, pa, pb).toFixed(4), footPedalSagittalM: +d(sag(fa), sag(fb), sag(pa), sag(pb)).toFixed(4) };
  },
  frameCheck(){ // rider share of frame height + horizon position, % (Opus framing acceptance)
    const box = new THREE.Box3().setFromObject(riderRig);
    const pts = [];
    for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) pts.push(new THREE.Vector3(x, y, z).project(camera));
    const ys = pts.map(p => p.y);
    const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
    const hor = camera.position.clone().add(fwd.multiplyScalar(100)); hor.y = camera.position.y;
    const hNdc = hor.project(camera).y;
    return { riderSharePct: +(((Math.max(...ys) - Math.min(...ys)) / 2) * 100).toFixed(1), horizonFromTopPct: +(((1 - hNdc) / 2) * 100).toFixed(1) };
  },
  groundAt: world.groundAt,
  physGroundAt,
  teleport(x, z, heading = 0){
    mode = 'ride'; flowFactor = 1; grind = null; bike.config.topSpeed = FLOW_BASE;
    bike.reset({ x, z, heading }, env);
    camPos.set(x - Math.sin(heading)*4.3, S.y + 2.3, z - Math.cos(heading)*4.3);
  },
  frameStats(){
    const a = ftSamples.slice(-240); if (!a.length) return null;
    const s = [...a].sort((p,q)=>p-q);
    const w = [...workSamples.slice(-240)].sort((p,q)=>p-q);
    return { medianMs: +(s[Math.floor(s.length/2)]*1000).toFixed(2), p90Ms: +(s[Math.floor(s.length*0.9)]*1000).toFixed(2),
             workMedianMs: w.length ? +w[Math.floor(w.length/2)].toFixed(2) : null, n: a.length };
  },
  setFreeze(v){ window.__freeze = !!v; },
  ready: true,
};
</script>
