<script type="module">
import * as THREE from 'three';
import { buildWorld, WORLD_LIGHTING, applyWorldEnvMap } from './src/world/buildWorld.js';
import { buildLoftedCar } from './src/gpcar_loft.js';
import { buildPerson, poseWalk, poseIdle } from './src/people.js';
import { CARS } from './cars.js';

/* ============================================================ RENDERER / SCENE / DUSK SKY
   (host setup carried over from Bunny Hop unchanged: same world, same light) */
const container = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = WORLD_LIGHTING.renderer.exposure;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(WORLD_LIGHTING.fog.color, WORLD_LIGHTING.fog.near, WORLD_LIGHTING.fog.far);
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0.0,'#1d2a52'); gr.addColorStop(0.45,'#3a4a7d'); gr.addColorStop(0.72,'#8a5f7d');
  gr.addColorStop(0.88,'#e07f4a'); gr.addColorStop(1.0,'#f7a856');
  g.fillStyle = gr; g.fillRect(0,0,4,512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 400); // Bunny Hop settlement: FOV 60 base, +4 speed breathe, 64 cap
const hemi = new THREE.HemisphereLight(WORLD_LIGHTING.hemi.sky, WORLD_LIGHTING.hemi.ground, WORLD_LIGHTING.hemi.intensity); scene.add(hemi);
const sun = new THREE.DirectionalLight(WORLD_LIGHTING.sun.color, WORLD_LIGHTING.sun.intensity);
const SUN_OFF = new THREE.Vector3(...WORLD_LIGHTING.sun.dir).normalize().multiplyScalar(45);
sun.position.copy(SUN_OFF); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-34; sun.shadow.camera.right=34; sun.shadow.camera.top=34; sun.shadow.camera.bottom=-34;
sun.shadow.camera.near=1; sun.shadow.camera.far=140; sun.shadow.bias=-0.0007;
scene.add(sun); scene.add(sun.target);
scene.add(new THREE.AmbientLight(WORLD_LIGHTING.ambient.color, WORLD_LIGHTING.ambient.intensity));

/* ============================================================ WORLD
   parkedCarCount: 0 — the lot is the crew fleet ONLY; the world builder's
   generic curbside cars stay out of this game (Cherie, Nov 20). */
const world = buildWorld(scene, { parkedCarCount: 0 });
const envInfo = applyWorldEnvMap(renderer, scene);
const WATER_Y = world.water.y;

/* Effective ground for collision: world groundAt folded with collider tops
   (buildings, poles, trees present as tall AABBs) and bin footprints — the
   same presentation Bunny Hop's physics seam uses. A sample that rises
   > 0.5 m above the current ground is a wall. */
function effGroundAt(x, z){
  let h = world.groundAt(x, z);
  for (const c of world.colliders) if (x > c.minX && x < c.maxX && z > c.minZ && z < c.maxZ && c.top > h) h = c.top;
  for (const b of world.bins) if (Math.abs(x - b.x) < 0.52 && Math.abs(z - b.z) < 0.52 && b.top > h) h = b.top;
  return h;
}
function blockedAt(x, z, curY){
  if (world.water.contains(x, z) && effGroundAt(x, z) < 1.2) return true; // canal: never enter (bridge deck reads 4.0 and is exempt via contains())
  return effGroundAt(x, z) - curY > 0.5;
}

/* ============================================================ THE LOT — the whole fleet, one row
   Every entry in CARS (cars.js) becomes a parked, drivable car. The row
   runs along the main street's north lane, noses facing SOUTH (heading 0)
   toward the walking side of the street, spaced by each car's width so
   the whole fleet fits one walkable row west of the bridge. */
const LOT = { z: 26.2, x0: -51, gap: 1.7, heading: 0 };
function beamColorOf(spec){
  const ff = spec.frontFascia || {};
  if (ff.popups && ff.popups.beamColor != null) return ff.popups.beamColor;
  if (ff.fixedLamps && ff.fixedLamps.beamColor != null) return ff.fixedLamps.beamColor;
  return 0xffd9a8; // canon warm for every car except Brad (yellow, in spec) and Rigg (blue, in spec)
}
const fleet = CARS.map((def, i) => {
  const built = buildLoftedCar(def.spec);
  scene.add(built.group);
  const st = {
    def, built, index: i,
    x: 0, z: LOT.z, heading: LOT.heading,
    y: 0, speed: 0, steerAngle: 0,
    hasPopups: !!(def.spec.frontFascia && def.spec.frontFascia.popups && def.spec.frontFascia.popups.enabled),
    popTarget: 1, popT: 1, // Celica starts with its pop-ups UP so the blue beams show in the lot
    beamColor: beamColorOf(def.spec),
  };
  if (st.hasPopups) built.setPopups(1);
  return st;
});
{ // lay the row out west -> east, each car centred on its own width + gap
  let cursor = LOT.x0;
  for (const st of fleet){
    const w = st.built.dims.width || 1.8;
    st.x = cursor + w / 2;
    cursor += w + LOT.gap;
    st.y = world.groundAt(st.x, st.z);
    placeCar(st, 0);
  }
}
function placeCar(st, dt){
  const g = st.built.group;
  g.position.set(st.x, st.y, st.z);
  g.rotation.order = 'YXZ';
  g.rotation.y = st.heading;
  if (dt > 0){
    // ground following: pitch/roll from ground sampled fore/aft + across
    const fx = Math.sin(st.heading), fz = Math.cos(st.heading);
    const rx = Math.cos(st.heading), rz = -Math.sin(st.heading); // car's left vector (local +X)
    const wb = st.built.dims.wheelbase || 2.5;
    const hF = world.groundAt(st.x + fx * wb * 0.5, st.z + fz * wb * 0.5);
    const hR = world.groundAt(st.x - fx * wb * 0.5, st.z - fz * wb * 0.5);
    const hL = world.groundAt(st.x + rx * 0.8, st.z + rz * 0.8);
    const hRt = world.groundAt(st.x - rx * 0.8, st.z - rz * 0.8);
    g.rotation.x = -Math.atan2(hF - hR, wb);
    g.rotation.z = Math.atan2(hL - hRt, 1.6);
    st.built.updateWheels(st.speed, -st.steerAngle, dt);
  } else { g.rotation.x = 0; g.rotation.z = 0; }
}
let active = 0;
let mode = 'walk'; // 'walk' (on foot) | 'drive'

/* Car-vs-point test in a parked car's own frame (OBB), pad expands the box.
   Used for the walker (don't walk through cars), the GET IN range check,
   and the driven car (don't drive through the parked fleet). */
function carLocal(st, x, z){
  const dx = x - st.x, dz = z - st.z;
  const s = Math.sin(st.heading), c = Math.cos(st.heading);
  return { lx: dx * c - dz * s, lz: dx * s + dz * c };
}
function carHit(st, x, z, pad){
  const { lx, lz } = carLocal(st, x, z);
  const L = (st.built.dims.length || 4.6) / 2 + pad, W = (st.built.dims.width || 1.8) / 2 + pad;
  return Math.abs(lx) < W && Math.abs(lz) < L;
}
function carEdgeDist(st, x, z){ // 0 inside the OBB, else metres to the nearest edge
  const { lx, lz } = carLocal(st, x, z);
  const L = (st.built.dims.length || 4.6) / 2, W = (st.built.dims.width || 1.8) / 2;
  const ox = Math.max(0, Math.abs(lx) - W), oz = Math.max(0, Math.abs(lz) - L);
  return Math.hypot(ox, oz);
}
function nearestCarTo(x, z){
  let best = -1, bestD = Infinity;
  fleet.forEach((st, i) => { const d = carEdgeDist(st, x, z); if (d < bestD){ bestD = d; best = i; } });
  return { index: best, dist: bestD };
}

/* Burnt Mustang: a faint ember glow under the hood (game-layer effect —
   the charred spec itself carries no light). One small flickering
   PointLight parented to the car so it travels if the car is driven. */
let emberLight = null;
{
  const burnt = fleet.find(c => /Burnt/.test(c.def.name));
  if (burnt){
    emberLight = new THREE.PointLight(0xff5a1a, 4, 5.5, 1.6);
    emberLight.position.set(0, 0.72, (burnt.built.dims.length || 4.6) * 0.30);
    burnt.built.group.add(emberLight);
  }
}

/* ============================================================ THE WALKER
   The Scaggsville shared Figure Factory person (src/people.js) — the
   player spawns on foot on the south side of the street, facing the row. */
const personFig = buildPerson({ skin: 0xc68863, shirt: 0x2e5f8a, pants: 0x2a3a5e, hair: 0x1a1410, hairStyle: 'short', shoes: 0x222226 });
scene.add(personFig.group);
const person = { x: -30, z: 31.2, y: 0, heading: Math.PI, speed: 0, phase: 0 };
person.y = world.groundAt(person.x, person.z);
personFig.group.position.set(person.x, person.y, person.z);
personFig.group.rotation.y = person.heading;

/* Per-car name labels (HTML, projected each frame over the row). */
const labelBox = document.getElementById('labels');
const labelEls = fleet.map(st => {
  const el = document.createElement('div');
  el.className = 'carLabel'; el.textContent = st.def.name;
  labelBox.appendChild(el);
  return el;
});
const promptEl = document.getElementById('prompt');
const btnInEl = document.getElementById('btnIn');

/* Headlight beam for the driven car: the loft spec already paints halo
   cards + a road pool in the car's beam colour; this SpotLight adds real
   illumination on the road ahead. Colour follows the active car's spec.
   Off while on foot. */
const beam = new THREE.SpotLight(0xffffff, 150, 42, 0.5, 0.65, 1.1);
beam.castShadow = false;
scene.add(beam); scene.add(beam.target);
function updateBeam(st){
  const fx = Math.sin(st.heading), fz = Math.cos(st.heading);
  beam.color.setHex(st.beamColor);
  beam.position.set(st.x + fx * 1.7, st.y + 0.78, st.z + fz * 1.7);
  beam.target.position.set(st.x + fx * 14, st.y - 0.4, st.z + fz * 14);
}

/* ============================================================ INPUT (gptouch + keyboard — Bunny Hop pattern) */
const keys = {};
let joyActive = false, joyId = null, joyOX = 0, joyOY = 0, joyX = 0, joyY = 0;
let btnA = false, btnB = false;
const input = { steer: 0, gas: false, brake: false };
window.addEventListener('keydown', e=>{
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault();
  if (e.code === 'Tab' && !e.repeat && mode === 'drive') swapCar((active + 1) % fleet.length);
  if ((e.code === 'KeyP' || e.code === 'KeyL') && !e.repeat && mode === 'drive') togglePopups();
  if (e.code === 'KeyE' && !e.repeat){
    if (mode === 'drive') getOut();
    else { const n = nearestCarTo(person.x, person.z); if (n.index >= 0 && n.dist <= 2.5) getIn(n.index); }
  }
  keys[e.code] = true;
});
window.addEventListener('keyup', e=>{ keys[e.code] = false; });
const zone = document.getElementById('stickZone'), sBase = document.getElementById('stickBase'), sKnob = document.getElementById('stickKnob');
zone.addEventListener('pointerdown', e=>{
  joyActive = true; joyId = e.pointerId; joyOX = e.clientX; joyOY = e.clientY; joyX = 0; joyY = 0;
  sBase.style.display = sKnob.style.display = 'block';
  sBase.style.left = joyOX+'px'; sBase.style.top = joyOY+'px';
  sKnob.style.left = joyOX+'px'; sKnob.style.top = joyOY+'px';
  try { zone.setPointerCapture(e.pointerId); } catch(_){}
});
zone.addEventListener('pointermove', e=>{
  if (!joyActive || e.pointerId !== joyId) return;
  let dx = e.clientX - joyOX, dy = e.clientY - joyOY;
  const len = Math.hypot(dx,dy), max = 52;
  if (len > max){ dx *= max/len; dy *= max/len; }
  joyX = dx/max; joyY = dy/max;
  sKnob.style.left = (joyOX+dx)+'px'; sKnob.style.top = (joyOY+dy)+'px';
});
function joyEnd(e){ if (e.pointerId === joyId){ joyActive=false; joyX=0; joyY=0; sBase.style.display = sKnob.style.display = 'none'; } }
zone.addEventListener('pointerup', joyEnd); zone.addEventListener('pointercancel', joyEnd);
function bindBtn(id, set){
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e=>{ e.preventDefault(); set(true); el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch(_){} });
  const off = e=>{ set(false); el.classList.remove('on'); };
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off);
}
bindBtn('btnA', v=>{ btnA = v; });
bindBtn('btnB', v=>{ btnB = v; });
bindBtn('btnSwap', v=>{ if (v && mode === 'drive') swapCar((active + 1) % fleet.length); });
bindBtn('btnPop', v=>{ if (v && mode === 'drive') togglePopups(); });
bindBtn('btnOut', v=>{ if (v && mode === 'drive') getOut(); });
bindBtn('btnIn', v=>{ if (v && mode === 'walk'){ const n = nearestCarTo(person.x, person.z); if (n.index >= 0 && n.dist <= 2.5) getIn(n.index); } });
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());
function pollInput(){
  let steer = 0;
  if (keys['KeyA'] || keys['ArrowLeft']) steer -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) steer += 1;
  if (joyActive) steer += joyX; // stick X steers (gptouch standard)
  input.steer = THREE.MathUtils.clamp(steer, -1, 1);
  input.gas = btnA || !!keys['KeyW'] || !!keys['ArrowUp'];
  input.brake = btnB || !!keys['KeyS'] || !!keys['ArrowDown'];
}

/* ============================================================ CAR / MODE ACTIONS */
function snapCamBehind(x, y, z, heading, dist, h){
  camYawS = heading;
  camPos.set(x - Math.sin(heading) * dist, y + h, z - Math.cos(heading) * dist);
}
function swapCar(i){
  if (i === active || !fleet[i]) return;
  fleet[active].speed = 0; fleet[active].steerAngle = 0;
  active = i;
  const st = fleet[active];
  snapCamBehind(st.x, st.y, st.z, st.heading, CAM_DIST, CAM_H); // snap the chase cam behind the new car
  updateBeam(st);
}
function getIn(i){
  if (mode !== 'walk' || !fleet[i]) return;
  active = i;
  const st = fleet[active];
  st.speed = 0; st.steerAngle = 0;
  mode = 'drive';
  document.body.classList.remove('onfoot');
  personFig.group.visible = false;
  snapCamBehind(st.x, st.y, st.z, st.heading, CAM_DIST, CAM_H);
  updateBeam(st);
}
function getOut(){
  if (mode !== 'drive') return;
  const st = fleet[active];
  st.speed = 0; st.steerAngle = 0;
  // step out at the driver's door (loft cars carry their wheel on local
  // +X); fall back to the other side if that spot is somehow blocked.
  const sideX = Math.cos(st.heading), sideZ = -Math.sin(st.heading);
  const off = (st.built.dims.width || 1.8) / 2 + 0.8;
  let px = st.x + sideX * off, pz = st.z + sideZ * off;
  if (fleet.some(c => carHit(c, px, pz, 0.3)) || blockedAt(px, pz, st.y)){
    px = st.x - sideX * off; pz = st.z - sideZ * off;
  }
  person.x = px; person.z = pz;
  person.y = world.groundAt(px, pz);
  person.heading = st.heading; person.speed = 0;
  personFig.group.visible = true;
  mode = 'walk';
  document.body.classList.add('onfoot');
  snapCamBehind(person.x, person.y, person.z, person.heading, WALK_DIST, WALK_H);
}
function togglePopups(){
  const st = fleet[active];
  if (!st.hasPopups) return;
  st.popTarget = st.popTarget > 0.5 ? 0 : 1;
}
function setPopups(v){
  const st = fleet[active];
  if (!st.hasPopups) return false;
  st.popTarget = v ? 1 : 0;
  return true;
}

/* ============================================================ DRIVING (simple arcade)
   Steering sign: heading is rotation.y with forward = (sin h, cos h), so
   increasing heading swings the nose LEFT. Right input must DECREASE
   heading — the Scaggsville 3D fix, re-proven in this game's harness. */
const TOP_SPEED = 24, REV_SPEED = 7;
function solidAt(x, z, curY, selfSt){ // world walls + the parked fleet
  if (blockedAt(x, z, curY)) return true;
  for (const c of fleet) if (c !== selfSt && carHit(c, x, z, 0.8)) return true;
  return false;
}
function stepCar(st, dt){
  const maxSteer = THREE.MathUtils.lerp(0.55, 0.16, Math.min(1, Math.abs(st.speed) / TOP_SPEED)); // tightens with speed
  const targetSteer = input.steer * maxSteer;
  st.steerAngle += (targetSteer - st.steerAngle) * Math.min(1, dt * 8);
  if (input.gas){
    st.speed += 9.5 * dt * Math.max(0, 1 - st.speed / TOP_SPEED);
  } else if (input.brake){
    if (st.speed > 0.4) st.speed -= 15 * dt;                    // brake
    else st.speed -= 6.5 * dt * Math.max(0, 1 + st.speed / REV_SPEED); // then reverse
  } else {
    st.speed -= st.speed * 0.55 * dt;                            // coast-down drag
    if (Math.abs(st.speed) < 0.04) st.speed = 0;
  }
  st.speed = THREE.MathUtils.clamp(st.speed, -REV_SPEED, TOP_SPEED);
  if (Math.abs(st.speed) > 0.001 && Math.abs(st.steerAngle) > 0.0005){
    const wb = st.built.dims.wheelbase || 2.5;
    st.heading -= (st.speed / wb) * Math.tan(st.steerAngle) * dt; // right input -> heading decreases -> nose swings right
  }
  if (st.speed !== 0){
    const fx = Math.sin(st.heading), fz = Math.cos(st.heading);
    const nx = st.x + fx * st.speed * dt, nz = st.z + fz * st.speed * dt;
    const noseX = nx + fx * 1.9, noseZ = nz + fz * 1.9;
    const halfL = (st.built.dims.length || 4.6) / 2 - 0.2;
    const tailX = nx - fx * halfL, tailZ = nz - fz * halfL;
    if (!solidAt(nx, nz, st.y, st) && !solidAt(noseX, noseZ, st.y, st) && !solidAt(tailX, tailZ, st.y, st)){
      st.x = nx; st.z = nz;
    } else if (!solidAt(nx, st.z, st.y, st) && !solidAt(nx + fx * 1.9, st.z + fz * 1.9, st.y, st) && Math.abs(nx - st.x) > 0.004){
      st.x = nx; st.speed *= 0.55; // slide along the wall (only if it actually moves us)
    } else if (!solidAt(st.x, nz, st.y, st) && !solidAt(st.x + fx * 1.9, nz + fz * 1.9, st.y, st) && Math.abs(nz - st.z) > 0.004){
      st.z = nz; st.speed *= 0.55;
    } else {
      st.speed = 0; // wall / bank / building / parked fleet car: stop, never clip through
    }
  }
  st.y = world.groundAt(st.x, st.z);
}

/* ============================================================ WALKING
   Stick / WASD move the person camera-relatively at 3.4 m/s; the figure
   turns toward the move direction and poseWalk animates the stride.
   Collision: world blockedAt (walls, poles, bins, canal) + the fleet
   OBBs, so you stroll AROUND the cars, never through them. */
const WALK_SPEED = 3.4, WALK_DIST = 4.3, WALK_H = 2.1;
function angleLerp(a, b, t){
  let d = Math.atan2(Math.sin(b - a), Math.cos(b - a));
  return a + d * Math.min(1, t);
}
function stepPerson(dt, now){
  let mx = 0, mz = 0;
  const fx = Math.sin(camYawS), fz = Math.cos(camYawS);       // camera forward on the ground
  const rx = -Math.cos(camYawS), rz = Math.sin(camYawS);      // camera right (screen-right; sign fixed Nov 20 — was inverted, D/A + stick X walked screen-reversed)
  let fwd = 0, str = 0;
  if (keys['KeyW'] || keys['ArrowUp']) fwd += 1;
  if (keys['KeyS'] || keys['ArrowDown']) fwd -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) str += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) str -= 1;
  if (joyActive){ str += joyX; fwd -= joyY; }                 // stick up (dy<0) = forward
  mx = fx * fwd + rx * str; mz = fz * fwd + rz * str;
  const len = Math.hypot(mx, mz);
  if (len > 0.01){
    mx /= Math.max(1, len); mz /= Math.max(1, len);
    const mag = Math.min(1, len);
    person.speed = WALK_SPEED * mag;
    person.heading = angleLerp(person.heading, Math.atan2(mx, mz), dt * 10);
    const nx = person.x + mx * person.speed * dt, nz = person.z + mz * person.speed * dt;
    const hitFleet = (x, z) => fleet.some(c => carHit(c, x, z, 0.32));
    if (!blockedAt(nx, nz, person.y) && !hitFleet(nx, nz)){ person.x = nx; person.z = nz; }
    else if (!blockedAt(nx, person.z, person.y) && !hitFleet(nx, person.z)){ person.x = nx; }
    else if (!blockedAt(person.x, nz, person.y) && !hitFleet(person.x, nz)){ person.z = nz; }
    person.phase += dt * 7.5 * mag;
    poseWalk(personFig, person.phase);
  } else {
    person.speed = 0;
    poseIdle(personFig, now / 1000);
  }
  person.x = THREE.MathUtils.clamp(person.x, -102, 102);
  person.z = THREE.MathUtils.clamp(person.z, -72, 72);
  person.y = world.groundAt(person.x, person.z);
  personFig.group.position.set(person.x, person.y, person.z);
  personFig.group.rotation.y = person.heading;
}

/* ============================================================ HUD */
const speedEl = document.querySelector('#speed b'), modeEl = document.getElementById('mode'),
      hintEl = document.getElementById('hint');
setTimeout(()=>{ hintEl.style.opacity = '0'; }, 14000);

/* ============================================================ AI-FACING LIVE STATE
   Layer 2 of the AI layer (layer 1 = instructions: the #ai-instructions
   JSON block, window.__FLEET_DRIVE_AI__, and ./AI-RECIPE.md). This global
   lets an AI perceive the GAMEPLAY itself: which cars are in the lot
   (with their full specs), whether the player is on foot or driving,
   where everything is, and simple hooks to verify play. Read-mostly;
   no visible UI. */
function carSnapshot(st){
  return {
    index: st.index, name: st.def.name,
    x: +st.x.toFixed(2), z: +st.z.toFixed(2), y: +st.y.toFixed(2),
    heading: +st.heading.toFixed(3), speedKmh: +(st.speed * 3.6).toFixed(1),
    parked: Math.abs(st.speed) < 0.01, hasPopups: st.hasPopups,
    popupsUp: st.hasPopups ? st.popTarget > 0.5 : null, beamColor: '#' + st.beamColor.toString(16).padStart(6, '0'),
  };
}
function personSnapshot(){
  const n = nearestCarTo(person.x, person.z);
  return {
    x: +person.x.toFixed(2), z: +person.z.toFixed(2), y: +person.y.toFixed(2),
    heading: +person.heading.toFixed(3), speedKmh: +(person.speed * 3.6).toFixed(1),
    nearestCar: n.index >= 0 ? { index: n.index, name: fleet[n.index].def.name, edgeDist: +n.dist.toFixed(2) } : null,
    canGetIn: mode === 'walk' && n.index >= 0 && n.dist <= 2.5,
  };
}
window.__FLEET_DRIVE__ = {
  game: 'Fleet Drive',
  world: 'Bunny Hop world (buildWorld, parkedCarCount 0) — street, canal, bridge, dusk',
  cars: CARS.map((c, i) => ({ index: i, name: c.name, spec: c.spec })),
  get mode(){ return mode; },
  get activeIndex(){ return active; },
  activeCar(){ return carSnapshot(fleet[active]); },
  parkedCars(){ return fleet.map(carSnapshot); },
  person(){ return personSnapshot(); },
  nearestCar(){ return personSnapshot().nearestCar; },
  getIn(i){ getIn(i); return this.activeCar(); },
  getOut(){ getOut(); return personSnapshot(); },
  swapCar(i){ swapCar(i); return this.activeCar(); },
  nextCar(){ return this.swapCar((active + 1) % fleet.length); },
  setPopups(v){ return setPopups(!!v); },
  snapshotState(){
    return {
      mode,
      activeIndex: active,
      active: carSnapshot(fleet[active]),
      person: personSnapshot(),
      cars: fleet.map(carSnapshot),
      camera: { x: +camera.position.x.toFixed(2), y: +camera.position.y.toFixed(2), z: +camera.position.z.toFixed(2), fov: +camera.fov.toFixed(1) },
      drawCalls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
    };
  },
};
try {
  const aiJson = JSON.parse(document.getElementById('ai-instructions').textContent);
  window.__FLEET_DRIVE_AI__ = Object.assign(window.__FLEET_DRIVE_AI__ || {}, aiJson, { liveState: 'window.__FLEET_DRIVE__' });
} catch (e) { /* instructions also live in ./AI-RECIPE.md */ }

/* Debug / scripted-play hooks (verification harness) */
window.__dbg = {
  ready: true, world, fleet, person, input,
  get active(){ return active; },
  get mode(){ return mode; },
  get envMs(){ return envInfo.initMs; },
  swapCar, setPopups, getIn, getOut,
  state(){ return window.__FLEET_DRIVE__.snapshotState(); },
  teleport(x, z, heading){ // drive-mode teleport (active car)
    const st = fleet[active];
    st.x = x; st.z = z; if (heading != null) st.heading = heading;
    st.speed = 0; st.y = world.groundAt(x, z);
    snapCamBehind(st.x, st.y, st.z, st.heading, CAM_DIST, CAM_H);
  },
  walkTeleport(x, z, heading){ // walk-mode teleport (the person)
    person.x = x; person.z = z; if (heading != null) person.heading = heading;
    person.speed = 0; person.y = world.groundAt(x, z);
    snapCamBehind(person.x, person.y, person.z, person.heading, WALK_DIST, WALK_H);
  },
  camera,
};

/* ============================================================ MAIN LOOP — Bunny Hop chase camera.
   Drive mode: lazy yaw (tau 0.55 s) behind the car, 1.65 m-class shoulder
   height scaled to the car, FOV 60 + speed breathe to 64, roll 0.
   Walk mode: same lazy-follow language behind the person at walking
   height, FOV 60. */
const CAM_DIST = 5.4, CAM_H = 2.05;
const camPos = new THREE.Vector3(person.x - Math.sin(person.heading) * WALK_DIST, person.y + WALK_H, person.z - Math.cos(person.heading) * WALK_DIST);
let camYawS = person.heading;
const projV = new THREE.Vector3();
let last = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  pollInput();
  const st = fleet[active];
  if (mode === 'drive') stepCar(st, dt); else stepPerson(dt, now);
  // pop-up animation (lerp toward target) on whichever car has them
  for (const c of fleet){
    if (!c.hasPopups) continue;
    const d = c.popTarget - c.popT;
    if (Math.abs(d) > 0.001){ c.popT += THREE.MathUtils.clamp(d, -dt * 2.4, dt * 2.4); c.built.setPopups(c.popT); }
  }
  for (const c of fleet) placeCar(c, dt);
  beam.visible = mode === 'drive';
  if (mode === 'drive') updateBeam(st);
  if (emberLight) emberLight.intensity = 4.2 + Math.sin(now * 0.021) * 1.4 + Math.sin(now * 0.047 + 1.3) * 1.1; // burnt Mustang ember flicker
  // ---- camera + focus ----
  const focus = mode === 'drive' ? st : person;
  if (mode === 'drive'){
    if (Math.abs(st.speed) > 0.15){
      let dyaw = st.heading - camYawS; dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
      camYawS += dyaw * (1 - Math.exp(-dt / 0.55));
    }
    const bx = Math.sin(camYawS), bz = Math.cos(camYawS);
    camPos.x += ((st.x - bx * CAM_DIST) - camPos.x) * Math.min(1, dt * 4.5);
    camPos.z += ((st.z - bz * CAM_DIST) - camPos.z) * Math.min(1, dt * 4.5);
    camPos.y += ((st.y + CAM_H) - camPos.y) * Math.min(1, dt * 4.5);
    const camGround = world.groundAt(camPos.x, camPos.z) + 0.45;
    if (camPos.y < camGround) camPos.y = camGround;
    camera.position.copy(camPos);
    camera.lookAt(st.x, st.y + 0.7, st.z);
    const fovT = 60 + 4 * THREE.MathUtils.smoothstep(Math.abs(st.speed), 6, 22);
    if (Math.abs(camera.fov - fovT) > 0.02){ camera.fov = fovT; camera.updateProjectionMatrix(); }
  } else {
    if (person.speed > 0.15){
      let dyaw = person.heading - camYawS; dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
      camYawS += dyaw * (1 - Math.exp(-dt / 0.45));
    }
    const bx = Math.sin(camYawS), bz = Math.cos(camYawS);
    camPos.x += ((person.x - bx * WALK_DIST) - camPos.x) * Math.min(1, dt * 5);
    camPos.z += ((person.z - bz * WALK_DIST) - camPos.z) * Math.min(1, dt * 5);
    camPos.y += ((person.y + WALK_H) - camPos.y) * Math.min(1, dt * 5);
    const camGround = world.groundAt(camPos.x, camPos.z) + 0.45;
    if (camPos.y < camGround) camPos.y = camGround;
    camera.position.copy(camPos);
    camera.lookAt(person.x, person.y + 1.3, person.z);
    if (Math.abs(camera.fov - 60) > 0.02){ camera.fov = 60; camera.updateProjectionMatrix(); }
  }
  sun.position.set(focus.x + SUN_OFF.x, SUN_OFF.y, focus.z + SUN_OFF.z); sun.target.position.set(focus.x, 0, focus.z);
  // ---- HUD + labels + prompt ----
  if (mode === 'drive'){
    speedEl.textContent = Math.round(Math.abs(st.speed) * 3.6);
    modeEl.textContent = st.def.name.toUpperCase() + (Math.abs(st.speed) < 0.01 ? ' — PARKED' : '');
    promptEl.classList.remove('show'); btnInEl.classList.remove('show');
  } else {
    speedEl.textContent = Math.round(person.speed * 3.6);
    const n = nearestCarTo(person.x, person.z);
    const canIn = n.index >= 0 && n.dist <= 2.5;
    modeEl.textContent = canIn ? 'ON FOOT — ' + fleet[n.index].def.name.toUpperCase() : 'ON FOOT — WALK THE ROW';
    promptEl.textContent = canIn ? 'GET IN — ' + fleet[n.index].def.name : '';
    promptEl.classList.toggle('show', canIn);
    btnInEl.classList.toggle('show', canIn);
  }
  const nearIdx = mode === 'walk' ? nearestCarTo(person.x, person.z).index : active;
  fleet.forEach((c, i) => {
    const el = labelEls[i];
    projV.set(c.x, c.y + (c.built.dims.height || 1.4) + 0.55, c.z).project(camera);
    const dist = Math.hypot(camera.position.x - c.x, camera.position.z - c.z);
    if (projV.z > 1 || dist > 22){ el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.left = ((projV.x * 0.5 + 0.5) * window.innerWidth) + 'px';
    el.style.top = ((-projV.y * 0.5 + 0.5) * window.innerHeight) + 'px';
    el.classList.toggle('near', i === nearIdx);
  });
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
