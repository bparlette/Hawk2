<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Helix Drop</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#aee3ff;touch-action:none;overscroll-behavior:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  #game{position:fixed;inset:0;display:block;touch-action:none}
  .ui{position:fixed;z-index:1100;pointer-events:none;color:#fff}
  #hudPct{top:calc(10px + env(safe-area-inset-top));left:0;right:0;text-align:center;
    font-size:64px;font-weight:900;letter-spacing:-1px;text-shadow:0 3px 0 rgba(30,90,160,.35),0 6px 18px rgba(30,90,160,.35)}
  #hudPct small{font-size:28px;font-weight:900}
  #hudSub{top:calc(86px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:15px;font-weight:800;
    text-shadow:0 2px 6px rgba(30,90,160,.5)}
  #hudSmash{top:calc(112px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:170px;height:16px;
    background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.85);border-radius:99px;overflow:hidden;display:none}
  #smashFill{height:100%;width:0%;background:linear-gradient(90deg,#ffd23f,#ff7b00);border-radius:99px;transition:width .15s}
  #smashLabel{top:calc(132px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:13px;font-weight:900;
    color:#fff;text-shadow:0 2px 6px rgba(200,90,0,.7);display:none}
  #hint{bottom:calc(26px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:16px;font-weight:800;
    text-shadow:0 2px 8px rgba(30,90,160,.55);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .overlay{position:fixed;inset:0;z-index:1200;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(20,40,90,.45);color:#fff;text-align:center;padding:24px}
  .overlay.show{display:flex}
  .overlay h1{font-size:44px;font-weight:900;margin-bottom:8px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  .overlay p{font-size:18px;font-weight:700;margin-bottom:22px;max-width:300px}
  .btn{pointer-events:auto;background:#ffcf3f;color:#5b3200;border:none;border-radius:99px;padding:16px 42px;
    font-size:20px;font-weight:900;box-shadow:0 6px 0 #d99a00,0 10px 24px rgba(0,0,0,.3);cursor:pointer;touch-action:none}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d99a00}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui" id="hudPct">0<small>%</small></div>
<div class="ui" id="hudSub">LEVEL 1 &nbsp;·&nbsp; PLATFORMS 0 &nbsp;·&nbsp; SCORE 0</div>
<div class="ui" id="hudSmash"><div id="smashFill"></div></div>
<div class="ui" id="smashLabel">⚡ SMASH READY — HIT A RED ONE! ⚡</div>
<div class="ui" id="hint">◀ &nbsp;DRAG TO SPIN THE TOWER&nbsp; ▶</div>
<div class="overlay" id="overDead">
  <h1>💥 SPLAT!</h1>
  <p id="deadText">You landed on a red segment.</p>
  <button class="btn" id="btnRetry">↻ &nbsp;TRY AGAIN</button>
</div>
<div class="overlay" id="overClear">
  <h1>🎉 TOWER DOWN!</h1>
  <p id="clearText">Level clear!</p>
  <button class="btn" id="btnNext">NEXT TOWER ▶</button>
</div>
<script>
'use strict';
// ============ Helix Drop — original rotate-the-tower descent game ============
// One verb: drag horizontally to spin the tower. Drop the ball through gaps.
// Red segments end the run — unless a long chained fall charged your SMASH.
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

// Block double-tap zoom + browser gestures
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd <= 350) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ---------- seeded RNG (deterministic per level) ----------
function mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- constants ----------
const SEG = 6;                 // segments per platform
const SEG_DEG = 360 / SEG;     // 60°
const GAP_H = 92;              // vertical spacing between platforms (world px)
const RADIUS = Math.min(132, Math.max(104, W * 0.34));
const DEG_PER_PX = 0.45;       // drag sensitivity
const PALETTE = ['#ff5d8f','#ffb340','#3ec6ff','#7ee081','#b388ff','#ff8a5c','#4dd0e1','#f06292','#aed581','#64b5f6'];
const RED = '#e8252c';

// ---------- state ----------
let level = 1, platforms = [], totalPlatforms = 0;
let rot = 0;                   // tower rotation, degrees
let rotVel = 0;
let ballY = 0, ballVY = 0;     // ball world Y (platform i top = i*GAP_H)
let standPlat = -1;            // platform the ball is bouncing on (-1 = falling toward targetPlat)
let targetPlat = 0;            // platform whose surface the falling ball hits next
let mode = 'bounce';           // bounce | fall | dead | clear
let passed = 0, score = 0;
let fallChain = 0, smash = false, smashUsed = 0;
let camY = 0, shake = 0, flash = 0;
let particles = [], streaks = [];
let deadInfo = '', startTime = performance.now();
const norm = a => ((a % 360) + 360) % 360;

// effective segment under the ball: ball sits at world angle 0 (front centre)
function effAngle(){ return norm(0 - rot); }
function segAt(plat, ang){
  const idx = Math.floor(norm(ang) / SEG_DEG) % SEG;
  if (idx === plat.gapSeg) return 'gap';
  return plat.redSegs.includes(idx) ? 'red' : 'safe';
}
function segCenter(idx){ return idx * SEG_DEG + SEG_DEG / 2; }

function buildLevel(lv){
  const rnd = mulberry(1234 + lv * 777);
  totalPlatforms = 14 + lv * 4;
  platforms = [];
  let prevGapSeg = Math.floor(rnd() * SEG);
  for (let i = 0; i < totalPlatforms; i++){
    let gapSeg;
    // cluster runs (i%7 in 2,3,4) share the gap segment -> one spin = long chained fall
    if (i % 7 === 3 || i % 7 === 4) gapSeg = prevGapSeg;
    else { gapSeg = Math.floor(rnd() * SEG); if (gapSeg === prevGapSeg && rnd() < 0.6) gapSeg = (gapSeg + 1 + Math.floor(rnd() * (SEG - 1))) % SEG; }
    prevGapSeg = gapSeg;
    const reds = [];
    if (i > 0){
      const nRed = Math.min(3, (rnd() < 0.45 + lv * 0.06 ? 2 : 1) + (lv >= 3 && rnd() < 0.3 ? 1 : 0));
      const cand = [];
      for (let s = 0; s < SEG; s++) if (s !== gapSeg) cand.push(s);
      for (let k = 0; k < nRed && cand.length; k++){ reds.push(cand.splice(Math.floor(rnd() * cand.length), 1)[0]); }
    }
    platforms.push({ gapSeg, redSegs: reds, color: PALETTE[i % PALETTE.length], smashed: false });
  }
  rot = 0; rotVel = 0; ballY = -GAP_H * 0.9; ballVY = 0; standPlat = -1; targetPlat = 0;
  mode = 'bounce'; passed = 0; fallChain = 0; smash = false; smashUsed = 0;
  camY = ballY - H * 0.38; particles = []; streaks = []; shake = 0; flash = 0;
  document.getElementById('overDead').classList.remove('show');
  document.getElementById('overClear').classList.remove('show');
  startTime = performance.now();
  updateHUD();
}

function updateHUD(){
  const pct = totalPlatforms ? Math.min(100, Math.floor(passed / totalPlatforms * 100)) : 0;
  document.getElementById('hudPct').innerHTML = pct + '<small>%</small>';
  score = passed * 10 + pct + smashUsed * 25;
  document.getElementById('hudSub').textContent = 'LEVEL ' + level + '  ·  PLATFORMS ' + passed + '/' + totalPlatforms + '  ·  SCORE ' + score;
  const bar = document.getElementById('hudSmash'), lab = document.getElementById('smashLabel');
  if (smash){ bar.style.display = 'block'; lab.style.display = 'block'; document.getElementById('smashFill').style.width = '100%'; }
  else if (fallChain > 0){ bar.style.display = 'block'; lab.style.display = 'none'; document.getElementById('smashFill').style.width = Math.min(100, fallChain / 3 * 100) + '%'; }
  else { bar.style.display = 'none'; lab.style.display = 'none'; }
}

function burst(x, y, color){
  for (let i = 0; i < 26; i++){ const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 1, color, r: 3 + Math.random() * 5 }); }
  shake = 10; flash = 0.35;
}

function die(){
  mode = 'dead'; deadInfo = 'Landed on red at ' + Math.floor(passed / totalPlatforms * 100) + '%';
  burst(W / 2, platScreenY(Math.max(0, targetPlat)) - 10, RED);
  document.getElementById('deadText').textContent = 'You hit a red segment at ' + Math.floor(passed / totalPlatforms * 100) + '% down. Score ' + score + ' — spin so the gap is under the ball!';
  setTimeout(() => document.getElementById('overDead').classList.add('show'), 450);
}
function clearLevel(){
  mode = 'clear'; passed = totalPlatforms; updateHUD();
  burst(W / 2, H * 0.55, '#ffd23f');
  document.getElementById('clearText').textContent = 'Level ' + level + ' cleared! Score ' + score + '. Next tower is taller — with more red.';
  setTimeout(() => document.getElementById('overClear').classList.add('show'), 350);
}
function smashThrough(platIdx){
  platforms[platIdx].smashed = true; smash = false; smashUsed++;
  passed++; fallChain++;
  burst(W / 2, platScreenY(platIdx), platforms[platIdx].color);
  updateHUD();
}

// platform i top surface in screen coords
function platScreenY(i){ return i * GAP_H - camY; }

// ---------- physics ----------
let lastT = performance.now();
// Evaluate the segment under the ball on platform idx at contact.
// Returns 'passed' (keep falling), 'landed' (bounce here), or 'dead'.
function contact(idx){
  const plat = platforms[idx];
  if (plat.smashed) return 'passed';
  const kind = segAt(plat, effAngle());
  if (kind === 'gap'){
    passed++; fallChain++;
    if (fallChain >= 3 && !smash) smash = true;
    mode = 'fall'; updateHUD();
    return 'passed';
  }
  if (kind === 'red'){
    if (smash){ smashThrough(idx); mode = 'fall'; return 'passed'; }
    die(); return 'dead';
  }
  if (mode === 'fall') fallChain = 0;
  mode = 'bounce'; updateHUD();
  return 'landed';
}
function step(now){
  const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now;
  const g = 2600, bounceV = 780;
  if (mode === 'bounce' || mode === 'fall'){
    // tower inertia
    if (!dragging){ rot = norm(rot + rotVel); rotVel *= Math.pow(0.0005, dt); if (Math.abs(rotVel) < 0.01) rotVel = 0; }
    const prevY = ballY;
    ballVY += g * dt; ballY += ballVY * dt;
    if (standPlat >= 0){
      // bouncing on standPlat: each return to its surface re-checks the segment
      const surfY = standPlat * GAP_H;
      if (ballVY > 0 && prevY < surfY && ballY >= surfY){
        const idx = standPlat;
        const res = contact(idx);
        if (res === 'landed'){ ballY = surfY; ballVY = -bounceV; }
        else if (res === 'passed'){ standPlat = -1; targetPlat = idx + 1; ballY = surfY; }
        else { ballY = surfY; }
      }
    } else if (targetPlat < totalPlatforms){
      const surfY = targetPlat * GAP_H;
      if (ballVY > 0 && prevY < surfY && ballY >= surfY){
        const idx = targetPlat;
        const res = contact(idx);
        if (res === 'landed'){ standPlat = idx; ballY = surfY; ballVY = -bounceV; }
        else if (res === 'passed'){ targetPlat = idx + 1; ballY = surfY; }
        else { ballY = surfY; }
      }
    } else if (ballY >= totalPlatforms * GAP_H + 30){
      clearLevel();
    }
    if (mode === 'fall' && ballVY > 500 && Math.random() < 0.7){
      streaks.push({ x: W / 2 + (Math.random() - 0.5) * RADIUS * 1.6, y: (ballY - camY) - 30 - Math.random() * 60, len: 26 + Math.random() * 40, life: 1 });
    }
  }
  // camera follows ball
  const targetCam = ballY - H * 0.38;
  camY += (targetCam - camY) * Math.min(1, dt * 10);
  // particles / streaks
  for (const p of particles){ p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= dt * 1.4; }
  particles = particles.filter(p => p.life > 0);
  for (const s of streaks) s.life -= dt * 3;
  streaks = streaks.filter(s => s.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flash > 0) flash = Math.max(0, flash - dt);
  draw();
  requestAnimationFrame(step);
}

// ---------- drawing (2.5D: elliptical segmented discs on a pole) ----------
function ellipsePt(cx, cy, rx, ry, deg){ const r = deg * Math.PI / 180; return [cx + rx * Math.sin(r), cy + ry * Math.cos(r)]; }
function drawSeg(cx, cy, rx, ry, thick, a1, a2, color, topShade){
  // side face
  ctx.beginPath();
  let [x, y] = ellipsePt(cx, cy + thick, rx, ry, a1); ctx.moveTo(x, y);
  for (let a = a1; a <= a2; a += 4){ [x, y] = ellipsePt(cx, cy + thick, rx, ry, a); ctx.lineTo(x, y); }
  for (let a = a2; a >= a1; a -= 4){ [x, y] = ellipsePt(cx, cy, rx, ry, a); ctx.lineTo(x, y); }
  ctx.closePath(); ctx.fillStyle = topShade; ctx.fill();
  // top face
  ctx.beginPath();
  [x, y] = ellipsePt(cx, cy, rx, ry, a1); ctx.moveTo(x, y);
  for (let a = a1; a <= a2; a += 4){ [x, y] = ellipsePt(cx, cy, rx, ry, a); ctx.lineTo(x, y); }
  ctx.lineTo(cx, cy); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
}
function shade(hex, f){ const n = parseInt(hex.slice(1), 16); const r = Math.min(255, ((n >> 16) & 255) * f), g = Math.min(255, ((n >> 8) & 255) * f), b = Math.min(255, (n & 255) * f); return `rgb(${r|0},${g|0},${b|0})`; }

function draw(){
  // sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#8ed8ff'); grad.addColorStop(0.55, '#c9ecff'); grad.addColorStop(1, '#ffe9f4');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  // soft clouds
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (let i = 0; i < 5; i++){ const cxp = ((i * 173 + 60) % (W + 80)) - 40, cyp = ((i * 211 + ((-camY * 0.15) % 500) + 500) % 500) + i * 60; ctx.beginPath(); ctx.ellipse(cxp, cyp % H, 44, 15, 0, 0, 7); ctx.fill(); }
  const cx = W / 2 + (shake ? (Math.random() - 0.5) * shake : 0);
  const rx = RADIUS, ry = rx * 0.30, thick = 15;
  const topIdx = Math.max(0, Math.floor(camY / GAP_H) - 2), botIdx = Math.min(totalPlatforms - 1, Math.ceil((camY + H) / GAP_H) + 1);
  // central pole
  ctx.fillStyle = '#fff'; ctx.fillRect(cx - 13, -20, 26, H + 40);
  ctx.fillStyle = 'rgba(120,170,220,.35)'; ctx.fillRect(cx + 4, -20, 9, H + 40);
  // base
  const baseY = totalPlatforms * GAP_H - camY + 6;
  if (baseY > -40 && baseY < H + 60){
    ctx.beginPath(); ctx.ellipse(cx, baseY, rx * 1.18, ry * 1.25, 0, 0, 7); ctx.fillStyle = '#39c26d'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx, baseY - 8, rx * 1.18, ry * 1.25, 0, 0, 7); ctx.fillStyle = '#54d97f'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '900 15px system-ui'; ctx.textAlign = 'center'; ctx.fillText('★ FINISH ★', cx, baseY - 2);
  }
  // platforms, bottom-most first so nearer (lower) discs overlap correctly
  for (let i = botIdx; i >= topIdx; i--){
    const plat = platforms[i]; if (plat.smashed) continue;
    const cy = i * GAP_H - camY; if (cy < -50 || cy > H + 50) continue;
    // draw back segments first, then front, so front faces sit on top
    const order = [];
    for (let s = 0; s < SEG; s++) if (s !== plat.gapSeg) order.push(s);
    order.sort((a, b) => Math.cos((segCenter(a) + rot) * Math.PI / 180) - Math.cos((segCenter(b) + rot) * Math.PI / 180));
    for (const s of order){
      const a1 = norm(segCenter(s) - SEG_DEG / 2 + rot), a2 = a1 + SEG_DEG - 2;
      const isRed = plat.redSegs.includes(s);
      const col = isRed ? RED : plat.color;
      drawSeg(cx, cy, rx, ry, thick, a1, a2, col, shade(isRed ? '#a31218' : plat.color, 0.72));
      if (isRed){ // warning stripes marker at segment centre front
        const [mx, my] = ellipsePt(cx, cy, rx * 0.72, ry * 0.72, norm(segCenter(s) + rot));
        if (Math.cos(norm(segCenter(s) + rot) * Math.PI / 180) > 0.25){ ctx.fillStyle = '#fff'; ctx.font = '900 13px system-ui'; ctx.textAlign = 'center'; ctx.fillText('✕', mx, my + 4); }
      }
    }
  }
  // fall streaks
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (const s of streaks){ ctx.globalAlpha = s.life * 0.8; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y + s.len); ctx.stroke(); }
  ctx.globalAlpha = 1;
  // ball (front centre), squash & stretch from velocity
  const ballScreenY = ballY - camY - 17;
  const stretch = Math.max(-0.28, Math.min(0.38, ballVY / 2600));
  const sx = 1 - stretch * 0.55, sy = 1 + stretch;
  ctx.save(); ctx.translate(cx, ballScreenY); ctx.scale(sx, sy);
  const bg = ctx.createRadialGradient(-6, -8, 3, 0, 0, 19);
  bg.addColorStop(0, '#fff3b0'); bg.addColorStop(0.45, '#ffd23f'); bg.addColorStop(1, '#ff9d00');
  ctx.beginPath(); ctx.arc(0, 0, 17, 0, 7); ctx.fillStyle = smash ? '#ff5722' : bg; ctx.fill();
  ctx.strokeStyle = 'rgba(160,80,0,.5)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(-6, -6, 4.5, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
  ctx.restore();
  if (smash){ ctx.strokeStyle = 'rgba(255,110,0,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, ballScreenY, 24 + Math.sin(performance.now() / 90) * 3, 0, 7); ctx.stroke(); }
  // particles
  for (const p of particles){ ctx.globalAlpha = Math.max(0, p.life); ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fillStyle = p.color; ctx.fill(); }
  ctx.globalAlpha = 1;
  if (flash > 0){ ctx.fillStyle = `rgba(255,240,200,${flash})`; ctx.fillRect(0, 0, W, H); }
  if (mode === 'dead'){ ctx.fillStyle = 'rgba(232,37,44,.14)'; ctx.fillRect(0, 0, W, H); }
}

// ---------- input: one-thumb horizontal drag spins the tower ----------
let dragging = false, lastX = 0;
function onDown(x){ dragging = true; lastX = x; rotVel = 0; document.getElementById('hint').style.display = 'none'; }
function onMove(x){ if (!dragging) return; const dx = x - lastX; lastX = x; const d = dx * DEG_PER_PX; rot = norm(rot + d); rotVel = d * 0.25; }
function onUp(){ dragging = false; }
cv.addEventListener('pointerdown', e => { try { cv.setPointerCapture(e.pointerId); } catch (_) {} onDown(e.clientX); });
cv.addEventListener('pointermove', e => onMove(e.clientX));
cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
cv.addEventListener('mousedown', e => onDown(e.clientX));
window.addEventListener('mousemove', e => onMove(e.clientX));
window.addEventListener('mouseup', onUp);

document.getElementById('btnRetry').addEventListener('click', () => buildLevel(level));
document.getElementById('btnNext').addEventListener('click', () => { level++; buildLevel(level); });

// ---------- debug / QA surface ----------
window.__dbg = {
  state: () => ({ mode, passed, total: totalPlatforms, pct: totalPlatforms ? Math.floor(passed / totalPlatforms * 100) : 0, score, rot: Math.round(rot * 10) / 10, eff: Math.round(effAngle() * 10) / 10, standPlat, targetPlat, fallChain, smash, smashUsed, level }),
  next: () => { const i = standPlat >= 0 ? standPlat : targetPlat; if (i >= totalPlatforms) return { base: true }; const p = platforms[i]; return { idx: i, gapSeg: p.gapSeg, gapCenter: segCenter(p.gapSeg), redSegs: p.redSegs.slice(), redCenters: p.redSegs.map(segCenter), smashed: p.smashed }; },
  segCenter,
};
window.__helixReady = true;
buildLevel(1);
requestAnimationFrame(step);
</script>
</body>
</html>
