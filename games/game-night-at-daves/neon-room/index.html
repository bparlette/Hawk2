<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GAME NIGHT AT DAVE'S — Step One Room Study (Neon)</title>
  <style>
    :root {
      --vgc-navy: #000080;
      --vgc-green: #90ee90;
      --vgc-bg: #05050a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #040408;
      color: #f4efe6;
      font-family: "Courier New", Courier, monospace;
      touch-action: none;
    }

    .stage-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #121226 0%, #030307 82%);
    }

    .phone-frame {
      position: relative;
      height: 100dvh;
      max-height: 100dvh;
      aspect-ratio: 390 / 844;
      max-width: 100vw;
      background: #06060d;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(144, 238, 144, 0.18), 0 20px 60px rgba(0, 0, 0, 0.85);
      touch-action: none;
    }

    #roomCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    /* HTML UI Layer: z-index >= 1100 per TOUCH.md */
    .ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1200;
    }

    .sfx-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 34px;
      height: 30px;
      border-radius: 7px;
      border: 2px solid #4d6bff;
      background: var(--vgc-navy);
      color: var(--vgc-green);
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
    }

    .sfx-btn:active {
      transform: translateY(1px);
    }

    .tap-toast {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(0, 0, 128, 0.94);
      border: 2px solid var(--vgc-green);
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.7px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.16s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75);
      pointer-events: none;
    }

    .tap-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="stage-shell">
    <div class="phone-frame" id="phoneFrame">
      <!-- 260 x 562 logical 16-bit pixel art canvas (exact 390:844 portrait aspect) -->
      <canvas id="roomCanvas" width="260" height="562"></canvas>

      <div class="ui-layer">
        <button class="sfx-btn" id="btnSfx" aria-label="Toggle Sound">SFX</button>
        <div class="tap-toast" id="tapToast">GAME NIGHT READY — STEP ONE ROOM STUDY</div>
      </div>
    </div>
  </div>

  <script type="module">
    const canvas = document.getElementById('roomCanvas');
    const ctx = canvas.getContext('2d');
    const phoneFrame = document.getElementById('phoneFrame');
    const btnSfx = document.getElementById('btnSfx');
    const tapToast = document.getElementById('tapToast');

    const W = 260;
    const H = 562;

    // iOS-safe WebAudio unlock chain
    let audioCtx = null;
    let audioUnlocked = false;
    let muted = false;

    function unlockAudio() {
      if (audioUnlocked && audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        return;
      }
      try {
        if (typeof navigator !== 'undefined' && navigator.audioSession) {
          navigator.audioSession.type = 'playback';
        }
      } catch (_) {}
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      try {
        const b = audioCtx.createBuffer(1, 1, 22050);
        const s = audioCtx.createBufferSource();
        s.buffer = b;
        s.connect(audioCtx.destination);
        s.start(0);
      } catch (_) {}
      audioUnlocked = true;
    }

    function playStartChime() {
      if (muted || !audioCtx || audioCtx.state !== 'running') return;
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((f, i) => {
        const t = audioCtx.currentTime + i * 0.06;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.08, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
      });
    }

    // Pixel helpers (integer-aligned for razor-sharp 16-bit look)
    function px(x, y, w, h, col) {
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    }

    function pill(x, y, w, h, col) {
      x = Math.round(x);
      y = Math.round(y);
      w = Math.round(w);
      h = Math.round(h);
      ctx.fillStyle = col;
      if (w >= 4 && h >= 4) {
        ctx.fillRect(x + 1, y, w - 2, h);
        ctx.fillRect(x, y + 1, w, h - 2);
      } else {
        ctx.fillRect(x, y, w, h);
      }
    }

    function roundedRect(x, y, w, h, col, r = 2) {
      x = Math.round(x);
      y = Math.round(y);
      w = Math.round(w);
      h = Math.round(h);
      ctx.fillStyle = col;
      ctx.fillRect(x + r, y, w - r * 2, h);
      ctx.fillRect(x, y + r, w, h - r * 2);
      if (r >= 2) {
        ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
      }
    }

    // Crew specification — LOCKED seating order left-to-right, backs of heads ONLY, ZERO faces!
    const CREW = [
      {
        name: 'SUDZ',
        hairType: 'crop',
        hair: '#8a623c',
        hairHi: '#ab7e52',
        hairShade: '#5d4026',
        shirt: '#c9322c',
        shirtShade: '#8c1f1b',
        reclinedFeet: true,
        sockCol: '#242730',
        pantsCol: '#2e3a4e',
      },
      {
        name: 'SCOTT',
        hairType: 'cap',
        hair: '#222630',
        hairHi: '#3d4557',
        hairShade: '#13161d',
        shirt: '#d98a22',
        shirtShade: '#965c12',
        reclinedFeet: false,
      },
      {
        name: 'BRENT',
        hairType: 'full',
        hair: '#c8cdd6',
        hairHi: '#eef2f8',
        hairShade: '#8b93a2',
        shirt: '#328a46',
        shirtShade: '#1e5b2c',
        reclinedFeet: true,
        sockCol: '#59606e',
        pantsCol: '#38465e',
      },
      {
        name: 'BRIAN',
        hairType: 'cap',
        hair: '#232732',
        hairHi: '#42495c',
        hairShade: '#13161d',
        shirt: '#ebe6dc',
        shirtShade: '#bab3a6',
        reclinedFeet: false,
      },
      {
        name: 'STEVE',
        hairType: 'wave',
        hair: '#2b1d14',
        hairHi: '#473224',
        hairShade: '#18100b',
        shirt: '#1c3c86',
        shirtShade: '#112554',
        reclinedFeet: true,
        sockCol: '#e5e7ec',
        pantsCol: '#9a7e5a',
      },
      {
        name: 'CHRIS',
        hairType: 'buzz',
        hair: '#887866',
        hairHi: '#a69682',
        hairShade: '#5c5043',
        shirt: '#228c88',
        shirtShade: '#145a57',
        reclinedFeet: false,
      },
      {
        name: 'BRAD',
        hairType: 'crop',
        hair: '#b85426',
        hairHi: '#db7442',
        hairShade: '#7d3414',
        shirt: '#2ea8ff',
        shirtShade: '#1a6eb3',
        reclinedFeet: true,
        sockCol: '#242730',
        pantsCol: '#333d50',
      },
      {
        name: 'BRENDAN',
        hairType: 'long',
        hair: '#1e1922',
        hairHi: '#3a3242',
        hairShade: '#110d14',
        shirt: '#7a3ab8',
        shirtShade: '#4e227a',
        reclinedFeet: false,
      },
      {
        name: 'DAVE',
        hairType: 'sweep',
        hair: '#d6dbe4',
        hairHi: '#f4f7fc',
        hairShade: '#9aa2b2',
        shirt: '#263858',
        shirtShade: '#162238',
        isDave: true,
        reclinedFeet: true,
        sockCol: '#1f222a',
        pantsCol: '#2c3342',
      },
    ];

    // Precompute deterministic starfield for videogamecritic.com masthead
    const STARS = [];
    for (let i = 0; i < 38; i++) {
      STARS.push({
        x: (i * 37 + 11) % W,
        y: (i * 19 + 3) % 24,
        bright: i % 3 === 0 ? '#ffffff' : i % 2 === 0 ? '#90ee90' : '#7b88c9',
      });
    }

    // Deterministic game spine colors for shelves
    const SPINE_COLORS_RIGHT = ['#b52b2b', '#26538d', '#d18d2a', '#2b7a46', '#7d2e82', '#d8d2c4', '#40485c', '#c94932'];
    const SPINE_COLORS_LEFT = ['#ebe6da', '#ded8ca', '#f2eee4', '#d1cab9', '#c6c0b2', '#e4dfd2'];

    function drawMasthead(time) {
      // videogamecritic.com starfield masthead
      px(0, 0, W, 26, '#05050b');
      for (const s of STARS) {
        const tw = Math.sin(time * 3 + s.x) > -0.6 ? 1 : 0;
        if (tw) px(s.x, s.y, 1, 1, s.bright);
      }
      px(0, 25, W, 2, '#000080');
      px(0, 27, W, 1, '#90ee90');

      ctx.font = 'bold 8px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#c8d0e0';
      ctx.fillText('presented by', 80, 13);
      ctx.fillStyle = '#90ee90';
      ctx.fillText('videogamecritic.com', 160, 13);
    }

    function drawRoomArchitecture(time) {
      // Warm dim living-room wall & ceiling behind TVs
      px(0, 28, W, 240, '#2a221c');
      // Subtle top ceiling shadow
      px(0, 28, W, 16, '#1c1612');
      // Warm wall glow behind big TV & CRT
      const glow = ctx.createRadialGradient(128, 136, 18, 128, 145, 118);
      glow.addColorStop(0, 'rgba(72, 118, 196, 0.28)');
      glow.addColorStop(0.55, 'rgba(255, 178, 96, 0.12)');
      glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 28, W, 230);

      // 1. LEFT FLOOR-TO-CEILING BLACK SHELF WALL (packed white/cream spines + dark Genesis cases per room-1!)
      px(0, 32, 34, 214, '#0f0e12');
      for (let row = 0; row < 7; row++) {
        const sy = 36 + row * 29;
        px(2, sy + 25, 30, 3, '#1e1c24'); // shelf plank
        for (let bx = 3; bx < 31; bx += 3) {
          const isDarkBottom = row >= 4;
          const col = isDarkBottom
            ? (bx % 6 === 0 ? '#b8322c' : bx % 9 === 0 ? '#2e63a8' : '#262936')
            : SPINE_COLORS_LEFT[(bx + row * 3) % SPINE_COLORS_LEFT.length];
          const bh = 21 + ((bx + row) % 3);
          px(bx, sy + (25 - bh), 2, bh, col);
        }
      }
      // Shelf outer wood frame
      px(34, 32, 2, 214, '#1b1820');

      // 2. RIGHT FLOOR-TO-CEILING BLACK SHELF WALL (red/black/blue/green retro boxes per room-1 & room-3!)
      px(W - 34, 32, 34, 214, '#0f0e12');
      for (let row = 0; row < 7; row++) {
        const sy = 36 + row * 29;
        px(W - 32, sy + 25, 30, 3, '#1e1c24');
        for (let bx = W - 31; bx < W - 3; bx += 3) {
          const col = SPINE_COLORS_RIGHT[(bx + row * 5) % SPINE_COLORS_RIGHT.length];
          const bh = 20 + ((bx * 3 + row) % 4);
          px(bx, sy + (25 - bh), 2, bh, col);
        }
      }
      px(W - 36, 32, 2, 214, '#1b1820');

      // 3. UPPER BACK SHELF & POSTER COLLAGE WALL (between the side shelves, matching room-2 & room-3!)
      // Top white shelf with retro boxes & books
      px(38, 44, 184, 3, '#c8bfa8');
      px(38, 47, 184, 2, '#5c5244');
      for (let x = 42; x < 216; x += 6) {
        const col = SPINE_COLORS_RIGHT[(x * 7) % SPINE_COLORS_RIGHT.length];
        px(x, 33 + (x % 3), 5, 11 - (x % 3), col);
      }

      // Glowing PlayStation △ ○ × □ light above the big TV (direct from room-2!)
      px(50, 51, 38, 10, '#141724');
      const psGlow = 0.8 + 0.2 * Math.sin(time * 4);
      ctx.save();
      ctx.globalAlpha = psGlow;
      px(53, 53, 6, 6, '#38e88c'); // green triangle
      px(62, 53, 6, 6, '#ff4d6d'); // pink circle
      px(71, 53, 6, 6, '#4db8ff'); // blue cross
      px(80, 53, 6, 6, '#d96bff'); // purple square
      ctx.restore();

      // Framed Poster Collage Wall (between TVs and upper shelves, matching room-3!)
      const posters = [
        { x: 96, y: 50, w: 18, h: 22, bg: '#2c3d68', fg: '#e8c468' },
        { x: 117, y: 52, w: 16, h: 20, bg: '#6e232a', fg: '#f2b880' },
        { x: 136, y: 50, w: 20, h: 22, bg: '#203b32', fg: '#88e0b8' },
        { x: 160, y: 52, w: 15, h: 20, bg: '#3e2954', fg: '#e08cf2' },
        { x: 179, y: 51, w: 22, h: 21, bg: '#5a3a22', fg: '#ffd27a' },
      ];
      for (const p of posters) {
        px(p.x - 1, p.y - 1, p.w + 2, p.h + 2, '#141118');
        px(p.x, p.y, p.w, p.h, p.bg);
        px(p.x + 3, p.y + 4, p.w - 6, 6, p.fg);
        px(p.x + 4, p.y + 12, p.w - 8, 5, 'rgba(255,255,255,0.35)');
      }

      // 4. TAN CARPET FLOOR (from TV stand base down to bottom of frame)
      px(0, 240, W, H - 240, '#8d7a62');
      // Perspective floor shading (warmer near TVs, darker under recliners)
      const floorGrad = ctx.createLinearGradient(0, 240, 0, H);
      floorGrad.addColorStop(0, 'rgba(40, 32, 24, 0.35)');
      floorGrad.addColorStop(0.25, 'rgba(180, 155, 120, 0.12)');
      floorGrad.addColorStop(0.65, 'rgba(22, 16, 12, 0.45)');
      floorGrad.addColorStop(1, 'rgba(6, 6, 12, 0.92)');
      ctx.fillStyle = floorGrad;
      ctx.fillRect(0, 240, W, H - 240);

      // Baseboard trim
      px(36, 236, W - 72, 4, '#5a4a38');
    }

    function drawTvWall(time) {
      // === LEFT: BIG FLATSCREEN TV (shows GAME NIGHT AT DAVE'S) ===
      const tvX = 40;
      const tvY = 78;
      const tvW = 114;
      const tvH = 74;

      // Subtle screen glow halo on wall
      ctx.fillStyle = 'rgba(60, 128, 255, 0.16)';
      ctx.fillRect(tvX - 4, tvY - 4, tvW + 8, tvH + 8);

      // Bezel
      roundedRect(tvX, tvY, tvW, tvH, '#12151e', 2);
      px(tvX + 3, tvY + 3, tvW - 6, tvH - 6, '#0c1a34');

      // Retro game title screen inside the big TV!
      // Deep navy header bar
      px(tvX + 4, tvY + 4, tvW - 8, 10, '#000080');
      ctx.font = 'bold 6px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#90ee90';
      ctx.fillText('VIDEOGAMECRITIC.COM', tvX + tvW / 2, tvY + 9);

      // Main pixel title
      ctx.font = '900 12px "Courier New", monospace';
      ctx.fillStyle = '#ffcf48';
      ctx.fillText('GAME NIGHT', tvX + tvW / 2, tvY + 29);
      ctx.fillStyle = '#ffffff';
      ctx.fillText("AT DAVE'S", tvX + tvW / 2, tvY + 43);

      // Sub-copy & tiny animated pixel hearts/beers
      ctx.font = 'bold 6px "Courier New", monospace';
      ctx.fillStyle = '#90ee90';
      ctx.fillText("Dave's reviewing tonight.", tvX + tvW / 2, tvY + 58);

      // Scanlines across big TV
      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      for (let sy = tvY + 4; sy < tvY + tvH - 4; sy += 2) {
        ctx.fillRect(tvX + 3, sy, tvW - 6, 1);
      }

      // === RIGHT: SILVER CRT TV + PAC-MAN & GHOSTS LAMP ON TOP (direct from room-2!) ===
      const crtX = 160;
      const crtY = 92;
      const crtW = 60;
      const crtH = 56;

      // Glowing Pac-Man + 4 Ghosts pixel lamp sitting on top of the silver CRT!
      const lampY = crtY - 10;
      px(crtX + 8, crtY - 2, 44, 2, '#181820');
      const pacCols = ['#ff3b3b', '#ff8cd9', '#3be8ff', '#ff9d2e', '#ffe63b'];
      pacCols.forEach((col, i) => {
        const lx = crtX + 10 + i * 8;
        const bob = Math.sin(time * 5 + i) > 0.3 ? -1 : 0;
        px(lx, lampY + bob, 6, 7, col);
        px(lx + 1, lampY + 2 + bob, 1, 1, '#ffffff');
        px(lx + 4, lampY + 2 + bob, 1, 1, '#ffffff');
      });

      // Silver CRT casing
      roundedRect(crtX, crtY, crtW, crtH, '#989ba4', 3);
      roundedRect(crtX + 2, crtY + 2, crtW - 4, crtH - 10, '#71757f', 2);
      // Curved dark glass CRT tube
      roundedRect(crtX + 5, crtY + 5, crtW - 10, crtH - 16, '#142426', 3);
      // Retro arcade attract bars on CRT
      const barPulse = Math.floor(time * 4) % 4;
      px(crtX + 10, crtY + 12, 34, 4, '#29e3ff');
      px(crtX + 12, crtY + 20, 24, 3, '#ffcf48');
      px(crtX + 14, crtY + 27, 28, 3, barPulse < 2 ? '#ff4d6d' : '#90ee90');
      px(crtX + 18, crtY + 34, 18, 3, '#72b8ff');
      // CRT specular highlight
      px(crtX + 7, crtY + 7, 10, 2, 'rgba(255,255,255,0.22)');
      // CRT front power LED & brand stripe
      px(crtX + 48, crtY + 48, 3, 2, '#54ff88');
      px(crtX + 10, crtY + 48, 16, 2, '#4d5058');

      // === CONSOLE MEDIA STANDS UNDER BOTH TVs (NES, SNES, Xbox, Dreamcast per room-2!) ===
      // Left wide black console rack
      px(42, 154, 110, 82, '#14151c');
      px(44, 156, 106, 2, '#2b2e3c');
      px(44, 178, 106, 2, '#2b2e3c');
      px(44, 202, 106, 2, '#2b2e3c');
      px(44, 226, 106, 2, '#2b2e3c');

      // Shelf 1: NES + SNES
      px(50, 164, 28, 12, '#d6d2c8'); // NES
      px(50, 168, 28, 3, '#2d2f38');
      px(72, 172, 2, 2, '#ff3b3b'); // NES power LED
      px(86, 166, 24, 10, '#ccc8d4'); // SNES
      px(91, 168, 6, 4, '#6b4ca8');
      px(100, 168, 6, 4, '#6b4ca8');
      px(118, 167, 26, 9, '#24262e'); // Genesis / Saturn

      // Shelf 2: Original Xbox (green glow!) + PS2
      px(52, 186, 36, 14, '#1d2126');
      px(68, 191, 4, 4, '#44ff44'); // Xbox jewel
      px(96, 188, 42, 12, '#1c1f2c'); // PS2 / receiver
      px(130, 192, 4, 2, '#3ba8ff');

      // Shelf 3: Retro gear + Dreamcast on floor in front
      px(52, 210, 88, 14, '#1b1d26');
      px(60, 214, 10, 3, '#ff6a38');
      px(76, 214, 12, 3, '#3be8ff');
      px(104, 214, 18, 3, '#ffcf48');

      // Right CRT stand with consoles
      px(162, 150, 56, 86, '#181a22');
      px(164, 152, 52, 2, '#343846');
      px(164, 178, 52, 2, '#343846');
      px(164, 206, 52, 2, '#343846');
      px(168, 162, 22, 12, '#2b2d38');
      px(194, 160, 18, 14, '#c82b36'); // Switch / red dock accent
      px(168, 188, 42, 14, '#22242e');
      px(172, 214, 34, 14, '#1d202a');

      // Dreamcast + controllers + tangled cords on carpet in front of rack (direct from room-2!)
      px(62, 240, 20, 11, '#e6e2d8');
      px(70, 243, 4, 3, '#ff5c28'); // Dreamcast orange swirl
      ctx.strokeStyle = '#18161a';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(72, 251);
      ctx.quadraticCurveTo(84, 262, 98, 258);
      ctx.moveTo(114, 236);
      ctx.quadraticCurveTo(122, 252, 134, 260);
      ctx.stroke();
    }

    function drawCoffeeTableAndRig(time) {
      // Coffee table sits IN FRONT of the recliners (between crew & TVs!)
      const tx = 62;
      const ty = 258;
      const tw = 136;
      const th = 34;

      // Table floor shadow
      px(tx + 4, ty + th, tw - 8, 7, 'rgba(0,0,0,0.42)');
      // Table legs
      px(tx + 6, ty + th - 2, 5, 10, '#3a291c');
      px(tx + tw - 11, ty + th - 2, 5, 10, '#3a291c');
      // Table top
      roundedRect(tx, ty, tw, th, '#5e432c', 2);
      px(tx + 2, ty + 2, tw - 4, th - 6, '#75563a');
      px(tx + 2, ty + 2, tw - 4, 2, '#916e4c');

      // === MASSIVE STEEL BATTALION DUAL-STICK RIG (direct from room-2!) ===
      const rx = 76;
      const ry = 252;
      // White mounting board underneath
      px(rx - 4, ry + 18, 100, 12, '#ddd8cc');

      // Left stick module
      roundedRect(rx, ry + 6, 26, 22, '#1d2028', 2);
      px(rx + 2, ry + 8, 22, 14, '#2d3240');
      // Left flight stick handle
      px(rx + 11, ry - 6, 4, 16, '#14161c');
      px(rx + 9, ry - 8, 8, 6, '#363c4c');
      px(rx + 12, ry - 7, 2, 2, '#ff3b3b');

      // Center illuminated Steel Battalion button console!
      roundedRect(rx + 28, ry + 4, 36, 24, '#171a22', 2);
      px(rx + 30, ry + 6, 32, 18, '#262b38');
      // Glowing green/red tactical buttons
      const blink = Math.floor(time * 3) % 2 === 0;
      for (let bx = 0; bx < 5; bx++) {
        px(rx + 32 + bx * 6, ry + 9, 4, 3, bx === 0 && blink ? '#ff4444' : '#42e878');
        px(rx + 32 + bx * 6, ry + 15, 4, 3, bx === 4 ? '#ffca3a' : '#2db860');
      }
      // Tuner dial
      px(rx + 44, ry + 20, 6, 3, '#9aa4b8');

      // Right stick module
      roundedRect(rx + 66, ry + 6, 26, 22, '#1d2028', 2);
      px(rx + 68, ry + 8, 22, 14, '#2d3240');
      // Right flight stick handle
      px(rx + 77, ry - 6, 4, 16, '#14161c');
      px(rx + 75, ry - 8, 8, 6, '#363c4c');
      px(rx + 78, ry - 7, 2, 2, '#ff3b3b');

      // === GREY/SILVER HELMET resting near right side of rig (direct from room-2!) ===
      const hx = 176;
      const hy = 258;
      pill(hx, hy, 18, 13, '#6e7480');
      pill(hx + 2, hy + 1, 14, 7, '#9ca3b0');
      px(hx + 5, hy + 2, 6, 2, '#d4dbe6'); // specular
      px(hx + 4, hy + 6, 10, 2, '#323640'); // helmet vent

      // === BLACK BOX WITH BLUE BALL-TOP ARCADE STICK on left table corner (direct from room-3!) ===
      const ax = 42;
      const ay = 274;
      roundedRect(ax, ay, 18, 14, '#14161d', 2);
      px(ax + 2, ay + 2, 14, 9, '#242836');
      px(ax + 8, ay - 6, 2, 9, '#b8c4d8'); // stick shaft
      pill(ax + 6, ay - 10, 6, 6, '#2e90ff'); // iconic bright blue ball-top!
      px(ax + 7, ay - 9, 2, 2, '#8fd0ff');
      px(ax + 12, ay + 4, 3, 3, '#2e90ff'); // blue arcade button
    }

    // Draw CONNECTED extended footrests & stretched-out legs/socks emerging directly from the front of the reclined seats!
    function drawExtendedFootrests(seatGeom) {
      for (let i = 0; i < CREW.length; i++) {
        const c = CREW[i];
        if (!c.reclinedFeet) continue;
        const g = seatGeom[i];
        const fx = g.cx;
        // Anchor directly into the front edge of the seat so there is ZERO floating gap!
        const seatFrontY = g.topY + 4;

        // Floor shadow beneath extended footrest
        px(fx - 9, seatFrontY - 22, 18, 22, 'rgba(0,0,0,0.28)');

        // Extended seat-pan & hinged footrest cushion connected straight out of the chair
        roundedRect(fx - 8, seatFrontY - 19, 16, 22, '#968062', 3);
        roundedRect(fx - 7, seatFrontY - 18, 14, 19, '#d6c5a8', 2);
        // Padded front lip roll of footrest
        px(fx - 6, seatFrontY - 18, 12, 3, '#f0e5d0');
        // Horizontal crease between seat cushion and hinged ottoman flap
        px(fx - 7, seatFrontY - 9, 14, 2, '#8b7558');

        // Stretched-out pant legs extending continuously from the reclined torso onto the footrest!
        px(fx - 6, seatFrontY - 16, 5, 17, c.pantsCol);
        px(fx + 1, seatFrontY - 16, 5, 17, c.pantsCol);
        // Subtle denim/khaki knee highlight
        px(fx - 5, seatFrontY - 13, 3, 4, 'rgba(255,255,255,0.12)');
        px(fx + 2, seatFrontY - 13, 3, 4, 'rgba(255,255,255,0.12)');

        // Socked feet kicked up at the front edge of the footrest (crossed/relaxed per room-1 & room-3!)
        pill(fx - 7, seatFrontY - 22, 5, 7, c.sockCol);
        pill(fx + 2, seatFrontY - 21, 5, 7, c.sockCol);
        // Sock toe/heel highlight
        px(fx - 5, seatFrontY - 21, 2, 2, 'rgba(255,255,255,0.28)');
        px(fx + 4, seatFrontY - 20, 2, 2, 'rgba(255,255,255,0.28)');
      }
    }

    // Draw one wide padded console armrest WITH recessed black cup holder & optional drink/prop!
    function drawConsoleArmrest(ax, ay, ah, propType) {
      const aw = 9;
      // Floor shadow under armrest
      px(ax - 1, ay + ah - 2, aw + 2, 5, 'rgba(0,0,0,0.44)');

      // Outer leather side walls (warm tan)
      roundedRect(ax, ay, aw, ah, '#8a7457', 3);
      // Plush rounded top pillow pad of armrest
      roundedRect(ax + 1, ay + 1, aw - 2, ah - 6, '#d9c8ac', 2);
      // Curved sunlit leather highlight along top & front bulge
      px(ax + 2, ay + 2, aw - 4, 6, '#f2e8d4');
      px(ax + 2, ay + ah - 12, aw - 4, 3, '#c4b090');
      // Deep front bevel crease
      px(ax + 1, ay + ah - 8, aw - 2, 2, '#6b5740');

      // Recessed BLACK CUP HOLDER RING (unmistakable movie-theater recliner cue!)
      const chY = ay + 9;
      pill(ax + 1, chY, 7, 7, '#151313');
      px(ax + 2, chY + 1, 5, 5, '#2b2725');
      px(ax + 3, chY + 2, 3, 3, '#0a0909');

      // Real drinks & props from Cherie's photos!
      if (propType === 'beerCan') {
        // Yellow beer can (room-3!)
        px(ax + 2, chY - 5, 5, 8, '#e8c432');
        px(ax + 2, chY - 5, 5, 2, '#dce2ea');
        px(ax + 3, chY - 2, 3, 3, '#c9322c');
      } else if (propType === 'redCup') {
        // Red Solo cup
        px(ax + 2, chY - 5, 5, 8, '#d42c30');
        px(ax + 2, chY - 5, 5, 1, '#f2efe8');
      } else if (propType === 'remote') {
        // White TV remote resting right next to cup holder (room-1 & room-3!)
        px(ax + 2, ay + 21, 5, 11, '#e6e4de');
        px(ax + 3, ay + 23, 3, 2, '#4a5262');
        px(ax + 3, ay + 27, 3, 3, '#98a0b0');
      } else if (propType === 'glass') {
        // Clear drink glass (room-1!)
        px(ax + 2, chY - 4, 5, 7, '#b8d4dc');
        px(ax + 3, chY - 1, 3, 3, '#e0c682');
      } else if (propType === 'gradebook') {
        // Dave's red grade book resting on his right armrest!
        roundedRect(ax - 1, ay + 17, 10, 14, '#9e1f26', 1);
        px(ax + 1, ay + 19, 6, 10, '#f4efe2');
        px(ax + 2, ay + 21, 4, 1, '#2a3448');
        px(ax + 2, ay + 24, 4, 1, '#2a3448');
        px(ax + 2, ay + 27, 3, 1, '#c9322c');
      }
    }

    // Draw the BACK of a crew member's head & shoulders SUNK DEEP into the headrest pillow!
    // STRICT RULE: Backs of heads ONLY. NO FACES anywhere!
    function drawSitterBack(c, cx, headTopY, tiltPx) {
      const hx = Math.round(cx + tiltPx);
      const hy = Math.round(headTopY);

      // Sliver of shoulders sunk BELOW the headrest rim (never perched on top!)
      roundedRect(hx - 8, hy + 13, 16, 10, c.shirtShade, 2);
      roundedRect(hx - 7, hy + 13, 14, 7, c.shirt, 2);

      // Subtle neck/collar shadow where head meets shirt
      px(hx - 3, hy + 11, 6, 3, '#b88a68');

      // Back of head silhouette (nestled INTO the headrest pillow)
      if (c.hairType === 'cap') {
        // Back of baseball cap (rounded crown + plastic snapback cutout + tiny skin/hair at nape)
        roundedRect(hx - 6, hy + 1, 12, 11, c.hairShade, 3);
        roundedRect(hx - 5, hy + 1, 10, 9, c.hair, 2);
        px(hx - 4, hy + 2, 8, 2, c.hairHi);
        // Back cap strap cutout (unmistakably back-of-head!)
        px(hx - 3, hy + 8, 6, 2, '#c89b78');
        px(hx - 3, hy + 9, 6, 1, '#12141a');
      } else if (c.hairType === 'long') {
        // Brendan: long dark hair falling PAST the shoulders over the headrest!
        roundedRect(hx - 6, hy, 12, 14, c.hair, 3);
        roundedRect(hx - 7, hy + 7, 14, 14, c.hairShade, 2);
        px(hx - 5, hy + 2, 10, 4, c.hairHi);
        px(hx - 6, hy + 9, 4, 11, c.hair);
        px(hx + 2, hy + 9, 4, 11, c.hair);
      } else if (c.hairType === 'wave') {
        // Steve: dark brown full wave
        roundedRect(hx - 6, hy, 12, 12, c.hairShade, 3);
        roundedRect(hx - 6, hy + 1, 12, 9, c.hair, 2);
        px(hx - 4, hy + 1, 8, 3, c.hairHi);
        px(hx - 5, hy + 5, 4, 2, c.hairHi);
        px(hx + 1, hy + 6, 4, 2, c.hairHi);
      } else if (c.hairType === 'buzz') {
        // Chris: close-cropped buzz cut (higher rounded skull, warm skin at nape/ears)
        roundedRect(hx - 5, hy + 2, 10, 10, '#c89974', 3);
        roundedRect(hx - 5, hy + 1, 10, 8, c.hair, 3);
        px(hx - 3, hy + 2, 6, 2, c.hairHi);
      } else if (c.hairType === 'sweep') {
        // Dave: silver sweep (back view, swept nicely across crown)
        roundedRect(hx - 6, hy, 12, 12, c.hairShade, 3);
        roundedRect(hx - 6, hy + 1, 12, 9, c.hair, 3);
        px(hx - 5, hy + 1, 9, 3, c.hairHi);
        px(hx - 4, hy + 5, 8, 2, c.hairHi);
      } else if (c.hairType === 'full') {
        // Brent: silver full hair
        roundedRect(hx - 6, hy, 12, 12, c.hairShade, 3);
        roundedRect(hx - 6, hy + 1, 12, 10, c.hair, 2);
        px(hx - 5, hy + 1, 10, 3, c.hairHi);
      } else {
        // Neat crop (Sudz light-brown, Brad light auburn)
        roundedRect(hx - 6, hy + 1, 12, 11, c.hairShade, 3);
        roundedRect(hx - 5, hy + 1, 10, 9, c.hair, 2);
        px(hx - 4, hy + 2, 8, 2, c.hairHi);
      }

      // Ears peeking subtly on sides (back-of-head cue)
      px(hx - 7, hy + 6, 1, 3, '#c89974');
      px(hx + 6, hy + 6, 1, 3, '#c89974');
    }

    // Draw ONE sculpted, plush, overstuffed cream-tan leather movie-theater recliner from behind!
    function drawPlushRecliner(g, c, idx) {
      const { cx, topY, seatW, backH, tilt } = g;
      const leftX = Math.round(cx - seatW / 2);

      // 1. Deep floor shadow underneath reclined shell (grounding weight!)
      px(leftX - 1, topY + backH - 3, seatW + 2, 10, 'rgba(0,0,0,0.52)');

      // 2. Side wing bolsters (wide puffy cheeks framing the sitter's shoulders!)
      roundedRect(leftX, topY + 6, seatW, backH - 8, '#8a7458', 4);
      roundedRect(leftX + 1, topY + 7, seatW - 2, backH - 11, '#c9b698', 3);

      // 3. TOP PILLOW HEADREST ROLL (soft curved dome leaning back, with dimple where head sinks in!)
      // Outer pillow roll
      roundedRect(leftX + 1, topY + 2, seatW - 2, 20, '#998365', 5);
      roundedRect(leftX + 2, topY + 3, seatW - 4, 17, '#e2d3b8', 4);
      // Sunlit TV-glow leather crest along top curve of headrest
      px(leftX + 4, topY + 3, seatW - 8, 3, '#f4ead6');
      // Soft concave indent shadow right behind where the head nestles!
      roundedRect(leftX + 5, topY + 7, seatW - 10, 11, '#c4b090', 3);

      // 4. Draw the SITTER SUNK INTO THE HEADREST (head nestled down into the cushion, shoulders tucked!)
      drawSitterBack(c, cx, topY + 4, tilt);

      // 5. LOWER / MID RECLINED BACKREST SHELL (overstuffed, curved plush leather pillow!)
      // Because the recliner is LEANED BACK toward us, the thick lower back pillow billows out behind the sitter's shoulders!
      const midY = topY + 23;
      const midH = 26;
      // Deep stitched horizontal seam between headrest and lumbar pillow
      px(leftX + 3, midY - 1, seatW - 6, 2, '#5e4934');

      // Plump bulging lumbar pillow with true rounded leather billow
      roundedRect(leftX - 1, midY + 1, seatW + 2, midH, '#786248', 4);
      roundedRect(leftX, midY + 2, seatW, midH - 3, '#d7c6aa', 4);
      // Curved upper specular roll (narrower than full width so it reads as a rounded 3D pillow, not a flat bar!)
      roundedRect(leftX + 3, midY + 3, seatW - 6, 6, '#f2e8d4', 2);
      // Soft pillow side bolsters curving inward
      px(leftX + 1, midY + 5, 2, midH - 10, '#c0aa8a');
      px(leftX + seatW - 3, midY + 5, 2, midH - 10, '#c0aa8a');
      // Center vertical leather tuft dimple
      px(cx - 1, midY + 9, 2, midH - 14, '#a89272');
      px(cx - 2, midY + 11, 1, 6, '#c2ad8e');
      // Lower shadow under bulging lumbar roll
      px(leftX + 3, midY + midH - 4, seatW - 6, 3, '#8f785c');

      // 6. RECLINED LOWER BACK SKIRT / BASE (angled wider at the bottom as the chair leans back!)
      const baseY = midY + midH - 1;
      const baseH = 20;
      px(leftX + 2, baseY, seatW - 4, 2, '#564430');
      roundedRect(leftX - 1, baseY + 2, seatW + 2, baseH, '#69553e', 3);
      roundedRect(leftX, baseY + 3, seatW, baseH - 4, '#bfa989', 2);
      roundedRect(leftX + 3, baseY + 4, seatW - 6, 4, '#dac9ac', 1);
      // Dark mechanical recliner rail peek at very bottom
      px(leftX + 4, baseY + baseH - 2, seatW - 8, 3, '#1e1b18');

      // 7. Outer-end angled recliner side profile (on Sudz left & Dave right so the 28-deg recline angle is 100% unmistakable!)
      if (idx === 0) {
        // Leftmost outer leather flank sloping back toward the viewer
        px(leftX - 4, topY + 16, 4, 48, '#8a7458');
        px(leftX - 3, topY + 18, 3, 42, '#cbb89a');
        px(leftX - 3, topY + 18, 2, 14, '#e6d8be');
      } else if (idx === CREW.length - 1) {
        // Rightmost outer leather flank sloping back
        px(leftX + seatW, topY + 16, 4, 48, '#8a7458');
        px(leftX + seatW, topY + 18, 3, 42, '#cbb89a');
        px(leftX + seatW + 1, topY + 18, 2, 14, '#e6d8be');
      }
    }

    function drawReclinerRow() {
      // Gentle theater arc: outer seats sit slightly lower/closer & angled inward toward the TVs!
      const marginX = 6;
      const usableW = W - marginX * 2;
      const step = usableW / CREW.length; // ~27.5px per seat

      const seatGeom = CREW.map((_, i) => {
        const norm = (i - 4) / 4; // -1 (left) .. 0 (center) .. +1 (right)
        const arcDrop = Math.round(norm * norm * 10); // gentle curved theater arc
        return {
          cx: Math.round(marginX + step * (i + 0.5)),
          topY: 332 + arcDrop,
          seatW: 24,
          backH: 68,
          tilt: Math.round(-norm * 1.5),
        };
      });

      // 1. Extended reclined footrests & stretched-out socked feet FIRST (ahead of chairs toward TVs!)
      drawExtendedFootrests(seatGeom);

      // 2. Draw all 9 sculpted plush recliners + sunk crew sitters
      for (let i = 0; i < CREW.length; i++) {
        drawPlushRecliner(seatGeom[i], CREW[i], i);
      }

      // 3. Wide padded console armrests with black cup-holder rings BETWEEN seats + outer ends!
      const armProps = {
        0: 'glass',      // far left of Sudz
        2: 'beerCan',    // between Scott & Brent
        4: 'remote',     // between Brian & Steve
        6: 'redCup',     // between Chris & Brad
        9: 'gradebook',  // Dave's right armrest: his red grade book!
      };
      for (let a = 0; a <= CREW.length; a++) {
        const ax = a === 0
          ? seatGeom[0].cx - 16
          : a === CREW.length
            ? seatGeom[CREW.length - 1].cx + 8
            : Math.round((seatGeom[a - 1].cx + seatGeom[a].cx) / 2 - 4);
        const refY = a === 0
          ? seatGeom[0].topY
          : a === CREW.length
            ? seatGeom[CREW.length - 1].topY
            : Math.min(seatGeom[a - 1].topY, seatGeom[a].topY);
        drawConsoleArmrest(ax, refY + 28, 42, armProps[a] || null);
      }

      // 4. Lazy arms/elbows draped forward onto the padded armrests + controllers at the side
      const armDrape = [0, 2, 4, 6];
      for (const idx of armDrape) {
        const g = seatGeom[idx];
        const c = CREW[idx];
        // Sleeve & forearm resting lazily on the upper armrest pad
        px(g.cx + 10, g.topY + 24, 4, 8, c.shirt);
        px(g.cx + 10, g.topY + 22, 4, 3, '#d1a27e'); // hand resting forward near cup holder
        // Tiny retro controller held at the side on Brent & Brad
        if (idx === 2 || idx === 6) {
          px(g.cx + 9, g.topY + 19, 6, 3, '#222630');
          px(g.cx + 13, g.topY + 20, 1, 1, '#ff3b3b');
        }
      }
    }

    function drawFooterOverlay(time, tapFlash) {
      const fy = 436;
      // Clean dark gradient band at bottom so roster & CTA pop cleanly
      const g = ctx.createLinearGradient(0, fy - 12, 0, H);
      g.addColorStop(0, 'rgba(6, 6, 14, 0)');
      g.addColorStop(0.22, 'rgba(6, 6, 14, 0.88)');
      g.addColorStop(1, 'rgba(4, 4, 10, 0.98)');
      ctx.fillStyle = g;
      ctx.fillRect(0, fy - 12, W, H - fy + 12);

      // videogamecritic.com styled UNLOCKS / FAVORITES button (matching shell identity)
      const bx = 40;
      const by = 446;
      const bw = 180;
      const bh = 22;
      px(bx, by, bw, 2, '#90ee90');
      px(bx, by + 2, bw, bh - 2, '#000080');
      ctx.strokeStyle = '#3846a8';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 2.5, bw - 1, bh - 3);
      ctx.font = 'bold 9px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('★ UNLOCKS · FAVORITES', W / 2, by + 13);

      // Crew seating roster matching exact left-to-right order
      ctx.font = 'bold 7.5px "Courier New", monospace';
      ctx.fillStyle = '#d4cbb8';
      ctx.fillText('SUDZ · SCOTT · BRENT · BRIAN · STEVE', W / 2, 482);
      ctx.fillText('CHRIS · BRAD · BRENDAN · DAVE', W / 2, 493);

      // Tagline in VGC link-green
      ctx.font = 'bold 8.5px "Courier New", monospace';
      ctx.fillStyle = '#90ee90';
      ctx.fillText('8 ROUNDS · 4 BEERS · ONE VERDICT', W / 2, 511);

      // Pulsing TAP TO START prompt
      const pulse = 0.65 + 0.35 * Math.sin(time * 4.5);
      ctx.save();
      ctx.globalAlpha = tapFlash > 0 ? 1 : pulse;
      ctx.font = 'bold 10px "Courier New", monospace';
      ctx.fillStyle = tapFlash > 0 ? '#90ee90' : '#ffcf48';
      ctx.fillText(tapFlash > 0 ? '★ STARTING GAME NIGHT! ★' : 'TAP TO START', W / 2, 531);
      ctx.restore();

      // Honest step-one room study note
      ctx.font = 'bold 6.5px "Courier New", monospace';
      ctx.fillStyle = 'rgba(180, 190, 215, 0.55)';
      ctx.fillText('STEP ONE — ROOM STUDY (NEON)', W / 2, 550);
    }

    let time = 0;
    let tapFlash = 0;
    let toastTimer = null;

    function render() {
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, W, H);
      drawMasthead(time);
      drawRoomArchitecture(time);
      drawTvWall(time);
      drawCoffeeTableAndRig(time);
      drawReclinerRow();
      drawFooterOverlay(time, tapFlash);

      // Brief arcade acknowledge flash on tap
      if (tapFlash > 0) {
        ctx.fillStyle = `rgba(144, 238, 144, ${tapFlash * 0.22})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function triggerTap() {
      unlockAudio();
      playStartChime();
      tapFlash = 1.0;
      tapToast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => tapToast.classList.remove('show'), 2200);
    }

    btnSfx.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      unlockAudio();
      muted = !muted;
      btnSfx.textContent = muted ? 'OFF' : 'SFX';
    });

    phoneFrame.addEventListener('pointerdown', (e) => {
      if (e.target === btnSfx) return;
      e.preventDefault();
      triggerTap();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        triggerTap();
      }
    });

    let lastTs = performance.now();
    function loop(ts) {
      const dt = Math.min((ts - lastTs) / 1000, 0.05);
      lastTs = ts;
      time += dt;
      if (tapFlash > 0) tapFlash = Math.max(0, tapFlash - dt * 2.2);
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    window.__roomStudy = {
      renderAt: (t = 1.2) => {
        time = t;
        tapFlash = 0;
        render();
      },
      tap: () => {
        triggerTap();
        render();
      },
      crewOrder: () => CREW.map((c) => c.name),
    };
  </script>
</body>
</html>
