<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Game Night at Dave's</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000000;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:Verdana,"Courier New",monospace;}
  /* shell harmonized with videogamecritic.com (his own CSS, fetched
     2026-11-22): black starfield, navy #000080 panels, link-green #90ee90,
     white/#dddddd Verdana text */
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000000;
    background-image:radial-gradient(1px 1px at 20px 30px,#ffffff 50%,transparent 51%),radial-gradient(1px 1px at 70px 90px,#aaaaFF 50%,transparent 51%),radial-gradient(1.5px 1.5px at 120px 50px,#dddddd 50%,transparent 51%);
    background-size:150px 120px;}
  #siteBar{font-family:Verdana,sans-serif;font-size:12px;color:#dddddd;padding:7px 0 3px;letter-spacing:.4px;}
  #siteBar a{color:#90ee90;font-weight:bold;text-decoration:none;}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;background:#241610;
    /* fit ANY container (standalone page or someone else's iframe): scale to
       the smaller dimension, aspect locked, never overflow (30px reserved
       for the siteBar above) */
    width:min(100vw,calc((100vh - 30px) * 390 / 844));height:auto;aspect-ratio:390 / 844;max-width:100vw;max-height:100vh;}
  #muteBtn{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:1200;
    width:44px;height:44px;border-radius:10px;border:2px solid #000080;background:rgba(0,0,60,.92);
    color:#90ee90;font-size:21px;line-height:1;cursor:pointer;padding:0;}
  #errBox{position:fixed;inset:0;z-index:1300;display:none;align-items:center;justify-content:center;
    background:rgba(10,6,4,.94);color:#ffe9c4;text-align:center;padding:24px;}
  #errBox .card{max-width:320px;border:3px solid #b3543f;padding:20px;background:#241610;}
  #errBox button{margin-top:14px;font:inherit;font-weight:bold;background:#ffd98a;color:#241610;
    border:2px solid #0d0906;padding:10px 18px;cursor:pointer;}

<body>
<div id="wrap"><div id="siteBar">presented by <a href="https://videogamecritic.com" target="_blank" rel="noopener">videogamecritic.com</a></div><canvas id="cv" width="390" height="844"></canvas></div>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<div id="errBox"><div class="card"><div style="font-size:20px;font-weight:bold;">TAPE EJECTED</div>
<div style="margin-top:10px;">Something glitched in the game room.<br>No save files were harmed.</div>
<button onclick="location.reload()">REWIND &amp; RELOAD</button></div></div>
<script>
"use strict";
window.addEventListener("error",function(){var b=document.getElementById("errBox");if(b)b.style.display="flex";});

/* ============================== UTILS ============================== */
var W=390,H=844;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function mulberry32(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function qs(name){var m=new RegExp("[?&]"+name+"=([^&]*)").exec(location.search);return m?decodeURIComponent(m[1]):null;}
function shuffle(arr,rng){for(var i=arr.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}

/* ============================== AUDIO ============================== */
var Audio8={
  ctx:null,master:null,muted:false,musicTimer:null,musicStep:0,
  init:function(){
    if(this.ctx)return;
    try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    var c=this.ctx=new AC();
    var comp=c.createDynamicsCompressor();
    comp.threshold.value=-14; comp.knee.value=22; comp.ratio.value=10;
    this.master=c.createGain(); this.master.gain.value=this.muted?0:0.5;
    this.master.connect(comp); comp.connect(c.destination);
    // silent buffer unlock
    var buf=c.createBuffer(1,1,c.sampleRate),src=c.createBufferSource();
    src.buffer=buf; src.connect(this.master); src.start(0);
    try{ this.muted=localStorage.getItem("gnd_mute")==="1"; this.applyMute(); }catch(e){}
    this.startMusic();
  },
  resume:function(){ if(this.ctx&&this.ctx.state==="suspended") this.ctx.resume(); },
  applyMute:function(){ if(this.master) this.master.gain.value=this.muted?0:0.5;
    var b=document.getElementById("muteBtn"); if(b)b.textContent=this.muted?"🔇":"🔊";
    if(this.muted&&typeof Voice!=="undefined")Voice.stop(); },
  toggleMute:function(){ this.init(); this.muted=!this.muted;
    try{ localStorage.setItem("gnd_mute",this.muted?"1":"0"); }catch(e){}
    this.applyMute(); },
  tone:function(freq,dur,type,vol,delay,slideTo){
    if(!this.ctx||this.muted)return;
    var c=this.ctx,t=c.currentTime+(delay||0);
    var o=c.createOscillator(),g=c.createGain();
    o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
    g.gain.setValueAtTime(vol||0.16,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02);
  },
  noise:function(dur,vol,delay){
    if(!this.ctx||this.muted)return;
    var c=this.ctx,t=c.currentTime+(delay||0);
    var len=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    var s=c.createBufferSource(); s.buffer=buf;
    var f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900; f.Q.value=0.8;
    var g=c.createGain(); g.gain.value=vol||0.2;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  shout:function(){ // distant "PHLEGM!!" — detuned saws through a bandpass sweep
    if(!this.ctx||this.muted)return;
    var c=this.ctx,t=c.currentTime;
    var f=c.createBiquadFilter(); f.type="bandpass"; f.Q.value=2.2;
    f.frequency.setValueAtTime(500,t); f.frequency.linearRampToValueAtTime(1100,t+0.12);
    f.frequency.linearRampToValueAtTime(420,t+0.34);
    var g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.22,t+0.05); g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    f.connect(g); g.connect(this.master);
    [196,207].forEach(function(fr){var o=c.createOscillator();o.type="sawtooth";o.frequency.value=fr;o.connect(f);o.start(t);o.stop(t+0.42);});
  },
  jingleWin:function(){ var n=[523,659,784,1047]; for(var i=0;i<n.length;i++)this.tone(n[i],0.11,"square",0.15,i*0.07); },
  jingleLose:function(){ this.tone(220,0.16,"sawtooth",0.14,0,160); this.tone(160,0.24,"sawtooth",0.14,0.13,90); },
  jingleComedy:function(){ this.tone(880,0.09,"square",0.15,0,1320); this.tone(1174,0.14,"square",0.15,0.1,1568); },
  startMusic:function(){
    if(this.musicTimer||!this.ctx)return;
    var bass=[110,0,110,0,131,0,110,0,98,0,98,0,147,0,165,0];
    var lead=[440,0,523,0,659,0,523,0,587,0,523,0,440,0,0,0];
    var self=this;
    this.musicTimer=setInterval(function(){
      if(self.muted||!Shell||(Shell.state!=="TITLE"&&Shell.state!=="REVIEW"))return;
      var s=self.musicStep%16;
      if(bass[s])self.tone(bass[s],0.14,"triangle",0.20,0);
      if(lead[s])self.tone(lead[s],0.10,"square",0.05,0);
      self.musicStep++;
    },132);
  },
  sig:function(id){ // per-microgame 3-note signature
    var map={sudz:[392,523,659],scott:[330,330,262],brent:[262,330,392],brad:[523,392,784],
             brian:[262,330,262],steve:[349,440,523],chris:[587,587,440],brendan:[196,233,196]};
    var n=map[id]||[440,440,440];
    for(var i=0;i<n.length;i++)this.tone(n[i],0.09,"square",0.13,i*0.06);
  }
};

/* ============================== VOICES ==============================
   BLIP TALK, old-Nintendo style: NO recorded audio at all.
   When a card's line appears, Voice.play(id) "speaks" it as rapid
   pitched SYLLABLE blips — Animalese / Banjo-Kazooie babble at natural
   speech cadence, synced to the text — at the speaking character's
   pitch profile (VOICE_PROFILES below; the same map is published in
   the README for the parallel module lanes). Blips are plain WebAudio
   oscillators routed through Audio8.master, so the mute toggle
   silences them, and the iOS gesture-unlock chain covers startup. */
var LINES={"intro_sudz":["sudz","What team am I, blue or phlegm?"],"intro_scott":["scott","Set down the controller and sip your beer."],"intro_brent":["brent","He's lining up from 80 yards!"],"intro_brian":["brian","That little shit keeps grabbing my balls!!"],"intro_steve":["steve","This game is beer friendly."],"intro_chris":["chris","Put the Rams video on. Loop it."],"intro_brad":["brad","OP Brad, reporting for duty."],"intro_brendan":["brendan","How much did you pay for this?"],"brad_ext":["brad","Okay, just two more times!"],"brian_ohh":["brian","Ooooh!"],"r_sudz_win":["sudz","PHLEGM!"],"r_sudz_burn":["dave","Medical finger burn."],"r_sudz_slow":["dave","Too slow."],"r_scott_win":["scott","I don't care if I live or die."],"r_scott_lose":["dave","You played."],"r_brent_good":["dave","It's good!"],"r_brent_crotch":["dave","Choir Boy Promotion."],"r_brent_miss":["dave","Wide."],"r_brent_never":["dave","Never kicked."],"r_brad_win":["dave","Wave cleared!"],"r_brad_overrun":["dave","Overrun!"],"r_brad_remain":["dave","The demons remain."],"r_brian_win":["dave","Still holding."],"r_brian_lose":["dave","Grabbed 'em all."],"r_steve_win":["dave","Maze generated!"],"r_steve_lose":["dave","A mug sat empty."],"r_chris_win":["dave","The loop lives."],"r_chris_lose":["dave","The loop died."],"r_brendan_win":["dave","Spot on."],"r_brendan_lose":["dave","Way off."],"say_a":["dave","Chicken, fight like a robot!"],"say_b":["dave","Work with me here!"],"say_c":["dave","If I wanted to watch a movie, I'd go to Blockbuster."],"say_d":["dave","Made me physically ill."],"say_f":["dave","You'll get more enjoyment out of making fun of this game than actually playing it."],"grade_Ap":["dave","Dave gives you an A plus."],"grade_A":["dave","Dave gives you an A."],"grade_Am":["dave","Dave gives you an A minus."],"grade_Bp":["dave","Dave gives you a B plus."],"grade_B":["dave","Dave gives you a B."],"grade_Bm":["dave","Dave gives you a B minus."],"grade_Cp":["dave","Dave gives you a C plus."],"grade_C":["dave","Dave gives you a C."],"grade_Cm":["dave","Dave gives you a C minus."],"grade_Dp":["dave","Dave gives you a D plus."],"grade_D":["dave","Dave gives you a D."],"grade_Dm":["dave","Dave gives you a D minus."],"grade_Fp":["dave","Dave gives you an F plus."],"grade_F":["dave","Dave gives you an F."],"grade_Fm":["dave","Dave gives you an F minus."]};
var VOICE_PROFILES={
  dave:   {pitch:110, rate:0.85, wave:"square",   wobble:2},
  sudz:   {pitch:230, rate:1.55, wave:"square",   wobble:6},
  scott:  {pitch:150, rate:0.95, wave:"triangle", wobble:0},
  brent:  {pitch:132, rate:1.05, wave:"square",   wobble:3},
  brian:  {pitch:196, rate:1.15, wave:"triangle", wobble:5},
  steve:  {pitch:165, rate:1.00, wave:"sawtooth", wobble:2},
  chris:  {pitch:140, rate:1.25, wave:"square",   wobble:3},
  brad:   {pitch:175, rate:1.35, wave:"triangle", wobble:4},
  brendan:{pitch:118, rate:0.90, wave:"sawtooth", wobble:3}
};
var Voice={
  nodes:[], blips:0,
  /* BLIP TALK — Nintendo voice babble (Animalese / Banjo-Kazooie /
     Mario Party chatter). One short pitched blip per SYLLABLE, at
     natural speech cadence, synced to the card's text. Inflection:
     pitch RISES at a question, DIPS at a sentence end, phrase ends
     sag a little, ALL-CAPS words jump up for emphasis, and each
     syllable's pitch jitters deterministically so no two lines sound
     looped. Every blip is a WebAudio oscillator through
     Audio8.master — the mute toggle silences them, and the iOS
     gesture-unlock chain covers startup. No audio assets, ever. */
  syllables:function(word){
    var w=(word||"").toLowerCase().replace(/[^a-z]/g,"");
    if(!w)return 0;
    var n=0, prev=false, i, v;
    for(i=0;i<w.length;i++){
      v="aeiouy".indexOf(w[i])>=0;
      if(v&&!prev)n++;
      prev=v;
    }
    if(w.length>2&&w.charAt(w.length-1)==="e"&&n>1)n--; // silent e
    return Math.max(1,n);
  },
  pattern:function(text,p){
    var iv=0.078/p.rate, t=0, out=[];
    var words=(text||"").split(/\s+/), wi, si;
    for(wi=0;wi<words.length;wi++){
      var word=words[wi]; if(!word)continue;
      var syl=this.syllables(word); if(!syl)continue;
      var letters=word.replace(/[^A-Za-z]/g,"");
      var caps=letters.length>1&&letters===letters.toUpperCase();
      var lastCh=word.charAt(word.length-1);
      var sentEnd=(lastCh==="."||lastCh==="!"||lastCh==="?")&&wi===words.length-1;
      var phraseEnd=(lastCh===","||lastCh===";"||lastCh===":");
      for(si=0;si<syl;si++){
        var jit=((wi*7+si*13)%5-2)*0.03;         // deterministic jitter
        var m=1+jit+((si%2)?0.02:-0.01);         // gentle up-down babble
        if(caps)m*=1.15;                          // emphasis jump — a shout
                                                  // keeps its jump (no end dip)
        else if(sentEnd&&si===syl-1)m*=(lastCh==="?")?1.22:0.82; // rise / dip
        else if(phraseEnd&&si===syl-1)m*=0.94;    // phrase-end sag
        out.push([t,iv*0.62,m]);
        t+=iv;
      }
      t+=iv*0.45;                                 // word gap
      if(phraseEnd)t+=iv*0.8;
      if(sentEnd)t+=iv*1.2;
    }
    return out;
  },
  play:function(id){
    if(Audio8.muted)return;
    var L=LINES[id]; if(!L)return;
    Audio8.init(); Audio8.resume();
    this.stop();
    if(!Audio8.ctx||!Audio8.master)return;
    var p=VOICE_PROFILES[L[0]]||VOICE_PROFILES.dave;
    var pat=this.pattern(L[1],p), t0=Audio8.ctx.currentTime+0.03, i;
    for(i=0;i<pat.length;i++){
      if(pat[i][0]>4.2)break;
      var wob=1+((i%2)?1:-1)*(p.wobble/200);
      this._blip(t0+pat[i][0],pat[i][1],p.pitch*pat[i][2]*wob,p.wave);
    }
  },
  _blip:function(t,dur,freq,wave){
    var ctx=Audio8.ctx;
    var o=ctx.createOscillator(), gn=ctx.createGain();
    o.type=wave;
    o.frequency.setValueAtTime(freq*1.06,t);
    o.frequency.exponentialRampToValueAtTime(freq*0.88,t+dur);
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.exponentialRampToValueAtTime(0.055,t+0.008);
    gn.gain.setValueAtTime(0.055,t+Math.max(0.008,dur-0.012));
    gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(gn); gn.connect(Audio8.master);
    o.start(t); o.stop(t+dur+0.02);
    this.nodes.push(o); this.blips++;
  },
  stop:function(){
    for(var i=0;i<this.nodes.length;i++){ try{this.nodes[i].stop();}catch(e){} }
    this.nodes.length=0;
  }
};

/* ============================== INPUT ============================== */
var Input={
  x:0,y:0,down:false,px:0,py:0, // pointer pos / prev pos
  moved:0,                       // distance moved this frame while down
  path:[],                       // recent {x,y,t} while down (for rub analysis)
  tapEdge:false,releaseEdge:false,
  keys:{},keyEdge:{},keyUpEdge:{},
  sipEdge:false,                 // set by beer-button hit or B key
  resetFrame:function(){ this.moved=0; this.tapEdge=false; this.releaseEdge=false; this.sipEdge=false; this.keyEdge={}; this.keyUpEdge={}; }
};
function canvasPos(evt){
  var r=cv.getBoundingClientRect();
  var cx=(evt.touches&&evt.touches.length)?evt.touches[0].clientX:evt.clientX;
  var cy=(evt.touches&&evt.touches.length)?evt.touches[0].clientY:evt.clientY;
  return {x:(cx-r.left)*(W/r.width), y:(cy-r.top)*(H/r.height)};
}
var cv=document.getElementById("cv");
cv.setAttribute("tabindex","0"); cv.style.outline="none"; // keyboard focus lives here when embedded
function ptrDown(e){
  Audio8.init(); Audio8.resume();
  try{ cv.focus({preventScroll:true}); }catch(_){ } // grab keyboard focus on interaction (iframe-safe)
  var p=canvasPos(e);
  Input.x=p.x; Input.y=p.y; Input.px=p.x; Input.py=p.y;
  Input.down=true; Input.tapEdge=true; Input.path=[{x:p.x,y:p.y,t:performance.now()}];
  if(Shell)Shell.onTap(p.x,p.y);
  if(e.cancelable)e.preventDefault();
}
function ptrMove(e){
  var p=canvasPos(e);
  if(Input.down){ Input.moved+=Math.hypot(p.x-Input.x,p.y-Input.y);
    Input.path.push({x:p.x,y:p.y,t:performance.now()});
    if(Input.path.length>90)Input.path.shift(); }
  Input.px=Input.x; Input.py=Input.y; Input.x=p.x; Input.y=p.y;
  if(e.cancelable)e.preventDefault();
}
function ptrUp(e){
  Input.down=false; Input.releaseEdge=true; Input.path.length=0;
  if(e.cancelable)e.preventDefault();
}
cv.addEventListener("pointerdown",ptrDown);
cv.addEventListener("pointermove",ptrMove);
window.addEventListener("pointerup",ptrUp);
window.addEventListener("pointercancel",ptrUp);
document.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
document.addEventListener("dblclick",function(e){e.preventDefault();});
window.addEventListener("keydown",function(e){
  Audio8.init(); Audio8.resume();
  if(!Input.keys[e.code])Input.keyEdge[e.code]=true;
  Input.keys[e.code]=true;
  if(e.code==="KeyB")Input.sipEdge=true;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].indexOf(e.code)>=0)e.preventDefault();
  if(Shell)Shell.onKey(e.code);
});
window.addEventListener("keyup",function(e){ Input.keys[e.code]=false; Input.keyUpEdge[e.code]=true; });
document.addEventListener("visibilitychange",function(){
  if(!document.hidden)Audio8.resume();
  if(Shell)Shell.onVisibility(document.hidden);
});
document.getElementById("muteBtn").addEventListener("click",function(e){ e.stopPropagation(); Audio8.toggleMute(); });
try{ if(localStorage.getItem("gnd_mute")==="1"){ Audio8.muted=true; Audio8.applyMute(); } }catch(e){}


/* ============================== ART ============================== */
var g=cv.getContext("2d");
g.imageSmoothingEnabled=false;
function R(x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function T(txt,x,y,size,c,align,weight){
  g.font=(weight||"bold")+" "+size+"px 'Courier New',monospace";
  g.textAlign=align||"left"; g.textBaseline="top";
  g.fillStyle="#0d0906"; g.fillText(txt,x+2,y+2);
  g.fillStyle=c; g.fillText(txt,x,y);
}
function Tplain(txt,x,y,size,c,align){
  g.font="bold "+size+"px 'Courier New',monospace";
  g.textAlign=align||"left"; g.textBaseline="top"; g.fillStyle=c; g.fillText(txt,x,y);
}
/* chunky pixel rect on a 3px grid, local coords */
function PX(ctx,x,y,w,h,c){ ctx.g.fillStyle=c; ctx.g.fillRect(ctx.x+Math.round(x)*3,ctx.y+Math.round(y)*3,Math.round(w)*3,Math.round(h)*3); }

var CREW={
  dave:  {name:"DAVE",  icon:"📼", shirt:"#3a5f8a", shirtD:"#2b4767", pants:"#4a3b2c", skin:"#e8b48c", hair:"#6e6e6e", hairStyle:"flat",  color:"#ffd98a"},
  sudz:  {name:"SUDZ",  icon:"🩸", shirt:"#c0392b", shirtD:"#8f2a1f", pants:"#333a44", skin:"#d99e6a", hair:"#2b2b2b", hairStyle:"spiky", color:"#ff7a6b"},
  scott: {name:"SCOTT", icon:"🍺", shirt:"#d9903a", shirtD:"#a86c28", pants:"#5a4632", skin:"#e8b48c", hair:"#7a4a22", hairStyle:"cap",   color:"#ffb84d"},
  brent: {name:"BRENT", icon:"🏈", shirt:"#3f9e4d", shirtD:"#2e7539", pants:"#e8e4da", skin:"#c98a5a", hair:"#1d1d1d", hairStyle:"flat",  color:"#7ddb8a"},
  brian: {name:"BRIAN", icon:"🤕", shirt:"#e8e4da", shirtD:"#bdb8ac", pants:"#3c4654", skin:"#eec39c", hair:"#4a3220", hairStyle:"bandage",color:"#ffffff"},

function wrapText(txt,x,y,size,c,maxW,lineH){
  g.font="bold "+size+"px 'Courier New',monospace"; g.textAlign="left"; g.textBaseline="top";
  var words=txt.split(" "),lines=[],cur="";
  for(var i=0;i<words.length;i++){
    var t=cur?cur+" "+words[i]:words[i];
    if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=words[i];}else cur=t;
  }
  if(cur)lines.push(cur);
  for(var j=0;j<lines.length;j++){ g.fillStyle="#0d0906"; g.fillText(lines[j],x+2,y+j*lineH+2); g.fillStyle=c; g.fillText(lines[j],x,y+j*lineH); }
  return lines.length;
}

}

}

var GRADES=["A+","A","A-","B+","B","B-","C+","C","C-","D+","D","D-","F+","F","F-"];
function computeGrade(){
  var played=Shell.results.length; if(!played)return "F-";
  var wins=0,i; for(i=0;i<played;i++)if(Shell.results[i].win)wins++;
  var perf=clamp(wins/played+0.03*Shell.bestStreak,0,1);
  var idx=Math.round((1-perf)*(GRADES.length-1));
  return GRADES[clamp(idx,0,GRADES.length-1)];
}
var FRIEND_LINES={
  brad:{best:"Your paddle work would make Brad proud.",worst:"Brad is still shouting for two more times."},
  sudz:{best:"Sudz respects the finger burn.",worst:"Sudz's finger outlasted yours."},
  scott:{best:"You sipped like a pro while the opponent beat himself.",worst:"Scott drank alone."},
  brent:{best:"Brent is still talking about that kick.",worst:"Brent's kick is still sailing somewhere."},
  brian:{best:"Brian kept every ball accounted for. A first.",worst:"Brian is icing something again."},
  steve:{best:"Every mug stayed full. Steve is emotional.",worst:"Steve is still waiting for that beer."},
  chris:{best:"The loop never died. Chris is at peace.",worst:"The loop died on your watch. Everyone heard the beeps."},
  brendan:{best:"Brendan couldn't heckle a single price. Silenced.",worst:"Brendan is still asking what you paid."}
};
function buildReview(){
  var grade=computeGrade();
  var band=grade.charAt(0);
  var opener={A:"A masterclass in game-night survival.",
    B:"A solid night on the couch.",
    C:"An uneven night, but the couch has seen worse.",
    D:"The crew is being polite. Barely.",
    F:"A catastrophe of historic proportions."}[band];
  var closer={A:"Chicken, fight like a robot!",
    B:"Work with me here!",
    C:"If I wanted to watch a movie I'd go to Blockbuster.",
    D:"Made me physically ill.",
    F:"You'll get more enjoyment out of making fun of this game than actually playing it."}[band];
  // best / worst friend from results
  var byFriend={},i,r;
  for(i=0;i<Shell.results.length;i++){ r=Shell.results[i];
    if(!byFriend[r.id])byFriend[r.id]={w:0,l:0};
    if(r.win)byFriend[r.id].w++; else byFriend[r.id].l++; }
  var best=null,worst=null;
  for(var id in byFriend){ if(byFriend[id].w>0&&(!best||byFriend[id].w>byFriend[best].w))best=id;
    if(byFriend[id].l>0&&(!worst||byFriend[id].l>byFriend[worst].l))worst=id; }
  var mid=[];
  if(best)mid.push(FRIEND_LINES[best].best);
  if(worst&&worst!==best)mid.push(FRIEND_LINES[worst].worst);
  if(!mid.length)mid.push("The crew has no notes. Suspicious.");

var Shell={
  state:"TITLE", mod:null, modState:null,

  round:0, totalRounds:8, order:[], results:[],
  timeLeft:0, timeTotal:6, speed:1,
  stateT:0, react:null, review:null, inter:null,
  rng:mulberry32(1), paused:false,
  bestScore:0, bestGrade:"",
  streakMult:function(){ return this.streak>=4?4:this.streak>=3?3:this.streak>=2?2:1; },
  init:function(){
    var seed=qs("seed"); this.seedBase=(seed!==null&&seed!=="")?(parseInt(seed,10)||0):(Date.now()%100000);
    try{ this.bestScore=parseInt(localStorage.getItem("gnd_best_score")||"0",10)||0;
         this.bestGrade=localStorage.getItem("gnd_best_grade")||""; }catch(e){}
  },
  startRun:function(firstId){
    this.rng=mulberry32(this.seedBase);
    var ids=["sudz","scott","brent","brian","steve","chris","brad","brendan"];
    this.order=shuffle(ids.slice(),this.rng);
    if(firstId){ var i=this.order.indexOf(firstId); if(i>0){ this.order.splice(i,1); this.order.unshift(firstId); } }
    this.score=0; this.streak=0; this.bestStreak=0; this.beers=4;
    this.round=0; this.results=[]; this.review=null;
    this.nextIntro();
  },
  nextIntro:function(){
    if(this.round>=this.totalRounds||this.beers<=0){ this.toReview(); return; }
    var id=this.order[this.round];
    this.mod=MODULES[id];
    this.speed=Math.min(1.16,1+0.08*Math.floor(this.round/4));
    this.state="INTRO"; this.stateT=2.0;
    Audio8.sig(id);
    Voice.play("intro_"+id);
  },
  startPlay:function(){
    var m=this.mod;
    this.timeTotal=Math.max(6.5,8-0.5*Math.floor(this.round/4));
    this.timeLeft=this.timeTotal;
    this.modState=m.create(this);
    this.state="PLAY";
  },
  endRound:function(win,opts){
    opts=opts||{};
    var m=this.mod, pts=0;
    if(win){
      this.streak++; if(this.streak>this.bestStreak)this.bestStreak=this.streak;
      if(opts.comedy){ pts=0; }
      else { pts=Math.round(1000*this.streakMult()+ (this.timeTotal>0? (this.timeLeft/this.timeTotal)*500:0)) + (opts.bonus||0); }
    } else {
      this.streak=0; this.beers--; pts=opts.bonus||0;
    }
    this.score+=pts;
    this.results.push({id:m.id,win:win,comedy:!!opts.comedy,points:pts});
    if(this.modState&&this.modState.onEnd)this.modState.onEnd();
    var rc=opts.card||(win?{headline:"NICE!",sub:""}:{headline:"OUCH.",sub:""});
    rc.win=win; rc.points=pts; rc.ill=!!opts.ill;
    this.react=rc;
    if(win)Audio8.jingleWin(); else if(opts.comedy)Audio8.jingleComedy(); else Audio8.jingleLose();
    if(opts.shout)Audio8.shout();
    if(opts.voice)Voice.play(opts.voice);
    this.state="REACT"; this.stateT=opts.cardT||1.9;
    this.round++;
  },
  toReview:function(){
    this.review=buildReview();
    this.state="REVIEW"; this.stateT=0;
    Voice.play("grade_"+this.review.grade.replace("+","p").replace("-","m"));
    var band=this.review.grade.charAt(0).toLowerCase();
    setTimeout(function(){ if(Shell.state==="REVIEW")Voice.play("say_"+band); },2300);
    if(this.score>this.bestScore)this.bestScore=this.score;
    var gi=GRADES.indexOf(this.review.grade), bi=GRADES.indexOf(this.bestGrade||"F-");
    if(!this.bestGrade||gi<bi)this.bestGrade=this.review.grade;
    try{ localStorage.setItem("gnd_best_score",""+this.bestScore);
         localStorage.setItem("gnd_best_grade",this.bestGrade); }catch(e){}
  },
  onTap:function(x,y){
    if(this.state==="TITLE"){ this.startRun(); }
    else if(this.state==="INTRO"&&this.stateT<1.7)this.stateT=0; // tap to skip the intro card
    else if(this.state==="REACT"&&this.stateT<1.1)this.stateT=0; // tap to move on (after a fair read)
    else if(this.state==="REVIEW"){
      if(y>=660&&y<=730){ if(x<195)this.startRun(); else shareReview(); }
    }
    else if(this.state==="PLAY"&&this.modState&&this.modState.onTap)this.modState.onTap(x,y);
  },
  onKey:function(code){
    if(this.state==="TITLE"&&(code==="Space"||code==="Enter"))this.startRun();
    else if(this.state==="INTRO"&&(code==="Space"||code==="Enter")&&this.stateT<1.7)this.stateT=0;
    else if(this.state==="REACT"&&(code==="Space"||code==="Enter")&&this.stateT<1.1)this.stateT=0;
    else if(this.state==="REVIEW"&&(code==="Space"||code==="Enter"))this.startRun();
    else if(this.state==="PLAY"&&this.modState&&this.modState.onKey)this.modState.onKey(code);
  },
  onVisibility:function(hidden){ this.paused=hidden; },
  update:function(dt){
    if(this.paused)return;
    if(this.state==="INTRO"){ this.stateT-=dt; if(this.stateT<=0)this.startPlay(); }
    else if(this.state==="PLAY"){
      var st=this.modState;
      st.update(dt,Input);
      if(st.state==="playing"){
        if(!(st.holdTimer&&st.holdTimer())){ this.timeLeft-=dt; }
        if(this.timeLeft<=0){ this.timeLeft=0; if(st.onTimeout)st.onTimeout(); if(st.state==="playing")st.state="lost"; }
      }
      if(st.state!=="playing")this.endRound(st.state==="won",st.result||{});
    }
    else if(this.state==="REACT"){ this.stateT-=dt; if(this.stateT<=0)this.nextIntro(); }
  },
  speedScale:function(){ return 1; }, // module-internal speeds use Shell.speed; timer runs real-time

        R(CRT.x+22,CRT.y+222,(CRT.w-44)*pat,10,pat<0.3?"#e84d26":"#c39aff");
        Tplain("BRENDAN'S PATIENCE",CRT.x+22,CRT.y+238,10,"#a8906a");
        // the price dial: slide it
        R(CRT.x+22,CRT.y+292,CRT.w-44,12,"#12081f");
        for(var tk=0;tk<=6;tk++){ var tx=CRT.x+22+tk*(CRT.w-44)/6;
          R(tx-1,CRT.y+288,2,20,"#8a6f4d"); Tplain("$"+(tk*10),tx,CRT.y+312,10,"#a8906a","center"); }
        var kx=CRT.x+22+(CRT.w-44)*(this.dial/60);
        R(kx-5,CRT.y+282,10,32,"#e8b020"); R(kx-5,CRT.y+282,10,5,"#f7c948");
        Tplain("$"+this.dial,CRT.x+CRT.w/2,CRT.y+338,34,"#ffd98a","center");
        Tplain("WHAT DID DAVE PAY?",CRT.x+CRT.w/2,CRT.y+382,13,"#f7f2e2","center");
        Tplain("SLIDE THE DIAL · WITHIN $"+this.band+" WINS",CRT.x+CRT.w/2,CRT.y+404,11,"#9fd8e8","center");
      },
      renderOverlay:function(){
        var z=LOCKZONE;
        R(z.x-4,z.y-4,z.w+8,z.h+8,"#54432c");
        R(z.x,z.y,z.w,z.h,"#7a4a9e");
        Tplain("LOCK IT IN",z.x+z.w/2,z.y+14,18,"#ffffff","center");
        Tplain("no take-backs",z.x+z.w/2,z.y+38,10,"#e8d8ff","center");
      }
    };
    return st;
  }
};

/* ============================== BOOT / LOOP ============================== */
Shell.init();
var lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  Shell.update(dt);
  Shell.render();
  Input.resetFrame();
}
requestAnimationFrame(frame);
window.__ready=true;
window.__dbg={
  get state(){return Shell.state;},
  get round(){return Shell.round;},
  get timer(){return Shell.timeLeft;},
  get timeTotal(){return Shell.timeTotal;},
  get score(){return Shell.score;},
  get beers(){return Shell.beers;},
  get streak(){return Shell.streak;},
  get speed(){return Shell.speed;},
  get game(){return Shell.mod?Shell.mod.id:null;},
  get results(){return Shell.results;},
  get review(){return Shell.review;},
  get inter(){return !!Shell.inter;},
  get gameState(){ var s=Shell.modState; if(!s)return null; var o={};
    ["dist","burn","rate","points","style","serves","needle","wind","brianX","kicked","outcome","extensions","baseCleared","paddleX","phase","sipWin","killPts"].forEach(function(k){
      if(s[k]!==undefined)o[k]=s[k]; });
    if(s.debug){ var dd=s.debug(); for(var dk in dd)o[dk]=dd[dk]; }
    if(s.demonsAlive)o.demonsAlive=s.demonsAlive();
    if(s.demons)o.demons=s.demons.filter(function(d){return d.alive;}).map(function(d){return {x:Math.round(d.x),y:Math.round(d.y)};});
    return o; },
  startRun:function(){ Shell.startRun(); },
  startGame:function(id){ Shell.startRun(id); },
  tap:function(x,y){ Audio8.init(); Audio8.resume(); Input.x=x; Input.y=y; Input.down=true; Input.tapEdge=true; Shell.onTap(x,y); },
  release:function(){ Input.down=false; Input.releaseEdge=true; },
  pointer:function(x,y,down){ Input.x=x; Input.y=y; Input.down=down;
    if(down)Input.path=[{x:x,y:y,t:performance.now()}]; else Input.path.length=0; },
  moveTo:function(x,y){ if(Input.down){ Input.moved+=Math.hypot(x-Input.x,y-Input.y);
      Input.path.push({x:x,y:y,t:performance.now()}); if(Input.path.length>90)Input.path.shift(); }
    Input.x=x; Input.y=y; },
  key:function(code,down){ if(down){ if(!Input.keys[code])Input.keyEdge[code]=true;
      Input.keys[code]=true; if(code==="KeyB")Input.sipEdge=true; Shell.onKey(code); }
    else { Input.keys[code]=false; Input.keyUpEdge[code]=true; } }
};
