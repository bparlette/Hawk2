<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Game Night at Dave's</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000000;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:Verdana,"Courier New",monospace;}
  /* shell harmonized with videogamecritic.com (his own CSS, fetched
     2026-11-22): black starfield, navy #000080 panels, link-green #90ee90,
     white/#dddddd Verdana text */
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000000;
    background-image:radial-gradient(1px 1px at 20px 30px,#ffffff 50%,transparent 51%),radial-gradient(1px 1px at 70px 90px,#aaaaFF 50%,transparent 51%),radial-gradient(1.5px 1.5px at 120px 50px,#dddddd 50%,transparent 51%);
    background-size:150px 120px;}
  /* "presented by" credit: overlay INSIDE the stage at the bottom edge.
     The stage's bottom strip is empty floor in every state, so the credit
     costs no screen area. The bar itself ignores taps (only the link is
     live), so it can never block a game tap. */
  #siteBar{position:fixed;left:0;right:0;bottom:0;z-index:1100;text-align:center;pointer-events:none;
    font-family:Verdana,sans-serif;font-size:10px;line-height:1;color:#dddddd;padding:2px 0 3px;letter-spacing:.4px;
    background:rgba(0,0,0,.55);}
  #siteBar a{color:#90ee90;font-weight:bold;text-decoration:none;pointer-events:auto;}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;background:#241610;
    /* fit ANY container (standalone page or someone else's iframe): scale to
       the smaller dimension, aspect locked, never overflow */
    width:min(100vw,calc(100vh * 390 / 844));height:auto;aspect-ratio:390 / 844;max-width:100vw;max-height:100vh;}
  /* PHONES (portrait, phone-like aspect): fill the screen edge-to-edge —
     full viewport WIDTH is the hard rule (no black side bars), height via
     the dynamic viewport so browser chrome can't shrink the stage.
     Internal rendering stays 390x844; phone aspects sit within ~0.5% of
     390:844 so the stretch is invisible, and tap mapping is per-axis
     (canvasPos scales x and y independently), so taps stay exact. */
  @media (orientation:portrait) and (max-aspect-ratio:3/5){
    canvas{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;aspect-ratio:auto;}
  }
  #muteBtn{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:1200;
    width:44px;height:44px;border-radius:10px;border:2px solid #000080;background:rgba(0,0,60,.92);
    color:#90ee90;font-size:21px;line-height:1;cursor:pointer;padding:0;}
  #errBox{position:fixed;inset:0;z-index:1300;display:none;align-items:center;justify-content:center;
    background:rgba(10,6,4,.94);color:#ffe9c4;text-align:center;padding:24px;}
  #errBox .card{max-width:320px;border:3px solid #b3543f;padding:20px;background:#241610;}
  #errBox button{margin-top:14px;font:inherit;font-weight:bold;background:#ffd98a;color:#241610;
    border:2px solid #0d0906;padding:10px 18px;cursor:pointer;}
</style>

<div id="wrap"><div id="siteBar">presented by <a href="https://videogamecritic.com" target="_blank" rel="noopener">videogamecritic.com</a></div><canvas id="cv" width="390" height="844"></canvas></div>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>

window.addEventListener("error",function(){var b=document.getElementById("errBox");if(b)b.style.display="flex";});

/* ============================== UTILS ============================== */
var W=390,H=844;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function mulberry32(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function qs(name){var m=new RegExp("[?&]"+name+"=([^&]*)").exec(location.search);return m?decodeURIComponent(m[1]):null;}
function shuffle(arr,rng){for(var i=arr.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}

/* ============================== AUDIO ============================== */

    var c=this.ctx=new AC();
    var comp=c.createDynamicsCompressor();
    comp.threshold.value=-14; comp.knee.value=22; comp.ratio.value=10;
    this.master=c.createGain(); this.master.gain.value=this.muted?0:0.5;
    this.master.connect(comp); comp.connect(c.destination);
    // silent buffer unlock
    var buf=c.createBuffer(1,1,c.sampleRate),src=c.createBufferSource();
    src.buffer=buf; src.connect(this.master); src.start(0);
    try{ this.muted=localStorage.getItem("gnd_mute")==="1"; this.applyMute(); }catch(e){}
    this.startMusic();
  },
  resume:function(){ if(this.ctx&&this.ctx.state!=="running") this.ctx.resume(); },
  /* Robust unlock for programmatic starts (merged build: the game is
     launched by the room bridge, with no gesture inside this document).
     Creates the context if needed, primes it with a silent buffer, and
     resumes. Safe to call from any gesture handler or bridge call. */
  unlock:function(){
    try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
    this.init();
    if(!this.ctx)return Promise.resolve(false);
    try{ var c=this.ctx,buf=c.createBuffer(1,1,c.sampleRate),src=c.createBufferSource();
      src.buffer=buf; src.connect(this.master); src.start(0); }catch(e){}
    if(this.ctx.state!=="running"){
      try{ var p=this.ctx.resume(); if(p&&p.catch)p.catch(function(){}); }catch(e){}
    }
    var self=this;

  },
  applyMute:function(){ if(this.master) this.master.gain.value=this.muted?0:0.5;

    var c=this.ctx,t=c.currentTime+(delay||0);
    var o=c.createOscillator(),g=c.createGain();
    o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
    g.gain.setValueAtTime(vol||0.16,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02);
  },
  noise:function(dur,vol,delay){
    if(!this.ctx||this.muted)return;
    var c=this.ctx,t=c.currentTime+(delay||0);
    var len=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);

    var f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900; f.Q.value=0.8;
    var g=c.createGain(); g.gain.value=vol||0.2;

    var c=this.ctx,t=c.currentTime;
    var f=c.createBiquadFilter(); f.type="bandpass"; f.Q.value=2.2;
    f.frequency.setValueAtTime(500,t); f.frequency.linearRampToValueAtTime(1100,t+0.12);
    f.frequency.linearRampToValueAtTime(420,t+0.34);
    var g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.22,t+0.05); g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    f.connect(g); g.connect(this.master);
    [196,207].forEach(function(fr){var o=c.createOscillator();o.type="sawtooth";o.frequency.value=fr;o.connect(f);o.start(t);o.stop(t+0.42);});
  },
  jingleWin:function(){ var n=[523,659,784,1047]; for(var i=0;i<n.length;i++)this.tone(n[i],0.11,"square",0.15,i*0.07); },
  jingleLose:function(){ this.tone(220,0.16,"sawtooth",0.14,0,160); this.tone(160,0.24,"sawtooth",0.14,0.13,90); },
  jingleComedy:function(){ this.tone(880,0.09,"square",0.15,0,1320); this.tone(1174,0.14,"square",0.15,0.1,1568); },
  startMusic:function(){
    if(this.musicTimer||!this.ctx)return;
    var bass=[110,0,110,0,131,0,110,0,98,0,98,0,147,0,165,0];
    var lead=[440,0,523,0,659,0,523,0,587,0,523,0,440,0,0,0];
    var self=this;
    this.musicTimer=setInterval(function(){
      if(self.muted||!Shell||(Shell.state!=="TITLE"&&Shell.state!=="REVIEW"&&Shell.state!=="SHELF"&&Shell.state!=="UNLOCK"))return;
      var s=self.musicStep%16;
      if(bass[s])self.tone(bass[s],0.14,"triangle",0.20,0);
      if(lead[s])self.tone(lead[s],0.10,"square",0.05,0);
      self.musicStep++;
    },132);
  },
  sig:function(id){ // per-microgame 3-note signature
    var map={sudz:[392,523,659],scott:[330,330,262],brent:[262,330,392],brad:[523,392,784],
             brian:[262,330,262],steve:[349,440,523],chris:[587,587,440],brendan:[196,233,196]};
    var n=map[id]||[440,440,440];
    for(var i=0;i<n.length;i++)this.tone(n[i],0.09,"square",0.13,i*0.06);
  }
};

/* ============================== VOICES ==============================
   ROBOT SPEECH by default (SAM synth inlined below — see the SAM
   SYNTH banner for attribution): real English words in a digital
   beep voice, a distinct voice per character. BLIP TALK, old-
   Nintendo style with NO recorded audio, survives as ?voice=blip.
   The DEFAULT voice is the ROBOT BUTLER (Cherie's bake-off pick,
   Nov 22, 2026): every character's SAM render slowed to an
   enunciated pace and run through an 88 Hz ring-mod sheen — one
   polite robot butler: the identical voice for every speaker. ?voice=sam restores the
   plain SAM render for A/B comparison.
   When a card's line appears, Voice.play(id) "speaks" it as rapid
   pitched SYLLABLE blips — Animalese / Banjo-Kazooie babble at natural
   speech cadence, synced to the text — at the speaking character's
   pitch profile (VOICE_PROFILES below; the same map is published in
   the README for the parallel module lanes). Blips are plain WebAudio
   oscillators routed through Audio8.master, so the mute toggle
   silences them, and the iOS gesture-unlock chain covers startup. */

   stays the lowest, slowest, most deadpan and Sudz the highest/fastest. */
var SAM_PROFILES={

  brendan:[88,84,140,120],
  brent:  [80,74,128,135],
  chris:  [76,60,120,128],

try{ var qv=qs("voice"); if(qv==="blip")VOICE_MODE="blip"; else if(qv==="sam")VOICE_MODE="sam"; }catch(e){}
/* ROBOT BUTLER profile: [pitch, speed, throat, mouth] — ONE profile
   for EVERY speaker (Cherie, Nov 22, 2026: "All voices exactly robot
   butler no changing for each person"). The single voice is the
   bake-off demo's: Brad's SAM pitch / throat / mouth at the butler's
   enunciated speed 92, run through the butlerize() sheen. Speaker
   identity makes zero difference to the voice; BUTLER_PROFILES maps
   every speaker to the same shared profile so it cannot drift. */
var BUTLER_PROFILE=[64,92,128,150];
var BUTLER_PROFILES={
  dave:BUTLER_PROFILE, brendan:BUTLER_PROFILE, brent:BUTLER_PROFILE,
  chris:BUTLER_PROFILE, scott:BUTLER_PROFILE, steve:BUTLER_PROFILE,
  brad:BUTLER_PROFILE, brian:BUTLER_PROFILE, sudz:BUTLER_PROFILE
};
/* the bake-off's OriginalsButler chain, lifted exactly:
   out[n] = buf[n] * (0.82 + 0.38 * sin(2*pi*88*n/22050)), peak -> 0.78 */
function butlerize(buf){
  var out=new Float32Array(buf.length), n, peak=0, a;
  for(n=0;n<buf.length;n++)out[n]=buf[n]*(0.82+0.38*Math.sin(2*Math.PI*88*n/22050));
  for(n=0;n<out.length;n++){ a=Math.abs(out[n]); if(a>peak)peak=a; }
  if(peak>0.01){ var g=0.78/peak; for(n=0;n<out.length;n++)out[n]*=g; }
  return out;
}

var Voice={
  nodes:[], blips:0, speeches:0, speechSrc:null, speechLog:[],
  _speechGain:null, _samCache:{}, _samVoices:{}, lastBuf:null,
  /* BLIP TALK — Nintendo voice babble (Animalese / Banjo-Kazooie /
     Mario Party chatter). One short pitched blip per SYLLABLE, at
     natural speech cadence, synced to the card's text. Inflection:
     pitch RISES at a question, DIPS at a sentence end, phrase ends
     sag a little, ALL-CAPS words jump up for emphasis, and each
     syllable's pitch jitters deterministically so no two lines sound
     looped. Every blip is a WebAudio oscillator through
     Audio8.master — the mute toggle silences them, and the iOS
     gesture-unlock chain covers startup. No audio assets, ever. */
  syllables:function(word){
    var w=(word||"").toLowerCase().replace(/[^a-z]/g,"");
    if(!w)return 0;
    var n=0, prev=false, i, v;
    for(i=0;i<w.length;i++){
      v="aeiouy".indexOf(w[i])>=0;
      if(v&&!prev)n++;
      prev=v;
    }
    if(w.length>2&&w.charAt(w.length-1)==="e"&&n>1)n--; // silent e
    return Math.max(1,n);
  },
  pattern:function(text,p){
    var iv=0.078/p.rate, t=0, out=[];
    var words=(text||"").split(/\s+/), wi, si;
    for(wi=0;wi<words.length;wi++){
      var word=words[wi]; if(!word)continue;
      var syl=this.syllables(word); if(!syl)continue;
      var letters=word.replace(/[^A-Za-z]/g,"");
      var caps=letters.length>1&&letters===letters.toUpperCase();
      var lastCh=word.charAt(word.length-1);
      var sentEnd=(lastCh==="."||lastCh==="!"||lastCh==="?")&&wi===words.length-1;
      var phraseEnd=(lastCh===","||lastCh===";"||lastCh===":");
      for(si=0;si<syl;si++){
        var jit=((wi*7+si*13)%5-2)*0.03;         // deterministic jitter
        var m=1+jit+((si%2)?0.02:-0.01);         // gentle up-down babble
        if(caps)m*=1.15;                          // emphasis jump — a shout
                                                  // keeps its jump (no end dip)
        else if(sentEnd&&si===syl-1)m*=(lastCh==="?")?1.22:0.82; // rise / dip
        else if(phraseEnd&&si===syl-1)m*=0.94;    // phrase-end sag
        out.push([t,iv*0.62,m]);
        t+=iv;
      }
      t+=iv*0.45;                                 // word gap
      if(phraseEnd)t+=iv*0.8;
      if(sentEnd)t+=iv*1.2;
    }
    return out;
  },
  play:function(id){
    var L=LINES[id]; if(!L)return;
    if(Audio8.muted){ Comm.show(L[0],L[1],Comm.estimate(L[1])); return; }
    this._speak(L[0],L[1]);
  },
  /* speak an arbitrary speaker-tagged line ({who, text}) — the module
     lanes' lines (sudden death, favorites) ride this path */
  say:function(who,text){ if(Audio8.muted){ Comm.show(who,text,Comm.estimate(text)); return; } this._speak(who,text); },
  _speak:function(who,text){
    if(Audio8.muted)return;
    Audio8.init(); Audio8.resume();
    this.stop();
    if(!Audio8.ctx||!Audio8.master)return;
    if(VOICE_MODE==="blip"||typeof SamJs==="undefined"){ this._speakBlip(who,text); return; }
    var clean=(text||"").replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2014\u2013]/g,"-");
    var key=who+"|"+clean, buf=this._samCache[key];
    if(!buf){
      try{
        var butler=(VOICE_MODE==="butler");
        var profs=butler?BUTLER_PROFILES:SAM_PROFILES;
        var vkey=(butler?"b:":"s:")+who;
        var sam=this._samVoices[vkey], sp=profs[who]||profs.dave;
        if(!sam){ sam=new SamJs({pitch:sp[0],speed:sp[1],throat:sp[2],mouth:sp[3]}); this._samVoices[vkey]=sam; }
        var f32=sam.buf32(clean);
        if(butler&&f32&&f32.length)f32=butlerize(f32);
        if(!f32||!f32.length){ this._speakBlip(who,text); return; }
        buf=Audio8.ctx.createBuffer(1,f32.length,22050);
        buf.getChannelData(0).set(f32);
        this._samCache[key]=buf;
      }catch(e){ this._speakBlip(who,text); return; }
    }
    if(!this._speechGain){ this._speechGain=Audio8.ctx.createGain(); this._speechGain.gain.value=0.55; this._speechGain.connect(Audio8.master); }
    var src=Audio8.ctx.createBufferSource(); src.buffer=buf;
    src.connect(this._speechGain); src.start();
    this.speechSrc=src; this.lastBuf=buf; this.speeches++;
    this.speechLog.push({who:who,text:clean,dur:buf.duration});
    if(this.speechLog.length>60)this.speechLog.shift();
    Comm.show(who,clean,buf.duration);
  },
  /* the original blip talk, kept as the ?voice=blip fallback */
  _speakBlip:function(who,text){
    Comm.show(who,text,Comm.estimate(text));
    var p=VOICE_PROFILES[who]||VOICE_PROFILES.dave;
    var pat=this.pattern(text,p), t0=Audio8.ctx.currentTime+0.03, i;
    for(i=0;i<pat.length;i++){
      if(pat[i][0]>4.2)break;
      var wob=1+((i%2)?1:-1)*(p.wobble/200);
      this._blip(t0+pat[i][0],pat[i][1],p.pitch*pat[i][2]*wob,p.wave);
    }
  },
  _blip:function(t,dur,freq,wave){
    var ctx=Audio8.ctx;
    var o=ctx.createOscillator(), gn=ctx.createGain();
    o.type=wave;
    o.frequency.setValueAtTime(freq*2*1.06,t);
    o.frequency.exponentialRampToValueAtTime(freq*2*0.88,t+dur);
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.exponentialRampToValueAtTime(0.22,t+0.008);
    gn.gain.setValueAtTime(0.22,t+Math.max(0.008,dur-0.012));
    gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(gn); gn.connect(Audio8.master);
    o.start(t); o.stop(t+dur+0.02);
    this.nodes.push(o); this.blips++;
  },
  stop:function(){
    Comm.hide();
    if(this.speechSrc){ try{this.speechSrc.stop();}catch(e){} this.speechSrc=null; }
    for(var i=0;i<this.nodes.length;i++){ try{this.nodes[i].stop();}catch(e){} }
    this.nodes.length=0;
  }
};

/* back of one head, 26 wide / 32 tall, top at `top` — hair silhouette
   only, over skin nape + ears where the style leaves them bare */
function drawRowBackHead(cx,top,p,h){
  var hx=cx-13, skin=p.skin, c=h.c;
  if(h.style==="crop"||h.style==="buzz"||h.style==="cap"){
    R(hx-3,top+16,3,8,skin); R(hx+26,top+16,3,8,skin);

    R(hx+1,top+4,24,28,skin);
    R(hx+1,top+3,24,15,c); R(hx+1,top+9,3,9,c); R(hx+22,top+9,3,9,c);
    R(hx+5,top+17,4,2,skin); R(hx+16,top+17,4,2,skin);

    R(hx+1,top+18,24,4,"#101014");
    R(hx+2,top+23,22,3,"#1a1512");

    R(hx,top+2,26,30,c);

    R(hx+1,top+2,24,3,"rgba(255,255,255,0.15)");

    if(gI===6){ R(ax+2,backTop+47,7,11,"#b03a3a"); R(ax+2,backTop+45,7,2,"#e8e4da"); }  // red cup in the holder
    if(gI===9){ // Dave's grade book standing on his armrest
      R(ax-7,backTop-6,13,20,"#7a2e2e"); R(ax-7,backTop-6,13,3,"#a8453a");
      R(ax+2,backTop-3,3,14,"#f4f1e8"); R(ax-5,backTop+2,6,1,"#ffd98a");

    if(armSeat[gI]!==undefined){

    }

}

function wrapText(txt,x,y,size,c,maxW,lineH){
  g.font="bold "+size+"px 'Courier New',monospace"; g.textAlign="left"; g.textBaseline="top";
  var words=txt.split(" "),lines=[],cur="";
  for(var i=0;i<words.length;i++){
    var t=cur?cur+" "+words[i]:words[i];
    if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=words[i];}else cur=t;
  }
  if(cur)lines.push(cur);
  for(var j=0;j<lines.length;j++){ g.fillStyle="#0d0906"; g.fillText(lines[j],x+2,y+j*lineH+2); g.fillStyle=c; g.fillText(lines[j],x,y+j*lineH); }
  return lines.length;
}
/* Readable long-form text: clean system sans, left-aligned, generous
   line-height. The chunky Courier display font is for headings, the
   grade letter and short labels ONLY (Cherie's readability rule). */
var SANS="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif";
function wrapLines(txt,size,maxW){
  g.font="500 "+size+"px "+SANS;
  var words=txt.split(" "),lines=[],cur="";
  for(var i=0;i<words.length;i++){
    var t=cur?cur+" "+words[i]:words[i];
    if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=words[i];}else cur=t;
  }
  if(cur)lines.push(cur);
  return lines;
}
function wrapSans(txt,x,y,size,c,maxW,lineH){
  var lines=wrapLines(txt,size,maxW);
  g.font="500 "+size+"px "+SANS; g.textAlign="left"; g.textBaseline="top"; g.fillStyle=c;
  for(var j=0;j<lines.length;j++)g.fillText(lines[j],x,y+j*lineH);
  return lines.length;
}

var GRADES=["A+","A","A-","B+","B","B-","C+","C","C-","D+","D","D-","F+","F","F-"];
function computeGrade(){

function buildReview(){

    B:"A solid night on the couch.",
    C:"An uneven night, but the couch has seen worse.",
    D:"The crew is being polite. Barely.",
    F:"A catastrophe of historic proportions."}[band];
  var closer={A:"Chicken, fight like a robot!",
    B:"Work with me here!",
    C:"If I wanted to watch a movie I'd go to Blockbuster.",
    D:"Made me physically ill.",
    F:"You'll get more enjoyment out of making fun of this game than actually playing it."}[band];
  // best / worst friend from results
  var byFriend={},i,r;
  for(i=0;i<Shell.results.length;i++){ r=Shell.results[i];
    if(!FRIEND_LINES[r.id])continue; // hidden / sudden-death rounds have no friend line
    if(!byFriend[r.id])byFriend[r.id]={w:0,l:0};
    if(r.win)byFriend[r.id].w++; else byFriend[r.id].l++; }
  var best=null,worst=null;
  for(var id in byFriend){ if(byFriend[id].w>0&&(!best||byFriend[id].w>byFriend[best].w))best=id;
    if(byFriend[id].l>0&&(!worst||byFriend[id].l>byFriend[worst].l))worst=id; }

  if(best)mid.push(FRIEND_LINES[best].best);
  if(worst&&worst!==best)mid.push(FRIEND_LINES[worst].worst);

/* ============================================================================
   GAME NIGHT AT DAVE'S — UNLOCK SYSTEM (DESIGN.md §10)
   ----------------------------------------------------------------------------
   Persistent unlock flags in localStorage (key prefix "gnd_unlock_", matching
   the shell's "gnd_" prefix family). The shell calls checkUnlocks(runStats)
   once at run end (REVIEW); anything newly unlocked comes back as an array so
   the shell can announce it ("UNLOCKED: X" — drawUnlockCard below, or the
   shell can draw the returned strings itself).

   The four unlocks (conditions are exact — each fires on its condition and
   not before):
     jekyllMode      "Jekyll Mode"           finish a run (reach the Review)
     favoritesShelf  "Dave's Favorites"      finish a full pass (reach Round 9)
     noBeerChallenge "No-Beer Challenge"     finish a run with all 4 beers
     criticsCut      "Critic's Cut"          earn any A grade (A- / A / A+)

   Modes: three of the unlocks double as toggleable modes for the NEXT run.
   applyModes() returns the flag object the shell reads at startRun:
     { jekyllInRotation: bool,   // jekyllMode on: Jekyll joins openly
       favoritesAvailable: bool, // favoritesShelf unlocked (shelf visible)
       noBeerChallenge: bool,    // noBeerChallenge on: any lost beer ends run
       speedBonus: 0.15 | 0 }    // criticsCut on: harder speed ramp

   runStats shape (aliases accepted):
     { finished: bool,            // reached the Review screen
       roundsReached: int,        // highest round number entered (or .round)
       beersLeft: int,            // beers remaining at run end (or .beers)
       grade: "A-" }              // final Dave grade (or "" if unfinished)

   Storage is fully try/catch-guarded like the shell; if localStorage is
   unavailable the system degrades to in-memory flags for the session.
   ============================================================================ */
(function () {
  "use strict";

  var UNLOCK_PREFIX = "gnd_unlock_";
  var MODE_PREFIX = "gnd_mode_";

  var DEFS = [
    {
      id: "jekyllMode",
      name: "Jekyll Mode",
      desc: "A certain doctor joins the rotation. Dave saw nothing.",
      conditionText: "Finish a run",
      mode: true,
      test: function (s) { return !!s.finished; }
    },
    {
      id: "favoritesShelf",
      name: "Dave's Favorites Shelf",
      desc: "Warlords. Hydro Thunder. River Raid. The good shelf.",
      conditionText: "Finish a full pass (Round 9)",
      mode: false,
      test: function (s) { return (s.roundsReached | 0) >= 9; }
    },
    {
      id: "noBeerChallenge",
      name: "No-Beer Challenge",
      desc: "Run the table without losing a single beer.",
      conditionText: "Finish with all 4 beers",
      mode: true,
      test: function (s) { return !!s.finished && (s.beersLeft | 0) >= 4; }
    },
    {
      id: "criticsCut",
      name: "Critic's Cut",
      desc: "The harder speed cut. Dave gets pickier.",
      conditionText: "Earn any A grade",
      mode: true,
      test: function (s) { return typeof s.grade === "string" && s.grade.charAt(0) === "A"; }
    }
  ];

  /* --- storage (guarded; in-memory fallback) --- */
  var mem = {};
  var store = {
    get: function (k) {
      try { var v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : null) : v; }
      catch (e) { return k in mem ? mem[k] : null; }
    },
    set: function (k, v) {
      mem[k] = v;
      try { localStorage.setItem(k, v); } catch (e) {}
    },
    del: function (k) {
      delete mem[k];
      try { localStorage.removeItem(k); } catch (e) {}
    }
  };

  function normalizeStats(raw) {
    raw = raw || {};
    return {
      finished: !!raw.finished,
      roundsReached: (raw.roundsReached != null ? raw.roundsReached : raw.round) | 0,
      beersLeft: (raw.beersLeft != null ? raw.beersLeft : raw.beers) | 0,
      grade: raw.grade || ""
    };
  }

  function defById(id) {
    for (var i = 0; i < DEFS.length; i++) if (DEFS[i].id === id) return DEFS[i];
    return null;
  }

  function isUnlocked(id) { return store.get(UNLOCK_PREFIX + id) === "1"; }

  function publicDef(d) {
    return {
      id: d.id, name: d.name, desc: d.desc,
      conditionText: d.conditionText, mode: !!d.mode,
      unlocked: isUnlocked(d.id)
    };
  }

  var api = {
    DEFS: DEFS.map(function (d) {
      return { id: d.id, name: d.name, desc: d.desc, conditionText: d.conditionText, mode: !!d.mode };
    }),

    /* Every unlock with its current state — for a collection/progress screen. */
    listUnlocks: function () { return DEFS.map(publicDef); },

    isUnlocked: isUnlocked,

    /*
     * Call at run end. Persists any newly-earned unlocks and returns ONLY the
     * newly unlocked defs (possibly empty) so the shell announces each once.
     */
    checkUnlocks: function (runStats) {
      var s = normalizeStats(runStats);
      var fresh = [];
      for (var i = 0; i < DEFS.length; i++) {
        var d = DEFS[i];
        if (!isUnlocked(d.id) && d.test(s)) {
          store.set(UNLOCK_PREFIX + d.id, "1");
          fresh.push(publicDef(d));
        }

            var tc = this.torches[i], p = clamp(tc.t / tc.fly, 0, 1);
            var tx = lerp(tc.x0, tc.x1, p) / 3;
            var ty = (lerp(tc.y0, this.groundY(), p) - Math.sin(p * Math.PI) * 64) / 3;
            PX(CC, tx - 1, ty - 2, 3, 3, NES.FLAME);
            PX(CC, tx - 1, ty - 4, 3, 2, NES.FLAME2);
            if (p > 0.7) PX(CC, tc.x1 / 3 - 2, gY + 1, 4, 1, "rgba(248,56,0,0.6)");
          }

          /* the telegraph: a singer leans out of a window, torch in hand,
             red notes drifting (the refs' window singer, weaponized) */
          if (this.villager) {
            var vx = this.villager.x / 3, wy2 = (this.groundY() - 118) / 3;
            PX(CC, vx - 5, wy2 - 2, 11, 2, NES.PALE);           // lintel
            PX(CC, vx - 4, wy2, 9, 13, NES.OLIVE);              // window
            PX(CC, vx - 2, wy2 + 3, 4, 4, NES.SKIN);            // her head
            PX(CC, vx - 2, wy2 + 7, 4, 6, NES.YELLOW);          // gold dress
            PX(CC, vx + 3, wy2 + 1, 2, 6, NES.FLAME);           // raised torch
            PX(CC, vx + 3, wy2 - 1, 2, 2, NES.FLAME2);
            PX(CC, vx - 8, wy2 + 2, 2, 3, NES.NOTE_RED);        // musical notes
            PX(CC, vx + 7, wy2 + 6, 2, 3, NES.NOTE_RED);
          }

          /* Hyde's shadow grows with TEMPER */
          if (this.hyde > 0.45) {
            var ha = (this.hyde - 0.45) / 0.55;
            PX(CC, this.jx / 3 - 5, gY - 2, 11, 2, "rgba(0,0,0," + (0.4 * ha).toFixed(2) + ")");
          }

          this.drawJekyll(shx);

          /* THE METER — the real game's HUD: black bar, "METER" in pale
             green, slanted two-tone bar (pale Jekyll | dark-green Hyde),
             J and H at the ends. hyde fills the dark side from the right. */
          R(C.x, C.y, C.w, 44, NES.BLACK);
          var mx = C.x + 74, mw = C.w - 118, my = C.y + 14;
          R(mx, my, mw, 13, NES.METER_PALE);
          var darkW = Math.round(mw * this.hyde);
          if (darkW > 0) {
            R(mx + mw - darkW, my, darkW, 13, NES.METER_DARK);
            R(mx + mw - darkW - 4, my, 4, 13, NES.METER_DARK); // slanted nose (approx)
          }
          if (typeof Tplain === "function") {
            Tplain("METER", C.x + 10, C.y + 13, 14, NES.METER_PALE);
            Tplain("J", mx - 14, C.y + 13, 14, NES.METER_PALE);
            Tplain("H", mx + mw + 6, C.y + 13, 14, NES.METER_PALE);
            Tplain("TAP TO STAY JEKYLL", C.x + C.w - 10, C.y + 31, 10, NES.METER_PALE, "right");
            if (this.hint > 0) {
              Tplain("SLIDE TO DODGE THE TORCHES!", C.x + C.w / 2, C.y + C.h - 30, 14, NES.SAND, "center");
            }
            if (this.flash > 0) Tplain("⚡", C.x + C.w / 2, C.y + 60, 40, NES.PALE, "center");
          }
        },

        /* The figure, from the refs: Jekyll is SMALL — a grey suit and
           reddish-brown hair, ~1/6 of the screen tall. As TEMPER passes
           2/3 he hunches into the refs' Hyde: bulky dark-grey body, wild
           black hair, orange-tan face and arms. */
        drawJekyll: function (shx) {
          if (typeof PX !== "function" || typeof CC === "undefined") return;
          var gy = this.groundY() / 3;             // pixel-grid coords (CC origin is CRT)
          var jx = Math.round((this.jx + (shx || 0)) / 3);
          var leg = Math.floor(this.walkPhase) % 2;
          if (this.hyde > 0.66) {
            /* --- HYDE form --- */
            PX(CC, jx - 3, gy - 15, 6, 2, NES.BLACK);              // wild hair
            PX(CC, jx - 3, gy - 16, 2, 1, NES.BLACK);
            PX(CC, jx + 1, gy - 16, 2, 1, NES.BLACK);
            PX(CC, jx - 2, gy - 13, 4, 3, NES.ORANGE);              // face
            PX(CC, jx - 3, gy - 10, 7, 6, NES.HYDE_BODY);          // bulky body
            PX(CC, jx - 4, gy - 9, 1, 5, NES.ORANGE);              // arms
            PX(CC, jx + 3, gy - 9, 1, 5, NES.ORANGE);
            if (leg) { PX(CC, jx - 3, gy - 4, 2, 4, NES.HYDE_BODY); PX(CC, jx + 1, gy - 4, 2, 3, NES.HYDE_BODY); }
            else { PX(CC, jx - 2, gy - 4, 2, 4, NES.HYDE_BODY); PX(CC, jx + 1, gy - 4, 2, 4, NES.HYDE_BODY); }
            PX(CC, jx - 3, gy - 1, 2, 1, NES.BLACK);               // feet
            PX(CC, jx + 1, gy - 1, 2, 1, NES.BLACK);
          } else {
            /* --- JEKYLL form --- */
            PX(CC, jx - 1, gy - 15, 3, 2, NES.HAIR);               // reddish-brown hair
            PX(CC, jx - 1, gy - 13, 3, 3, NES.SKIN);               // face
            PX(CC, jx - 2, gy - 10, 4, 6, NES.SUIT);               // grey suit
            PX(CC, jx + 2, gy - 9, 1, 7, NES.DKBROWN);             // cane
            if (leg) { PX(CC, jx - 2, gy - 4, 2, 3, NES.SUIT); PX(CC, jx + 1, gy - 4, 1, 3, NES.SUIT); }
            else { PX(CC, jx - 1, gy - 4, 1, 3, NES.SUIT); PX(CC, jx + 1, gy - 4, 2, 3, NES.SUIT); }
            PX(CC, jx - 2, gy - 1, 2, 1, NES.BLACK);               // shoes
            PX(CC, jx + 1, gy - 1, 2, 1, NES.BLACK);
          }
        },

        /* Standalone fallback (stub harness without shell art helpers):
           draws with the raw 2d context only, same NES palette. */
        renderFallback: function () {
          var ctx2d = (typeof g !== "undefined") ? g : null;
          if (!ctx2d) return;
          if (!this.started) this.startInit();
          var C = (typeof CRT !== "undefined") ? CRT : { x: 15, y: 118, w: 360, h: 452 };
          ctx2d.fillStyle = NES.CYAN; ctx2d.fillRect(C.x, C.y, C.w, C.h);
          ctx2d.fillStyle = NES.BRICK; ctx2d.fillRect(C.x, C.y + 44, C.w, this.groundY() - 44);
          ctx2d.fillStyle = NES.GREY; ctx2d.fillRect(C.x, C.y + this.groundY(), C.w, 9);
          ctx2d.fillStyle = NES.BROWN; ctx2d.fillRect(C.x, C.y + this.groundY() + 9, C.w, 21);
          ctx2d.fillStyle = this.hyde > 0.66 ? NES.HYDE_BODY : NES.SUIT;
          ctx2d.fillRect(C.x + this.jx - 6, C.y + this.groundY() - 30, 12, 30);
          ctx2d.fillStyle = NES.HAIR; ctx2d.fillRect(C.x + this.jx - 5, C.y + this.groundY() - 38, 10, 6);
          ctx2d.fillStyle = NES.BLACK; ctx2d.fillRect(C.x, C.y, C.w, 44);
          ctx2d.fillStyle = NES.METER_PALE; ctx2d.fillRect(C.x + 74, C.y + 14, C.w - 118, 13);
          ctx2d.fillStyle = NES.METER_DARK;
          var dw = Math.round((C.w - 118) * this.hyde);
          if (dw > 0) ctx2d.fillRect(C.x + 74 + (C.w - 118) - dw, C.y + 14, dw, 13);
          ctx2d.fillStyle = NES.FLAME2;
          for (var i = 0; i < this.torches.length; i++) {
            var tc = this.torches[i], p = clamp(tc.t / tc.fly, 0, 1);
            ctx2d.fillRect(C.x + lerp(tc.x0, tc.x1, p) - 3, C.y + lerp(tc.y0, this.groundY(), p) - Math.sin(p * Math.PI) * 64 - 3, 6, 6);
          }
        }
      };
      return st;
    }
  };

  var api = {
    module: MODULE,
    id: MODULE.id,
    hidden: true,
    era: "NES",
    palette: NES,
    FRIEND_IDS: FRIEND_IDS.slice(),
    shouldJoinRotation: shouldJoinRotation,
    register: function (modulesObj) {
      var target = modulesObj || (typeof MODULES !== "undefined" ? MODULES : null);
      if (target) target[MODULE.id] = MODULE;
      return !!target;
    }
  };

  if (typeof window !== "undefined") {
    window.GNDJekyll = api;
    if (typeof MODULES !== "undefined") api.register(MODULES);
  }
  if (typeof module !== "undefined" && module.exports) module.exports = api;
})();

function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  Shell.update(dt);
  Shell.render();
  if(Shell.state!=="UNLOCK")drawComm(); // unlock cards keep TAP TO CONTINUE uncovered
  Input.resetFrame();
}
requestAnimationFrame(frame);
window.__ready=true;
window.__dbg={
  get state(){return Shell.state;},
  get round(){return Shell.round;},
  get timer(){return Shell.timeLeft;},
  get timeTotal(){return Shell.timeTotal;},
  get score(){return Shell.score;},
  get beers(){return Shell.beers;},
  get streak(){return Shell.streak;},
  get speed(){return Shell.speed;},
  get game(){return Shell.mod?Shell.mod.id:null;},
  get results(){return Shell.results;},
  get review(){return Shell.review;},
  get inter(){return !!Shell.inter;},
  get gameState(){ var s=Shell.modState; if(!s)return null; var o={};
    ["dist","burn","rate","points","style","serves","needle","wind","brianX","kicked","outcome","extensions","baseCleared","paddleX","phase","sipWin","killPts"].forEach(function(k){
      if(s[k]!==undefined)o[k]=s[k]; });
    if(s.debug){ var dd=s.debug(); for(var dk in dd)o[dk]=dd[dk]; }
    if(s.demonsAlive)o.demonsAlive=s.demonsAlive();
    if(s.demons)o.demons=s.demons.filter(function(d){return d.alive;}).map(function(d){return {x:Math.round(d.x),y:Math.round(d.y)};});
    return o; },
  unlockAudio:function(){ return Audio8.unlock(); },
  startRun:function(){ Audio8.unlock(); Shell.startRun(); },
  startGame:function(id){ Audio8.unlock(); Shell.startRun(id); },
  startShelf:function(id){ Shell.startShelfPlay(id); },
  unlocks:function(){ return window.GNDUnlocks?GNDUnlocks.listUnlocks():[]; },
  modes:function(){ return window.GNDUnlocks?GNDUnlocks.applyModes():{}; },
  setMode:function(id,on){ if(window.GNDUnlocks)GNDUnlocks.setMode(id,!!on); },
  checkUnlocks:function(s){ return window.GNDUnlocks?GNDUnlocks.checkUnlocks(s):[]; },
  resetUnlocks:function(){ if(window.GNDUnlocks)GNDUnlocks.reset(); },
  get shelfOpen(){ return !!(window.GNDUnlocks&&GNDUnlocks.isUnlocked("favoritesShelf")); },
  get seen(){ return Shell.seenFriends; },
  get flow(){ return Shell.flow; },
  get order(){ return Shell.order; },
  get inSD(){ return Shell.inSD; },
  tap:function(x,y){ Audio8.init(); Audio8.resume(); Input.x=x; Input.y=y; Input.down=true; Input.tapEdge=true; Shell.onTap(x,y); },
  release:function(){ Input.down=false; Input.releaseEdge=true; },
  pointer:function(x,y,down){ Input.x=x; Input.y=y; Input.down=down;
    if(down)Input.path=[{x:x,y:y,t:performance.now()}]; else Input.path.length=0; },
  moveTo:function(x,y){ if(Input.down){ Input.moved+=Math.hypot(x-Input.x,y-Input.y);
      Input.path.push({x:x,y:y,t:performance.now()}); if(Input.path.length>90)Input.path.shift(); }
    Input.x=x; Input.y=y; },
  key:function(code,down){ if(down){ if(!Input.keys[code])Input.keyEdge[code]=true;
      Input.keys[code]=true; if(code==="KeyB")Input.sipEdge=true; Shell.onKey(code); }
    else { Input.keys[code]=false; Input.keyUpEdge[code]=true; } }
};
