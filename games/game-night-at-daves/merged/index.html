  <style>
    :root {
      --vgc-navy: #000080;
      --vgc-green: #90ee90;
      --vgc-bg: #05050a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #040408;
      color: #f4efe6;
      font-family: "Courier New", Courier, monospace;
      touch-action: none;
    }

    .stage-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #121226 0%, #030307 82%);
    }

    .phone-frame {
      position: relative;
      height: 100dvh;
      max-height: 100dvh;
      aspect-ratio: 390 / 844;
      max-width: 100vw;
      background: #06060d;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(144, 238, 144, 0.18), 0 20px 60px rgba(0, 0, 0, 0.85);
      touch-action: none;
    }

    #roomCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    /* HTML UI Layer: z-index >= 1100 per TOUCH.md */
    .ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1200;
    }

    .sfx-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 34px;
      height: 30px;
      border-radius: 7px;
      border: 2px solid #4d6bff;
      background: var(--vgc-navy);
      color: var(--vgc-green);

      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
    }

    .sfx-btn:active {
      transform: translateY(1px);
    }

    .tap-toast {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(0, 0, 128, 0.94);
      border: 2px solid var(--vgc-green);
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.7px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.16s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75);
      pointer-events: none;
    }

    .tap-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  
    /* Merged build: full-viewport game frame, hidden until the room tap */
    #gameFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      border: 0;
      margin: 0;
      padding: 0;
      background: #000;
      z-index: 3000;
      display: none;

<body>
  <div class="stage-shell">
    <div class="phone-frame" id="phoneFrame">
      <!-- 260 x 562 logical 16-bit pixel art canvas (exact 390:844 portrait aspect) -->
      <canvas id="roomCanvas" width="260" height="562"></canvas>

      <div class="ui-layer">
        <button class="sfx-btn" id="btnSfx" aria-label="Toggle Sound">SFX</button>
        <div class="tap-toast" id="tapToast">GAME NIGHT READY — STEP ONE ROOM STUDY</div>
      </div>
    </div>
  </div>

  <script type="module">
    const canvas = document.getElementById('roomCanvas');
    const ctx = canvas.getContext('2d');
    const phoneFrame = document.getElementById('phoneFrame');
    const btnSfx = document.getElementById('btnSfx');
    const tapToast = document.getElementById('tapToast');

    const W = 260;
    const H = 562;

    // iOS-safe WebAudio unlock chain
    let audioCtx = null;
    let audioUnlocked = false;
    let muted = false;

    function unlockAudio() {
      if (audioUnlocked && audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        return;
      }
      try {
        if (typeof navigator !== 'undefined' && navigator.audioSession) {
          navigator.audioSession.type = 'playback';
        }
      } catch (_) {}
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      try {
        const b = audioCtx.createBuffer(1, 1, 22050);
        const s = audioCtx.createBufferSource();
        s.buffer = b;
        s.connect(audioCtx.destination);
        s.start(0);
      } catch (_) {}
      audioUnlocked = true;
    }

    function playStartChime() {
      if (muted || !audioCtx || audioCtx.state !== 'running') return;
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((f, i) => {
        const t = audioCtx.currentTime + i * 0.06;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.08, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
      });
    }

    // Pixel helpers (integer-aligned for razor-sharp 16-bit look)
    function px(x, y, w, h, col) {
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    }

    function pill(x, y, w, h, col) {
      x = Math.round(x);
      y = Math.round(y);
      w = Math.round(w);
      h = Math.round(h);
      ctx.fillStyle = col;
      if (w >= 4 && h >= 4) {
        ctx.fillRect(x + 1, y, w - 2, h);
        ctx.fillRect(x, y + 1, w, h - 2);
      } else {
        ctx.fillRect(x, y, w, h);
      }
    }

    function roundedRect(x, y, w, h, col, r = 2) {
      x = Math.round(x);
      y = Math.round(y);
      w = Math.round(w);
      h = Math.round(h);
      ctx.fillStyle = col;
      ctx.fillRect(x + r, y, w - r * 2, h);
      ctx.fillRect(x, y + r, w, h - r * 2);
      if (r >= 2) {
        ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
      }
    }

    // Crew specification — LOCKED seating order left-to-right, backs of heads ONLY, ZERO faces!
    const CREW = [
      {
        name: 'SUDZ',
        hairType: 'crop',
        hair: '#8a623c',
        hairHi: '#ab7e52',
        hairShade: '#5d4026',
        shirt: '#c9322c',
        shirtShade: '#8c1f1b',
        reclinedFeet: true,
        sockCol: '#242730',
        pantsCol: '#2e3a4e',
      },
      {
        name: 'SCOTT',
        hairType: 'cap',
        hair: '#222630',
        hairHi: '#3d4557',
        hairShade: '#13161d',
        shirt: '#d98a22',
        shirtShade: '#965c12',
        reclinedFeet: false,
      },
      {
        name: 'BRENT',
        hairType: 'full',
        hair: '#c8cdd6',
        hairHi: '#eef2f8',
        hairShade: '#8b93a2',
        shirt: '#328a46',
        shirtShade: '#1e5b2c',
        reclinedFeet: true,
        sockCol: '#59606e',
        pantsCol: '#38465e',
      },
      {
        name: 'BRIAN',
        hairType: 'cap',
        hair: '#232732',
        hairHi: '#42495c',
        hairShade: '#13161d',
        shirt: '#ebe6dc',
        shirtShade: '#bab3a6',
        reclinedFeet: false,
      },
      {
        name: 'STEVE',
        hairType: 'wave',
        hair: '#2b1d14',
        hairHi: '#473224',
        hairShade: '#18100b',
        shirt: '#1c3c86',
        shirtShade: '#112554',
        reclinedFeet: true,
        sockCol: '#e5e7ec',
        pantsCol: '#9a7e5a',
      },
      {
        name: 'CHRIS',
        hairType: 'buzz',
        hair: '#887866',
        hairHi: '#a69682',
        hairShade: '#5c5043',
        shirt: '#228c88',
        shirtShade: '#145a57',
        reclinedFeet: false,
      },
      {
        name: 'BRAD',
        hairType: 'crop',
        hair: '#b85426',
        hairHi: '#db7442',
        hairShade: '#7d3414',
        shirt: '#2ea8ff',
        shirtShade: '#1a6eb3',
        reclinedFeet: true,
        sockCol: '#242730',
        pantsCol: '#333d50',
      },
      {
        name: 'BRENDAN',
        hairType: 'long',
        hair: '#1e1922',
        hairHi: '#3a3242',
        hairShade: '#110d14',
        shirt: '#7a3ab8',
        shirtShade: '#4e227a',
        reclinedFeet: false,
      },
      {
        name: 'DAVE',
        hairType: 'sweep',
        hair: '#d6dbe4',
        hairHi: '#f4f7fc',
        hairShade: '#9aa2b2',
        shirt: '#263858',
        shirtShade: '#162238',
        isDave: true,
        reclinedFeet: true,
        sockCol: '#1f222a',
        pantsCol: '#2c3342',
      },
    ];

    // Precompute deterministic starfield for videogamecritic.com masthead
    const STARS = [];
    for (let i = 0; i < 38; i++) {
      STARS.push({
        x: (i * 37 + 11) % W,
        y: (i * 19 + 3) % 24,
        bright: i % 3 === 0 ? '#ffffff' : i % 2 === 0 ? '#90ee90' : '#7b88c9',
      });
    }

    // Deterministic game spine colors for shelves
    const SPINE_COLORS_RIGHT = ['#b52b2b', '#26538d', '#d18d2a', '#2b7a46', '#7d2e82', '#d8d2c4', '#40485c', '#c94932'];
    const SPINE_COLORS_LEFT = ['#ebe6da', '#ded8ca', '#f2eee4', '#d1cab9', '#c6c0b2', '#e4dfd2'];

    function drawMasthead(time) {
      // videogamecritic.com starfield masthead
      px(0, 0, W, 26, '#05050b');
      for (const s of STARS) {
        const tw = Math.sin(time * 3 + s.x) > -0.6 ? 1 : 0;
        if (tw) px(s.x, s.y, 1, 1, s.bright);
      }
      px(0, 25, W, 2, '#000080');
      px(0, 27, W, 1, '#90ee90');

      ctx.font = 'bold 8px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#c8d0e0';
      ctx.fillText('presented by', 80, 13);
      ctx.fillStyle = '#90ee90';
      ctx.fillText('videogamecritic.com', 160, 13);
    }

    function drawRoomArchitecture(time) {
      // Warm dim living-room wall & ceiling behind TVs
      px(0, 28, W, 240, '#2a221c');
      // Subtle top ceiling shadow
      px(0, 28, W, 16, '#1c1612');
      // Warm wall glow behind big TV & CRT
      const glow = ctx.createRadialGradient(128, 136, 18, 128, 145, 118);
      glow.addColorStop(0, 'rgba(72, 118, 196, 0.28)');
      glow.addColorStop(0.55, 'rgba(255, 178, 96, 0.12)');
      glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 28, W, 230);

      // 1. LEFT FLOOR-TO-CEILING BLACK SHELF WALL (packed white/cream spines + dark Genesis cases per room-1!)
      px(0, 32, 34, 214, '#0f0e12');
      for (let row = 0; row < 7; row++) {
        const sy = 36 + row * 29;
        px(2, sy + 25, 30, 3, '#1e1c24'); // shelf plank
        for (let bx = 3; bx < 31; bx += 3) {
          const isDarkBottom = row >= 4;
          const col = isDarkBottom
            ? (bx % 6 === 0 ? '#b8322c' : bx % 9 === 0 ? '#2e63a8' : '#262936')
            : SPINE_COLORS_LEFT[(bx + row * 3) % SPINE_COLORS_LEFT.length];
          const bh = 21 + ((bx + row) % 3);
          px(bx, sy + (25 - bh), 2, bh, col);
        }
      }
      // Shelf outer wood frame
      px(34, 32, 2, 214, '#1b1820');

      // 2. RIGHT FLOOR-TO-CEILING BLACK SHELF WALL (red/black/blue/green retro boxes per room-1 & room-3!)
      px(W - 34, 32, 34, 214, '#0f0e12');
      for (let row = 0; row < 7; row++) {
        const sy = 36 + row * 29;
        px(W - 32, sy + 25, 30, 3, '#1e1c24');
        for (let bx = W - 31; bx < W - 3; bx += 3) {
          const col = SPINE_COLORS_RIGHT[(bx + row * 5) % SPINE_COLORS_RIGHT.length];
          const bh = 20 + ((bx * 3 + row) % 4);
          px(bx, sy + (25 - bh), 2, bh, col);
        }
      }
      px(W - 36, 32, 2, 214, '#1b1820');

      // 3. UPPER BACK SHELF & POSTER COLLAGE WALL (between the side shelves, matching room-2 & room-3!)
      // Top white shelf with retro boxes & books
      px(38, 44, 184, 3, '#c8bfa8');
      px(38, 47, 184, 2, '#5c5244');
      for (let x = 42; x < 216; x += 6) {
        const col = SPINE_COLORS_RIGHT[(x * 7) % SPINE_COLORS_RIGHT.length];
        px(x, 33 + (x % 3), 5, 11 - (x % 3), col);
      }

      // Glowing PlayStation △ ○ × □ light above the big TV (direct from room-2!)
      px(50, 51, 38, 10, '#141724');
      const psGlow = 0.8 + 0.2 * Math.sin(time * 4);
      ctx.save();
      ctx.globalAlpha = psGlow;
      px(53, 53, 6, 6, '#38e88c'); // green triangle
      px(62, 53, 6, 6, '#ff4d6d'); // pink circle
      px(71, 53, 6, 6, '#4db8ff'); // blue cross
      px(80, 53, 6, 6, '#d96bff'); // purple square
      ctx.restore();

      // Framed Poster Collage Wall (between TVs and upper shelves, matching room-3!)
      const posters = [
        { x: 96, y: 50, w: 18, h: 22, bg: '#2c3d68', fg: '#e8c468' },
        { x: 117, y: 52, w: 16, h: 20, bg: '#6e232a', fg: '#f2b880' },
        { x: 136, y: 50, w: 20, h: 22, bg: '#203b32', fg: '#88e0b8' },
        { x: 160, y: 52, w: 15, h: 20, bg: '#3e2954', fg: '#e08cf2' },
        { x: 179, y: 51, w: 22, h: 21, bg: '#5a3a22', fg: '#ffd27a' },
      ];
      for (const p of posters) {
        px(p.x - 1, p.y - 1, p.w + 2, p.h + 2, '#141118');
        px(p.x, p.y, p.w, p.h, p.bg);
        px(p.x + 3, p.y + 4, p.w - 6, 6, p.fg);
        px(p.x + 4, p.y + 12, p.w - 8, 5, 'rgba(255,255,255,0.35)');
      }

      // 4. TAN CARPET FLOOR (from TV stand base down to bottom of frame)
      px(0, 240, W, H - 240, '#8d7a62');
      // Perspective floor shading (warmer near TVs, darker under recliners)
      const floorGrad = ctx.createLinearGradient(0, 240, 0, H);
      floorGrad.addColorStop(0, 'rgba(40, 32, 24, 0.35)');
      floorGrad.addColorStop(0.25, 'rgba(180, 155, 120, 0.12)');
      floorGrad.addColorStop(0.65, 'rgba(22, 16, 12, 0.45)');
      floorGrad.addColorStop(1, 'rgba(6, 6, 12, 0.92)');
      ctx.fillStyle = floorGrad;
      ctx.fillRect(0, 240, W, H - 240);

      // Baseboard trim
      px(36, 236, W - 72, 4, '#5a4a38');
    }

    function drawTvWall(time) {
      // === LEFT: BIG FLATSCREEN TV (shows GAME NIGHT AT DAVE'S) ===
      const tvX = 40;
      const tvY = 78;
      const tvW = 114;
      const tvH = 74;

      // Subtle screen glow halo on wall
      ctx.fillStyle = 'rgba(60, 128, 255, 0.16)';
      ctx.fillRect(tvX - 4, tvY - 4, tvW + 8, tvH + 8);

      // Bezel
      roundedRect(tvX, tvY, tvW, tvH, '#12151e', 2);
      px(tvX + 3, tvY + 3, tvW - 6, tvH - 6, '#0c1a34');

      // Retro game title screen inside the big TV!
      // Deep navy header bar
      px(tvX + 4, tvY + 4, tvW - 8, 10, '#000080');
      ctx.font = 'bold 6px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#90ee90';
      ctx.fillText('VIDEOGAMECRITIC.COM', tvX + tvW / 2, tvY + 9);

      // Main pixel title
      ctx.font = '900 12px "Courier New", monospace';
      ctx.fillStyle = '#ffcf48';
      ctx.fillText('GAME NIGHT', tvX + tvW / 2, tvY + 29);
      ctx.fillStyle = '#ffffff';
      ctx.fillText("AT DAVE'S", tvX + tvW / 2, tvY + 43);

      // Sub-copy & tiny animated pixel hearts/beers
      ctx.font = 'bold 6px "Courier New", monospace';
      ctx.fillStyle = '#90ee90';
      ctx.fillText("Dave's reviewing tonight.", tvX + tvW / 2, tvY + 58);

      // Scanlines across big TV
      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      for (let sy = tvY + 4; sy < tvY + tvH - 4; sy += 2) {
        ctx.fillRect(tvX + 3, sy, tvW - 6, 1);
      }

      // === RIGHT: SILVER CRT TV + PAC-MAN & GHOSTS LAMP ON TOP (direct from room-2!) ===
      const crtX = 160;
      const crtY = 92;
      const crtW = 60;
      const crtH = 56;

      // Glowing Pac-Man + 4 Ghosts pixel lamp sitting on top of the silver CRT!
      const lampY = crtY - 10;
      px(crtX + 8, crtY - 2, 44, 2, '#181820');
      const pacCols = ['#ff3b3b', '#ff8cd9', '#3be8ff', '#ff9d2e', '#ffe63b'];
      pacCols.forEach((col, i) => {
        const lx = crtX + 10 + i * 8;
        const bob = Math.sin(time * 5 + i) > 0.3 ? -1 : 0;
        px(lx, lampY + bob, 6, 7, col);
        px(lx + 1, lampY + 2 + bob, 1, 1, '#ffffff');
        px(lx + 4, lampY + 2 + bob, 1, 1, '#ffffff');
      });

      // Silver CRT casing
      roundedRect(crtX, crtY, crtW, crtH, '#989ba4', 3);
      roundedRect(crtX + 2, crtY + 2, crtW - 4, crtH - 10, '#71757f', 2);
      // Curved dark glass CRT tube
      roundedRect(crtX + 5, crtY + 5, crtW - 10, crtH - 16, '#142426', 3);
      // Retro arcade attract bars on CRT
      const barPulse = Math.floor(time * 4) % 4;
      px(crtX + 10, crtY + 12, 34, 4, '#29e3ff');
      px(crtX + 12, crtY + 20, 24, 3, '#ffcf48');
      px(crtX + 14, crtY + 27, 28, 3, barPulse < 2 ? '#ff4d6d' : '#90ee90');
      px(crtX + 18, crtY + 34, 18, 3, '#72b8ff');
      // CRT specular highlight
      px(crtX + 7, crtY + 7, 10, 2, 'rgba(255,255,255,0.22)');
      // CRT front power LED & brand stripe
      px(crtX + 48, crtY + 48, 3, 2, '#54ff88');
      px(crtX + 10, crtY + 48, 16, 2, '#4d5058');

      // === CONSOLE MEDIA STANDS UNDER BOTH TVs (NES, SNES, Xbox, Dreamcast per room-2!) ===
      // Left wide black console rack
      px(42, 154, 110, 82, '#14151c');
      px(44, 156, 106, 2, '#2b2e3c');
      px(44, 178, 106, 2, '#2b2e3c');
      px(44, 202, 106, 2, '#2b2e3c');
      px(44, 226, 106, 2, '#2b2e3c');

      // Shelf 1: NES + SNES
      px(50, 164, 28, 12, '#d6d2c8'); // NES
      px(50, 168, 28, 3, '#2d2f38');
      px(72, 172, 2, 2, '#ff3b3b'); // NES power LED
      px(86, 166, 24, 10, '#ccc8d4'); // SNES
      px(91, 168, 6, 4, '#6b4ca8');
      px(100, 168, 6, 4, '#6b4ca8');
      px(118, 167, 26, 9, '#24262e'); // Genesis / Saturn

      // Shelf 2: Original Xbox (green glow!) + PS2
      px(52, 186, 36, 14, '#1d2126');
      px(68, 191, 4, 4, '#44ff44'); // Xbox jewel
      px(96, 188, 42, 12, '#1c1f2c'); // PS2 / receiver
      px(130, 192, 4, 2, '#3ba8ff');

      // Shelf 3: Retro gear + Dreamcast on floor in front
      px(52, 210, 88, 14, '#1b1d26');
      px(60, 214, 10, 3, '#ff6a38');
      px(76, 214, 12, 3, '#3be8ff');
      px(104, 214, 18, 3, '#ffcf48');

      // Right CRT stand with consoles
      px(162, 150, 56, 86, '#181a22');
      px(164, 152, 52, 2, '#343846');
      px(164, 178, 52, 2, '#343846');
      px(164, 206, 52, 2, '#343846');
      px(168, 162, 22, 12, '#2b2d38');
      px(194, 160, 18, 14, '#c82b36'); // Switch / red dock accent
      px(168, 188, 42, 14, '#22242e');
      px(172, 214, 34, 14, '#1d202a');

      // Dreamcast + controllers + tangled cords on carpet in front of rack (direct from room-2!)
      px(62, 240, 20, 11, '#e6e2d8');
      px(70, 243, 4, 3, '#ff5c28'); // Dreamcast orange swirl
      ctx.strokeStyle = '#18161a';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(72, 251);
      ctx.quadraticCurveTo(84, 262, 98, 258);
      ctx.moveTo(114, 236);
      ctx.quadraticCurveTo(122, 252, 134, 260);
      ctx.stroke();
    }

    function drawCoffeeTableAndRig(time) {
      // Coffee table sits IN FRONT of the recliners (between crew & TVs!)
      const tx = 62;
      const ty = 258;
      const tw = 136;
      const th = 34;

      // Table floor shadow
      px(tx + 4, ty + th, tw - 8, 7, 'rgba(0,0,0,0.42)');
      // Table legs
      px(tx + 6, ty + th - 2, 5, 10, '#3a291c');
      px(tx + tw - 11, ty + th - 2, 5, 10, '#3a291c');
      // Table top
      roundedRect(tx, ty, tw, th, '#5e432c', 2);
      px(tx + 2, ty + 2, tw - 4, th - 6, '#75563a');
      px(tx + 2, ty + 2, tw - 4, 2, '#916e4c');

      // === MASSIVE STEEL BATTALION DUAL-STICK RIG (direct from room-2!) ===
      const rx = 76;
      const ry = 252;
      // White mounting board underneath
      px(rx - 4, ry + 18, 100, 12, '#ddd8cc');

      // Left stick module
      roundedRect(rx, ry + 6, 26, 22, '#1d2028', 2);
      px(rx + 2, ry + 8, 22, 14, '#2d3240');
      // Left flight stick handle
      px(rx + 11, ry - 6, 4, 16, '#14161c');
      px(rx + 9, ry - 8, 8, 6, '#363c4c');
      px(rx + 12, ry - 7, 2, 2, '#ff3b3b');

      // Center illuminated Steel Battalion button console!
      roundedRect(rx + 28, ry + 4, 36, 24, '#171a22', 2);
      px(rx + 30, ry + 6, 32, 18, '#262b38');
      // Glowing green/red tactical buttons
      const blink = Math.floor(time * 3) % 2 === 0;
      for (let bx = 0; bx < 5; bx++) {
        px(rx + 32 + bx * 6, ry + 9, 4, 3, bx === 0 && blink ? '#ff4444' : '#42e878');
        px(rx + 32 + bx * 6, ry + 15, 4, 3, bx === 4 ? '#ffca3a' : '#2db860');
      }
      // Tuner dial
      px(rx + 44, ry + 20, 6, 3, '#9aa4b8');

      // Right stick module
      roundedRect(rx + 66, ry + 6, 26, 22, '#1d2028', 2);
      px(rx + 68, ry + 8, 22, 14, '#2d3240');
      // Right flight stick handle
      px(rx + 77, ry - 6, 4, 16, '#14161c');
      px(rx + 75, ry - 8, 8, 6, '#363c4c');
      px(rx + 78, ry - 7, 2, 2, '#ff3b3b');

      // === GREY/SILVER HELMET resting near right side of rig (direct from room-2!) ===
      const hx = 176;
      const hy = 258;
      pill(hx, hy, 18, 13, '#6e7480');
      pill(hx + 2, hy + 1, 14, 7, '#9ca3b0');
      px(hx + 5, hy + 2, 6, 2, '#d4dbe6'); // specular
      px(hx + 4, hy + 6, 10, 2, '#323640'); // helmet vent

      // === BLACK BOX WITH BLUE BALL-TOP ARCADE STICK on left table corner (direct from room-3!) ===
      const ax = 42;
      const ay = 274;
      roundedRect(ax, ay, 18, 14, '#14161d', 2);
      px(ax + 2, ay + 2, 14, 9, '#242836');
      px(ax + 8, ay - 6, 2, 9, '#b8c4d8'); // stick shaft
      pill(ax + 6, ay - 10, 6, 6, '#2e90ff'); // iconic bright blue ball-top!
      px(ax + 7, ay - 9, 2, 2, '#8fd0ff');
      px(ax + 12, ay + 4, 3, 3, '#2e90ff'); // blue arcade button
    }

    // Draw CONNECTED extended footrests & stretched-out legs/socks for reclined seats (Layer 1 — farthest forward)
    function drawExtendedFootrest(cx, topY, c) {
      const seatFrontY = topY + 4;
      px(cx - 9, seatFrontY - 20, 18, 22, 'rgba(0,0,0,0.28)');
      roundedRect(cx - 8, seatFrontY - 18, 16, 22, '#8b7457', 3);
      roundedRect(cx - 7, seatFrontY - 17, 14, 19, '#d8c7ab', 2);
      px(cx - 6, seatFrontY - 17, 12, 3, '#f4ead6');
      px(cx - 7, seatFrontY - 9, 14, 2, '#8b7558');

      px(cx - 6, seatFrontY - 15, 5, 16, c.pantsCol);
      px(cx + 1, seatFrontY - 15, 5, 16, c.pantsCol);
      pill(cx - 7, seatFrontY - 21, 5, 7, c.sockCol);
      pill(cx + 2, seatFrontY - 20, 5, 7, c.sockCol);
      px(cx - 5, seatFrontY - 20, 2, 2, 'rgba(255,255,255,0.28)');
      px(cx + 4, seatFrontY - 19, 2, 2, 'rgba(255,255,255,0.28)');
    }

    // Draw forward console armrest WITH recessed black cup holder (drawn BEFORE chair backs so arms sit IN FRONT of seats!)
    function drawForwardArmrest(ax, ay, propType) {
      const aw = 9;
      roundedRect(ax, ay - 4, aw, 32, '#7d684c', 3);
      roundedRect(ax + 1, ay - 3, aw - 2, 27, '#d7c6aa', 2);
      px(ax + 2, ay - 3, aw - 4, 5, '#f4ead6');

      const chY = ay + 1;
      pill(ax + 1, chY, 7, 6, '#141212');
      px(ax + 2, chY + 1, 5, 4, '#2a2624');
      px(ax + 3, chY + 2, 3, 2, '#080707');

      if (propType === 'beerCan') {
        px(ax + 2, chY - 5, 5, 8, '#e8c432');
        px(ax + 2, chY - 5, 5, 2, '#e2e8f0');
        px(ax + 3, chY - 2, 3, 3, '#c9322c');
      } else if (propType === 'redCup') {
        px(ax + 2, chY - 5, 5, 8, '#d42c30');
        px(ax + 2, chY - 5, 5, 1, '#f4f0e8');
      } else if (propType === 'remote') {
        px(ax + 2, ay + 10, 5, 10, '#e6e4de');
        px(ax + 3, ay + 12, 3, 2, '#4a5262');
      } else if (propType === 'glass') {
        px(ax + 2, chY - 4, 5, 7, '#b4d2dc');
        px(ax + 3, chY - 1, 3, 3, '#e0c682');
      }
    }

    // Draw the BACK of a crew member's head & shoulders (Option B crisp proportions, backs of heads ONLY, ZERO faces!)
    function drawSitterBack(c, cx, headTopY, isFolding = false) {
      const hx = Math.round(cx);
      const hy = Math.round(headTopY);
      const hw = 14;
      const hh = 13;

      // Shoulders (tucked inside headrest for recliners; visible above metal folding backrest for folding chairs!)
      roundedRect(hx - 9, hy + 13, 18, isFolding ? 16 : 10, c.shirtShade, 2);
      roundedRect(hx - 8, hy + 13, 16, isFolding ? 14 : 8, c.shirt, 2);
      // Neck
      px(hx - 3, hy + 11, 6, 3, '#b88a68');

      // Ears
      px(hx - 8, hy + 5, 2, 4, '#c89974');
      px(hx + 6, hy + 5, 2, 4, '#c89974');

      // Back of head / hair
      if (c.hairType === 'cap') {
        roundedRect(hx - 7, hy, hw, hh, c.hairShade, 3);
        roundedRect(hx - 6, hy + 1, hw - 2, hh - 3, c.hair, 2);
        px(hx - 5, hy + 1, hw - 4, 2, c.hairHi);
        // Back snapback strap opening
        px(hx - 3, hy + 9, 6, 2, '#c89b78');
        px(hx - 3, hy + 10, 6, 1, '#12141a');
      } else if (c.hairType === 'long') {
        // Brendan: long dark hair falling past shoulders over the folding chair back!
        roundedRect(hx - 7, hy, hw, hh + 12, c.hairShade, 3);
        roundedRect(hx - 6, hy + 1, hw - 2, hh + 9, c.hair, 2);
        px(hx - 5, hy + 2, hw - 4, 3, c.hairHi);
      } else if (c.hairType === 'wave') {
        roundedRect(hx - 7, hy, hw, hh, c.hairShade, 3);
        roundedRect(hx - 6, hy + 1, hw - 2, hh - 2, c.hair, 2);
        px(hx - 5, hy + 1, hw - 4, 3, c.hairHi);
        px(hx - 5, hy + 6, 4, 2, c.hairHi);
        px(hx + 1, hy + 7, 4, 2, c.hairHi);
      } else if (c.hairType === 'buzz') {
        roundedRect(hx - 6, hy + 1, hw - 2, hh - 1, '#c89974', 3);
        roundedRect(hx - 6, hy, hw - 2, hh - 4, c.hair, 3);
        px(hx - 4, hy + 1, hw - 6, 2, c.hairHi);
      } else if (c.hairType === 'sweep') {
        roundedRect(hx - 7, hy, hw, hh, c.hairShade, 3);
        roundedRect(hx - 6, hy + 1, hw - 2, hh - 2, c.hair, 3);
        px(hx - 5, hy + 1, 9, 3, c.hairHi);
        px(hx - 4, hy + 6, 8, 2, c.hairHi);
      } else if (c.hairType === 'full') {
        roundedRect(hx - 7, hy, hw, hh, c.hairShade, 3);
        roundedRect(hx - 6, hy + 1, hw - 2, hh - 2, c.hair, 2);
        px(hx - 5, hy + 1, hw - 4, 3, c.hairHi);
      } else {
        roundedRect(hx - 7, hy, hw, hh, c.hairShade, 3);
        roundedRect(hx - 6, hy + 1, hw - 2, hh - 2, c.hair, 2);
        px(hx - 5, hy + 1, hw - 4, 3, c.hairHi);
      }
    }

    // Draw ONE Option-B style plush, overstuffed cream-tan leather recliner (slimmed slightly so 6 fit cleanly in 1 row!)
    function drawOptionBRecliner(cx, topY, c) {
      const seatW = 27;
      const lx = Math.round(cx - seatW / 2);

      // Floor shadow behind reclined shell
      px(lx - 1, topY + 56, seatW + 2, 9, 'rgba(0,0,0,0.52)');

      // Giant sculpted plush headrest pillow dome (Option B style)
      roundedRect(lx, topY + 1, seatW, 24, '#887154', 5);
      roundedRect(lx + 1, topY + 2, seatW - 2, 21, '#e6d7bd', 4);
      roundedRect(lx + 4, topY + 3, seatW - 8, 4, '#f8f0e0', 2);
      // Soft concave pillow dimple where the head sinks in
      roundedRect(lx + 6, topY + 7, seatW - 12, 13, '#c5b190', 3);

      // Sitter sunk deep into the headrest!
      drawSitterBack(c, cx, topY + 4, false);

      // Wide bulging tufted lumbar back leaning BACK toward camera (cleanly overlapping rear of forward armrests!)
      const by = topY + 24;
      px(lx + 2, by - 1, seatW - 4, 2, '#5c4732');
      roundedRect(lx - 1, by + 1, seatW + 2, 26, '#756046', 5);
      roundedRect(lx, by + 2, seatW, 23, '#d9c8ac', 4);
      roundedRect(lx + 4, by + 3, seatW - 8, 5, '#f3e9d6', 2);
      // Center vertical leather tuft crease
      px(cx - 1, by + 9, 2, 11, '#a68f70');
      px(lx + 3, by + 22, seatW - 6, 3, '#968062');

      // Lower reclined skirt + dark mechanical base rail
      roundedRect(lx, by + 26, seatW, 10, '#69553e', 2);
      roundedRect(lx + 1, by + 27, seatW - 2, 7, '#bfa989', 1);
      px(lx + 4, by + 34, seatW - 8, 3, '#1a1714');
    }

    // Draw ONE classic black metal folding chair (1 on far left for Sudz, 2 on far right for Brendan & Dave!)
    function drawFoldingChair(cx, topY, c) {
      const cw = 20;
      const lx = Math.round(cx - cw / 2);

      // Floor shadow beneath slender metal legs
      px(lx + 1, topY + 61, cw - 2, 6, 'rgba(0,0,0,0.45)');

      // Sitter seated in folding chair (backs of heads ONLY, ZERO faces!)
      drawSitterBack(c, cx, topY + 7, true);

      // Tubular steel frame legs & arched back rail
      const frameCol = '#586070';
      const frameHi = '#848fa3';
      const frameDark = '#2a2f3a';

      // Left & right rear tubular legs angled down to carpet
      px(lx + 1, topY + 24, 2, 39, frameCol);
      px(lx + 1, topY + 24, 1, 37, frameHi);
      px(lx + cw - 3, topY + 24, 2, 39, frameCol);
      px(lx + cw - 2, topY + 24, 1, 37, frameDark);
      // Rubber feet
      px(lx, topY + 61, 3, 3, '#14161c');
      px(lx + cw - 3, topY + 61, 3, 3, '#14161c');

      // Horizontal rear steel cross-brace between legs
      px(lx + 3, topY + 51, cw - 6, 2, frameCol);
      px(lx + 3, topY + 52, cw - 6, 1, frameDark);

      // Rear edge of folding seat pan (visible under lower back gap!)
      px(lx + 2, topY + 42, cw - 4, 4, '#1b1e26');
      px(lx + 3, topY + 43, cw - 6, 2, '#2d3240');

      // Black padded vinyl backrest panel (iconic folding-chair silhouette with open gap underneath!)
      roundedRect(lx, topY + 22, cw, 16, frameCol, 3);
      roundedRect(lx + 1, topY + 23, cw - 2, 14, '#1c1f28', 2);
      px(lx + 3, topY + 24, cw - 6, 2, '#343a4a'); // subtle vinyl highlight
      px(lx + 3, topY + 34, cw - 6, 2, '#111318');

      // Dave's red grade book resting right beside him on his right folding tray/lap edge!
      if (c.isDave) {
        // Small wooden TV-tray / side ledge holding Dave's grade book at the far right
        px(lx + cw - 1, topY + 36, 9, 3, '#5e432c');
        px(lx + cw + 2, topY + 39, 2, 23, '#3a291c');
        roundedRect(lx + cw - 2, topY + 24, 10, 13, '#9e1f26', 1);
        px(lx + cw, topY + 26, 6, 9, '#f4efe2');
        px(lx + cw + 1, topY + 28, 4, 1, '#2a3448');
        px(lx + cw + 1, topY + 31, 4, 1, '#2a3448');
        px(lx + cw + 1, topY + 33, 3, 1, '#c9322c');
      }
    }

    function drawReclinerRow() {
      // Layout: 1 folding chair left (Sudz) · 6 Option-B recliners middle (Scott..Brad) · 2 folding chairs right (Brendan, Dave)
      // All in ONE continuous curved theater row across W = 260!
      const xs = [
        13,   // 0: Sudz (folding chair, far left)
        44,   // 1: Scott (recliner)
        74,   // 2: Brent (recliner)
        104,  // 3: Brian (recliner)
        134,  // 4: Steve (recliner)
        164,  // 5: Chris (recliner)
        194,  // 6: Brad (recliner)
        220,  // 7: Brendan (folding chair, right)
        240,  // 8: Dave (folding chair, far right + grade book fully in-frame)
      ];
      const topYs = [
        343,  // Sudz
        336,  // Scott
        332,  // Brent
        330,  // Brian
        330,  // Steve
        332,  // Chris
        336,  // Brad
        341,  // Brendan
        344,  // Dave
      ];

      // LAYER 1 (FARTHEST FORWARD): Connected extended footrests on 3 of the 6 middle recliners (Brent, Steve, Brad)
      for (const idx of [2, 4, 6]) {
        drawExtendedFootrest(xs[idx], topYs[idx], CREW[idx]);
      }

      // LAYER 2 (IN FRONT OF RECLINER BACKS): Wide forward cup-holder console armrests for the 6 middle recliners!
      // Drawn BEFORE the recliner backs so the reclined backrests cleanly overlap the rear of the armrests!
      const armProps = {
        0: 'glass',   // outer left arm of Scott's recliner
        1: 'beerCan', // between Scott & Brent
        3: 'remote',  // between Brian & Steve
        5: 'redCup',  // between Chris & Brad
      };
      for (let a = 0; a <= 6; a++) {
        const ax = a === 0
          ? xs[1] - 18
          : a === 6
            ? xs[6] + 10
            : Math.round((xs[a] + xs[a + 1]) / 2 - 4);
        const ay = a === 0
          ? topYs[1]
          : a === 6
            ? topYs[6]
            : Math.min(topYs[a], topYs[a + 1]);
        drawForwardArmrest(ax, ay + 2, armProps[a] || null);
      }

      // LAYER 3 (CLOSEST TO VIEWER): 6 plush Option-B recliners in the center + 3 black metal folding chairs on the ends!
      drawFoldingChair(xs[0], topYs[0], CREW[0]); // Sudz (left folding chair)
      for (let i = 1; i <= 6; i++) {
        drawOptionBRecliner(xs[i], topYs[i], CREW[i]); // Scott..Brad (6 wide plush recliners)
      }
      drawFoldingChair(xs[7], topYs[7], CREW[7]); // Brendan (right folding chair)
      drawFoldingChair(xs[8], topYs[8], CREW[8]); // Dave (far-right folding chair + grade book)
    }

    function drawFooterOverlay(time, tapFlash) {
      const fy = 436;
      // Clean dark gradient band at bottom so roster & CTA pop cleanly
      const g = ctx.createLinearGradient(0, fy - 12, 0, H);
      g.addColorStop(0, 'rgba(6, 6, 14, 0)');
      g.addColorStop(0.22, 'rgba(6, 6, 14, 0.88)');
      g.addColorStop(1, 'rgba(4, 4, 10, 0.98)');
      ctx.fillStyle = g;
      ctx.fillRect(0, fy - 12, W, H - fy + 12);

      // videogamecritic.com styled UNLOCKS / FAVORITES button (matching shell identity)
      const bx = 40;
      const by = 446;
      const bw = 180;
      const bh = 22;
      px(bx, by, bw, 2, '#90ee90');
      px(bx, by + 2, bw, bh - 2, '#000080');
      ctx.strokeStyle = '#3846a8';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 2.5, bw - 1, bh - 3);
      ctx.font = 'bold 9px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('★ UNLOCKS · FAVORITES', W / 2, by + 13);

      // Crew seating roster matching exact left-to-right order
      ctx.font = 'bold 7.5px "Courier New", monospace';
      ctx.fillStyle = '#d4cbb8';
      ctx.fillText('SUDZ · SCOTT · BRENT · BRIAN · STEVE', W / 2, 482);
      ctx.fillText('CHRIS · BRAD · BRENDAN · DAVE', W / 2, 493);

      // Tagline in VGC link-green
      ctx.font = 'bold 8.5px "Courier New", monospace';
      ctx.fillStyle = '#90ee90';
      ctx.fillText('8 ROUNDS · 4 BEERS · ONE VERDICT', W / 2, 511);

      // Pulsing TAP TO START prompt
      const pulse = 0.65 + 0.35 * Math.sin(time * 4.5);
      ctx.save();
      ctx.globalAlpha = tapFlash > 0 ? 1 : pulse;
      ctx.font = 'bold 10px "Courier New", monospace';
      ctx.fillStyle = tapFlash > 0 ? '#90ee90' : '#ffcf48';
      ctx.fillText(tapFlash > 0 ? '★ STARTING GAME NIGHT! ★' : 'TAP TO START', W / 2, 531);
      ctx.restore();

      // Honest step-one room study note
      ctx.font = 'bold 6.5px "Courier New", monospace';
      ctx.fillStyle = 'rgba(180, 190, 215, 0.55)';
      ctx.fillText('STEP ONE — ROOM STUDY (NEON)', W / 2, 550);
    }

    let time = 0;
    let tapFlash = 0;
    let toastTimer = null;

    function render() {
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, W, H);
      drawMasthead(time);
      drawRoomArchitecture(time);
      drawTvWall(time);
      drawCoffeeTableAndRig(time);
      drawReclinerRow();
      drawFooterOverlay(time, tapFlash);

      // Brief arcade acknowledge flash on tap
      if (tapFlash > 0) {
        ctx.fillStyle = `rgba(144, 238, 144, ${tapFlash * 0.22})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function triggerTap() {
      unlockAudio();
      playStartChime();
      tapFlash = 1.0;
      tapToast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => tapToast.classList.remove('show'), 2200);
    }

    btnSfx.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      unlockAudio();
      muted = !muted;
      btnSfx.textContent = muted ? 'OFF' : 'SFX';
    });

    phoneFrame.addEventListener('pointerdown', (e) => {
      if (e.target === btnSfx) return;
      e.preventDefault();
      triggerTap();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        triggerTap();
      }
    });

    let lastTs = performance.now();
    function loop(ts) {
      const dt = Math.min((ts - lastTs) / 1000, 0.05);
      lastTs = ts;
      time += dt;
      if (tapFlash > 0) tapFlash = Math.max(0, tapFlash - dt * 2.2);
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    window.__roomStudy = {
      renderAt: (t = 1.2) => {
        time = t;
        tapFlash = 0;
        render();
      },
      tap: () => {
        triggerTap();
        render();
      },
      crewOrder: () => CREW.map((c) => c.name),
    };
  </script>

    var launched = false;

    function decodeGame() {
      var bin = atob(GAME_B64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder("utf-8").decode(bytes);
    }

    function startGameWhenReady(frame) {
      var tries = 0;
      var iv = setInterval(function () {
        tries++;
        try {
          var w = frame.contentWindow;
          if (w && w.__ready && w.__dbg) {
            clearInterval(iv);
            // Unlock the game's audio FIRST, while this call chain is
            // still as close to the player's room tap as possible, then
            // start the run (startRun also unlocks, belt and suspenders).
            try { if (w.__dbg.unlockAudio) w.__dbg.unlockAudio(); } catch (e) {}
            w.__dbg.startRun();
          }
        } catch (e) { /* iframe not ready yet */ }
        if (tries > 150) clearInterval(iv); // ~15 s cap
      }, 100);
    }

    var primed = false;
    function prime() {
      // Runs SYNCHRONOUSLY inside the room-tap gesture handler: creating
      // the iframe and booting the game now (while the browser still
      // counts the tap as user activation) is what lets the game's
      // AudioContext start instead of staying suspended until the mute
      // button is toggled. The frame stays hidden until launch().
      if (primed) return;
      primed = true;
      var frame = document.getElementById("gameFrame");
      frame.srcdoc = decodeGame();
      startGameWhenReady(frame);
    }

    function launch() {
      if (launched) return;
      launched = true;
      prime();
      var frame = document.getElementById("gameFrame");
      frame.style.display = "block";
      var shell = document.querySelector(".stage-shell");
      if (shell) shell.style.display = "none";
      document.body.style.background = "#000";
    }

    // The room's own tap is the trigger (its flash/toast fire first, in its
    // own handler); the SFX button stopPropagation()s, so it never launches.
    var pf = document.getElementById("phoneFrame");
    if (pf) pf.addEventListener("pointerdown", function () { prime(); setTimeout(launch, 500); });
    window.addEventListener("keydown", function (e) {
      if (e.code === "Space" || e.code === "Enter") { prime(); setTimeout(launch, 500); }
    });
  })();
