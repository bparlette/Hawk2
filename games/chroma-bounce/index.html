<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chroma Bounce — Colour-Gate Bounce Climber</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; overscroll-behavior:none;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif; color:#fff; }
  #game { position:fixed; inset:0; display:block; z-index:1; }
  #flash { position:fixed; inset:0; pointer-events:none; z-index:1050; opacity:0;
    box-shadow: inset 0 0 0 6px #fff, inset 0 0 42px 10px #fff; }
  .hud { position:fixed; z-index:1100; pointer-events:none; text-align:center; width:100%; }
  #scoreHud { top:calc(10px + env(safe-area-inset-top)); font-size:52px; font-weight:800; line-height:1;
    text-shadow:0 0 18px rgba(255,255,255,.45); }
  #bestHud { top:calc(66px + env(safe-area-inset-top)); font-size:14px; font-weight:600; letter-spacing:2px; color:#9aa3b2; }
  #speedHud { top:calc(88px + env(safe-area-inset-top)); font-size:12px; font-weight:700; letter-spacing:2px; color:#ff2e88; opacity:0; }
  .overlay { position:fixed; inset:0; z-index:1200; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; background:rgba(0,0,0,.45); }
  .overlay.hidden { display:none; }
  .overlay h1 { font-size:42px; font-weight:900; letter-spacing:1px; line-height:1.05;
    background:linear-gradient(90deg,#2ee6e6,#f7e733,#ff2e88,#8b3dff); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,46,136,.35)); }
  .overlay h2 { font-size:34px; font-weight:900; color:#ff2e88; text-shadow:0 0 16px rgba(255,46,136,.7); }
  .overlay p { margin-top:14px; font-size:16px; color:#dfe6f2; max-width:300px; line-height:1.45; }
  .overlay .big { font-size:64px; font-weight:900; margin-top:8px; }
  .overlay .tap { margin-top:26px; font-size:15px; font-weight:700; letter-spacing:3px; color:#fff; animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.35; transform:scale(.97);} 50%{opacity:1; transform:scale(1.03);} }
  .swatches { display:flex; gap:10px; margin-top:18px; }
  .swatches span { width:22px; height:22px; border-radius:50%; box-shadow:0 0 12px currentColor; background:currentColor; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="flash"></div>
<div class="hud" id="scoreHud">0</div>
<div class="hud" id="bestHud">BEST 0</div>
<div class="hud" id="speedHud">SPEED UP!</div>

<div class="overlay" id="startOverlay">
  <h1>CHROMA<br>BOUNCE</h1>
  <p>Tap to bounce. Climb through each spinning gate on the segment that matches your ball — grab a star to swap colour.</p>
  <div class="swatches">
    <span style="color:#2ee6e6"></span><span style="color:#f7e733"></span><span style="color:#ff2e88"></span><span style="color:#8b3dff"></span>
  </div>
  <div class="tap">TAP TO BOUNCE</div>
</div>

<div class="overlay hidden" id="overOverlay">
  <h2>WRONG COLOUR!</h2>
  <div class="big" id="finalScore">0</div>
  <p id="finalBest">BEST 0</p>
  <div class="tap">TAP TO RETRY</div>
</div>

<script>
'use strict';
/* Chroma Bounce — original colour-gate bounce climber. Vanilla JS, 2D canvas, no libraries. */

// ---------- gesture / zoom blocking ----------
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 350) e.preventDefault();
  lastTouchEnd = now;
}, { passive:false });

// ---------- palette (one consistent set everywhere) ----------
const COLOURS = ['#2ee6e6', '#f7e733', '#ff2e88', '#8b3dff']; // cyan, yellow, pink, purple
const COLOUR_NAMES = ['cyan', 'yellow', 'pink', 'purple'];

// ---------- canvas ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- tiny synth ----------
let AC = null;
function beep(freq, dur, type, vol, slide) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, AC.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  } catch (e) { /* audio is garnish */ }
}

// ---------- game constants ----------
const GRAV = 2050;          // px/s^2
const BOUNCE_VY = -880;     // tap impulse
const BALL_R = 13;
const GATE_SPACING = 335;
const FIRST_GATE_Y = -300;  // world y of gate 1 (up is negative)
const STAR_GAP = 168;       // star sits this far above its gate

// ---------- state ----------
let phase = 'start';        // start | play | dead
let ball, camTop, gates, stars, particles, score, best, flashT, shakeT, deadT;
let flyby = null;           // milestone pelican flyby {t} — pure dressing, no gameplay effect
best = parseInt(localStorage.getItem('chromaBounceBest') || '0', 10) || 0;

function speedMul() { return Math.min(1 + 0.13 * Math.floor(score / 10), 2.6); }
function milestone() { return Math.floor(score / 10); }

function gateType(n) { // n = 1-based gate number
  if (n <= 3) return 'ring';
  const seq = ['ring', 'cross', 'ring', 'double', 'pinwheel', 'cross', 'double', 'ring'];
  return seq[n % seq.length];
}

function makeGate(i) { // i = 0-based
  const n = i + 1;
  return {
    n, type: gateType(n),
    y: FIRST_GATE_Y - i * GATE_SPACING,
    rot: Math.random() * Math.PI * 2,
    dir: i % 2 === 0 ? 1 : -1,
    baseSpeed: 0.85 + Math.min(i * 0.012, 0.5),
    offset: Math.floor(Math.random() * 4),
    passed: false,
  };
}
function makeStar(i) { // star above gate i
  return { y: FIRST_GATE_Y - i * GATE_SPACING - STAR_GAP, taken: false, spin: Math.random() * 6 };
}

function reset() {
  ball = { y: 0, vy: 0, colour: Math.floor(Math.random() * 4), trail: [] };
  camTop = -H * 0.62;
  gates = []; stars = []; particles = [];
  for (let i = 0; i < 6; i++) { gates.push(makeGate(i)); stars.push(makeStar(i)); }
  score = 0; flashT = 0; shakeT = 0; deadT = 0; flyby = null;
  updateHud();
}
function ensureAhead() {
  const topY = gates[gates.length - 1].y;
  if (ball.y - H < topY) {
    const i = gates.length;
    gates.push(makeGate(i)); stars.push(makeStar(i));
  }
  while (gates.length && gates[0].y - camTop > H + 500) { gates.shift(); stars.shift(); }
}

function updateHud() {
  document.getElementById('scoreHud').textContent = score;
  document.getElementById('bestHud').textContent = 'BEST ' + best;
}

// ---------- colour helpers ----------
// colour index of the segment at world angle a (radians, atan2 frame) for a gate
function segColourAt(gate, a) {
  const TAU = Math.PI * 2;
  let local = (a - gate.rot) % TAU; if (local < 0) local += TAU;
  const seg = Math.floor(local / (Math.PI / 2)) % 4;
  return (seg + gate.offset) % 4;
}
// colour of the arm of a cross pointing along world angle a
function armColourAt(gate, a) {
  const TAU = Math.PI * 2;
  let local = (a - gate.rot) % TAU; if (local < 0) local += TAU;
  const arm = Math.round(local / (Math.PI / 2)) % 4;
  return (arm + gate.offset) % 4;
}

// ---------- collision: returns colour index hit, or -1 ----------
function collideGate(g) {
  // Entry-side + rising only: once the ball's centre crosses the gate's centre
  // plane it has legally entered on the approach segment, so the far arc never
  // kills; and a ball falling back down through a gate it hasn't cleared yet
  // gets a second try — only the upward attempt is judged.
  if (ball.y <= g.y) return -1;
  if (ball.vy >= 0) return -1;
  const dy = ball.y - g.y; // ball x is always centre; ball is below the gate
  const d = Math.abs(dy);
  const ang = Math.PI / 2;
  if (g.type === 'ring') {
    const R = 88;
    if (Math.abs(d - R) < 15 + BALL_R - 4) return segColourAt(g, ang);
  } else if (g.type === 'double') {
    if (Math.abs(d - 106) < 13 + BALL_R - 4) return segColourAt(g, ang);
    if (Math.abs(d - 64) < 13 + BALL_R - 4) {
      // inner ring rotates the other way: fake a gate view with reversed rotation
      return segColourAt({ rot: -g.rot * 1.35, offset: (g.offset + 1) % 4 }, ang);
    }
  } else if (g.type === 'pinwheel') {
    if (d < 100 + BALL_R - 4 && d > 6) return segColourAt(g, ang);
  } else if (g.type === 'cross') {
    // transform ball offset into the cross's rotating frame
    const lx = Math.cos(-g.rot) * 0 - Math.sin(-g.rot) * dy;
    const ly = Math.sin(-g.rot) * 0 + Math.cos(-g.rot) * dy;
    const halfT = 15, armLen = 108;
    if (Math.abs(ly) < halfT + BALL_R - 4 && Math.abs(lx) < armLen) return armColourAt(g, Math.atan2(0, lx >= 0 ? 1 : -1) + (lx >= 0 ? 0 : Math.PI));
    if (Math.abs(lx) < halfT + BALL_R - 4 && Math.abs(ly) < armLen) return armColourAt(g, ly >= 0 ? Math.PI / 2 : -Math.PI / 2);
  }
  return -1;
}

// ---------- effects ----------
const flashEl = document.getElementById('flash');
function edgeFlash(colourIdx) {
  const c = COLOURS[colourIdx];
  flashEl.style.boxShadow = 'inset 0 0 0 6px ' + c + ', inset 0 0 46px 12px ' + c;
  flashEl.style.transition = 'none'; flashEl.style.opacity = '0.95';
  requestAnimationFrame(() => { flashEl.style.transition = 'opacity .45s ease-out'; flashEl.style.opacity = '0'; });
}
function burst(x, y, colourIdx, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random() * 0.7) * (spd || 260);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.55, t: 0, c: COLOURS[colourIdx], r: 2 + Math.random() * 3.5 });
  }
}

// ---------- flow ----------
function bounce() {
  if (phase === 'start') {
    phase = 'play';
    document.getElementById('startOverlay').classList.add('hidden');
  } else if (phase === 'dead') {
    if (deadT < 0.25) return; // avoid the death tap instantly restarting
    document.getElementById('overOverlay').classList.add('hidden');
    reset(); phase = 'play';
  }
  if (phase !== 'play') return;
  ball.vy = BOUNCE_VY;
  beep(300 + ball.colour * 60, 0.09, 'sine', 0.10, 520);
}
function die() {
  phase = 'dead'; deadT = 0; shakeT = 0.35;
  burst(W / 2, ball.y - camTop, ball.colour, 30, 340);
  beep(160, 0.35, 'sawtooth', 0.12, 40);
  if (score > best) { best = score; localStorage.setItem('chromaBounceBest', String(best)); }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = 'BEST ' + best + (score >= 10 ? '  ·  SPEED LEVEL ' + (milestone() + 1) : '');
  document.getElementById('overOverlay').classList.remove('hidden');
  updateHud();
}
function passGate(g) {
  g.passed = true; score++;
  burst(W / 2, g.y - camTop, ball.colour, 16, 220);
  beep(660, 0.12, 'triangle', 0.12, 990);
  if (score % 10 === 0) {
    flyby = { t: 0 }; // the pelican celebrates every milestone
    const sh = document.getElementById('speedHud');
    sh.textContent = 'SPEED UP! NEW SHAPES!';
    sh.style.transition = 'none'; sh.style.opacity = '1';
    setTimeout(() => { sh.style.transition = 'opacity .8s'; sh.style.opacity = '0'; }, 900);
    beep(880, 0.2, 'square', 0.08, 1320);
  }
  updateHud();
}
function takeStar(s) {
  s.taken = true;
  let next = ball.colour;
  while (next === ball.colour) next = Math.floor(Math.random() * 4);
  ball.colour = next;
  edgeFlash(next);
  burst(W / 2, s.y - camTop, next, 20, 240);
  beep(520, 0.16, 'triangle', 0.13, 1040);
}

// ---------- update ----------
function update(dt) {
  for (const g of gates) g.rot += g.dir * g.baseSpeed * speedMul() * dt;
  for (const s of stars) s.spin += dt * 2.2;
  for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; }
  particles = particles.filter(p => p.t < p.life);
  if (flyby) { flyby.t += dt; if (flyby.t > 2.4) flyby = null; }
  if (shakeT > 0) shakeT -= dt;
  if (phase === 'dead') { deadT += dt; return; }
  if (phase !== 'play') return;

  ball.vy += GRAV * dt;
  ball.y += ball.vy * dt;
  ball.trail.unshift({ y: ball.y, c: ball.colour });
  if (ball.trail.length > 12) ball.trail.pop();

  // camera only climbs
  const target = ball.y - H * 0.62;
  if (target < camTop) camTop += (target - camTop) * Math.min(1, dt * 10);

  ensureAhead();

  // stars
  for (const s of stars) {
    if (!s.taken && Math.abs(ball.y - s.y) < BALL_R + 20) takeStar(s);
  }
  // gates
  for (const g of gates) {
    if (g.passed) continue;
    const hit = collideGate(g);
    if (hit >= 0 && hit !== ball.colour) { die(); return; }
    if (ball.y < g.y - 10) passGate(g); // centre crossed upward = gate cleared
  }
  // fell off the bottom
  if (ball.y - camTop > H + 30) die();
}

// ---------- drawing ----------
function drawGateShape(g, cy) {
  const cx = W / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(g.rot);
  ctx.lineCap = 'butt';
  // Neon glow WITHOUT shadowBlur (murderously slow in software renderers):
  // a wide, faint stroke under the main stroke reads the same at phone size.
  const seg = (R, width, inner) => {
    for (let i = 0; i < 4; i++) {
      const a0 = i * Math.PI / 2 + 0.02, a1 = (i + 1) * Math.PI / 2 - 0.02;
      ctx.strokeStyle = COLOURS[(i + g.offset) % 4];
      ctx.globalAlpha = 0.15; ctx.lineWidth = width + 13;
      ctx.beginPath(); ctx.arc(0, 0, R, a0, a1); ctx.stroke();
      ctx.globalAlpha = 0.28; ctx.lineWidth = width + 5;
      ctx.beginPath(); ctx.arc(0, 0, R, a0, a1); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = width;
      ctx.beginPath(); ctx.arc(0, 0, R, a0, a1); ctx.stroke();
    }
  };
  if (g.type === 'ring') seg(88, 26, false);
  else if (g.type === 'double') { seg(106, 22, false); ctx.save(); ctx.rotate(-g.rot * 2.35); seg(64, 22, true); ctx.restore(); }
  else if (g.type === 'pinwheel') {
    for (let i = 0; i < 4; i++) {
      const a0 = i * Math.PI / 2 + 0.03, a1 = (i + 1) * Math.PI / 2 - 0.03;
      ctx.fillStyle = COLOURS[(i + g.offset) % 4];
      ctx.globalAlpha = 0.18;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 106, a0, a1); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 100, a0, a1); ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.fillStyle = '#000'; ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
  } else if (g.type === 'cross') {
    const armLen = 108, halfT = 15;
    for (let i = 0; i < 4; i++) {
      ctx.save(); ctx.rotate(i * Math.PI / 2);
      ctx.fillStyle = COLOURS[(i + g.offset) % 4];
      ctx.globalAlpha = 0.18; ctx.fillRect(-3, -halfT - 6, armLen + 6, (halfT + 6) * 2);
      ctx.globalAlpha = 1; ctx.fillRect(0, -halfT, armLen, halfT * 2);
      ctx.restore();
    }
    ctx.beginPath(); ctx.fillStyle = '#0a0a12'; ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  // gate number
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.font = '700 12px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(String(g.n), cx, cy + 4);
}
function drawStar(s, cy) {
  const cx = W / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(s.spin);
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = COLOURS[i];
    ctx.globalAlpha = 0.2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 24, i * Math.PI / 2, (i + 1) * Math.PI / 2); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 19, i * Math.PI / 2, (i + 1) * Math.PI / 2); ctx.closePath(); ctx.fill();
  }
  ctx.rotate(-s.spin * 2);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); // 4-point sparkle
  ctx.moveTo(0, -13); ctx.quadraticCurveTo(2.5, -2.5, 13, 0); ctx.quadraticCurveTo(2.5, 2.5, 0, 13);
  ctx.quadraticCurveTo(-2.5, 2.5, -13, 0); ctx.quadraticCurveTo(-2.5, -2.5, 0, -13);
  ctx.fill();
  ctx.restore();
}
// The house pelican: perches on the start pad, and tows a flag in the ball's
// colour across the screen at every 10-gate milestone. Dressing only.
function drawPelican(x, y, s, flap, perched, flagColour) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // tail feathers
  ctx.fillStyle = '#dfe6ee';
  ctx.beginPath(); ctx.moveTo(-16, -2); ctx.lineTo(-27, -7); ctx.lineTo(-25, 2); ctx.lineTo(-27, 8); ctx.lineTo(-15, 5); ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(0, 0, 19, 11, -0.12, 0, Math.PI * 2); ctx.fill();
  // wing (flaps when flying, folded when perched)
  ctx.fillStyle = '#eef3f8';
  ctx.save(); ctx.translate(-2, -4); ctx.rotate(perched ? 0.5 : Math.sin(flap) * 0.55 - 0.15);
  ctx.beginPath(); ctx.ellipse(-6, 0, 13, 5.5, 0.25, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // neck + head
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(12, -5); ctx.quadraticCurveTo(19, -12, 22, -11); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(23, -11, 6, 0, Math.PI * 2); ctx.fill();
  // crest
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(19, -15); ctx.quadraticCurveTo(15, -19, 12, -18); ctx.stroke();
  // long beak + pouch
  ctx.fillStyle = '#ff9f1c';
  ctx.beginPath(); ctx.moveTo(27, -13); ctx.lineTo(46, -8); ctx.lineTo(27, -7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffb85c';
  ctx.beginPath(); ctx.moveTo(28, -8); ctx.quadraticCurveTo(37, -1, 44, -7); ctx.quadraticCurveTo(36, -5, 28, -6); ctx.closePath(); ctx.fill();
  // eye
  ctx.fillStyle = '#101018';
  ctx.beginPath(); ctx.arc(24.5, -12, 1.5, 0, Math.PI * 2); ctx.fill();
  if (perched) { // legs on the pad
    ctx.strokeStyle = '#ff9f1c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-3, 10); ctx.lineTo(-3, 17); ctx.moveTo(5, 10); ctx.lineTo(5, 17); ctx.stroke();
  }
  if (flagColour) { // towed milestone flag in the ball's colour
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-26, -4); ctx.quadraticCurveTo(-36, -8, -44, -5); ctx.stroke();
    ctx.fillStyle = flagColour; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.moveTo(-44, -11); ctx.lineTo(-58, -7); ctx.lineTo(-44, -2); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // faint starfield dots, parallax with camera
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  for (let i = 0; i < 40; i++) {
    const x = (i * 97.3) % W, y = ((i * 173.7 - camTop * 0.35) % (H + 20) + H + 20) % (H + 20) - 10;
    ctx.fillRect(x, y, 2, 2);
  }
  let ox = 0, oy = 0;
  if (shakeT > 0) { ox = (Math.random() - 0.5) * 12 * shakeT; oy = (Math.random() - 0.5) * 12 * shakeT; }
  ctx.save(); ctx.translate(ox, oy);
  for (const s of stars) if (!s.taken) { const cy = s.y - camTop; if (cy > -60 && cy < H + 60) drawStar(s, cy); }
  for (const g of gates) { const cy = g.y - camTop; if (cy > -160 && cy < H + 160) drawGateShape(g, cy); }
  // start pad (+ perched pelican while it's on screen)
  const padY = 26 - camTop;
  if (padY < H + 30) {
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W / 2 - 70, padY); ctx.lineTo(W / 2 + 70, padY); ctx.stroke();
    if (padY > -40) drawPelican(W / 2 + 108, padY - 17, 0.9, 0, true, null);
  }
  // milestone pelican flyby (screen space, above the world)
  if (flyby) {
    const fx = -90 + (W + 180) * (flyby.t / 2.4);
    drawPelican(fx, 150 + Math.sin(flyby.t * 5) * 8, 1.05, flyby.t * 16, false, COLOURS[ball.colour]);
  }
  // trail + ball
  if (phase !== 'dead') {
    ball.trail.forEach((t, i) => {
      ctx.globalAlpha = 0.16 * (1 - i / ball.trail.length);
      ctx.fillStyle = COLOURS[t.c];
      ctx.beginPath(); ctx.arc(W / 2, t.y - camTop, BALL_R * (1 - i / 22), 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    const by = ball.y - camTop, c = COLOURS[ball.colour];
    ctx.fillStyle = c;
    ctx.globalAlpha = 0.18; ctx.beginPath(); ctx.arc(W / 2, by, BALL_R + 11, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(W / 2, by, BALL_R + 5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(W / 2, by, BALL_R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(W / 2 - 4, by - 4, 4, 0, Math.PI * 2); ctx.fill();
  }
  for (const p of particles) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---------- main loop ----------
let lastTs = 0, frozen = false;
function frame(ts) {
  if (frozen) { draw(); requestAnimationFrame(frame); return; } // QA freeze: state static, frames keep flowing for screenshots
  const dt = Math.min((ts - lastTs) / 1000 || 0.016, 0.033);
  lastTs = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}

// ---------- input: one verb ----------
window.addEventListener('pointerdown', e => { e.preventDefault(); bounce(); });
window.addEventListener('mousedown', e => { e.preventDefault(); bounce(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) bounce(); }
});

// ---------- debug / QA surface ----------
function nextGate() { return gates.find(g => !g.passed) || null; }
function threatColour(g) {
  if (!g) return -1;
  const ang = ball.y >= g.y ? Math.PI / 2 : -Math.PI / 2;
  if (g.type === 'cross') return armColourAt(g, ang);
  return segColourAt(g, ang);
}
window.__chroma = {
  state() {
    const g = nextGate();
    const s = stars.find(x => !x.taken);
    return {
      phase, score, best, colour: ball ? ball.colour : -1, colourName: ball ? COLOUR_NAMES[ball.colour] : null,
      ballScreenY: ball ? ball.y - camTop : -1, vy: ball ? ball.vy : 0,
      speedMul: speedMul(),
      gate: g ? { n: g.n, type: g.type, screenY: g.y - camTop, threat: threatColour(g), dist: Math.abs(ball.y - g.y) } : null,
      star: s ? { screenY: s.y - camTop, dist: Math.abs(ball.y - s.y) } : null,
    };
  },
  threat() { return threatColour(nextGate()); },
  celebrate() { flyby = { t: 0 }; }, // QA hook: trigger the milestone flyby on demand
  freeze(on) { // QA hook: freeze/unfreeze game state for screenshots
    if (on && !frozen) frozen = true;
    else if (!on && frozen) { frozen = false; lastTs = 0; }
  },
  bounce,
};

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
