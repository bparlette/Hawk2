<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Traffic Hop — Delivery Dash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0f2e;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;z-index:1100;pointer-events:none;color:#fff;text-align:center;width:100%}
#score{top:calc(env(safe-area-inset-top,0px) + 10px);font-size:64px;font-weight:900;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 24px rgba(255,170,40,.5);letter-spacing:1px}
#sub{top:calc(env(safe-area-inset-top,0px) + 80px);font-size:14px;font-weight:700;opacity:.95;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:14px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.8);opacity:.95}
#whoosh{top:38%;font-size:34px;font-weight:900;color:#ffe66d;opacity:0;transform:rotate(-6deg);text-shadow:0 3px 0 #b3541e,0 0 18px rgba(255,200,0,.8)}
#overlay{position:fixed;inset:0;z-index:1200;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(20,8,30,.55);color:#fff;text-align:center;padding:24px;pointer-events:auto}
#overlay h1{font-size:42px;font-weight:900;margin-bottom:8px;text-shadow:0 4px 0 rgba(0,0,0,.4)}
#overlay p{font-size:18px;margin-bottom:20px;font-weight:600}
#retry{pointer-events:auto;background:#ffcf3f;color:#231200;border:none;border-radius:999px;padding:16px 34px;font-size:20px;font-weight:900;box-shadow:0 6px 0 #c47f00;cursor:pointer}
#title{position:fixed;z-index:1150;top:22%;width:100%;text-align:center;color:#fff;pointer-events:none}
#title h1{font-size:44px;font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.35)}
#title p{font-weight:700;text-shadow:0 2px 5px rgba(0,0,0,.7);margin-top:6px}
</style></head><body>
<canvas id="c"></canvas>
<div class="ui" id="score">0</div>
<div class="ui" id="sub">📦 TRAFFIC HOP</div>
<div class="ui" id="whoosh">WHOOSH! 💨</div>
<div id="title"><h1>TRAFFIC HOP</h1><p>Deliver the parcel. Don't stop.</p></div>
<div class="ui" id="hint">TAP to hop forward · SWIPE to dodge</div>
<div id="overlay"><h1 id="deathTitle">SPLAT!</h1><p id="deathText"></p><button id="retry">↻ HOP AGAIN</button></div>
<script>
'use strict';
// Block double-tap zoom / gestures
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
let lastTouch=0; document.addEventListener('touchend',e=>{const n=Date.now(); if(n-lastTouch<300) e.preventDefault(); lastTouch=n;},{passive:false});
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=390,H=844,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const COLS=9, MID=4;
// Seeded RNG per row
function rng(seed){let a=seed*2654435761>>>0;return()=>{a^=a<<13;a^=a>>>17;a^=a<<5;a>>>=0;return a/4294967296;};}
const lanes=new Map();
function laneFor(row){
 if(lanes.has(row))return lanes.get(row);
 if(row>3&&!lanes.has(row-1)) laneFor(row-1); // ensure prev exists for sequence rules
 const r=rng(row+1013); let type='grass';
 if(row<=3) type='grass';
 else if(row===4) type='road';
 else if(row===5) type='grass';
 else if(row===6) type='river';
 else{ const p=r(); const prev=lanes.get(row-1), prev2=lanes.get(row-2);
   if(prev&&prev.type==='rail') type=r()<.5?'grass':'road';
   else if(p<0.14) type='rail';
   else if(p<0.38) type='river';
   else if(p<0.78) type='road';
   else type='grass';
   if(prev&&prev.type==='river'&&type==='river') type='grass';
   if(prev&&prev.type==='river'&&prev2&&prev2.type==='river'&&type==='river') type='road';
   if(prev&&prev.type==='river'&&type==='rail') type='road';
 }
 const dir=r()<0.5?-1:1;
 const baseSpeed={road:1.2+r()*1.6,river:0.7+r()*0.9,rail:0,grass:0}[type];
 const gap={road:2.6+r()*2.2,river:2.8+r()*1.6,rail:0,grass:0}[type];
 const off=r()*10;
 const colorIdx=Math.floor(r()*5);
 const L={row,type,dir,speed:baseSpeed,gap,off,colorIdx,trainOff:r()*14+4,trees:[]};
 if(row===4){L.speed=0.9;L.gap=3.4;} if(row===6){L.speed=0.7;L.gap=3.2;}
 if(type==='grass'){for(let i=0;i<COLS;i++) if(r()<0.14&&!(row<=2&&i===MID)) L.trees.push(i);}
 lanes.set(row,L); return L;
}
// entities positions (in column units, continuous) for a lane at time t
function entities(L,t,esc){
 if(L.type==='road'){const out=[];const sp=L.speed*esc*L.dir;const span=COLS+6;const n=Math.max(2,Math.floor(span/L.gap));
   for(let i=0;i<n;i++){let x=((L.off+i*L.gap+ t*sp)%span+span)%span-3; out.push({x,w:(i%3===2?1.9:1.25),kind:i%3===2?'truck':'car',ci:(L.colorIdx+i)%5});} return out;}
 if(L.type==='river'){const out=[];const sp=L.speed*L.dir;const span=COLS+7;const n=Math.max(2,Math.floor(span/L.gap));
   for(let i=0;i<n;i++){let x=((L.off+i*L.gap+t*sp)%span+span)%span-3.5; out.push({x,w:2.6,kind:'log'});} return out;}
 if(L.type==='rail'){const out=[];const cycle=9;const ph=((t+L.trainOff)%cycle); // train sweeps periodically
   if(ph<2.2){const x=-6+ph/2.2*(COLS+14); out.push({x,w:5.5,kind:'train',warn:ph>1.4});} else if(ph>cycle-1.2){out.push({x:-99,w:0,kind:'warn'});}
   return out;}
 return[];
}
let score=0,best=0,dead=false,deathCause='',started=false,nearmiss=0,whooshT=0,slowmo=0,shake=0;
let px=MID,py=0,fromX=px,fromY=py,toX=px,toY=py,hopT=1; const HOPD=0.13;
let camY=0, sweepRow=-6, gameT=0, lastMoveT=0, drift=0, onLog=false, riverT=0;
const carColors=['#e8452c','#2c7be8','#f2b705','#37b24d','#9b5de5','#ff7b9c'];
function esc(){return 1+Math.min(1.6,score*0.018);}
function state(){return{score,px:px+drift,py,dead,started,nearmiss,onLog,lane:laneFor(Math.round(py)).type,best};}
function die(cause){if(dead)return;dead=true;deathCause=cause;shake=10;best=Math.max(best,score);
 document.getElementById('deathTitle').textContent=cause==='car'?'SPLAT! 🚗':cause==='river'?'SPLASH! 🌊':cause==='train'?'WHAM! 🚆':'SWEEP GOT YOU! 🌪️';
 document.getElementById('deathText').textContent=`Score ${score} · Best ${best} · Near-misses ${nearmiss}`;
 document.getElementById('overlay').style.display='flex';}
function reset(){score=0;dead=false;px=MID;py=0;fromX=toX=px;fromY=toY=py;hopT=1;camY=0;sweepRow=-6;lastMoveT=gameT;drift=0;nearmiss=0;started=true;lanes.clear();
 document.getElementById('overlay').style.display='none';document.getElementById('title').style.display='none';document.getElementById('score').textContent='0';}
function hop(dx,dy){ if(dead){reset();return;} if(hopT<1)return; started=true; document.getElementById('title').style.display='none';
 fromX=px+drift; fromY=py; drift=0; px=fromX; // bake drift
 toX=Math.max(0,Math.min(COLS-1,Math.round(px)+dx)); toY=py+dy; px=toX; py=toY; hopT=0; lastMoveT=gameT;
 if(dy>0){score=Math.max(score,Math.floor(py)); document.getElementById('score').textContent=score;}
 // tree block: if target grass tree, revert? keep simple: allow but nudge
 const L=laneFor(py); if(L.type==='grass'&&L.trees.includes(toX)){ /* blocked */ px=fromX;py=fromY;toX=fromX;toY=fromY; }
}
addEventListener('keydown',e=>{const k=e.key.toLowerCase(); if(k==='arrowup'||k==='w')hop(0,1); else if(k==='arrowdown'||k==='s')hop(0,-1); else if(k==='arrowleft'||k==='a')hop(-1,0); else if(k==='arrowright'||k==='d')hop(1,0); if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();});
let tsx=0,tsy=0;
cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-tsx,dy=t.clientY-tsy;
 if(Math.abs(dx)<24&&Math.abs(dy)<24) hop(0,1); else if(Math.abs(dx)>Math.abs(dy)) hop(dx>0?1:-1,0); else hop(0,dy<0?1:-1); e.preventDefault();},{passive:false});
cv.addEventListener('mousedown',e=>{tsx=e.clientX;tsy=e.clientY;});
cv.addEventListener('mouseup',e=>{const dx=e.clientX-tsx,dy=e.clientY-tsy; if(Math.abs(dx)<24&&Math.abs(dy)<24)hop(0,1); else if(Math.abs(dx)>Math.abs(dy))hop(dx>0?1:-1,0); else hop(0,dy<0?1:-1);});
document.getElementById('retry').addEventListener('click',e=>{e.stopPropagation();reset();});
// update
let lastTs=performance.now();
function update(dt){
 let ts=1; if(slowmo>0){slowmo-=dt; ts=0.35;}
 gameT+=dt*ts;
 if(hopT<1) hopT=Math.min(1,hopT+dt/HOPD);
 if(dead||!started) return;
 // camera follows player smoothly; sweep advances
 const targetCam=py-3.2; if(targetCam>camY) camY+=(targetCam-camY)*Math.min(1,dt*6);
 sweepRow+=dt*0.22*esc()*(gameT-lastMoveT>2.5?2.2:1); // accelerates if idle
 const bottomRow=camY-1.6; const sweep=Math.max(sweepRow,bottomRow-2+ (gameT)*0.02);
 if(py < camY-2.2) die('sweep');
 // current lane interactions when not hopping mid-air heavily (check at hopT>0.4)
 const L=laneFor(Math.round(py)); const ents=entities(L,gameT,esc());
 const curX=(hopT<1? (fromX+(toX-fromX)*hopT) : px+drift);
 if(L.type==='road'&&hopT>0.35){ for(const e of ents){ const d=Math.abs(curX-e.x); if(d < e.w/2+0.32){die('car');return;} if(d < e.w/2+0.95 && !e._nm && hopT>=1){e._nm=true;nearmiss++;whooshT=0.7;slowmo=0.22;document.getElementById('whoosh').style.opacity=1;} } }
 if(L.type==='rail'&&hopT>0.35){ for(const e of ents){ if(e.kind==='train'&&Math.abs(curX-e.x)<e.w/2+0.3){die('train');return;} } }
 if(L.type==='river'&&hopT>=1){ let on=false,logSp=0; for(const e of ents){ if(curX>e.x-e.w/2&&curX<e.x+e.w/2){on=true;logSp=L.speed*L.dir;} } onLog=on; if(!on){riverT+=dt; if(riverT>0.3){die('river');return;}} else {riverT=0; drift+=logSp*dt; if(px+drift< -0.2||px+drift>COLS-0.8){die('river');return;}} }
 else onLog=false;
}
function draw(){
 const cw=W/COLS, rh=62;
 ctx.clearRect(0,0,W,H);
 // sky/golden bg
 const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#ff9e4f');g.addColorStop(0.35,'#ffb347');g.addColorStop(1,'#7b2d8b'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
 const startRow=Math.floor(camY)-3, endRow=Math.ceil(camY+H/rh)+2;
 for(let row=endRow; row>=startRow; row--){
   const L=laneFor(row); const y=H-(row-camY+1)*rh; // screen y top of lane
   // lane base with tilted feel: offset alternate
   if(L.type==='grass'){ctx.fillStyle=(row%2?'#58b368':'#4da75e');ctx.fillRect(0,y,W,rh);ctx.fillStyle='rgba(255,220,120,.18)';ctx.fillRect(0,y,W,8);}
   else if(L.type==='road'){ctx.fillStyle='#343a46';ctx.fillRect(0,y,W,rh);ctx.fillStyle='#ffd23f';for(let x=0;x<W;x+=44)ctx.fillRect(x,y+rh/2-2,26,4);ctx.fillStyle='#22262f';ctx.fillRect(0,y,W,5);ctx.fillRect(0,y+rh-5,W,5);}
   else if(L.type==='river'){ctx.fillStyle='#1f7fb8';ctx.fillRect(0,y,W,rh);ctx.fillStyle='rgba(255,255,255,.25)';for(let i=0;i<3;i++){const wx=((gameT*30*(L.dir)+i*150+row*40)%(W+60))-30;ctx.fillRect(wx,y+10+i*18,36,3);}}
   else if(L.type==='rail'){ctx.fillStyle='#6b4a2f';ctx.fillRect(0,y,W,rh);ctx.fillStyle='#9aa0a6';ctx.fillRect(0,y+rh*0.3,W,6);ctx.fillRect(0,y+rh*0.68,W,6);ctx.fillStyle='#4a3320';for(let x=6;x<W;x+=34)ctx.fillRect(x,y+rh*0.25,10,rh*0.55);
     // warning lights
     const ents=entities(L,gameT,esc()); const warn=ents.length>0; if(warn&&Math.floor(gameT*4)%2===0){ctx.fillStyle='#ff2222';ctx.beginPath();ctx.arc(18,y+12,7,0,7);ctx.arc(W-18,y+12,7,0,7);ctx.fill();}}
   // trees
   if(L.type==='grass'){for(const tx of L.trees){const x=tx*cw+cw/2;ctx.fillStyle='#6b3a1f';ctx.fillRect(x-5,y+rh-26,10,18);ctx.fillStyle='#1e7a34';ctx.fillRect(x-17,y+4,34,26);ctx.fillStyle='#2fae4a';ctx.fillRect(x-12,y,24,12);}}
   // entities
   const ents=entities(L,gameT,esc());
   for(const e of ents){ if(e.kind==='warn')continue; const ex=e.x*cw, ey=y;
     if(e.kind==='log'){ctx.fillStyle='#8a5a2b';ctx.fillRect(ex-e.w*cw/2,ey+14,e.w*cw,rh-28);ctx.fillStyle='#a9743a';ctx.fillRect(ex-e.w*cw/2,ey+14,e.w*cw,8);ctx.fillStyle='#6e451d';ctx.beginPath();ctx.arc(ex-e.w*cw/2+12,ey+rh/2,7,0,7);ctx.arc(ex+e.w*cw/2-12,ey+rh/2,7,0,7);ctx.fill();}
     else if(e.kind==='train'){ctx.fillStyle='#c1272d';ctx.fillRect(ex-e.w*cw/2,ey+4,e.w*cw,rh-8);ctx.fillStyle='#ffd23f';ctx.fillRect(ex-e.w*cw/2,ey+22,e.w*cw,8);ctx.fillStyle='#fff';ctx.fillRect(ex+e.w*cw/2-26,ey+10,16,12);}
     else{const col=carColors[e.ci];const wpx=e.w*cw;ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(ex-wpx/2+3,ey+rh-16,wpx,8);
       ctx.fillStyle=col;ctx.fillRect(ex-wpx/2,ey+16,wpx,rh-30);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(ex-wpx/2+ (L.dir>0?wpx*0.55:wpx*0.15),ey+20,wpx*0.28,14);
       ctx.fillStyle='#111';ctx.fillRect(ex-wpx/2+6,ey+rh-18,16,8);ctx.fillRect(ex+wpx/2-22,ey+rh-18,16,8);
       ctx.fillStyle='#ffe66d';ctx.fillRect(L.dir>0?ex+wpx/2-6:ex-wpx/2,ey+24,6,8);
       if(e.kind==='truck'){ctx.fillStyle='#e9ecef';ctx.fillRect(ex-wpx/2+4,ey+8,wpx*0.62,rh-22);} }
   }
   // player on this row
   if(Math.round(py)===row){
     const hx=hopT<1?fromX+(toX-fromX)*hopT:px+drift, hy=hopT<1?fromY+(toY-fromY)*hopT:py;
     if(Math.round(hy)===row||hopT<1){
       const cxp=hx*cw+cw/2, cyp=y+rh/2 - Math.sin(Math.min(1,hopT)*Math.PI)*20;
       ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(cxp,y+rh-10,cw*0.32,7,0,0,7);ctx.fill();
       // courier: legs, body, head, cap, parcel
       ctx.fillStyle='#243b6b';ctx.fillRect(cxp-11,cyp+8,9,14);ctx.fillRect(cxp+2,cyp+8,9,14);
       ctx.fillStyle='#ff7b00';ctx.fillRect(cxp-15,cyp-12,30,22); // jacket
       ctx.fillStyle='#8a5a2b';ctx.fillRect(cxp+8,cyp-10,16,14); // parcel
       ctx.fillStyle='#ffd9a0';ctx.beginPath();ctx.arc(cxp,cyp-22,11,0,7);ctx.fill();
       ctx.fillStyle='#e8452c';ctx.fillRect(cxp-12,cyp-32,24,7);ctx.fillRect(cxp+2,cyp-32,20,4); // cap
       if(dead){ctx.strokeStyle='#111';ctx.beginPath();ctx.moveTo(cxp-6,cyp-26);ctx.lineTo(cxp-1,cyp-21);ctx.moveTo(cxp-1,cyp-26);ctx.lineTo(cxp-6,cyp-21);ctx.stroke();}
     }
   }
 }
 // sweep fog at bottom
 const sweepY=H-((camY-2.2)-camY+1)*62;
 ctx.fillStyle='rgba(255,60,30,.35)';ctx.fillRect(0,H-46,W,46);ctx.fillStyle='#ffdd55';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('🔥 THE SWEEP — KEEP HOPPING! 🔥',W/2,H-18);
 if(whooshT>0){whooshT-=0.016; if(whooshT<=0)document.getElementById('whoosh').style.opacity=0;}
 if(shake>0)shake--;
}
function loop(ts){const dt=Math.min(0.05,(ts-lastTs)/1000);lastTs=ts;update(dt);ctx.save();if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);draw();ctx.restore();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__th={state,hop,reset,ready:true,laneFor,entities:(L)=>entities(L,gameT,esc()),time:()=>gameT,esc};
</script></body></html>
