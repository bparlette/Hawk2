<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Picky Hole</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#222;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1b1b22}
  #stage{position:relative;width:min(100vw,calc(100vh*390/844));height:min(100vh,calc(100vw*844/390));max-width:390px;max-height:844px}
  canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
  /* ---- order ticket ---- */
  #ticket{position:absolute;top:8px;left:8px;right:8px;z-index:1100;background:rgba(255,252,240,.97);border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.35);padding:8px 10px 7px;pointer-events:none;border:2px dashed #c9b98a}
  #ticket .row1{display:flex;justify-content:space-between;align-items:baseline}
  #ticket .lvl{font-weight:800;font-size:15px;color:#3a2f1d;letter-spacing:.02em}
  #ticket .time{font-weight:800;font-size:15px;color:#3a2f1d;font-variant-numeric:tabular-nums}
  #ticket .time.low{color:#c02727}
  #ticket .strikes{font-size:13px;letter-spacing:2px;color:#c02727;min-height:16px}
  #ticket .strikes .off{color:#ddd3b8}
  #tbar{height:6px;background:#e7dcbb;border-radius:3px;margin:4px 0 6px;overflow:hidden}
  #tfill{height:100%;background:#58a34c;border-radius:3px;width:100%}
  #tfill.low{background:#c02727}
  #items{display:flex;flex-wrap:wrap;gap:5px}
  .chip{display:flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #d8cba0;border-radius:999px;padding:2px 8px 2px 3px;font-size:12.5px;font-weight:700;color:#3a2f1d}
  .chip .sw{width:18px;height:18px;border-radius:50%;flex:0 0 18px;border:2px solid rgba(0,0,0,.18)}
  .chip.done{opacity:.45;text-decoration:line-through}
  .chip .cnt{font-variant-numeric:tabular-nums}
  #hint{position:absolute;left:0;right:0;bottom:10px;z-index:1100;text-align:center;color:#fff;font-size:13px;font-weight:700;
    text-shadow:0 1px 4px rgba(0,0,0,.7);pointer-events:none}
  /* ---- overlays ---- */
  .overlay{position:absolute;inset:0;z-index:1200;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(20,16,10,.72);color:#fff;text-align:center;padding:24px}
  .overlay h1{font-size:42px;letter-spacing:.01em;margin-bottom:6px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
  .overlay h2{font-size:30px;margin-bottom:8px}
  .overlay p{font-size:15.5px;line-height:1.45;max-width:300px;margin-bottom:14px;color:#f3ead2}
  .overlay .holepic{width:74px;height:74px;border-radius:50%;background:#050505;box-shadow:0 0 0 7px rgba(255,255,255,.16),0 10px 22px rgba(0,0,0,.6);margin-bottom:16px}
  .btn{pointer-events:auto;cursor:pointer;border:none;border-radius:999px;background:#ffb62e;color:#38270a;font-weight:900;
    font-size:18px;padding:13px 34px;box-shadow:0 4px 0 #c07f10,0 8px 16px rgba(0,0,0,.4)}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c07f10}
  .hidden{display:none!important}
  #finale{margin:4px 0 10px}
  #scoreLine{font-size:17px;font-weight:800;color:#ffd968;margin-bottom:14px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="game" width="390" height="844"></canvas>

  <div id="ticket">
    <div class="row1"><span class="lvl" id="lvlName">Level 1</span><span class="strikes" id="strikes"></span><span class="time" id="timeLabel">0:45</span></div>
    <div id="tbar"><div id="tfill"></div></div>
    <div id="items"></div>
  </div>
  <div id="hint">Drag anywhere to steer the hole — eat ONLY what's on the ticket!</div>

  <div class="overlay" id="startScreen">
    <div class="holepic"></div>
    <h1>Picky Hole</h1>
    <p>One very fussy hole. Drag it around the diorama and swallow <b>only</b> the items on the order ticket. Wrong bites = a strike (and −3 s). Three strikes and you're done!</p>
    <button class="btn" id="startBtn">Start Order 1</button>
  </div>

  <div class="overlay hidden" id="endScreen">
    <h2 id="endTitle">Order Complete!</h2>
    <canvas id="finale" width="240" height="190"></canvas>
    <div id="scoreLine"></div>
    <p id="endText"></p>
    <button class="btn" id="endBtn">Next</button>
  </div>
</div></div>

<script>
'use strict';
// ---------- zoom / gesture guards ----------
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());
let lastTouchEnd=0;
document.addEventListener('touchend', e=>{ if(e.target && e.target.closest && e.target.closest('.btn')) return; const n=Date.now(); if(n-lastTouchEnd<=350) e.preventDefault(); lastTouchEnd=n; }, {passive:false});
document.addEventListener('touchmove', e=>{ if(e.cancelable) e.preventDefault(); }, {passive:false});

// ---------- setup ----------
const W=390, H=844, TOP=178, BOT=812;
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const ticketEl=$('items'), timeEl=$('timeLabel'), fillEl=$('tfill'), lvlEl=$('lvlName'), strikesEl=$('strikes'), hintEl=$('hint');

// tiny audio blips (WebAudio, created on first gesture)
let AC=null;
function beep(f,d,type,g){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(), gn=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; gn.gain.value=g||0.08;
  gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+(d||0.09)); o.connect(gn); gn.connect(AC.destination); o.start(); o.stop(AC.currentTime+(d||0.09)); }catch(e){} }

// ---------- item catalogue: colour + shape coding ----------
const TYPES={
  // breakfast
  egg:       {name:'Egg',        col:'#f7f3e8', accent:'#f5b921'},
  strawberry:{name:'Strawberry', col:'#e23b3b', accent:'#3f9e4d'},
  toast:     {name:'Toast',      col:'#e8b96f', accent:'#b57e35'},
  banana:    {name:'Banana',     col:'#ffd83d', accent:'#e0a81e'},
  blueberry: {name:'Blueberry',  col:'#3d5fc4', accent:'#24377a'},
  donut:     {name:'Donut',      col:'#f28bb4', accent:'#a05a2c'},
  mug:       {name:'Coffee Mug', col:'#4aa3c7', accent:'#ffffff'},
  // toolbox
  screw:     {name:'Screw',      col:'#b9c0c9', accent:'#7d8791'},
  nut:       {name:'Hex Nut',    col:'#9aa3ad', accent:'#5f6871'},
  wrench:    {name:'Wrench',     col:'#c7ced6', accent:'#828c96'},
  hammer:    {name:'Hammer',     col:'#c98d4b', accent:'#8a8f96'},
  gear:      {name:'Gear',       col:'#f0a13c', accent:'#a86a1c'},
  nail:      {name:'Nail',       col:'#d5dae0', accent:'#8a929b'},
  bolt:      {name:'Bolt',       col:'#e3c34a', accent:'#96791f'},
  // beach picnic
  shell:     {name:'Shell',      col:'#f6c9d4', accent:'#d9829c'},
  starfish:  {name:'Starfish',   col:'#ff9046', accent:'#d96a1e'},
  shades:    {name:'Sunglasses', col:'#333a44', accent:'#57c7e8'},
  bottle:    {name:'Sun Cream',  col:'#ffe066', accent:'#ff7b54'},
  ball:      {name:'Beach Ball', col:'#ef476f', accent:'#ffffff'},
  icecream:  {name:'Ice Cream',  col:'#f9e2ae', accent:'#ff8fab'},
  flipflop:  {name:'Flip-Flop',  col:'#2ec4b6', accent:'#1a8a80'},
};

// ---------- levels ----------
const LEVELS=[
 { name:'Order 1 · Breakfast Table', theme:'breakfast', time:45,
   order:{egg:3, strawberry:3, toast:2},
   decoys:{banana:3, blueberry:4, donut:2, mug:2},
   finale:'breakfast' },
 { name:'Order 2 · Toolbox', theme:'toolbox', time:55,
   order:{screw:4, nut:3, gear:2, wrench:1},
   decoys:{hammer:3, nail:5, bolt:3},
   finale:'toolbox' },
 { name:'Order 3 · Beach Picnic', theme:'beach', time:65,
   order:{shell:4, starfish:3, icecream:2, shades:1},
   decoys:{ball:3, bottle:3, flipflop:4, strawberry:2},
   finale:'beach' },
];

// deterministic RNG so layouts are stable per level
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// ---------- state ----------
let phase='start'; // start | play | win | lose
let levelIdx=0, objects=[], remaining={}, strikes=0, timeLeft=0, levelTime=0, score=0, totalScore=0;
let hole={x:W/2,y:560,r:26,baseR:26};
let pointer={down:false,x:hole.x,y:hole.y};
let shake=0, flash=0, flyers=[], lastTs=0;

function layout(level){
  const rnd=mulberry(1234+levelIdx*777);
  const list=[];
  const add=(type,n,correct)=>{ for(let i=0;i<n;i++) list.push({type,correct}); };
  for(const t in level.order) add(t, level.order[t], true);
  for(const t in level.decoys) add(t, level.decoys[t], false);
  // shuffle
  for(let i=list.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  const placed=[];
  for(const it of list){
    let x=0,y=0,ok=false,tries=0;
    while(!ok && tries<300){ tries++;
      x=34+rnd()*(W-68); y=TOP+26+rnd()*(BOT-TOP-52);
      ok=placed.every(p=>{ const dx=p.x-x, dy=p.y-y; return dx*dx+dy*dy>46*46; }) && Math.hypot(x-hole.x,y-hole.y)>70;
    }
    const o={...it, x, y, r:15+rnd()*4, rot:(rnd()-0.5)*0.9, state:'idle', shrink:0};
    placed.push(o); objects.push(o);
  }
}

function startLevel(i){
  levelIdx=i; const L=LEVELS[i];
  objects=[]; remaining={...L.order}; strikes=0; timeLeft=L.time; levelTime=L.time;
  hole={x:W/2,y:600,r:26,baseR:26}; pointer={down:false,x:hole.x,y:hole.y};
  flyers=[]; shake=0; flash=0;
  layout(L);
  phase='play';
  $('startScreen').classList.add('hidden'); $('endScreen').classList.add('hidden');
  hintEl.textContent='Drag anywhere to steer the hole — eat ONLY what\'s on the ticket!';
  renderTicket();
}
function renderTicket(){
  const L=LEVELS[levelIdx];
  lvlEl.textContent=L.name;
  ticketEl.innerHTML='';
  for(const t in L.order){
    const chip=document.createElement('div'); chip.className='chip'+(remaining[t]<=0?' done':''); chip.id='chip-'+t;
    chip.innerHTML='<span class="sw" style="background:'+TYPES[t].col+'"></span>'+TYPES[t].name+' <span class="cnt">×'+Math.max(0,remaining[t])+'</span>';
    ticketEl.appendChild(chip);
  }
  strikesEl.innerHTML='✕'.split('').map(()=> '').join('');
  strikesEl.textContent='✕'.repeat(strikes)+'✕'.repeat(Math.max(0,3-strikes));
  strikesEl.innerHTML='';
  for(let i=0;i<3;i++){ const s=document.createElement('span'); s.textContent='✕'; if(i>=strikes) s.className='off'; strikesEl.appendChild(s); }
  const m=Math.floor(Math.max(0,timeLeft)/60), s=Math.ceil(Math.max(0,timeLeft)%60);
  timeEl.textContent=m+':'+String(timeLeft%60<0.5&&timeLeft>0?Math.ceil(timeLeft%60):Math.floor(timeLeft%60)).padStart(2,'0');
  timeEl.textContent=m+':'+String(Math.max(0,Math.ceil(timeLeft)-m*60)).padStart(2,'0');
  timeEl.classList.toggle('low', timeLeft<=10);
  fillEl.style.width=Math.max(0,timeLeft/levelTime*100)+'%';
  fillEl.classList.toggle('low', timeLeft<=10);
}

// ---------- drawing: dioramas ----------
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function drawBackground(){
  const theme=LEVELS[levelIdx].theme;
  if(theme==='breakfast'){
    ctx.fillStyle='#f3e3c2'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e8d3a8'; for(let y=150;y<H;y+=92) ctx.fillRect(0,y,W,3);
    // tablecloth checks in play area
    ctx.fillStyle='rgba(210,80,60,.10)';
    for(let x=0;x<W;x+=48) for(let y=TOP;y<H;y+=48){ if(((x+y)/48)%2===0) ctx.fillRect(x,y,48,48); }
    // big plate decoration top area under ticket is covered; placemat ellipse centre
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(W/2,520,150,190,0,0,7); ctx.fill();
    ctx.strokeStyle='rgba(180,140,80,.35)'; ctx.lineWidth=3; ctx.stroke();
  } else if(theme==='toolbox'){
    ctx.fillStyle='#8a6a48'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#7c5f3f'; for(let y=140;y<H;y+=64) ctx.fillRect(0,y,W,4);
    ctx.fillStyle='rgba(0,0,0,.13)'; for(let x=30;x<W;x+=60) for(let y=TOP+20;y<H;y+=60){ ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill(); }
    ctx.fillStyle='rgba(255,230,180,.10)'; rr(ctx,18,TOP-6,W-36,BOT-TOP+18,18); ctx.fill();
  } else {
    ctx.fillStyle='#f6dc9a'; ctx.fillRect(0,0,W,H); // sand
    ctx.fillStyle='#57c7e8'; ctx.fillRect(0,0,W,TOP-38); // sea band at top
    ctx.fillStyle='#8fe0f5'; ctx.fillRect(0,TOP-44,W,8);
    ctx.fillStyle='rgba(255,255,255,.5)';
    for(let x=10;x<W;x+=64){ ctx.beginPath(); ctx.ellipse(x,TOP-60,22,5,0,0,7); ctx.fill(); }
    // picnic blanket
    ctx.fillStyle='#e4572e'; rr(ctx,42,430,306,300,16); ctx.fill();
    ctx.fillStyle='#f8f4ec'; for(let i=0;i<4;i++) for(let j=0;j<4;j++){ if((i+j)%2===0) ctx.fillRect(66+i*66,454+j*66,60,60); }
    ctx.fillStyle='rgba(0,0,0,.06)'; for(let i=0;i<26;i++){ ctx.beginPath(); ctx.arc((i*97)%W, TOP+40+(i*61)%(H-TOP-60), 2.4, 0, 7); ctx.fill(); }
  }
}

// ---------- drawing: objects (chunky flat shapes) ----------
function drawObject(o){
  const {x,y}=o; let r=o.r;
  if(o.state==='eaten'){ r=o.r*(1-o.shrink); }
  const s=r/16; // scale unit
  ctx.save(); ctx.translate(x,y); ctx.rotate(o.rot);
  // soft shadow
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(2,4,r*0.95,r*0.8,0,0,7); ctx.fill();
  ctx.scale(s,s);
  const T=TYPES[o.type];
  switch(o.type){
    case 'egg': ctx.fillStyle=T.col; ctx.beginPath(); ctx.ellipse(0,0,15,12.5,0.4,0,7); ctx.fill();
      ctx.fillStyle=T.accent; ctx.beginPath(); ctx.arc(1,0,6,0,7); ctx.fill(); break;
    case 'strawberry': ctx.fillStyle=T.col; ctx.beginPath(); ctx.moveTo(0,14); ctx.quadraticCurveTo(-14,2,-11,-7); ctx.quadraticCurveTo(-6,-13,0,-11); ctx.quadraticCurveTo(6,-13,11,-7); ctx.quadraticCurveTo(14,2,0,14); ctx.fill();
      ctx.fillStyle=T.accent; ctx.beginPath(); ctx.moveTo(-8,-11); ctx.lineTo(8,-11); ctx.lineTo(0,-5); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffd9d9'; [[-5,0],[4,3],[0,7],[-2,-4]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],1.3,0,7);ctx.fill();}); break;
    case 'toast': ctx.fillStyle=T.accent; rr(ctx,-13,-13,26,26,8); ctx.fill(); ctx.fillStyle=T.col; rr(ctx,-9.5,-9.5,19,19,6); ctx.fill(); break;
    case 'banana': ctx.strokeStyle=T.col; ctx.lineWidth=8; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(2,-2,12,0.25*Math.PI,1.15*Math.PI); ctx.stroke();
      ctx.strokeStyle=T.accent; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(2,-2,12,0.3*Math.PI,1.1*Math.PI); ctx.stroke(); break;
    case 'blueberry': ctx.fillStyle=T.col; ctx.beginPath(); ctx.arc(0,0,11,0,7); ctx.fill();
      ctx.fillStyle=T.accent; ctx.beginPath(); ctx.arc(0,-2,4,0,7); ctx.fill(); ctx.fillStyle='#9db8ff'; ctx.beginPath(); ctx.arc(-3,-4,2,0,7); ctx.fill(); break;
    case 'donut': ctx.fillStyle=T.accent; ctx.beginPath(); ctx.arc(0,0,14,0,7); ctx.fill(); ctx.fillStyle=T.col; ctx.beginPath(); ctx.arc(0,0,12.5,0,7); ctx.fill();
      ctx.fillStyle='#f3e3c2'; ctx.beginPath(); ctx.arc(0,0,4.6,0,7); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.6; [[-6,-4],[5,-6],[2,6],[-4,5]].forEach(p=>{ctx.beginPath();ctx.moveTo(p[0]-2,p[1]);ctx.lineTo(p[0]+2,p[1]+1);ctx.stroke();}); break;
    case 'mug': ctx.fillStyle=T.col; rr(ctx,-11,-9,20,18,4); ctx.fill(); ctx.strokeStyle=T.col; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(12,0,6,-1.2,1.2); ctx.stroke();
      ctx.fillStyle='#6b4226'; ctx.beginPath(); ctx.ellipse(-1,-6,8,3,0,0,7); ctx.fill(); break;
    case 'screw': ctx.fillStyle=T.accent; rr(ctx,-3,-13,6,22,2); ctx.fill(); ctx.fillStyle=T.col; ctx.beginPath(); ctx.arc(0,-12,8,0,7); ctx.fill();
      ctx.strokeStyle=T.accent; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(-5,-12); ctx.lineTo(5,-12); ctx.stroke();
      ctx.strokeStyle='#e8edf2'; ctx.lineWidth=2; for(let i=-6;i<8;i+=4){ ctx.beginPath(); ctx.moveTo(-3,i); ctx.lineTo(3,i+2); ctx.stroke(); } break;
    case 'nut': ctx.fillStyle=T.col; ctx.beginPath(); for(let i=0;i<6;i++){ const a=i*Math.PI/3; const px=Math.cos(a)*13, py=Math.sin(a)*13; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); ctx.fill();
      ctx.fillStyle='#f3e3c2'; ctx.beginPath(); ctx.arc(0,0,6,0,7); ctx.fill(); ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.arc(0,0,6,0,7); ctx.fill(); break;
    case 'wrench': ctx.strokeStyle=T.col; ctx.lineWidth=7; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-3,13); ctx.lineTo(5,-5); ctx.stroke();
      ctx.fillStyle=T.col; ctx.beginPath(); ctx.arc(7,-9,8,0,7); ctx.fill(); ctx.fillStyle='#8a6a48'; ctx.beginPath(); ctx.moveTo(7,-9); ctx.lineTo(15,-15); ctx.lineTo(16,-6); ctx.closePath(); ctx.fill(); break;
    case 'hammer': ctx.save(); ctx.rotate(0.7); ctx.fillStyle=T.col; rr(ctx,-3,-4,6,17,2); ctx.fill();
      ctx.fillStyle=T.accent; rr(ctx,-12,-14,24,10,3); ctx.fill(); ctx.restore(); break;
    case 'gear': ctx.fillStyle=T.col; for(let i=0;i<8;i++){ ctx.save(); ctx.rotate(i*Math.PI/4); rr(ctx,-3.4,-15,6.8,7,2); ctx.fill(); ctx.restore(); }
      ctx.beginPath(); ctx.arc(0,0,11,0,7); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(0,0,4.6,0,7); ctx.fill(); break;
    case 'nail': ctx.fillStyle=T.col; ctx.beginPath(); ctx.moveTo(-2.4,-8); ctx.lineTo(2.4,-8); ctx.lineTo(0,14); ctx.closePath(); ctx.fill();
      ctx.fillStyle=T.accent; rr(ctx,-7,-13,14,5,2); ctx.fill(); break;
    case 'bolt': ctx.fillStyle=T.col; ctx.beginPath(); for(let i=0;i<6;i++){ const a=i*Math.PI/3; const px=Math.cos(a)*10, py=Math.sin(a)*10-4; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); ctx.fill();
      ctx.fillStyle=T.accent; rr(ctx,-2.6,-4,5.2,15,2); ctx.fill(); break;
    case 'shell': ctx.fillStyle=T.col; ctx.beginPath(); ctx.moveTo(0,12); ctx.quadraticCurveTo(-15,4,-12,-6); ctx.quadraticCurveTo(-6,-13,0,-13); ctx.quadraticCurveTo(6,-13,12,-6); ctx.quadraticCurveTo(15,4,0,12); ctx.fill();
      ctx.strokeStyle=T.accent; ctx.lineWidth=2; for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(0,11); ctx.lineTo(i*5,-9); ctx.stroke(); } break;
    case 'starfish': ctx.fillStyle=T.col; ctx.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5; const rad=i%2?6:14.5; const px=Math.cos(a)*rad, py=Math.sin(a)*rad; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); ctx.fill();
      ctx.fillStyle=T.accent; [[0,0],[-4,3],[4,3],[0,-6]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],1.5,0,7);ctx.fill();}); break;
    case 'shades': ctx.fillStyle=T.col; rr(ctx,-14,-6,12,11,4); ctx.fill(); rr(ctx,2,-6,12,11,4); ctx.fill();
      ctx.fillRect(-2,-5,4,3); ctx.strokeStyle=T.accent; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-11,-3); ctx.lineTo(-5,2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(5,-3); ctx.lineTo(11,2); ctx.stroke(); break;
    case 'bottle': ctx.fillStyle=T.col; rr(ctx,-8,-13,16,26,5); ctx.fill(); ctx.fillStyle=T.accent; rr(ctx,-8,-13,16,8,4); ctx.fill();
      ctx.fillStyle='#fff'; rr(ctx,-5,-1,10,8,2); ctx.fill(); break;
    case 'ball': { const cols=['#ef476f','#ffd166','#06d6a0','#4cc9f0']; ctx.beginPath(); ctx.arc(0,0,14,0,7); ctx.fillStyle='#fff'; ctx.fill();
      for(let i=0;i<4;i++){ ctx.fillStyle=cols[i]; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,14,i*Math.PI/2,(i+1)*Math.PI/2); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,4,0,7); ctx.fill(); break; }
    case 'icecream': ctx.fillStyle=T.col; ctx.beginPath(); ctx.moveTo(-8,-1); ctx.lineTo(8,-1); ctx.lineTo(0,14); ctx.closePath(); ctx.fill();
      ctx.fillStyle=T.accent; ctx.beginPath(); ctx.arc(0,-5,9.5,0,7); ctx.fill(); ctx.fillStyle='#e23b3b'; ctx.beginPath(); ctx.arc(0,-14,3,0,7); ctx.fill(); break;
    case 'flipflop': ctx.fillStyle=T.col; ctx.beginPath(); ctx.ellipse(0,0,9,14,0,0,7); ctx.fill();
      ctx.strokeStyle=T.accent; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,-3); ctx.lineTo(-6,-11); ctx.moveTo(0,-3); ctx.lineTo(6,-11); ctx.stroke(); break;
    default: ctx.fillStyle=T.col; ctx.beginPath(); ctx.arc(0,0,13,0,7); ctx.fill();
  }
  ctx.restore();
}

function drawHole(){
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake*10,(Math.random()-0.5)*shake*10); }
  // soft rim shadow
  const g=ctx.createRadialGradient(hole.x,hole.y,hole.r*0.55,hole.x,hole.y,hole.r*1.28);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(0.78,'rgba(0,0,0,.28)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(hole.x,hole.y,hole.r*1.28,0,7); ctx.fill();
  ctx.fillStyle='#060606'; ctx.beginPath(); ctx.arc(hole.x,hole.y,hole.r,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.20)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(hole.x,hole.y,hole.r-1.5,Math.PI*0.9,Math.PI*1.5); ctx.stroke();
  ctx.restore();
  if(flash>0){ ctx.fillStyle='rgba(220,40,40,'+(flash*0.25)+')'; ctx.fillRect(0,0,W,H); }
}
function drawFlyers(dt){
  for(const f of flyers){ f.t+=dt*2.4; f.x+=(f.tx-f.x)*Math.min(1,dt*10); f.y+=(f.ty-f.y)*Math.min(1,dt*10)-dt*60;
    ctx.fillStyle=f.col; ctx.beginPath(); ctx.arc(f.x,f.y,Math.max(2,9*(1-f.t)),0,7); ctx.fill(); }
  flyers=flyers.filter(f=>f.t<1);
}

// ---------- finale: collected items assemble into the finished thing ----------
function drawFinale(kind){
  const c=$('finale').getContext('2d'); c.clearRect(0,0,240,190);
  if(kind==='breakfast'){ // plate of breakfast
    c.fillStyle='#fff'; c.beginPath(); c.ellipse(120,112,92,52,0,0,7); c.fill(); c.strokeStyle='#d8cba0'; c.lineWidth=3; c.stroke();
    mini(c,'egg',82,100,1.1); mini(c,'egg',150,92,1.1); mini(c,'toast',118,128,1.15); mini(c,'strawberry',92,132,1); mini(c,'strawberry',160,122,1); mini(c,'strawberry',126,84,1);
  } else if(kind==='toolbox'){ // tidy toolbox tray with parts in a row
    c.fillStyle='#c0392b'; rr(c,25,70,190,80,12); c.fill(); c.fillStyle='#922b21'; rr(c,25,70,190,20,10); c.fill();
    c.strokeStyle='#7b241c'; c.lineWidth=7; c.beginPath(); c.arc(120,66,26,Math.PI,0); c.stroke();
    mini(c,'screw',60,112,1.1); mini(c,'nut',100,112,1.1); mini(c,'gear',140,112,1.1); mini(c,'wrench',182,112,1.1);
  } else { // beach bucket of treasures
    c.fillStyle='#2ec4b6'; c.beginPath(); c.moveTo(70,80); c.lineTo(170,80); c.lineTo(158,158); c.lineTo(82,158); c.closePath(); c.fill();
    c.fillStyle='#1a8a80'; c.fillRect(66,72,108,12);
    mini(c,'shell',92,58,1.1); mini(c,'starfish',126,52,1.1); mini(c,'icecream',156,56,1.05); mini(c,'shades',120,104,1.2);
  }
}
// mini object drawer reusing drawObject logic on another context: temporarily swap
function mini(c,type,x,y,scale){
  // finale badges: coloured disc in the item's colour + its initial (clear shape/colour coding)
  c.save(); c.translate(x,y); c.fillStyle=TYPES[type].col; c.beginPath(); c.arc(0,0,15*scale,0,7); c.fill();
  c.lineWidth=2.5; c.strokeStyle=TYPES[type].accent; c.stroke();
  c.fillStyle='rgba(0,0,0,.55)'; c.font='900 '+(13*scale)+'px system-ui'; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(TYPES[type].name[0],0,1); c.restore();
}

// ---------- game flow ----------
function eatObject(o){
  o.state='eaten';
  if(o.correct){
    remaining[o.type]--; beep(660,0.08,'sine',0.07); setTimeout(()=>beep(880,0.09,'sine',0.06),60);
    flyers.push({x:o.x,y:o.y,tx:W/2,ty:60,t:0,col:TYPES[o.type].accent});
    hole.r=Math.min(46, hole.r+2);
    renderTicket();
    if(Object.values(remaining).every(v=>v<=0)) return winLevel();
  } else {
    strikes++; timeLeft=Math.max(0,timeLeft-3); flash=1; shake=1; beep(160,0.18,'sawtooth',0.08);
    renderTicket();
    if(strikes>=3) return loseLevel('Three strikes! The picky hole spat everything out.');
  }
}
function winLevel(){
  phase='win';
  const timeBonus=Math.ceil(timeLeft)*10, sizeBonus=Math.round((hole.r-hole.baseR)*20);
  score=timeBonus+sizeBonus; totalScore+=score;
  $('endTitle').textContent= levelIdx===LEVELS.length-1 ? 'All Orders Complete! 🎉' : 'Order Complete!';
  $('endText').textContent= levelIdx===LEVELS.length-1
    ? 'The picky hole is finally full. Every diorama, picked clean — exactly to order.'
    : 'The finished order assembles itself. Ready for the next ticket?';
  $('scoreLine').textContent='Score +'+score+'  (time '+timeBonus+' + size '+sizeBonus+') · Total '+totalScore;
  $('endBtn').textContent= levelIdx===LEVELS.length-1 ? 'Play Again' : 'Next Order →';
  $('endScreen').classList.remove('hidden');
  drawFinale(LEVELS[levelIdx].finale);
  beep(523,0.12,'sine',0.08); setTimeout(()=>beep(659,0.12,'sine',0.08),110); setTimeout(()=>beep(784,0.2,'sine',0.08),220);
}
function loseLevel(msg){
  if(phase!=='play') return;
  phase='lose';
  $('endTitle').textContent='Order Failed';
  $('scoreLine').textContent='Total score '+totalScore;
  $('endText').textContent=msg+' Tap retry — the ticket is exactly the same, you\'ve got this.';
  $('endBtn').textContent='Retry Order';
  $('endScreen').classList.remove('hidden');
  const c=$('finale').getContext('2d'); c.clearRect(0,0,240,190);
  c.fillStyle='#060606'; c.beginPath(); c.arc(120,95,52,0,7); c.fill();
  c.fillStyle='#fff'; c.font='900 44px system-ui'; c.textAlign='center'; c.fillText('✕ ✕ ✕'.slice(0,2+strikes*2-1),120,110);
  beep(220,0.25,'sawtooth',0.07);
}

// ---------- input: one-thumb drag anywhere ----------
function toGame(e){ const r=cv.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H }; }
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); const p=toGame(e); pointer.down=true; pointer.x=p.x; pointer.y=p.y; try{cv.setPointerCapture(e.pointerId);}catch(_){} });
cv.addEventListener('pointermove', e=>{ if(!pointer.down) return; const p=toGame(e); pointer.x=p.x; pointer.y=p.y; });
const endPointer=e=>{ pointer.down=false; };
cv.addEventListener('pointerup', endPointer); cv.addEventListener('pointercancel', endPointer);

$('startBtn').addEventListener('click', ()=>{ totalScore=0; startLevel(0); });
$('endBtn').addEventListener('click', ()=>{
  if(phase==='win'){ if(levelIdx===LEVELS.length-1){ totalScore=0; startLevel(0); } else startLevel(levelIdx+1); }
  else if(phase==='lose'){ startLevel(levelIdx); }
});

// ---------- main loop ----------
function update(dt){
  if(phase==='play'){
    timeLeft-=dt;
    if(timeLeft<=0){ timeLeft=0; renderTicket(); loseLevel('Time\'s up! The ticket went cold.'); }
    if(pointer.down){
      const dx=pointer.x-hole.x, dy=pointer.y-hole.y, d=Math.hypot(dx,dy);
      const sp=360;
      if(d>2){ const step=Math.min(d, sp*dt); hole.x+=dx/d*step; hole.y+=dy/d*step; }
    }
    hole.x=Math.max(hole.r*0.5, Math.min(W-hole.r*0.5, hole.x));
    hole.y=Math.max(150, Math.min(H-14, hole.y));
    for(const o of objects){
      if(o.state==='idle'){
        const d=Math.hypot(o.x-hole.x, o.y-hole.y);
        if(d < hole.r-2) eatObject(o);
        if(phase!=='play') break;
      } else if(o.state==='eaten'){
        o.shrink+=dt*5.5; o.x+=(hole.x-o.x)*Math.min(1,dt*14); o.y+=(hole.y-o.y)*Math.min(1,dt*14);
        if(o.shrink>=1) o.state='gone';
      }
    }
    if(Math.random()<0.25) renderTicket(); // keep timer fresh
  }
  shake=Math.max(0, shake-dt*3); flash=Math.max(0, flash-dt*2.2);
}
function frame(ts){
  const dt=Math.min(0.05,(ts-lastTs)/1000||0.016); lastTs=ts;
  update(dt);
  ctx.clearRect(0,0,W,H);
  drawBackground();
  for(const o of objects){ if(o.state!=='gone') drawObject(o); }
  drawFlyers(dt);
  drawHole();
  requestAnimationFrame(frame);
}
renderTicket();
requestAnimationFrame(frame);

// debug / QA surface
window.__picky={
  state:()=>({phase, level:levelIdx+1, strikes, timeLeft:Math.round(timeLeft*10)/10,
    remaining:{...remaining}, hole:{x:Math.round(hole.x),y:Math.round(hole.y),r:hole.r}, score, totalScore,
    alive:objects.filter(o=>o.state==='idle').length}),
  objects:()=>objects.filter(o=>o.state==='idle').map(o=>({type:o.type,correct:o.correct,x:Math.round(o.x),y:Math.round(o.y)})),
  start:()=>{ totalScore=0; startLevel(0); },
};
</script>
