<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14181e">
<title>Walk-off narrowed: 1 + Neon N1/N2/N4 + Opus C1/C3 — Hospital Escape bake-off</title>
<style>
html,body{margin:0;height:100%;background:#14181e;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Helvetica Neue",Arial,sans-serif}
#view{position:fixed;inset:0}#view canvas{display:block;width:100%;height:100%}
#ui{position:fixed;left:0;right:0;top:calc(6px + env(safe-area-inset-top));z-index:1200;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 8px;pointer-events:none}
#topbar{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px}
#bar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
#bar button{pointer-events:auto;height:38px;padding:0 10px;border-radius:21px;border:1.5px solid rgba(255,255,255,.55);background:rgba(16,20,26,.72);color:#fff;font:900 12.5px Arial;letter-spacing:.03em;touch-action:none;cursor:pointer;white-space:nowrap}
#bar button.gold{border-color:#e8c95a;color:#e8c95a}
#bar button.on{background:#e8ecf1;color:#10141a;border-color:#fff}
#bar button.gold.on{background:#e8c95a;color:#10141a;border-color:#fff}
#dirbar{display:flex;justify-content:center;gap:6px}
#dirbar button{pointer-events:auto;height:38px;padding:0 12px;border-radius:21px;border:1.5px solid rgba(255,255,255,.55);background:rgba(16,20,26,.72);color:#fff;font:900 12px Arial;letter-spacing:.05em;touch-action:none;cursor:pointer}
#dirbar button.on{background:#e8ecf1;color:#10141a;border-color:#fff}
#modebar{display:flex;justify-content:center;gap:6px}
#modebar button{pointer-events:auto;height:38px;padding:0 12px;border-radius:21px;border:1.5px solid rgba(232,201,90,.65);background:rgba(16,20,26,.72);color:#e8c95a;font:900 12px Arial;letter-spacing:.05em;touch-action:none;cursor:pointer}
#modebar button.on{background:#e8c95a;color:#10141a;border-color:#fff}
#load{position:fixed;inset:0;z-index:1300;display:flex;align-items:center;justify-content:center;color:#dfe6ee;font:700 16px Arial;letter-spacing:.08em;background:#14181e;text-align:center;padding:24px}
</style></head>
<body>
<div id="view"></div>
<div id="ui"><div id="topbar"><div id="modebar"><button data-imp="0">ORIG</button><button data-imp="1" class="on">IMPROVED</button></div>
<div id="dirbar"><button data-dir="front">FRONT</button><button data-dir="back">BACK</button><button data-dir="side">SIDE</button></div></div>
<div id="bar"><button data-mode="both" class="on">ALL</button><button data-mode="1" class="gold">1</button><button data-mode="n1">N1</button><button data-mode="n2">N2</button><button data-mode="n4">N4</button><button data-mode="c1">OPUS C1</button><button data-mode="c3">OPUS C3</button></div></div>
<div id="load">LOADING…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="game/gunman-data-0.js"></script><script src="game/gunman-data-1.js"></script><script src="game/gunman-data-2.js"></script><script src="game/gunman-data-3.js"></script>
<script src="walkoff-neon.js"></script>
</body></html>
