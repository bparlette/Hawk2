<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Room Crane AR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1b2432; touch-action:none;
    font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN",system-ui,-apple-system,sans-serif;
    -webkit-user-select:none; user-select:none; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; display:none; background:#000; }
  #app { position:fixed; inset:0; z-index:1; }
  #app canvas { display:block; }
  /* ---------- HUD ---------- */
  #hud { position:fixed; top:0; left:0; right:0; z-index:1100; display:flex; align-items:flex-start;
    justify-content:space-between; padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0 10px; pointer-events:none; }
  .pill { background:rgba(255,255,255,.92); color:#173a5e; border-radius:999px; padding:7px 14px;
    font-size:17px; font-weight:800; letter-spacing:.5px; box-shadow:0 3px 10px rgba(10,30,60,.35); white-space:nowrap; }
  .pill small { display:block; font-size:9px; letter-spacing:2px; color:#5b84ad; font-weight:700; }
  #playsPill { text-align:center; }
  #playsDots { font-size:15px; letter-spacing:3px; color:#e8443a; }
  #playsDots .off { color:#c9d6e2; }
  #hudBtns { display:flex; gap:8px; pointer-events:auto; }
  .hbtn { width:42px; height:42px; border-radius:50%; border:none; background:rgba(255,255,255,.92);
    font-size:19px; box-shadow:0 3px 10px rgba(10,30,60,.35); cursor:pointer; }
  .hbtn:active { transform:scale(.93); }
  #wonRow { position:fixed; top:calc(env(safe-area-inset-top,0px) + 64px); left:10px; z-index:1100;
    display:flex; gap:6px; flex-wrap:wrap; max-width:70%; pointer-events:none; }
  .chip { background:rgba(23,58,94,.85); color:#fff; border-radius:999px; padding:4px 10px; font-size:11px; font-weight:700; }
  .chip b { color:#ffd94d; }
  /* ---------- controls ---------- */
  #joyZone { position:fixed; left:0; top:0; width:58%; height:100%; z-index:1000; }
  #joyBase { position:fixed; width:118px; height:118px; border-radius:50%; z-index:1150; display:none;
    background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.45); pointer-events:none;
    transform:translate(-50%,-50%); }
  #joyKnob { position:absolute; left:50%; top:50%; width:54px; height:54px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff8a80, #e8443a 65%, #b71f16);
    box-shadow:0 4px 10px rgba(0,0,0,.4), inset 0 -4px 8px rgba(0,0,0,.25); transform:translate(-50%,-50%); }
  #dropBtn { position:fixed; right:22px; bottom:calc(env(safe-area-inset-bottom,0px) + 30px); z-index:1200;
    width:104px; height:104px; border-radius:50%; border:5px solid rgba(255,255,255,.85); cursor:pointer;
    background:radial-gradient(circle at 35% 28%, #ff9d94, #f04438 55%, #c22418);
    color:#fff; font-family:inherit; font-size:21px; font-weight:900; letter-spacing:1px;
    box-shadow:0 8px 22px rgba(0,0,0,.45), inset 0 -8px 14px rgba(0,0,0,.28);
    display:flex; align-items:center; justify-content:center; text-shadow:0 2px 3px rgba(0,0,0,.35); }
  #dropBtn:active { transform:scale(.94); }
  #dropBtn.disabled { filter:grayscale(.7) brightness(.75); }
  #stickHint { position:fixed; left:26px; bottom:calc(env(safe-area-inset-bottom,0px) + 44px); z-index:1050;
    color:rgba(255,255,255,.85); font-size:12px; font-weight:700; letter-spacing:1px; pointer-events:none;
    text-shadow:0 1px 4px rgba(0,0,0,.6); }
  /* ---------- toast ---------- */
  #toast { position:fixed; left:50%; top:34%; transform:translate(-50%,-50%) scale(.8); z-index:1500;
    background:rgba(255,255,255,.96); color:#173a5e; border-radius:20px; padding:16px 26px; text-align:center;
    font-size:24px; font-weight:900; box-shadow:0 12px 34px rgba(0,0,0,.45); opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; max-width:86%; }
  #toast small { display:block; font-size:14px; color:#e8443a; margin-top:3px; }
  #toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  /* ---------- overlays ---------- */
  .overlay { position:fixed; inset:0; z-index:2000; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:linear-gradient(180deg, rgba(16,38,66,.82), rgba(10,22,40,.9));
    color:#fff; text-align:center; padding:24px; }
  .overlay h1 { font-size:42px; font-weight:900; letter-spacing:1px; line-height:1.05;
    text-shadow:0 4px 0 #2b6cb0, 0 8px 22px rgba(0,0,0,.5); }
  .overlay h1 span { color:#ffd94d; }
  .overlay p { margin:14px 0 4px; font-size:15px; line-height:1.45; color:#cfe4f7; max-width:320px; }
  .bigbtn { margin-top:20px; background:linear-gradient(180deg,#ff6f61,#e8443a); color:#fff; border:none;
    font-family:inherit; font-size:20px; font-weight:900; letter-spacing:1px; padding:16px 34px; border-radius:999px;
    box-shadow:0 8px 20px rgba(0,0,0,.45), inset 0 -4px 0 rgba(0,0,0,.2); cursor:pointer; }
  .bigbtn:active { transform:scale(.96); }
  .ghostbtn { margin-top:12px; background:transparent; color:#cfe4f7; border:2px solid rgba(207,228,247,.5);
    font-family:inherit; font-size:14px; font-weight:700; padding:11px 22px; border-radius:999px; cursor:pointer; }
  #endCard { display:none; }
  #endScore { font-size:54px; color:#ffd94d; font-weight:900; text-shadow:0 3px 0 #2b6cb0; }
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<div id="app"></div>

<div id="hud">
  <div class="pill"><small>SCORE</small><span id="scoreVal">0</span></div>
  <div class="pill" id="playsPill"><small>PLAYS</small><span id="playsDots">●●●</span></div>
  <div id="hudBtns">
    <button class="hbtn" id="camBtn" title="Camera">📷</button>
    <button class="hbtn" id="sndBtn" title="Sound">🔊</button>
  </div>
</div>
<div id="wonRow"></div>

<div id="joyZone"></div>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="stickHint">◀ DRAG TO AIM ▶</div>
<button id="dropBtn">DROP</button>
<div id="toast"></div>

<div class="overlay" id="startCard">
  <h1>ROOM<br>CRANE <span>AR</span></h1>
  <p>A claw machine, standing right in your room. Aim with the stick, hit <b>DROP</b>, and carry a plush to the chute. 3 plays — make them count!</p>
  <button class="bigbtn" id="startCamBtn">📷 START CAMERA</button>
  <button class="ghostbtn" id="noCamBtn">Play without camera</button>
</div>

<div class="overlay" id="endCard">
  <h1>GAME <span>OVER</span></h1>
  <p>Final score</p>
  <div id="endScore">0</div>
  <p id="endWon"></p>
  <button class="bigbtn" id="againBtn">↻ PLAY AGAIN</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
'use strict';
/* ================= ROOM CRANE AR ================= */
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
$('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 60);
const CAM_HOME = new THREE.Vector3(0, 1.55, 5.4);
function fitCamera(){
  const a = innerWidth/innerHeight;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const vFit = 3.30/(2*t);            // fit cabinet height
  const hFit = 2.42/(2*t*a);          // fit cabinet width
  CAM_HOME.z = Math.max(vFit, hFit) + 0.25;
  CAM_HOME.y = 1.55;
}
fitCamera();
camera.position.copy(CAM_HOME);

scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const sun = new THREE.DirectionalLight(0xfff2dd, 0.95);
sun.position.set(2.6, 4.6, 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-2.4; sun.shadow.camera.right=2.4;
sun.shadow.camera.top=3.4; sun.shadow.camera.bottom=-0.4;
sun.shadow.camera.far=12; sun.shadow.bias=-0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbfe0ff, 0.3);
fill.position.set(-3, 2, 2.5); scene.add(fill);
const cabLight = new THREE.PointLight(0xd8ecff, 0.55, 4.5);
cabLight.position.set(0, 2.3, 0.1); scene.add(cabLight);

/* ---------- fallback room (shown when camera is off) ---------- */
const roomG = new THREE.Group(); scene.add(roomG);
{
  const wallCv = document.createElement('canvas'); wallCv.width=64; wallCv.height=256;
  const wg = wallCv.getContext('2d');
  const grad = wg.createLinearGradient(0,0,0,256);
  grad.addColorStop(0,'#f3e2c8'); grad.addColorStop(0.75,'#ecd9bd'); grad.addColorStop(1,'#d9c39e');
  wg.fillStyle=grad; wg.fillRect(0,0,64,256);
  const wallTex = new THREE.CanvasTexture(wallCv);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(16,7),
    new THREE.MeshStandardMaterial({ map:wallTex, roughness:1 }));
  wall.position.set(0,3.5,-2.4); roomG.add(wall);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(16,10),
    new THREE.MeshStandardMaterial({ color:0x9a6b46, roughness:0.9 }));
  floor.rotation.x = -Math.PI/2; floor.position.set(0,0,1.5);
  floor.receiveShadow = true; roomG.add(floor);
  const rug = new THREE.Mesh(new THREE.CircleGeometry(1.9, 40),
    new THREE.MeshStandardMaterial({ color:0x7d4a56, roughness:1 }));
  rug.rotation.x = -Math.PI/2; rug.position.set(0,0.005,0.55);
  rug.scale.set(1,0.62,1); rug.receiveShadow = true; roomG.add(rug);
  const base = new THREE.Mesh(new THREE.BoxGeometry(16,0.16,0.04),
    new THREE.MeshStandardMaterial({ color:0xfff6e8, roughness:0.8 }));
  base.position.set(0,0.08,-2.38); roomG.add(base);
}

/* ---------- canvas texture helpers ---------- */
function canvasTex(w,h,draw){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  draw(cv.getContext('2d'), w, h);
  const t=new THREE.CanvasTexture(cv); t.encoding=THREE.sRGBEncoding; t.anisotropy=4;
  return t;
}
/* winter backdrop inside the cabinet */
const backdropTex = canvasTex(1024, 768, (g,w,h)=>{
  const grad=g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#8ec9ee'); grad.addColorStop(0.55,'#c4e6fa'); grad.addColorStop(1,'#eaf8ff');
  g.fillStyle=grad; g.fillRect(0,0,w,h);
  // distant peaks
  g.fillStyle='#a8d4f2';
  g.beginPath(); g.moveTo(0,560);
  [[90,380],[210,500],[330,350],[470,520],[600,390],[740,530],[870,370],[1024,540],[1024,768],[0,768]].forEach(p=>g.lineTo(p[0],p[1]));
  g.closePath(); g.fill();
  // snowy peaks
  const peak=(x,y,s,col)=>{ g.fillStyle=col; g.beginPath();
    g.moveTo(x-s,y); g.lineTo(x,y-s*1.15); g.lineTo(x+s,y); g.closePath(); g.fill();
    g.fillStyle='rgba(255,255,255,.92)'; g.beginPath();
    g.moveTo(x-s*0.34,y-s*0.68); g.lineTo(x,y-s*1.15); g.lineTo(x+s*0.34,y-s*0.68);
    g.lineTo(x+s*0.12,y-s*0.8); g.lineTo(x,y-s*0.66); g.lineTo(x-s*0.14,y-s*0.82); g.closePath(); g.fill(); };
  peak(180,700,210,'#dceffb'); peak(520,720,260,'#cfe9fb'); peak(850,690,200,'#dceffb'); peak(60,730,150,'#cfe9fb'); peak(990,740,170,'#e6f4fd');
  // snowflakes
  g.strokeStyle='rgba(255,255,255,.95)'; g.lineCap='round';
  const flake=(x,y,r)=>{ g.lineWidth=Math.max(2,r/4);
    for(let i=0;i<6;i++){ const a=i*Math.PI/3;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r); g.stroke();
      const bx=x+Math.cos(a)*r*0.62, by=y+Math.sin(a)*r*0.62;
      g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+Math.cos(a+0.6)*r*0.3, by+Math.sin(a+0.6)*r*0.3); g.stroke();
      g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+Math.cos(a-0.6)*r*0.3, by+Math.sin(a-0.6)*r*0.3); g.stroke(); } };
  flake(120,120,34); flake(880,100,42); flake(700,240,24); flake(300,180,20); flake(520,90,26); flake(60,330,22); flake(950,330,26);
  g.fillStyle='rgba(255,255,255,.85)';
  for(let i=0;i<70;i++){ g.beginPath(); g.arc(Math.random()*w, Math.random()*h*0.7, 2+Math.random()*2.5, 0, 7); g.fill(); }
});
/* marquee */
const marqueeTex = canvasTex(1024, 176, (g,w,h)=>{
  const grad=g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#274b8f'); grad.addColorStop(1,'#16294f');
  g.fillStyle=grad; g.fillRect(0,0,w,h);
  g.fillStyle='rgba(255,255,255,.9)';
  [[70,40,3],[950,50,3.4],[420,26,2.4],[620,140,2.6],[150,140,2.8],[830,140,2.2]].forEach(s=>{ g.beginPath(); g.arc(s[0],s[1],s[2],0,7); g.fill(); });
  g.font='900 92px "Arial Rounded MT Bold", Arial, sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.lineWidth=14; g.strokeStyle='#0d1c38'; g.strokeText('ROOM CRANE', w/2, h/2+4);
  const tg=g.createLinearGradient(0,30,0,150);
  tg.addColorStop(0,'#ffffff'); tg.addColorStop(0.55,'#bfe3ff'); tg.addColorStop(1,'#ffd94d');
  g.fillStyle=tg; g.fillText('ROOM CRANE', w/2, h/2+4);
});
/* control-panel front of the base */
const panelTex = canvasTex(1024, 368, (g,w,h)=>{
  const grad=g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#f4f6fb'); grad.addColorStop(1,'#c9d2e8');
  g.fillStyle=grad; g.fillRect(0,0,w,h);
  g.fillStyle='#8f9cc0'; g.fillRect(0,0,w,10);
  // prize door (left)
  g.fillStyle='#39415e'; roundRect(g,36,58,300,252,18); g.fill();
  g.fillStyle='#141a2e'; roundRect(g,56,78,260,170,12); g.fill();
  g.fillStyle='#e86a92'; roundRect(g,56,216,260,32,8); g.fill();
  g.fillStyle='#fff'; g.font='900 40px Arial'; g.textAlign='center'; g.fillText('PRIZE', 186, 292);
  // joystick (middle)
  g.strokeStyle='#39415e'; g.lineWidth=13; g.beginPath(); g.moveTo(505,268); g.lineTo(478,168); g.stroke();
  g.fillStyle='#232a44'; g.beginPath(); g.ellipse(508,286,58,16,0,0,7); g.fill();
  const rg=g.createRadialGradient(458,118,6,478,140,44);
  rg.addColorStop(0,'#ff9d94'); rg.addColorStop(0.6,'#f04438'); rg.addColorStop(1,'#b71f16');
  g.fillStyle=rg; g.beginPath(); g.arc(478,140,42,0,7); g.fill();
  // PLAY pill
  g.fillStyle='#37b24d'; roundRect(g,586,120,150,62,31); g.fill();
  g.fillStyle='#fff'; g.font='900 36px Arial'; g.fillText('PLAY', 661, 163);
  // red drop button drawn
  const rg2=g.createRadialGradient(640,238,6,662,262,46);
  rg2.addColorStop(0,'#ffb3ab'); rg2.addColorStop(0.6,'#f04438'); rg2.addColorStop(1,'#b71f16');
  g.fillStyle=rg2; g.beginPath(); g.arc(662,262,44,0,7); g.fill();
  g.fillStyle='#39415e'; g.font='900 25px Arial'; g.fillText('DROP', 662, 338);
  // coin slot (right)
  g.fillStyle='#39415e'; roundRect(g,806,96,150,190,14); g.fill();
  g.fillStyle='#ffd94d'; g.font='900 44px Arial'; g.fillText('25¢', 881, 156);
  g.fillStyle='#141a2e'; roundRect(g,866,182,30,74,14); g.fill();
  g.fillStyle='#fff'; g.font='700 24px Arial'; g.fillText('1 COIN', 881, 330-58);
  function roundRect(g,x,y,ww,hh,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+ww,y,x+ww,y+hh,r);
    g.arcTo(x+ww,y+hh,x,y+hh,r); g.arcTo(x,y+hh,x,y,r); g.arcTo(x,y,x+ww,y,r); g.closePath(); }
});

/* ---------- the cabinet ---------- */
const FLOOR_Y = 0.80;               // interior floor top
const cabG = new THREE.Group(); scene.add(cabG);
const metal = new THREE.MeshStandardMaterial({ color:0xe8eef5, metalness:0.75, roughness:0.32 });
const shellMat = new THREE.MeshStandardMaterial({ color:0xd9a7c7, roughness:0.55, metalness:0.08 });
const shellMat2 = new THREE.MeshStandardMaterial({ color:0x9fb6dd, roughness:0.55, metalness:0.08 });
function box(w,h,d,mat,x,y,z,parent){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; (parent||cabG).add(m); return m;
}
/* base (panel section) */
box(2.0,0.74,1.0, shellMat2, 0,0.37,0);
const panel = new THREE.Mesh(new THREE.PlaneGeometry(1.94,0.70),
  new THREE.MeshStandardMaterial({ map:panelTex, roughness:0.6 }));
panel.position.set(0,0.37,0.505); cabG.add(panel);
/* prize door 3D flap */
const flapTex = canvasTex(512, 400, (g,w,h)=>{
  g.fillStyle='#39415e'; g.fillRect(0,0,w,h);
  g.fillStyle='#141a2e'; g.fillRect(28,28,w-56,h-150);
  g.fillStyle='#e86a92'; g.fillRect(28,h-150,w-56,34);
  g.fillStyle='#ffffff'; g.font='900 74px Arial'; g.textAlign='center';
  g.fillText('PRIZE', w/2, h-38);
});
box(0.56,0.44,0.03, new THREE.MeshStandardMaterial({ color:0x39415e, roughness:0.4, metalness:0.4 }), -0.63,0.37,0.52)
  .material = new THREE.MeshStandardMaterial({ map:flapTex, roughness:0.5 });
/* interior floor */
const floorIn = box(1.92,0.06,0.92, new THREE.MeshStandardMaterial({ color:0x2e7ea6, roughness:0.7 }), 0,FLOOR_Y-0.03,0);
floorIn.castShadow=false;
/* chute hole (front-left of floor) */
const CHUTE = { x:-0.76, z:0.30 };
{
  const hole = new THREE.Mesh(new THREE.CircleGeometry(0.155, 28),
    new THREE.MeshBasicMaterial({ color:0x06090f }));
  hole.rotation.x=-Math.PI/2; hole.position.set(CHUTE.x, FLOOR_Y+0.002, CHUTE.z); cabG.add(hole);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.155,0.016,10,32), metal);
  rim.rotation.x=Math.PI/2; rim.position.set(CHUTE.x, FLOOR_Y+0.004, CHUTE.z); cabG.add(rim);
}
/* backdrop + interior walls */
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(1.92,1.72),
  new THREE.MeshBasicMaterial({ map:backdropTex }));
backdrop.position.set(0, FLOOR_Y+0.86, -0.455); cabG.add(backdrop);
const sideWallMat = new THREE.MeshStandardMaterial({ color:0xcfe4f7, roughness:0.9 });
const wl = new THREE.Mesh(new THREE.PlaneGeometry(0.92,1.72), sideWallMat);
wl.rotation.y=Math.PI/2; wl.position.set(-0.955, FLOOR_Y+0.86, 0); cabG.add(wl);
const wr = wl.clone(); wr.rotation.y=-Math.PI/2; wr.position.x=0.955; cabG.add(wr);
/* glass + frame */
const glassMat = new THREE.MeshPhongMaterial({ color:0xd6ecff, transparent:true, opacity:0.10,
  shininess:140, specular:0xffffff, side:THREE.DoubleSide, depthWrite:false });
function glassPane(w,h,x,y,z,ry){
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h), glassMat);
  p.position.set(x,y,z); p.rotation.y=ry||0; p.renderOrder=5; cabG.add(p); return p;
}
glassPane(1.92,1.72, 0,FLOOR_Y+0.86, 0.475, 0);
glassPane(0.92,1.72, -0.975,FLOOR_Y+0.86, 0, Math.PI/2);
glassPane(0.92,1.72,  0.975,FLOOR_Y+0.86, 0,-Math.PI/2);
/* glass glare streaks */
const glareMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.10, depthWrite:false });
[[ -0.45,0.16 ],[ 0.35,0.11 ]].forEach(s=>{
  const st=new THREE.Mesh(new THREE.PlaneGeometry(s[1],1.5), glareMat);
  st.position.set(s[0], FLOOR_Y+0.86, 0.478); st.rotation.z=0.5; st.renderOrder=6; cabG.add(st);
});
/* corner posts + top/bottom glass frames */
[[-0.99,-0.49],[0.99,-0.49],[-0.99,0.49],[0.99,0.49]].forEach(p=> box(0.07,1.78,0.07, metal, p[0], FLOOR_Y+0.89, p[1]));
box(2.04,0.07,1.04, metal, 0, FLOOR_Y-0.048, 0);

  m.position.set(x,y,z); m.scale.set(sx||1, sy||1, sz||1);

let AC=null, masterGain=null, humOsc=null, humGain=null, soundOn=true;
function audioInit(){
  try { if (navigator.audioSession) navigator.audioSession.type='playback'; } catch(e){}
  if (AC) { if (AC.state==='suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = 0.4; masterGain.connect(AC.destination);
    humOsc = AC.createOscillator(); humOsc.type='sawtooth'; humOsc.frequency.value=52;
    const humFilter = AC.createBiquadFilter(); humFilter.type='lowpass'; humFilter.frequency.value=220;
    humGain = AC.createGain(); humGain.gain.value=0;
    humOsc.connect(humFilter); humFilter.connect(humGain); humGain.connect(masterGain);
    humOsc.start();
  } catch(e){ AC=null; }
}
function blip(freq, dur, type, vol, when, slideTo){
  if(!AC || !soundOn) return;
  const t0 = AC.currentTime + (when||0);
  const o=AC.createOscillator(), gn=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  gn.gain.setValueAtTime(vol||0.2, t0);
  gn.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.connect(gn); gn.connect(masterGain); o.start(t0); o.stop(t0+dur+0.02);
}

const TOP_LEN = 0.18;                       // cable length at rest

function startDrop(){

function nearestPlush(){
  let best=null, bd=1e9;
  plushies.forEach(p=>{
    if(p.won) return;
    const dx=p.g.position.x-game.craneX, dz=p.g.position.z-game.craneZ;
    const d=Math.hypot(dx,dz);
    if(d<bd){ bd=d; best=p; }
  });
  return (best && bd <= Math.max(0.30, best.r+0.13)) ? best : null;
}
function finishCycle(){
  game.state='idle';

    game.over=true;

}
function resetGame(){

    p.g.position.set(p.home.x, FLOOR_Y, p.home.z);

  });

  game.state='idle'; $('endCard').style.display='none'; updateHUD();
}

/* state machine */
function updateMachine(dt){
  game.t += dt;
  const ease = t => t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  switch(game.state){
    case 'lowering': {
      const k = clamp(game.t/1.05, 0, 1);
      game.cableLen = lerp(TOP_LEN, DROP_LEN, ease(k));
      game.clawOpen = lerp(game.clawOpen, 1, dt*8);
      if (k>=1){ game.state='closing'; game.t=0; sfx.clack(); }
      break; }
    case 'closing': {
      const k = clamp(game.t/0.45, 0, 1);
      game.clawOpen = lerp(1, 0, ease(k));
      if (k>=1){
        const p = nearestPlush();
        if (p){ game.held=p; p.g.scale.set(1,0.86,1); sfx.pop(); }
        game.state='rising'; game.t=0; sfx.whir();
      }
      break; }
    case 'rising': {
      const k = clamp(game.t/1.0, 0, 1);
      game.cableLen = lerp(DROP_LEN, TOP_LEN, ease(k));
      if (k>=1){ game.state='returning'; game.t=0; }
      break; }
    case 'returning': {
      const dx = CHUTE.x - game.craneX, dz = CHUTE.z - game.craneZ;
      const d = Math.hypot(dx,dz), step = 1.25*dt;
      if (d <= step){ game.craneX=CHUTE.x; game.craneZ=CHUTE.z; game.state='releasing'; game.t=0; }
      else { game.craneX += dx/d*step; game.craneZ += dz/d*step; }
      break; }
    case 'releasing': {
      const k = clamp(game.t/0.4, 0, 1);
      game.clawOpen = lerp(0, 1, ease(k));
      if (game.held && k>0.35 && !game.held._falling){ game.held._falling = game.t; game.held._fallY = game.held.g.position.y; }
      if (game.held && game.held._falling!==undefined && game.held._falling!==false){
        const p = game.held, ft = game.t - game.held._falling;
        p.g.position.y = lerp(p._fallY||FLOOR_Y+0.62, FLOOR_Y-0.25, clamp(ft/0.38,0,1));
        const sc = 1 - clamp(ft/0.38,0,1)*0.45; p.g.scale.set(sc, sc*0.9, sc);
        if (ft>=0.38){
          p.won=true; p.g.visible=false; p._falling=false;
          game.score += p.pts; game.won.push(p); game.held=null;
          sfx.win(); toast('YOU WON THE '+p.name+'!<small>+'+p.pts+' POINTS</small>', 1900);
          game.state='celebrate'; game.t=0; updateHUD();
        }
      }
      if (k>=1 && game.state==='releasing'){
        if (!game.held){ /* nothing grabbed */ if (game.t>0.45){ sfx.miss(); toast('MISS!<small>line the claw up over a plush</small>', 1200); finishCycle(); } }
      }
      break; }
    case 'celebrate': {
      if (game.t>0.5) finishCycle();
      break; }
  }
  if (game.held && game.state!=='releasing'){
    const p=game.held;
    p.g.position.x = game.craneX; p.g.position.z = game.craneZ;
    p.g.position.y = clawWorldY() - 0.10 - p.r*1.15;
    p.g.rotation.y += dt*0.6;
    p.g.rotation.x = game.swayZ*0.7; p.g.rotation.z = -game.swayX*0.7;
  }
  setClawOpen(game.clawOpen);
  cable.scale.y = game.cableLen;
  clawG.position.y = -game.cableLen;
}

/* ================= INPUT ================= */
const joy = { active:false, id:null, bx:0, by:0, vx:0, vz:0 };
const joyZone=$('joyZone'), joyBase=$('joyBase'), joyKnob=$('joyKnob');
joyZone.addEventListener('pointerdown', e=>{
  audioInit();
  if (joy.active) return;
  joy.active=true; joy.id=e.pointerId; joy.bx=e.clientX; joy.by=e.clientY; joy.vx=0; joy.vz=0;
  joyBase.style.display='block'; joyBase.style.left=e.clientX+'px'; joyBase.style.top=e.clientY+'px';
  joyKnob.style.transform='translate(-50%,-50%)';
  joyZone.setPointerCapture(e.pointerId);
});
joyZone.addEventListener('pointermove', e=>{
  if (!joy.active || e.pointerId!==joy.id) return;
  let dx=e.clientX-joy.bx, dy=e.clientY-joy.by;
  const d=Math.hypot(dx,dy), max=48;
  if (d>max){ dx*=max/d; dy*=max/d; }
  joy.vx=dx/max; joy.vz=dy/max;
  joyKnob.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
});
function joyEnd(e){
  if (e.pointerId!==joy.id) return;
  joy.active=false; joy.vx=0; joy.vz=0; joyBase.style.display='none';
}
joyZone.addEventListener('pointerup', joyEnd);
joyZone.addEventListener('pointercancel', joyEnd);
$('dropBtn').addEventListener('pointerdown', e=>{ e.preventDefault(); audioInit(); startDrop(); });
const keys={};
addEventListener('keydown', e=>{ keys[e.key.toLowerCase()]=true;
  if (e.key===' '){ e.preventDefault(); audioInit(); startDrop(); } });
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
function inputVector(){
  let vx=joy.vx, vz=joy.vz;
  if (keys['arrowleft']||keys['a']) vx-=1;
  if (keys['arrowright']||keys['d']) vx+=1;
  if (keys['arrowup']||keys['w']) vz-=1;
  if (keys['arrowdown']||keys['s']) vz+=1;
  const d=Math.hypot(vx,vz); if (d>1){ vx/=d; vz/=d; }
  return { vx, vz };
}
/* block browser gestures / double-tap zoom */
document.addEventListener('touchmove', e=>e.preventDefault(), { passive:false });
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());

/* ================= CAMERA + PARALLAX ================= */
const camVideo = $('cam');
let parallax = { x:0, y:0, tx:0, ty:0 };
async function startCamera(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }, audio:false });
    camVideo.srcObject = stream; camVideo.style.display='block';
    await camVideo.play().catch(()=>{});
    game.camera = true; roomG.visible = false;
    renderer.setClearColor(0x000000, 0);
    return true;
  } catch(e){ game.camera=false; return false; }
}
function askOrientation(){
  try {
    if (typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission)
      DeviceOrientationEvent.requestPermission().catch(()=>{});
  } catch(e){}
}
addEventListener('deviceorientation', e=>{
  if (e.gamma===null || e.gamma===undefined) return;
  parallax.tx = clamp(e.gamma/28, -1, 1) * 0.20;
  parallax.ty = clamp((e.beta-42)/28, -1, 1) * -0.10;
});
addEventListener('mousemove', e=>{
  if (game.camera) return;
  parallax.tx = (e.clientX/innerWidth - 0.5) * 0.22;
  parallax.ty = (e.clientY/innerHeight - 0.5) * -0.10;
});

/* ================= UI WIRING ================= */
$('startCamBtn').addEventListener('click', async ()=>{
  audioInit(); askOrientation();
  await startCamera();
  $('startCard').style.display='none';
  if (!game.camera) toast('NO CAMERA<small>playing in the showroom instead</small>', 1800);
});
$('noCamBtn').addEventListener('click', ()=>{ audioInit(); $('startCard').style.display='none'; });
$('camBtn').addEventListener('click', async ()=>{ audioInit(); askOrientation();
  if (!game.camera) await startCamera(); });
$('sndBtn').addEventListener('click', function(){
  soundOn=!soundOn; this.textContent = soundOn?'🔊':'🔇'; if(!soundOn) setHum(0);
});
$('againBtn').addEventListener('click', ()=>{ audioInit(); resetGame(); });
addEventListener('pointerdown', ()=>audioInit(), { once:false });

/* ================= MAIN LOOP ================= */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  /* crane movement (idle only) */
  let moving = 0;
  if (game.state==='idle' && !game.over){
    const v = inputVector();
    const sp = 1.15;
    game.craneX = clamp(game.craneX + v.vx*sp*dt, -BOUNDS.x, BOUNDS.x);
    game.craneZ = clamp(game.craneZ + v.vz*sp*dt, -BOUNDS.z, BOUNDS.z);
    moving = Math.hypot(v.vx, v.vz);
  }
  /* sway physics — driven by gantry acceleration */
  const velX = dt>0 ? (game.craneX-game.prevX)/dt : 0;
  const velZ = dt>0 ? (game.craneZ-game.prevZ)/dt : 0;
  game.prevX = game.craneX; game.prevZ = game.craneZ;
  const swayScale = 0.55 + game.cableLen*0.55;
  game.swayVX += ((-16*game.swayX) - (2.6*game.swayVX) - velX*1.4*swayScale) * dt * 3.2;
  game.swayVZ += ((-16*game.swayZ) - (2.6*game.swayVZ) + velZ*1.4*swayScale) * dt * 3.2;
  game.swayX = clamp(game.swayX + game.swayVX*dt, -0.4, 0.4);
  game.swayZ = clamp(game.swayZ + game.swayVZ*dt, -0.4, 0.4);
  swayPivot.rotation.z = -game.swayX;
  swayPivot.rotation.x = game.swayZ;
  setHum(game.state==='returning' ? 0.8 : moving);
  /* apply crane transform */
  craneX.position.x = game.craneX;
  trolley.position.z = game.craneZ;
  updateMachine(dt);
  /* camera parallax */
  parallax.x = lerp(parallax.x, parallax.tx, 0.045);
  parallax.y = lerp(parallax.y, parallax.ty, 0.045);
  camera.position.set(CAM_HOME.x + parallax.x, CAM_HOME.y + parallax.y, CAM_HOME.z);
  camera.lookAt(0, 1.38, 0);
  renderer.render(scene, camera);
}
updateHUD();
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  fitCamera();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= DEBUG HOOK ================= */
window.__dbg = {
  get state(){ return game.state; },
  get claw(){ return { x:game.craneX, z:game.craneZ, y:clawWorldY(), open:game.clawOpen }; },
  get plays(){ return game.plays; },
  get score(){ return game.score; },
  get camera(){ return game.camera; },
  get over(){ return game.over; },
  get won(){ return game.won.map(w=>w.name); },
  plush: plushies.map(p=>({ name:p.name, x:p.home.x, z:p.home.z, r:p.r, pts:p.pts })),
  moveTo(x,z){ game.craneX=clamp(x,-BOUNDS.x,BOUNDS.x); game.craneZ=clamp(z,-BOUNDS.z,BOUNDS.z); },
  drop(){ startDrop(); },
  reset(){ resetGame(); },
  skipIntro(cam){ $('startCard').style.display='none'; if (cam===false){ game.camera=false; } }
};

</script>
