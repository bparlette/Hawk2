<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Beat Bounce</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#0b0620;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:1200;left:0;right:0;top:0;padding:14px 16px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 12px #000}
.hud b{font-size:28px}.hud small{display:block;color:#cfe;opacity:.9;font-size:12px;letter-spacing:.12em}
#combo{color:#ffe45e}#judge{position:absolute;z-index:1200;left:0;right:0;top:22%;text-align:center;font-weight:900;font-size:34px;letter-spacing:.08em;pointer-events:none;text-shadow:0 0 18px currentColor}
.overlay{position:absolute;z-index:1300;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,rgba(90,30,160,.55),rgba(5,2,20,.92) 70%)}
.overlay h1{font-size:52px;line-height:.95;margin:0 0 8px;background:linear-gradient(90deg,#ff5ec4,#ffe45e,#4ef0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay p{max-width:320px;line-height:1.45;color:#e6e2ff}
button{pointer-events:auto;border:0;border-radius:999px;padding:15px 26px;font-weight:900;font-size:18px;background:linear-gradient(90deg,#ff5ec4,#ff9a3d);color:#16081f;box-shadow:0 8px 30px rgba(255,94,196,.45);margin:6px}
button.alt{background:linear-gradient(90deg,#4ef0ff,#7c5cff);color:#fff}
.tracks{display:flex;flex-direction:column;gap:4px}.sel{outline:3px solid #ffe45e}
.hidden{display:none!important}.card{background:rgba(20,10,45,.85);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:20px 22px;min-width:280px}
.big{font-size:40px;font-weight:900}
</style></head><body>
<div id="wrap"><canvas id="c"></canvas>
<div class="hud"><div><small>SCORE</small><b id="score">0</b></div><div style="text-align:center"><small>COMBO</small><b id="combo">×1</b></div><div style="text-align:right"><small id="trackName">NEON DUSK</small><b id="prog">0%</b></div></div>
<div id="judge"></div>
<div id="start" class="overlay"><h1>BEAT<br>BOUNCE</h1><p>Drag left &amp; right while the ball flies.<br>Land on every glowing tile — centre hits are <b style="color:#ffe45e">PERFECT</b>.<br>Miss a tile and you fall. The bounce <i>is</i> the beat.</p>
<div class="tracks"><button id="t0" class="sel">♪ Neon Dusk — 112 BPM</button><button id="t1" class="alt">♪ Pelican Sunrise — 132 BPM</button></div>
<button id="play">▶ TAP TO START</button><p style="font-size:13px;opacity:.8">Original music, synthesized live in code.<br>No audio files. Headphones on!</p></div>
<div id="end" class="overlay hidden"><div class="card"><div id="endTitle" class="big">YOU FELL</div><p id="endStats"></p><div id="endScore" class="big"></div><p id="endBest"></p></div><button id="again">↻ PLAY AGAIN</button><button id="menu" class="alt">TRACKS</button></div>
</div>
<script>
(()=>{ "use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=390,H=844,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault());
let lastTap=0;document.addEventListener('touchend',e=>{let n=Date.now();if(n-lastTap<350)e.preventDefault();lastTap=n},{passive:false});

// ---------- ORIGINAL COMPOSITIONS (synthesized, no files) ----------
// Track 1 "Neon Dusk": A-minor, Am–F–C–G, wistful lead. Track 2 "Pelican Sunrise": C-major bounce, C–G–Am–F, brighter/faster.
const TRACKS=[
 {name:"NEON DUSK",bpm:112,bars:12,root:110,prog:[[0,3,7],[ -4,0,3],[-9,-5,-2],[-7,-4,0]],mel:[12,-1,15,12, 10,-1,12,-1, 7,-1,10,7, 5,-1,-1,-1, 12,-1,15,19, 17,15,12,-1, 10,-1,12,15, 12,-1,-1,-1],bassPat:[0,-1,-1,0,-1,-1,7,-1],wave:'triangle',leadWave:'sawtooth'},
 {name:"PELICAN SUNRISE",bpm:132,bars:10,root:130.81,prog:[[0,4,7],[-5,-1,2],[-9,-5,-2],[-7,-3,0]],mel:[7,12,-1,16, 14,12,7,-1, 9,-1,12,9, 7,-1,-1,-1, 16,14,12,14, 16,-1,19,-1, 17,16,14,12, 14,-1,-1,-1],bassPat:[0,-1,0,-1,7,-1,0,-1],wave:'square',leadWave:'square'}
];
let trackIdx=0;
function buildTiles(tr){
 // deterministic winding path from beat map: one tile per beat, 4 beats/bar
 const total=tr.bars*4, tiles=[];let x=0;let seed=tr.bpm*7+3;
 const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
 for(let i=0;i<total;i++){ if(i>0){let step=Math.floor(rnd()*3)-1; if(i%8===7)step=0; x=Math.max(-1.8,Math.min(1.8,x+step*0.9));} tiles.push({i,x,z:i,hit:false,flash:0});}
 return tiles;
}
// ---------- AUDIO ----------
let AC=null,master=null,musicTimer=null,nextNoteTime=0,beatCount=0,startAt=0;
function initAudio(){ if(AC)return; AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.55; master.connect(AC.destination);}
function tone(freq,t,dur,type,vol,slide){ if(!AC)return; const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur); g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function noise(t,dur,vol,hp){ if(!AC)return; const len=AC.sampleRate*dur,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||5000;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);}
function scheduleBeat(beat,t){
 const tr=TRACKS[trackIdx],bar=Math.floor(beat/4)%tr.prog.length,step=beat%8,beatInBar=beat%4;
 // kick on every beat (the bounce), hat offbeat, chord pad per bar, bass 8ths, lead 8ths
 tone(150,t,.18,'sine',.9,42); noise(t,.03,.06,7000);
 if(beatInBar===0){tr.prog[bar].forEach(s=>tone(tr.root*2*Math.pow(2,s/12),t,.9,tr.wave,.05));}
 const bp=tr.bassPat[step]; if(bp>=0)tone(tr.root*Math.pow(2,bp/12),t,.22,'triangle',.28);
 const mel=tr.mel[beat%tr.mel.length*1] ; // lead on beats
 const m8=tr.mel[(beat*2)%tr.mel.length]; // placeholder (kept simple)
 if(beat%1===0){ const idx=(beat*2)%tr.mel.length; }
 // lead: play melody note on this beat if present (mel array is 32 8th-notes; use beat*2 index)
 const li=(beat*2)%tr.mel.length, ln=tr.mel[li]; if(ln>=0)tone(tr.root*2*Math.pow(2,ln/12),t,.28,tr.leadWave,.12);
 const li2=(beat*2+1)%tr.mel.length, ln2=tr.mel[li2]; if(ln2>=0)tone(tr.root*2*Math.pow(2,ln2/12),t+ (60/tr.bpm)/2,.22,tr.leadWave,.09);
}
function scheduler(){ if(!AC||state!=='play')return; const spb=60/TRACKS[trackIdx].bpm; while(nextNoteTime < AC.currentTime + .18){ scheduleBeat(beatCount,nextNoteTime); beatCount++; nextNoteTime+=spb; } }
// ---------- GAME STATE ----------
let state='menu',tiles=[],ballX=0,targetX=0,score=0,combo=0,maxCombo=0,hits=0,perfects=0,landedBeat=-1,fallY=0,fallV=0,trail=[],judgeTxt='',judgeT=0,shake=0;
const $=id=>document.getElementById(id);
function bestKey(){return 'beatbounce_best_'+trackIdx}
function startGame(){ initAudio(); if(AC.state==='suspended')AC.resume(); const tr=TRACKS[trackIdx]; tiles=buildTiles(tr); score=0;combo=0;maxCombo=0;hits=0;perfects=0;ballX=tiles[0].x;targetX=ballX;landedBeat=-1;fallY=0;fallV=0;trail=[]; state='play'; $('start').classList.add('hidden'); $('end').classList.add('hidden'); $('trackName').textContent=tr.name; beatCount=0; startAt=AC.currentTime+.15; nextNoteTime=startAt; musicTimer=setInterval(scheduler,40); scheduler(); }
function endGame(win){ if(state==='over')return; state='over'; clearInterval(musicTimer); const total=Math.max(1,tiles.length-1), acc=total?Math.round(hits/total*100):0; const prev=+localStorage.getItem(bestKey())||0; if(score>prev)localStorage.setItem(bestKey(),score); $('endTitle').textContent=win?'🎉 SONG COMPLETE!':'💦 YOU FELL'; $('endStats').innerHTML=`Tiles ${hits} / ${total} &nbsp;•&nbsp; Accuracy ${acc}%<br>Perfects ${perfects} &nbsp;•&nbsp; Best combo ×${(1+Math.min(maxCombo,20)*0.1).toFixed(1)} (${maxCombo})`; $('endScore').textContent=score; $('endBest').textContent='Best: '+Math.max(prev,score); $('end').classList.remove('hidden'); }
function judge(txt,color){judgeTxt=txt;judgeT=performance.now();const j=$('judge');j.textContent=txt;j.style.color=color;}
// pointer steering: drag delta -> targetX
let dragging=false,lastPX=0;
function pDown(e){dragging=true;lastPX=e.clientX} function pMove(e){ if(!dragging||state!=='play')return; const dx=e.clientX-lastPX; lastPX=e.clientX; targetX=Math.max(-2.3,Math.min(2.3,targetX+dx*0.012)); } function pUp(){dragging=false}
addEventListener('pointerdown',pDown);addEventListener('pointermove',pMove);addEventListener('pointerup',pUp);addEventListener('pointercancel',pUp);
$('t0').onclick=()=>{trackIdx=0;$('t0').classList.add('sel');$('t1').classList.remove('sel')};
$('t1').onclick=()=>{trackIdx=1;$('t1').classList.add('sel');$('t0').classList.remove('sel')};
$('play').onclick=startGame; $('again').onclick=startGame; $('menu').onclick=()=>{$('end').classList.add('hidden');$('start').classList.remove('hidden');state='menu'};
// projection: pseudo-3D forward view. dist in beats ahead.
const HORIZON=250;
function proj(x,dist,y){ const s=1/(1+dist*0.32); return {x:W/2 + x*110*s + (0)*s, y:HORIZON + (H*0.62-HORIZON)*Math.pow(s,0.7) - (y||0)*160*s, s}; }
function draw(){
 ctx.clearRect(0,0,W,H);
 // neon dusk sky
 let g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1b0b3a');g.addColorStop(.45,'#5b1e6e');g.addColorStop(.72,'#ff6b6b');g.addColorStop(1,'#120826'); ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // sun + stars
 ctx.fillStyle='rgba(255,220,120,.9)';ctx.beginPath();ctx.arc(W*.78,150,42,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.8)'; for(let i=0;i<40;i++){ctx.fillRect((i*97)%W,(i*57)%180,2,2)}
 const now = AC? AC.currentTime: performance.now()/1000;
 let beatPos=0;
 if(state==='play'||state==='over'){ beatPos = Math.max(0,(now-startAt)/(60/TRACKS[trackIdx].bpm)); }
 const curBeat=Math.floor(beatPos), frac=beatPos-curBeat;
 // landing check at beat boundary
 if(state==='play' && curBeat!==landedBeat && curBeat>=1){ landedBeat=curBeat; const idx=curBeat; if(idx>=tiles.length){ endGame(true); } else { const t=tiles[idx]; const dx=Math.abs(ballX-t.x); if(dx<0.38){t.hit=true;t.flash=1;perfects++;hits++;combo++;score+=Math.round(150*(1+Math.min(combo,20)*.1));judge('PERFECT','#ffe45e');} else if(dx<0.88){t.hit=true;t.flash=1;hits++;combo++;score+=Math.round(100*(1+Math.min(combo,20)*.1));judge('GOOD','#4ef0ff');} else { state='falling'; fallV=0; judge('MISS','#ff5e7a'); clearInterval(musicTimer); if(AC)tone(300,AC.currentTime,.6,'sawtooth',.2,40); } maxCombo=Math.max(maxCombo,combo); if(state!=='play')combo=combo; } }
 if(state==='play'){ ballX += (targetX-ballX)*0.35; }
 // draw tiles far->near
 if(tiles.length){ for(let i=tiles.length-1;i>=0;i--){ const t=tiles[i], dist=t.z-beatPos; if(dist<-1||dist>14)continue; const p=proj(t.x,Math.max(dist,0),0); const w=170*p.s,h=46*p.s; ctx.save(); ctx.shadowColor=t.flash>0?'#ffe45e':'#4ef0ff'; ctx.shadowBlur=18*p.s+ (t.flash>0?30:0); ctx.fillStyle=t.hit?'#ffe45e':(i%2?'#7c5cff':'#00c2d1'); ctx.globalAlpha=dist<0?Math.max(0,1+dist):1; ctx.beginPath(); ctx.roundRect(p.x-w/2,p.y-h/2,w,h,10*p.s); ctx.fill(); ctx.restore(); t.flash=Math.max(0,t.flash-.02); ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(p.x,p.y,5*p.s,0,7); ctx.fill(); } }
 // ball
 let by=0; if(state==='play') by=Math.sin(Math.min(frac,1)*Math.PI); if(state==='menu') by=Math.abs(Math.sin(performance.now()/400));
 if(state==='falling'){ fallY+=fallV; fallV+=.012; if(fallY>2.2){ endGame(false);} }
 const bp=proj(ballX,0,by); if(state!=='over'){ trail.push({x:bp.x,y:bp.y}); if(trail.length>14)trail.shift(); trail.forEach((tp,i)=>{ctx.globalAlpha=i/trail.length*.5;ctx.fillStyle='#ff5ec4';ctx.beginPath();ctx.arc(tp.x,tp.y,6+i*.8,0,7);ctx.fill()}); ctx.globalAlpha=1;
  ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=24; let grad=ctx.createRadialGradient(bp.x-6,bp.y-8,2,bp.x,bp.y,22); grad.addColorStop(0,'#fff');grad.addColorStop(.5,'#ffd166');grad.addColorStop(1,'#ff5ec4'); ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(bp.x,bp.y + (state==='falling'?fallY*180:0),20,0,7); ctx.fill(); ctx.restore(); }
 // HUD update
 $('score').textContent=score; $('combo').textContent='×'+(1+Math.min(combo,20)*.1).toFixed(1); $('prog').textContent=(tiles.length?Math.min(100,Math.round(Math.max(0,curBeat)/tiles.length*100)):0)+'%';
 if(judgeTxt && performance.now()-judgeT>700){judgeTxt='';$('judge').textContent=''}
 requestAnimationFrame(draw);
}
draw();
// QA / automation hook
window.__bb={ state:()=>({state,score,combo,hits,perfects,ballX,targetX,tiles:tiles.length,beat:(()=>{try{return AC?Math.floor((AC.currentTime-startAt)/(60/TRACKS[trackIdx].bpm)):0}catch(e){return 0}})()}),
 nextTile:()=>{ const b=AC?Math.floor((AC.currentTime-startAt)/(60/TRACKS[trackIdx].bpm)):0; const t=tiles[Math.min(b+1,tiles.length-1)]; return t?{x:t.x,index:b+1}:null; },
 setTarget:x=>{targetX=x}, start:(i)=>{ if(typeof i==='number'){trackIdx=i} startGame(); }, projX:x=>proj(x,0,0).x };
})();
</script></body></html>
